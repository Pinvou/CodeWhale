name: rustc-wrapper-smoke

# 验证 rustc-stack-wrapper 的接入方式(正式 Cargo 入口按平台注入 RUSTC_WRAPPER):
# - 默认配置(macOS/Linux 开发经 run-dev.sh、CI 经 job env)在 Windows 上不得
#   因 .cargo/config.toml 残留 wrapper 配置而 os error 193;config.toml 不配置
#   [build] rustc-wrapper(全局键无法按平台条件化),默认三端直接可用。
# - run-dev.sh 的 wrapper 平台选择(scripts/rustc-stack-wrapper-select.sh):
#   Darwin/Linux 注入 sh 版;Windows (MINGW*/MSYS*/CYGWIN*) 编译并注入 .exe 版,
#   导出的 RUSTC_WRAPPER 不得指向无扩展名 Unix 文件(os error 193)。
# - 按平台注入 RUSTC_WRAPPER 后(windows → .exe 版,unix → sh 版),Cargo 必须
#   能执行 wrapper;编译器进程 env 含 RUST_MIN_STACK=16777216。
# - 契约:运行时进程(cargo run / cargo test 目标)不继承 RUST_MIN_STACK,
#   默认线程栈语义(约 2 MiB)不变。
# 用最小 crate 继承仓库 wrapper 配置跑 cargo check(秒级,不编译全图),
# 防止 wrapper 在某个平台不可执行(如 Windows os error 193 / Unix ENOEXEC)
# 导致所有 Cargo build/check/test/run 全断。
on:
  pull_request:
    paths:
      - 'pinvou3-app/src-tauri/.cargo/config.toml'
      - 'pinvou3-app/src-tauri/scripts/rustc-stack-wrapper'
      - 'pinvou3-app/src-tauri/scripts/rustc-stack-wrapper.rs'
      - 'pinvou3-app/src-tauri/scripts/rustc-stack-wrapper-select.sh'
      - 'pinvou3-app/run-dev.sh'
      - '.github/workflows/rustc-wrapper-smoke.yml'
  merge_group:
  push:
    branches: [main]
    paths:
      - 'pinvou3-app/src-tauri/.cargo/config.toml'
      - 'pinvou3-app/src-tauri/scripts/rustc-stack-wrapper'
      - 'pinvou3-app/src-tauri/scripts/rustc-stack-wrapper.rs'
      - 'pinvou3-app/src-tauri/scripts/rustc-stack-wrapper-select.sh'
      - 'pinvou3-app/run-dev.sh'
      - '.github/workflows/rustc-wrapper-smoke.yml'

permissions:
  contents: read
  pull-requests: read

# Cancel superseded runs for the same ref to avoid queueing and wasted runner
# minutes. Only PR runs may cancel each other (cancel-and-replace per
# refs/pull/N/merge). Merge-queue entries and main pushes must never cancel:
# queue entries carry the required-check contexts the merge queue waits on,
# and letting a main push cancel an in-flight entry kills a context the
# queue is gating on. The gate keys on the event name — the repo-standard
# pattern — rather than on ref parsing, because merge_group ref semantics
# are not stable across GitHub releases (fixed 2026-10 after the audit found
# this file was the last merge_group/push-triggered workflow violating the
# event-gated cancel pattern; pr-title-check.yml's unconditional cancel is
# PR-only by design and stays).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # merge_group 不支持事件级 paths 过滤，先在一个轻量 Linux job 中判断组合
  # diff；无关 PR 入队时跳过后续三个平台 runner。PR/push 的事件级 paths 仍
  # 保留，避免这些事件连轻量路由 job 都启动。
  changes:
    runs-on: ${{ fromJSON(vars.PINVOU_LINUX_LIGHT_RUNNER || vars.PINVOU_LINUX_RUNNER || '["ubuntu-22.04"]') }}
    # The workflow default (360 min) would let a hung job burn runner minutes;
    # both jobs are minutes of work when healthy.
    timeout-minutes: 10
    outputs:
      wrapper: ${{ steps.filter.outputs.wrapper }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up zram and swap
        # 内存扩容为尽力而为:超时/失败只告警不阻断(回退 runner 默认内存)。
        run: timeout --kill-after=15 240 sudo --preserve-env=GITHUB_ACTIONS,PINVOU3_CI_DISABLE_ZRAM,RUNNER_ENVIRONMENT bash "${{ github.workspace }}/scripts/ci-memory-setup.sh" || echo "::warning::ci-memory-setup 未完成,继续使用 runner 默认内存"

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            wrapper:
              - 'pinvou3-app/src-tauri/.cargo/config.toml'
              - 'pinvou3-app/src-tauri/scripts/rustc-stack-wrapper'
              - 'pinvou3-app/src-tauri/scripts/rustc-stack-wrapper.rs'
              - 'pinvou3-app/src-tauri/scripts/rustc-stack-wrapper-select.sh'
              - 'pinvou3-app/run-dev.sh'
              - '.github/workflows/rustc-wrapper-smoke.yml'

  smoke:
    needs: changes
    if: ${{ needs.changes.outputs.wrapper == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(vars.PINVOU_WINDOWS_ENABLED != 'false' && (vars.PINVOU_MACOS_ENABLED != 'false' && '{"include":[{"os":"macos-15"},{"os":"ubuntu-22.04"},{"os":"windows-latest"}]}' || '{"include":[{"os":"ubuntu-22.04"},{"os":"windows-latest"}]}') || (vars.PINVOU_MACOS_ENABLED != 'false' && '{"include":[{"os":"macos-15"},{"os":"ubuntu-22.04"}]}' || '{"include":[{"os":"ubuntu-22.04"}]}')) }}
    # Windows pool overrides are limited to same-repository PR metadata (name + ID).
    # Fork/missing metadata or undeclared events use hosted Windows.
    # PR-editable YAML is not a runner ACL; other declared events keep their pools.
    runs-on: ${{ matrix.os == 'ubuntu-22.04' && fromJSON(vars.PINVOU_LINUX_LIGHT_RUNNER || vars.PINVOU_LINUX_RUNNER || '["ubuntu-22.04"]') || matrix.os == 'windows-latest' && fromJSON((github.event_name == 'push' || github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.repository != '' && github.repository_id != '' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.repo.full_name == github.repository && github.event.pull_request.head.repo.id == github.repository_id && github.event.pull_request.base.repo.id == github.repository_id)) && (vars.PINVOU_WINDOWS_LIGHT_RUNNER || vars.PINVOU_WINDOWS_RUNNER || '["windows-latest"]') || '["windows-latest"]') || matrix.os }}
    # Minutes of work when healthy (init a tiny crate, compile, run the
    # wrapper probes); the cap keeps a hung cargo from burning the 360-minute
    # default, including on the scarce macOS runner.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up zram and swap
        if: runner.os == 'Linux'
        # 内存扩容为尽力而为:超时/失败只告警不阻断(回退 runner 默认内存)。
        run: timeout --kill-after=15 240 sudo --preserve-env=GITHUB_ACTIONS,PINVOU3_CI_DISABLE_ZRAM,RUNNER_ENVIRONMENT bash "${{ github.workspace }}/scripts/ci-memory-setup.sh" || echo "::warning::ci-memory-setup 未完成,继续使用 runner 默认内存"

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # 1) 默认配置直接可用:不设任何覆盖,全新 clone 的默认 config.toml 必须
      #    三端直接 cargo check 通过。config.toml 已移除 [build] rustc-wrapper
      #    (Windows 上指向无扩展名 sh 会 os error 193),因此 Windows 不再
      #    需要 CI 专属 RUSTC_WRAPPER 或未被 Cargo 读取的 config.local.toml。
      - name: 默认配置(无覆盖)cargo check —— 三端直接可用
        shell: bash
        run: |
          set -euxo pipefail
          tmp="$(mktemp -d)"
          cd "$tmp"
          cargo init --name wrapper_smoke
          mkdir -p .cargo
          cp "$GITHUB_WORKSPACE/pinvou3-app/src-tauri/.cargo/config.toml" .cargo/config.toml
          cp -R "$GITHUB_WORKSPACE/pinvou3-app/src-tauri/scripts" scripts
          # 关键断言:config.toml 不得再声明 [build] rustc-wrapper
          if grep -q '^rustc-wrapper' .cargo/config.toml; then
            echo "FAIL: config.toml 仍包含 rustc-wrapper 键(Windows 默认路径会 os error 193)"
            exit 1
          fi
          CARGO_TERM_COLOR=never cargo check 2>&1 | tee cargo-check-default.log
          grep -q "Checking wrapper_smoke" cargo-check-default.log

      # 2) run-dev.sh 的 wrapper 平台选择(单一真相源 rustc-stack-wrapper-select.sh):
      #    验证 run-dev.sh 实际使用的 selector 在 Windows(Git Bash/MSYS,
      #    uname -s 为 MINGW*/MSYS*/CYGWIN*)下编译并输出 .exe 版、不指向
      #    无扩展名 Unix 文件——否则本地开发经 run-dev.sh 注入后会 os error 193,
      #    阻断 Windows 上所有 Cargo 命令。
      - name: run-dev.sh selector —— Windows 编译并注入 .exe 版 wrapper
        shell: bash
        run: |
          set -euxo pipefail
          run_dev="$GITHUB_WORKSPACE/pinvou3-app/run-dev.sh"
          select_script="$GITHUB_WORKSPACE/pinvou3-app/src-tauri/scripts/rustc-stack-wrapper-select.sh"
          # 回归检测:run-dev.sh 必须调用 selector,不得再直接无条件 export
          # 指向无扩展名 Unix 文件的 RUSTC_WRAPPER(会 os error 193)。
          if grep -nE '^[[:space:]]*export RUSTC_WRAPPER=.*rustc-stack-wrapper' "$run_dev"; then
            echo "FAIL: run-dev.sh 仍直接无条件 export 无扩展名 Unix wrapper"
            exit 1
          fi
          # selector 平台行为:Windows 编译并输出 .exe 版(Windows 原生路径),
          # Unix 输出存在的 sh 文件。
          out="$(bash "$select_script")"
          case "$(uname -s)" in
            MINGW*|MSYS*|CYGWIN*)
              [ -n "$out" ] || { echo "FAIL: Windows selector 应输出 .exe wrapper"; exit 1; }
              echo "$out" | grep -qi '\.exe$' || { echo "FAIL: Windows selector 应指向 .exe 版, got: $out"; exit 1; }
              echo "OK: Windows selector → $out"
              ;;
            Darwin|Linux)
              [ -n "$out" ] || { echo "FAIL: Unix selector 应输出 sh wrapper"; exit 1; }
              [ -x "$out" ] || { echo "FAIL: wrapper 不可执行: $out"; exit 1; }
              echo "OK: Unix selector → $out"
              ;;
          esac

      # 3) 按平台注入 wrapper 后:与正式入口(run-dev.sh / CI job env)一致,
      #    wrapper 必须被 Cargo 真正调用,且编译器进程获得 16MiB 栈。
      #    wrapper 是"注入 RUST_MIN_STACK + 转发原命令",用 wrapper 执行
      #    `env` 可直接观测注入结果(不经 cargo,验证 wrapper 自身逻辑)。
      - name: 按平台注入 wrapper —— 编译期获得 16 MiB
        shell: bash
        run: |
          set -euxo pipefail
          tmp="$(mktemp -d)"
          cd "$tmp"
          cargo init --name wrapper_smoke
          mkdir -p .cargo scripts
          cp "$GITHUB_WORKSPACE/pinvou3-app/src-tauri/scripts/rustc-stack-wrapper" scripts/ 2>/dev/null || true
          cp "$GITHUB_WORKSPACE/pinvou3-app/src-tauri/scripts/rustc-stack-wrapper.rs" scripts/ 2>/dev/null || true
          chmod +x scripts/rustc-stack-wrapper 2>/dev/null || true
          # 直接执行 wrapper,第一个参数是 env:输出应包含注入后的 RUST_MIN_STACK
          unset RUST_MIN_STACK
          if [ "$RUNNER_OS" = "Windows" ]; then
            # 编译 .exe 版 wrapper(与 selector 同一命令),再直接执行它跑 env
            # 观测注入结果(.exe 是原生二进制,可直接运行,无 .cmd 嵌套引号问题)。
            rustc -O scripts/rustc-stack-wrapper.rs -o scripts/rustc-stack-wrapper.exe
            out="$(scripts/rustc-stack-wrapper.exe env)"
          else
            out="$(scripts/rustc-stack-wrapper env)"
          fi
          # 用命令替换(非管道)避免 grep -q 提前关闭管道导致 env SIGPIPE
          # (set -o pipefail 下 SIGPIPE 会让 step flaky 失败)。
          grep -q "^RUST_MIN_STACK=16777216$" <<< "$out"

      # 4) 运行时契约:不继承编译器栈覆盖。
      #    复制仓库契约测试到最小 crate,按正式入口方式注入 wrapper 后跑
      #    cargo test:测试进程是 cargo 直接启动的目标进程,不经过 wrapper,
      #    不得继承 RUST_MIN_STACK。
      - name: 运行时进程不继承 RUST_MIN_STACK(契约测试)
        shell: bash
        run: |
          set -euxo pipefail
          tmp="$(mktemp -d)"
          cd "$tmp"
          cargo init --name wrapper_smoke
          mkdir -p .cargo tests
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "$GITHUB_WORKSPACE/pinvou3-app/src-tauri/scripts/rustc-stack-wrapper.rs" .
            rustc -O rustc-stack-wrapper.rs -o rustc-stack-wrapper.exe
            export RUSTC_WRAPPER="$tmp/rustc-stack-wrapper.exe"
          else
            cp "$GITHUB_WORKSPACE/pinvou3-app/src-tauri/scripts/rustc-stack-wrapper" .
            chmod +x "$tmp/rustc-stack-wrapper" 2>/dev/null || true
            export RUSTC_WRAPPER="$tmp/rustc-stack-wrapper"
          fi
          cp "$GITHUB_WORKSPACE/pinvou3-app/src-tauri/tests/compiler_stack_contract.rs" tests/
          CARGO_TERM_COLOR=never cargo test 2>&1 | tee cargo-test.log
          grep -q "compiler_stack_contract" cargo-test.log
          grep -q "test result: ok" cargo-test.log

      # 5) 链式 wrapper(RUSTC_WRAPPER_CHAIN):wrapper 必须先注入 RUST_MIN_STACK、
      #    再把完整原 argv(含首参 rustc)原样交给链上命令执行。链目标是本步
      #    自编译的探针(rustc 三端都有),每个参数独立成行输出后逐行断言:
      #    探针未被调用 = 委托被删;argv 缺首参或缺参 = 透传被丢;stack 非
      #    16777216 = 注入失败。round-12 review:旧的 argv=[a b c] 单行 join
      #    输出对「合并参数」变异不敏感($* 把三个参数折叠成一个也能拼出同
      #    一行),现改为每参一行 + 参数计数断言,合并/丢参/多参都会转红。
      #    `env` 一类无参即打印的命令对前两类变异均不敏感,故不再使用。注:
      #    本仓 CI 不接 sccache 链的真实原因是仓内没有 sccache;sccache 客户
      #    端本身会把客户端 env 经 env_vars 转发给 server 派生的编译器
      #    (pinvou-agent#269 的生产接线即依赖此),并非不传 env。
      - name: 链式 wrapper —— 完整 argv 委托链上命令且仍注入 16 MiB
        shell: bash
        run: |
          set -euxo pipefail
          tmp="$(mktemp -d)"
          cd "$tmp"
          cp "$GITHUB_WORKSPACE/pinvou3-app/src-tauri/scripts/rustc-stack-wrapper" .
          cp "$GITHUB_WORKSPACE/pinvou3-app/src-tauri/scripts/rustc-stack-wrapper.rs" .
          chmod +x rustc-stack-wrapper 2>/dev/null || true
          unset RUST_MIN_STACK
          # 探针:把「委托语义」变成逐字段可比对的输出——链命令被调用、
          # 完整 argv(含首参 rustc)按参数逐行透传、RUST_MIN_STACK 注入,
          # 缺一即断言失败;参数计数行额外钉住「不多不少恰好三个」。
          cat > chain-probe.rs <<'EOF'
          fn main() {
              let args: Vec<String> = std::env::args().skip(1).collect();
              let stack = std::env::var("RUST_MIN_STACK").unwrap_or_else(|_| "unset".into());
              println!("chain_probe_stack=[{}]", stack);
              println!("chain_probe_argc={}", args.len());
              for arg in &args {
                  println!("chain_probe_arg=[{}]", arg);
              }
              if let Ok(code) = std::env::var("CHAIN_PROBE_EXIT") {
                  std::process::exit(code.parse().expect("CHAIN_PROBE_EXIT must be an integer"));
              }
          }
          EOF
          rustc -O chain-probe.rs -o chain-probe.exe
          chmod +x chain-probe.exe 2>/dev/null || true
          if [ "$RUNNER_OS" = "Windows" ]; then
            rustc -O rustc-stack-wrapper.rs -o rustc-stack-wrapper.exe
            wrapper="./rustc-stack-wrapper.exe"
          else
            wrapper="./rustc-stack-wrapper"
          fi
          # cargo 调用约定:wrapper 收到 [rustc, --version, --verbose],必须把
          # 三者作为三个独立 argv 元素原样交给链上命令;命令替换收集输出,
          # grep -Fqx 整行精确比对(合并参数只剩一行、argc=1,均转红)。
          out="$(RUSTC_WRAPPER_CHAIN="$PWD/chain-probe.exe" "$wrapper" rustc --version --verbose)"
          printf '%s\n' "$out" | grep -Fqx 'chain_probe_stack=[16777216]'
          printf '%s\n' "$out" | grep -Fqx 'chain_probe_argc=3'
          printf '%s\n' "$out" | grep -Fqx 'chain_probe_arg=[rustc]'
          printf '%s\n' "$out" | grep -Fqx 'chain_probe_arg=[--version]'
          printf '%s\n' "$out" | grep -Fqx 'chain_probe_arg=[--verbose]'
          # 退出码透传(round-23):链上命令的非零退出必须原样穿过 wrapper
          # (sh 走 exec 天然传播;rs 显式传播 status.code())。此前探针恒退出 0,
          # 该半边契约在 CI 零断言。信号死亡的 rs 折叠系已披露边界,此处只钉退出码。
          chain_status=0
          CHAIN_PROBE_EXIT=42 RUSTC_WRAPPER_CHAIN="$PWD/chain-probe.exe" "$wrapper" rustc --version --verbose >/dev/null || chain_status=$?
          test "$chain_status" -eq 42
