name: release-packages

# VERSION 或发布链路变更时自动构建全平台安装包,挂为 GitHub Actions artifact(保留 90 天)。
#
# 触发条件:
# - push main 且 VERSION 或发布链路文件被修改(paths 限定);
# - 影响版本/打包链路的 PR:仅运行版本与无私有凭据的 Windows 静态契约;
# - push 事件按 github.event.before..github.sha 做精确发布链路 diff;
# - workflow_dispatch 手动触发:跳过 diff,无条件全量构建(用于补打/重打某版本)。
#
# 版本号单一事实来源 = 根目录 VERSION 文件。gate job 先跑
# scripts/sync-version.mjs --check,把该脚本登记的每个版本文件逐一与 VERSION 比对
# (打进安装包的是 pinvou3-app 的 tauri.conf.json / Cargo.toml / Cargo.lock /
# package.json / package-lock.json,以及 pinvou-knowledge 的 Cargo.toml+Cargo.lock;
# 完整清单以脚本 repoPaths() 为准,其中少数文件存在才纳入,不在此重复枚举以免漂移)。
# 构建 job 只消费已校验的版本文件,保证打进包里的任何版本号都来自 VERSION。
#
# 与其他 workflow 的分工:
# - pr-check / mac-build:每次改动跑编译验证 gate(不产出可用产物)。
# - release-packages(本 workflow):PR 只做轻量契约验证;VERSION 进入 main 或手动触发后产出全平台 artifact。
# - 本 workflow 只上传 CI artifact,绝不创建/推送 GitHub Release，也不替代
#   release-deb.sh / release-macos.sh 的正式 OTA 上传、签名与清单更新流程。
#
# 签名:Windows nsis 不签名(config/platforms/windows 无证书配置);macOS ad-hoc
# (signingIdentity="-",用户首次安装需 xattr -dr com.apple.quarantine)。
# Windows 正式发布仍进入 windows-release Environment。运行时仓库已公开，
# checkout 后不保留凭据，后续按锁定 gitlink 匿名拉取运行时和 Git LFS 对象。
# Linux/macOS 同样零 secret 依赖；所有路径均零外部写入副作用。

