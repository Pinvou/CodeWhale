permissions:
  contents: read
  actions: read

concurrency:
  group: release-packages-${{ github.ref }}
  # PR 连续更新时取消旧契约验证；main 的正式版本构建必须完整保留。
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Job 1: 发布链路变更检测(gate,跑 ubuntu 快) ────────────────────
  # push 对比事件 before..sha 的实际路径,覆盖一次 push 含多个 commit 的情况。
  # pull_request / workflow_dispatch 无条件放行 gate:PR 只跑轻量契约,
  # workflow_dispatch 还会让下游完整打包;push 则按实际发布链路 diff 判定。
  # 首次 push 或 before commit 不可达时直接放行,宁可多构建也不漏构建。
  check-version-bump:
    name: 检测发布链路变更
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      build_required: ${{ steps.diff.outputs.build_required }}
      version: ${{ steps.diff.outputs.version }}
    steps:
      # fetch-depth:0 确保 push 事件的 before commit 可用于整段 push 范围比较。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up zram and swap
        # 内存扩容为尽力而为:超时/失败只告警不阻断(回退 runner 默认内存)。
        run: timeout --kill-after=15 240 sudo --preserve-env=GITHUB_ACTIONS,PINVOU3_CI_DISABLE_ZRAM bash "${{ github.workspace }}/scripts/ci-memory-setup.sh" || echo "::warning::ci-memory-setup 未完成,继续使用 runner 默认内存"

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: 版本同步脚本测试
        run: node --test scripts/tests/sync-version.test.mjs

      # 版本号单一事实来源 = 根目录 VERSION。各处版本文件必须已与其同步。
      # 否则包名/包内版本号可能不一致，直接 fail 并提示先运行 sync-version.mjs。
      - name: 校验各处版本文件与 VERSION 一致
        run: node scripts/sync-version.mjs --check

      - name: 对比发布链路
        id: diff
        run: |
          set -euo pipefail
          V=$(tr -d '[:space:]' < VERSION)
          EVENT_NAME="${{ github.event_name }}"
          BEFORE="${{ github.event.before }}"
          if [ "$EVENT_NAME" = "pull_request" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            BUILD_REQUIRED=true
          elif [ -z "$BEFORE" ] || [[ "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            BUILD_REQUIRED=true
          else
            CHANGED_FILES=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
            if printf '%s\n' "$CHANGED_FILES" | node scripts/remote-control-release-path-policy.mjs || printf '%s\n' "$CHANGED_FILES" | grep -Eq \
              '^(VERSION|scripts/(sync-version\.mjs|run-windows-remote-control-e2e\.ps1|windows-e2e-process-guard\.ps1|windows-e2e-orchestrator-helpers\.ps1|create-installer-spdx\.mjs|check-enrollment-gated-v2-rollback\.mjs|asr/(build-sensevoice-runtime\.sh|sensevoice-source\.env)|check-linux-(elf-policy|glibc-floor)\.sh)|remote-control-relay/(docs/schemas/|package(-lock)?\.json|scripts/(controller-release-gate|validate-controller-release-evidence|deploy-controller-preflight|query-controller-release-telemetry|prepare-legacy-gateway-route|verify-provider-attestation|verify-installer-supply-chain)\.mjs|controller-sensitive-scan\.js|test/(controller-(release-|sensitive-scan|telemetry)|windows-e2e-(orchestrator-contract|orchestrator-helpers|path-guard)))|\.github/workflows/(release-packages|windows-remote-control-(evidence|build-evidence))\.yml|\.gitmodules|private-runtimes/windows|pinvou3-app/(package(-lock)?\.json|scripts/(remote-control-ui-smoke\.mjs|tauri/(build|codex-bridge|linux-asr-runtime|platform-config|windows-installer|windows-runtime)\.js)|src-tauri/(config/platforms/(linux|windows)|packaging/windows)/|src-tauri/resources/platforms/linux/asr/|tests/(codex_acp_windows_|linux_asr_runtime_packaging\.test\.js|remote_control_real_ui_smoke_contract\.test\.mjs|windows_runtime_packaging_contract\.test\.js)))'; then
              BUILD_REQUIRED=true
            else
              BUILD_REQUIRED=false
            fi
          fi
          echo "build_required=$BUILD_REQUIRED" >> "$GITHUB_OUTPUT"
          echo "version=$V" >> "$GITHUB_OUTPUT"

  remote-control-release-gate:
    name: Windows 远控真实证据门禁
    needs: check-version-bump
    if: >-
      needs.check-version-bump.outputs.build_required == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ${{ vars.PINVOU_REMOTE_RELEASE_RUNNER || 'windows-latest' }}
    environment:
      name: windows-release
    timeout-minutes: 15
    outputs:
      evidence_artifact_id: ${{ steps.remote-evidence-identity.outputs.artifact-id }}
      evidence_run_id: ${{ steps.remote-evidence-identity.outputs.run-id }}
    env:
      PINVOU_DESKTOP_CONTROLLER_ENABLED: ${{ vars.PINVOU_DESKTOP_CONTROLLER_ENABLED || '0' }}
      PINVOU_RELEASE_COMMIT_SHA: ${{ github.sha }}
      PINVOU_REMOTE_RELEASE_EVIDENCE: ${{ github.workspace }}/remote-control-evidence/manifest.json
      PINVOU_REMOTE_LEGACY_ENDPOINT_INVENTORY: ${{ vars.PINVOU_REMOTE_LEGACY_ENDPOINT_INVENTORY }}
      PINVOU_REMOTE_GATEWAY_CONFIG_PATH: ${{ vars.PINVOU_REMOTE_GATEWAY_CONFIG_PATH }}
      PINVOU_REMOTE_PUBLIC_ENTRYPOINTS_JSON: ${{ vars.PINVOU_REMOTE_PUBLIC_ENTRYPOINTS_JSON }}
      PINVOU_REMOTE_LEGACY_RELAY_URL: ${{ vars.PINVOU_REMOTE_LEGACY_RELAY_URL }}
      PINVOU_REMOTE_LEGACY_RELAY_BIND_HOST: ${{ vars.PINVOU_REMOTE_LEGACY_RELAY_BIND_HOST }}
      PINVOU_TRUSTED_WINDOWS_SIGNER_THUMBPRINT: ${{ vars.PINVOU_TRUSTED_WINDOWS_SIGNER_THUMBPRINT }}
      PINVOU_TRUSTED_WINDOWS_SIGNER_PUBLISHER: ${{ vars.PINVOU_TRUSTED_WINDOWS_SIGNER_PUBLISHER }}
      PINVOU_REMOTE_CONTROLLER_ENV_FILE: ${{ vars.PINVOU_REMOTE_CONTROLLER_ENV_FILE }}
      PINVOU_REMOTE_CONTROLLER_DISABLED_ENV_FILE: ${{ vars.PINVOU_REMOTE_CONTROLLER_DISABLED_ENV_FILE }}
      PINVOU_REMOTE_CONTROLLER_STATE_PATH: ${{ vars.PINVOU_REMOTE_CONTROLLER_STATE_PATH }}
      PINVOU_REMOTE_ENROLLMENT_DEPLOYMENT: ${{ vars.PINVOU_REMOTE_ENROLLMENT_DEPLOYMENT }}
      PINVOU_TRUSTED_E2E_DRIVER_SHA256: ${{ vars.PINVOU_TRUSTED_E2E_DRIVER_SHA256 }}
      PINVOU_TRUSTED_E2E_NODE_SHA256: ${{ vars.PINVOU_TRUSTED_E2E_NODE_SHA256 }}
      PINVOU_TRUSTED_E2E_NODE_SIGNER_THUMBPRINT: ${{ vars.PINVOU_TRUSTED_E2E_NODE_SIGNER_THUMBPRINT }}
      PINVOU_TRUSTED_E2E_NODE_SIGNER_PUBLISHER: ${{ vars.PINVOU_TRUSTED_E2E_NODE_SIGNER_PUBLISHER }}
      PINVOU_TRUSTED_E2E_ATTESTATION_PUBLIC_KEY_SHA256: ${{ vars.PINVOU_TRUSTED_E2E_ATTESTATION_PUBLIC_KEY_SHA256 }}
      PINVOU_TRUSTED_E2E_ATTESTATION_PROVIDER: ${{ vars.PINVOU_TRUSTED_E2E_ATTESTATION_PROVIDER }}
      PINVOU_TRUSTED_E2E_ATTESTATION_KEY_ID: ${{ format('{0}/orchestrator', vars.PINVOU_TRUSTED_E2E_ATTESTATION_KEY_ID) }}
      PINVOU_TRUSTED_E2E_ATTESTATION_ACL_SHA256: ${{ vars.PINVOU_TRUSTED_E2E_ATTESTATION_ACL_SHA256 }}
      PINVOU_TRUSTED_E2E_ATTESTATION_PROVIDER_MEASUREMENT_SHA256: ${{ vars.PINVOU_TRUSTED_E2E_ATTESTATION_PROVIDER_MEASUREMENT_SHA256 }}
      PINVOU_TRUSTED_E2E_ATTESTATION_PROVIDER_VENDOR: ${{ vars.PINVOU_TRUSTED_E2E_PROVIDER_VENDOR }}
      PINVOU_TRUSTED_E2E_PROVIDER_ROOT_CERTIFICATE_SHA256: ${{ vars.PINVOU_TRUSTED_E2E_PROVIDER_ROOT_CERTIFICATE_SHA256 }}
      PINVOU_TRUSTED_E2E_PROVIDER_VERIFIER_CERTIFICATE_SHA256: ${{ vars.PINVOU_TRUSTED_E2E_PROVIDER_VERIFIER_CERTIFICATE_SHA256 }}
      PINVOU_TRUSTED_E2E_ORCHESTRATOR_ROLE_POLICY_SHA256: ${{ vars.PINVOU_TRUSTED_E2E_ORCHESTRATOR_ROLE_POLICY_SHA256 }}
      PINVOU_TRUSTED_E2E_A_ROLE_POLICY_SHA256: ${{ vars.PINVOU_TRUSTED_E2E_A_ROLE_POLICY_SHA256 }}
      PINVOU_TRUSTED_E2E_B_ROLE_POLICY_SHA256: ${{ vars.PINVOU_TRUSTED_E2E_B_ROLE_POLICY_SHA256 }}
      PINVOU_RELEASE_BUILD_PROVENANCE_SHA256: ${{ vars.PINVOU_RELEASE_BUILD_PROVENANCE_SHA256 }}
      PINVOU_RELEASE_BUILD_REPOSITORY: ${{ github.repository }}
      PINVOU_RELEASE_BUILD_WORKFLOW: .github/workflows/windows-remote-control-build-evidence.yml
      PINVOU_RELEASE_BUILD_RUN_ID: ${{ vars.PINVOU_RELEASE_INSTALLER_BUILD_RUN_ID }}
      PINVOU_TRUSTED_GH_PATH: ${{ vars.PINVOU_TRUSTED_RELEASE_GH_PATH }}
      PINVOU_RELEASE_INSTALLER_SHA256: ${{ vars.PINVOU_RELEASE_INSTALLER_SHA256 }}
      PINVOU_RELEASE_VERSION: ${{ needs.check-version-bump.outputs.version }}
      PINVOU_REMOTE_TELEMETRY_SNAPSHOT_URL: ${{ vars.PINVOU_REMOTE_TELEMETRY_SNAPSHOT_URL }}
      PINVOU_REMOTE_TELEMETRY_ADMIN_TOKEN_FILE: ${{ vars.PINVOU_REMOTE_TELEMETRY_ADMIN_TOKEN_FILE }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Node.js（开启发布门禁）
        if: env.PINVOU_DESKTOP_CONTROLLER_ENABLED == '1'
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: remote-control-relay/package-lock.json

      - name: 安装 Relay 发布门禁依赖
        if: env.PINVOU_DESKTOP_CONTROLLER_ENABLED == '1'
        run: npm --prefix remote-control-relay ci --prefer-offline --no-audit --ignore-scripts

      - name: 锁定真实双机证据 run 与 artifact 身份
        id: remote-evidence-identity
        if: env.PINVOU_DESKTOP_CONTROLLER_ENABLED == '1'
        uses: actions/github-script@v8
        env:
          EVIDENCE_RUN_ID: ${{ inputs.remote_control_evidence_run_id || vars.PINVOU_REMOTE_CONTROL_EVIDENCE_RUN_ID }}
          EVIDENCE_ARTIFACT_NAME: ${{ inputs.remote_control_evidence_artifact || vars.PINVOU_REMOTE_CONTROL_EVIDENCE_ARTIFACT }}
          EVIDENCE_ARTIFACT_DIGEST: ${{ inputs.remote_control_evidence_artifact_digest || vars.PINVOU_REMOTE_CONTROL_EVIDENCE_ARTIFACT_DIGEST }}
          EVIDENCE_WORKFLOW_ID: ${{ vars.PINVOU_REMOTE_EVIDENCE_WORKFLOW_ID }}
        with:
          script: |
            const { selectProtectedWorkflowArtifact } = require(`${process.env.GITHUB_WORKSPACE}/remote-control-relay/scripts/verify-github-workflow-run.cjs`);
            const runId = Number(process.env.EVIDENCE_RUN_ID);
            const expectedWorkflowId = Number(process.env.EVIDENCE_WORKFLOW_ID);
            const artifactName = process.env.EVIDENCE_ARTIFACT_NAME;
            const expectedDigest = process.env.EVIDENCE_ARTIFACT_DIGEST;
            if (!Number.isSafeInteger(runId) || runId <= 0 || !Number.isSafeInteger(expectedWorkflowId) || expectedWorkflowId <= 0 || !artifactName || !/^sha256:[a-f0-9]{64}$/.test(expectedDigest || '')) {
              core.setFailed('remote_evidence_identity_configuration_missing');
              return;
            }
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const { data: run } = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: runId });
            const { data: workflow } = await github.rest.actions.getWorkflow({ owner, repo, workflow_id: expectedWorkflowId });
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({ owner, repo, run_id: runId, per_page: 100 });
            let artifact;
            try {
              artifact = selectProtectedWorkflowArtifact({ run, workflow, artifacts: data.artifacts, expected: {
                workflowId: expectedWorkflowId, workflowPath: '.github/workflows/windows-remote-control-evidence.yml',
                sha: context.sha, ref: context.ref, repository: `${owner}/${repo}`,
                artifactName, artifactDigest: expectedDigest,
              }});
            } catch (error) { core.setFailed(error.code || 'remote_evidence_workflow_identity_mismatch'); return; }
            core.setOutput('artifact-id', String(artifact.id));
            core.setOutput('artifact-digest', artifact.digest);
            core.setOutput('run-id', String(runId));

      - name: 下载真实双机证据
        if: env.PINVOU_DESKTOP_CONTROLLER_ENABLED == '1'
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.remote-evidence-identity.outputs.artifact-id }}
          path: remote-control-evidence
          github-token: ${{ github.token }}
          run-id: ${{ inputs.remote_control_evidence_run_id || vars.PINVOU_REMOTE_CONTROL_EVIDENCE_RUN_ID }}

      - name: 执行远控发布门禁
        run: node remote-control-relay/scripts/controller-release-gate.mjs

  build-linux-x64:
    name: 构建 Linux x86_64 deb
    needs: check-version-bump
    if: >-
      needs.check-version-bump.outputs.build_required == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    # 较新的 Ubuntu runner 可能引入 22.04 不具备的 glibc 符号，导致启动崩溃。
    # runner 固定为 ubuntu-22.04；升级前必须调整并验证配套 glibc 下限守卫。
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.check-version-bump.outputs.version }}
      # 托管 x86_64 runner 的冷 thin-LTO 构建也连续在约 30 分钟收到 shutdown
      # (exit 143)。与 ARM64 一致，仅对 CI artifact 关闭跨 crate LTO 并提高
      # 代码生成并行度；Cargo.toml 的正式本地 release profile 保持 thin LTO。
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      # v0.9.5 升级后 release(thin-LTO O3)编译 codewhale-tui 时 rustc/LLVM 栈溢出
      # (SIGBUS,Linux 与 macOS 同源风险)。.cargo/config.toml 不设置 rustc-wrapper
      # (全局键无法按平台条件化),由本 Linux 发布 job 显式注入 RUSTC_WRAPPER
      # 指向 sh 版(wrapper 只作用于编译期 rustc 进程,产物运行时语义不变)。
      # lld:BFD ld 处理大型 Rust binary 内存效率差,是 link OOM 独立主因(同 arm64)。
      RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
      RUSTC_WRAPPER: ${{ github.workspace }}/pinvou3-app/src-tauri/scripts/rustc-stack-wrapper
    steps:
      - name: Checkout (含 submodule)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up zram and swap
        # 内存扩容为尽力而为:超时/失败只告警不阻断(回退 runner 默认内存)。
        run: timeout --kill-after=15 240 sudo --preserve-env=GITHUB_ACTIONS,PINVOU3_CI_DISABLE_ZRAM bash "${{ github.workspace }}/scripts/ci-memory-setup.sh" || echo "::warning::ci-memory-setup 未完成,继续使用 runner 默认内存"

      # hosted runner 是单盘布局(/ 与 /mnt 同一 ext4,x64 镜像开机仅 ~13-14G
      # 可用);发布冷编译(700+ crate,dep-level O2)曾把盘写满(ENOSPC)。在任何
      # 工具链/缓存/依赖落盘之前删掉未使用的预装 SDK。
      - name: 为发布构建准备磁盘空间
        run: |
          sudo env GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            python3 scripts/ci-rust-disk.py --aggressive --min-free-gib 24

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          # 同时缓存独立 target dir 中的 knowledge-host，避免每次发布冷编译。
          workspaces: |
            pinvou3-app/src-tauri
            pinvou-knowledge
          # jammy 后缀隔离此前由 Ubuntu 24.04 构建的缓存产物，避免高版本
          shared-key: release-linux-x64-jammy
          # 非 main 手动构建只恢复 main 缓存；禁止写入分支缓存，避免多平台
          # release 缓存重复占满仓库配额并淘汰 pr-check 的 rust-test 暖缓存。
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # pinvou3 编译链接的系统库(gtk/webkit/soup/rsvg/openssl/X11×3/appindicator),
      # ubuntu runner 默认没装;cmake:reqwest 的 rustls 用 aws-lc-rs,其 build script
      # 需 cmake + C 编译器。清单同 pr-check.yml。
      - name: 装 Tauri + pinvou3 Linux 系统依赖
        run: |
          sudo apt-get update
          # 清单经 2026-09-15 探针逐包冗余审计(剔除单包模拟安装,安装集合
          # 不变即可移除):libgtk-3-dev/libsoup-3.0-dev/libx11-dev/libxi-dev/
          # libxtst-dev 均被 libwebkit2gtk-4.1-dev 硬依赖链传递安装,librsvg2-dev
          # 构建不需要(Cargo 无 rsvg crate)。libssl-dev 必须保留:hf-hub→
          # native-tls→openssl-sys 非 vendored,构建链接系统 OpenSSL;
          # libayatana-appindicator3-dev 托盘在用;lld/cmake/build-essential
          # 分别是链接器/aws-lc-rs/C 编译链。
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            libpipewire-0.3-dev libdrm-dev libgbm-dev libegl-dev \
            build-essential pkg-config cmake lld
          # 从源头减负:孤儿依赖、apt 缓存包与索引清单不留在构建盘上。
          sudo apt-get autoremove -y --purge
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      # pipewire-rs 0.10 (computer_use Wayland capture, direct + via xcap) needs
      # SPA static inline helpers that ubuntu-22.04's libpipewire 0.3.48 headers
      # lack (libspa-sys bindgens against system headers at build time). Build
      # the upstream 1.0.7 headers+lib into /usr/local so pkg-config resolves
      # the prefix; idempotent, no runner-image drift. Mirrors the pr-check
      # rust legs — the release build compiles the identical crate graph.
      # See scripts/ci-libpipewire-build.sh for the full rationale.
      - name: Build PipeWire 1.0.7 dev prefix (jammy SPA headers too old)
        run: bash scripts/ci-libpipewire-build.sh

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: pinvou3-app/package-lock.json

      - name: 安装前端依赖
        working-directory: pinvou3-app
        run: npm ci --prefer-offline --no-audit

      # bge-m3 是 gitignored 大资源(559MB),CI 干净 checkout 没有它。
      # 当前配置已不直接引用 bge-m3,空占位是防御性保留(同 pr-check.yml 的做法),
      # 防止资源清单日后恢复引用时 tauri-build 资源校验失败。
      - name: bge-m3 占位 (防御性保留)
        run: |
          d=pinvou3-app/src-tauri/resources/bge-m3
          mkdir -p "$d"
          for f in config.json model.onnx tokenizer.json tokenizer_config.json special_tokens_map.json; do
            : > "$d/$f"
          done

      # build.js 自动构建当前 x86_64 的固定版本 SenseVoice runtime，注入 Linux
      # 平台与架构 overlay，并准备 codex bridge。
      # 只打 deb(config overlay 的 targets 也只列了 deb)。
      - name: 构建 deb
        working-directory: pinvou3-app
        run: node scripts/tauri/build.js build --bundles deb

      # tauri deb 产物默认名 pinvou3_<version>_amd64.deb,重命名为 x64 后缀统一全平台命名。
      - name: 校验产物 + 统一命名 + sha256
        working-directory: pinvou3-app/src-tauri/target/release/bundle/deb
        run: |
          set -euo pipefail
          SRC=$(ls pinvou3_*_amd64.deb)
          DST="pinvou3_${VERSION}_x64.deb"
          mv "$SRC" "$DST"
          SHA=$(sha256sum "$DST" | awk '{print $1}')
          echo "deb sha256: $SHA"
          echo "$SHA  $DST" > "$DST.sha256"
          ls -lh "$DST"

      # 同时锁住包内 ELF 架构和 Ubuntu 22.04 ABI，避免把 ARM runtime 混入
      # x64 deb，或由 runner/依赖升级静默抬高运行系统要求。
      - name: ELF 架构 + glibc 下限守卫 (Ubuntu 22.04)
        run: ./scripts/check-linux-glibc-floor.sh "pinvou3-app/src-tauri/target/release/bundle/deb/pinvou3_${VERSION}_x64.deb" amd64

      - name: 上传 deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: pinvou3-linux-${{ needs.check-version-bump.outputs.version }}-x64
          path: |
            pinvou3-app/src-tauri/target/release/bundle/deb/pinvou3_${{ needs.check-version-bump.outputs.version }}_x64.deb
            pinvou3-app/src-tauri/target/release/bundle/deb/pinvou3_${{ needs.check-version-bump.outputs.version }}_x64.deb.sha256
          retention-days: 90
          if-no-files-found: error

  # ── Job 3: Linux arm64 deb(GitHub 原生 arm64 runner,公共仓库免费) ──
  build-linux-arm64:
    name: 构建 Linux arm64 deb
    needs: check-version-bump
    if: >-
      needs.check-version-bump.outputs.build_required == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.check-version-bump.outputs.version }}
      # thin-LTO + codegen-units=1 的冷构建在托管 ARM runner 上连续于约 25 分钟
      # 收到 shutdown(exit 143),且 runner 终止会跳过 Rust cache 保存。仅在该 CI
      # job 关闭跨 crate LTO 并提高代码生成并行度；保留 release 的 O3/strip/panic，
      # 其他平台及正式本地 release profile 仍使用 Cargo.toml 的 thin LTO。
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      # 即使关闭 LTO 也保留 lld，降低大型 Rust binary 的链接内存开销。
      RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
      # release 编译 codewhale-tui 的 SIGBUS 同源风险防护(同 build-linux-x64,
      # 正式入口按平台注入 RUSTC_WRAPPER,见 config.toml 注释)。
      RUSTC_WRAPPER: ${{ github.workspace }}/pinvou3-app/src-tauri/scripts/rustc-stack-wrapper
    steps:
      - name: Checkout (含 submodule)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up zram and swap
        # 内存扩容为尽力而为:超时/失败只告警不阻断(回退 runner 默认内存)。
        run: timeout --kill-after=15 240 sudo --preserve-env=GITHUB_ACTIONS,PINVOU3_CI_DISABLE_ZRAM bash "${{ github.workspace }}/scripts/ci-memory-setup.sh" || echo "::warning::ci-memory-setup 未完成,继续使用 runner 默认内存"

      # hosted runner 是单盘布局(/ 与 /mnt 同一 ext4,x64 镜像开机仅 ~13-14G
      # 可用);发布冷编译(700+ crate,dep-level O2)曾把盘写满(ENOSPC)。在任何
      # 工具链/缓存/依赖落盘之前删掉未使用的预装 SDK。
      # ARM64 镜像轻量(开机 ~34G 可用),base 档已足够;保守不动 /opt:
      # hostedtoolcache 删了 setup-node 也只是重装一遍,徒增下载耗时
      # (与 x64 的 aggressive 档不同)。
      - name: 为发布构建准备磁盘空间
        run: |
          sudo env GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            python3 scripts/ci-rust-disk.py --min-free-gib 24

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          # 与 x64 相同，同时缓存 knowledge-host 的独立 target dir。
          workspaces: |
            pinvou3-app/src-tauri
            pinvou-knowledge
          # jammy 后缀隔离此前由 Ubuntu 24.04 构建的缓存产物。
          shared-key: release-linux-arm64-jammy
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: 装 Tauri + pinvou3 Linux 系统依赖
        run: |
          sudo apt-get update
          # 清单经 2026-09-15 探针逐包冗余审计(剔除单包模拟安装,安装集合
          # 不变即可移除):libgtk-3-dev/libsoup-3.0-dev/libx11-dev/libxi-dev/
          # libxtst-dev 均被 libwebkit2gtk-4.1-dev 硬依赖链传递安装,librsvg2-dev
          # 构建不需要(Cargo 无 rsvg crate)。libssl-dev 必须保留:hf-hub→
          # native-tls→openssl-sys 非 vendored,构建链接系统 OpenSSL;
          # libayatana-appindicator3-dev 托盘在用;lld/cmake/build-essential
          # 分别是链接器/aws-lc-rs/C 编译链。
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            libpipewire-0.3-dev libdrm-dev libgbm-dev libegl-dev \
            build-essential pkg-config cmake lld
          # 从源头减负:孤儿依赖、apt 缓存包与索引清单不留在构建盘上。
          sudo apt-get autoremove -y --purge
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      # pipewire-rs 0.10 (computer_use Wayland capture, direct + via xcap) needs
      # SPA static inline helpers that ubuntu-22.04's libpipewire 0.3.48 headers
      # lack (libspa-sys bindgens against system headers at build time). Build
      # the upstream 1.0.7 headers+lib into /usr/local so pkg-config resolves
      # the prefix; idempotent, no runner-image drift. Mirrors the pr-check
      # rust legs — the release build compiles the identical crate graph.
      # See scripts/ci-libpipewire-build.sh for the full rationale.
      - name: Build PipeWire 1.0.7 dev prefix (jammy SPA headers too old)
        run: bash scripts/ci-libpipewire-build.sh

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: pinvou3-app/package-lock.json

      - name: 安装前端依赖
        working-directory: pinvou3-app
        run: npm ci --prefer-offline --no-audit

      - name: bge-m3 占位 (防御性保留)
        run: |
          d=pinvou3-app/src-tauri/resources/bge-m3
          mkdir -p "$d"
          for f in config.json model.onnx tokenizer.json tokenizer_config.json special_tokens_map.json; do
            : > "$d/$f"
          done

      # 连接器 CLI 不在构建期下载或打入安装包；用户首次连接时，应用按
      # connectors.lock.json 在线下载、校验并安装到用户目录。
      # main VERSION bump 和 workflow_dispatch 统一使用已验证的托管 ARM
      # 发布配置；build.js 先在该原生 runner 构建固定版本的 aarch64
      # SenseVoice runtime。PR 阶段只跑轻量契约。
      - name: 构建 deb（托管 ARM64 发布配置）
        working-directory: pinvou3-app
        run: node scripts/tauri/build.js build --bundles deb

      # tauri deb 产物默认名 pinvou3_<version>_arm64.deb,与目标命名一致,无需重命名。
      - name: 校验产物 + sha256
        working-directory: pinvou3-app/src-tauri/target/release/bundle/deb
        run: |
          set -euo pipefail
          DEB="pinvou3_${VERSION}_arm64.deb"
          test -f "$DEB" || { echo "❌ deb 产物不存在: $DEB"; ls -la; exit 1; }
          SHA=$(sha256sum "$DEB" | awk '{print $1}')
          echo "deb sha256: $SHA"
          echo "$SHA  $DEB" > "$DEB.sha256"
          ls -lh "$DEB"

      - name: ELF 架构 + glibc 下限守卫 (Ubuntu 22.04)
        run: ./scripts/check-linux-glibc-floor.sh "pinvou3-app/src-tauri/target/release/bundle/deb/pinvou3_${VERSION}_arm64.deb" arm64

      - name: 上传 deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: pinvou3-linux-${{ needs.check-version-bump.outputs.version }}-arm64
          path: |
            pinvou3-app/src-tauri/target/release/bundle/deb/pinvou3_${{ needs.check-version-bump.outputs.version }}_arm64.deb
            pinvou3-app/src-tauri/target/release/bundle/deb/pinvou3_${{ needs.check-version-bump.outputs.version }}_arm64.deb.sha256
          retention-days: 90
          if-no-files-found: error

  # ── Job 4: PR 的 Windows 静态验证(不接触私有凭据) ─────────────────
  validate-windows-runtime-pr:
    name: 验证 Windows 私有运行时契约
    needs: check-version-bump
    if: github.event_name == 'pull_request' && needs.check-version-bump.outputs.build_required == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout (不初始化私有 submodule)
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: pinvou3-app/package-lock.json

      - name: 安装前端依赖
        working-directory: pinvou3-app
        run: npm ci --prefer-offline --no-audit

      - name: 验证 Windows 打包契约
        working-directory: pinvou3-app
        run: |
          npm run test:windows-runtime
          npm run test:windows-runtime-cache
          npm run test:codex-acp-windows-runtime

  # ── Job 5: Windows x86_64 nsis(仅受保护的非 PR 上下文) ────────────
  build-windows-x64:
    name: 构建 Windows x86_64 nsis
    needs: [check-version-bump, remote-control-release-gate]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.check-version-bump.outputs.build_required == 'true' && needs.remote-control-release-gate.result == 'success'
    runs-on: windows-latest
    # 0.10.5 的 nsis 构建耗时 ~86min,90min 上限在 post cache save 阶段被撞掉。
    timeout-minutes: 150
    environment:
      name: windows-release
    defaults:
      run:
        # 统一用 Git Bash,sha256sum/通配符逻辑三平台一致。
        shell: bash
    env:
      VERSION: ${{ needs.check-version-bump.outputs.version }}
      PINVOU_DESKTOP_CONTROLLER_ENABLED: ${{ vars.PINVOU_DESKTOP_CONTROLLER_ENABLED || '0' }}
      PINVOU_RELEASE_INSTALLER_SHA256: ${{ vars.PINVOU_RELEASE_INSTALLER_SHA256 }}
      AWS_LC_SYS_PREBUILT_NASM: "1"
      # release 编译 codewhale-tui 的 SIGBUS 同源风险防护(三端统一注入;
      # Windows 用 .exe 版 wrapper(本 job 先编译):.cmd 经 cmd /C 受 8191 字符
      # 命令行上限限制,windows-sys 等大型 crate 的 rustc 命令行会超限)。
      RUSTC_WRAPPER: ${{ github.workspace }}/pinvou3-app/src-tauri/scripts/rustc-stack-wrapper.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 公开运行时由初始化脚本按锁文件精确拉取；不向跨仓库 submodule 传递 job token。
          submodules: false
          persist-credentials: false

      - name: 初始化公共底座 submodule
        run: git submodule update --init --recursive -- CodeWhale

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # 编译 Windows 专用 .exe 栈 wrapper(源码 scripts/rustc-stack-wrapper.rs)。
      # 直接调 rustc 编译、不经 cargo,故不受本 job 的 RUSTC_WRAPPER 影响,无自举依赖。
      - name: 编译 Windows 栈 wrapper(.exe)
        shell: bash
        run: rustc -O pinvou3-app/src-tauri/scripts/rustc-stack-wrapper.rs -o pinvou3-app/src-tauri/scripts/rustc-stack-wrapper.exe

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: pinvou3-app/src-tauri
          shared-key: release-windows-x64
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: pinvou3-app/package-lock.json

      - name: 安装前端依赖
        working-directory: pinvou3-app
        run: npm ci --prefer-offline --no-audit

      # private-runtimes/windows 在 .gitmodules 中显式 update = none，普通递归
      # checkout 会跳过；Windows 发布构建必须按锁定 gitlink 匿名初始化并拉取 LFS。
      - name: 初始化 Windows 独立运行时
        working-directory: pinvou3-app
        run: npm run runtime:windows:init

      - name: 验证 Windows ONNX Runtime 可加载
        working-directory: pinvou3-app
        run: npm run runtime:windows:onnx-smoke

      - name: bge-m3 占位 (防御性保留)
        run: |
          d=pinvou3-app/src-tauri/resources/bge-m3
          mkdir -p "$d"
          for f in config.json model.onnx tokenizer.json tokenizer_config.json special_tokens_map.json; do
            : > "$d/$f"
          done

      - name: 构建 nsis
        if: env.PINVOU_DESKTOP_CONTROLLER_ENABLED != '1'
        working-directory: pinvou3-app
        # 此 workflow 只产出无签名 GitHub artifact；正式 WoSign 依赖本地 UKey
        # 与 gitignored secrets，不能在 GitHub-hosted runner 上调用。
        run: npm run build:nsis:local

      - name: Download qualified Windows evidence artifact
        if: env.PINVOU_DESKTOP_CONTROLLER_ENABLED == '1'
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.remote-control-release-gate.outputs.evidence_artifact_id }}
          github-token: ${{ github.token }}
          run-id: ${{ needs.remote-control-release-gate.outputs.evidence_run_id }}
          path: qualified-remote-control-evidence

      - name: Reuse the exact qualified signed installer
        if: env.PINVOU_DESKTOP_CONTROLLER_ENABLED == '1'
        shell: pwsh
        run: |
          $qualified = @(Get-ChildItem -LiteralPath qualified-remote-control-evidence -Filter pinvou-installer.exe -File -Recurse)
          if ($qualified.Count -ne 1) { throw 'qualified_installer_count_invalid' }
          $actual = (Get-FileHash -LiteralPath $qualified[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:PINVOU_RELEASE_INSTALLER_SHA256) { throw 'qualified_installer_digest_mismatch' }
          $destination = "pinvou3-app/src-tauri/target/release/bundle/nsis/pinvou3_$env:VERSION`_x64-setup.exe"
          New-Item -ItemType Directory -Path (Split-Path -Parent $destination) -Force | Out-Null
          Copy-Item -LiteralPath $qualified[0].FullName -Destination $destination -Force -ErrorAction Stop
          if ((Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash.ToLowerInvariant() -ne $actual) { throw 'qualified_installer_copy_mismatch' }

      - name: 校验产物 + sha256
        working-directory: pinvou3-app/src-tauri/target/release/bundle/nsis
        run: |
          set -euo pipefail
          EXE="pinvou3_${VERSION}_x64-setup.exe"
          test -f "$EXE" || { echo "❌ nsis 产物不存在: $EXE"; ls -la; exit 1; }
          SHA=$(sha256sum "$EXE" | awk '{print $1}')
          echo "nsis sha256: $SHA"
          echo "$SHA  $EXE" > "$EXE.sha256"
          ls -lh "$EXE"

      - name: 上传 nsis artifact
        uses: actions/upload-artifact@v7
        with:
          name: pinvou3-windows-${{ needs.check-version-bump.outputs.version }}-x64
          path: |
            pinvou3-app/src-tauri/target/release/bundle/nsis/pinvou3_${{ needs.check-version-bump.outputs.version }}_x64-setup.exe
            pinvou3-app/src-tauri/target/release/bundle/nsis/pinvou3_${{ needs.check-version-bump.outputs.version }}_x64-setup.exe.sha256
          retention-days: 90
          if-no-files-found: error

  # ── Job 6: macOS universal dmg(沿用原 macOS 发布流程的做法) ──────────
  build-macos-universal:
    name: 构建 macOS universal dmg
    needs: check-version-bump
    if: >-
      needs.check-version-bump.outputs.build_required == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: macos-15
    # 冷缓存双 target + thin LTO 的临界路径持续增长：0.8.3 冷缓存全程约 110 分钟，
    # 0.8.4 依赖面扩大(+72 crate)后冷缓存估算超 160 分钟，150 分钟上限在 pass2 链接
    # 阶段将构建杀掉(run 32093220066，pass1 90m13s + pass2 被杀于 pinvou3-tauri 链接)。
    # release-macos 缓存又因仓库缓存总量顶满 10GB LRU 上限基本不可能跨发布存活，
    # 每次发布都按冷缓存规划。放宽至 240 分钟覆盖依赖增长与 runner 抖动。
    # 实测仍持续增长：0.10.0-0.10.2 分别 138/219/226 分钟(run 34747563852/
    # 34877996483/35308587808)，0.10.3(run 35377723253)在 241 分钟处撞线被取消，
    # macOS dmg 因此缺席发布而其余三平台完成。放宽至 360 分钟。
    timeout-minutes: 360
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      VERSION: ${{ needs.check-version-bump.outputs.version }}
      # v0.9.5 升级后 release(thin-LTO O3)编译 codewhale-tui 时 rustc/LLVM 栈溢出
      # (SIGBUS,run 31558490865 实证)。.cargo/config.toml 不设置 rustc-wrapper
      # (全局键无法按平台条件化),由本 macOS 发布 job 显式注入 RUSTC_WRAPPER
      # 指向 sh 版(wrapper 只作用于编译期 rustc 进程,产物运行时语义不变)。
      RUSTC_WRAPPER: ${{ github.workspace }}/pinvou3-app/src-tauri/scripts/rustc-stack-wrapper
    steps:
      - name: Checkout (含 submodule)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # 实际构建工具链由 src-tauri/rust-toolchain.toml 锁定；必须在该目录下把双 target
      # 安装到 pinned toolchain。只给上面的 stable 引导工具链装 target 会导致 Tauri
      # 切换到 pinned toolchain 后找不到 x86_64 target。
      - name: 安装双 target (universal 构建)
        working-directory: pinvou3-app/src-tauri
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          # Same as the Linux release job: also cache the pinvou-knowledge
          # isolated target dir.
          workspaces: |
            pinvou3-app/src-tauri
            pinvou-knowledge
          shared-key: release-macos-universal
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # macOS 27+ 兼容:dyld 新增 LINKEDIT 字符串池 8 字节对齐校验,而 release 默认
      # strip=debuginfo 会让 proc-macro dylib dlopen 被拒 → E0463(macOS ≤26 无此校验)。
      # runner 目前是 macos-15(不受影响),但 GitHub 升级 runner 到 macOS 27+ 时若缺此
      # 注入,tauri build 会硬失败。同 mac-build.yml 的 workaround。
      - name: macOS 27+ strip workaround
        run: |
          if [ "$(sw_vers -productVersion | cut -d. -f1)" -ge 27 ] 2>/dev/null; then
            echo "CARGO_PROFILE_RELEASE_STRIP=none" >> "$GITHUB_ENV"
            echo "RUSTFLAGS=-C strip=none" >> "$GITHUB_ENV"
            echo "⚠️ macOS $(sw_vers -productVersion) → 注入 strip=none(绕过 dyld 对齐校验)"
          else
            echo "✓ macOS $(sw_vers -productVersion),保留默认 strip"
          fi

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: pinvou3-app/package-lock.json

      - name: 安装前端依赖
        working-directory: pinvou3-app
        run: npm ci --prefer-offline --no-audit

      # bge-m3 是 gitignored 大资源(559MB),CI 干净 checkout 没有它。
      # 当前配置已不直接引用 bge-m3,空占位是防御性保留(同 mac-build.yml 的做法),
      # 防止资源清单日后恢复引用时 tauri-build 资源校验失败。
      - name: bge-m3 占位 (防御性保留)
        run: |
          d=pinvou3-app/src-tauri/resources/bge-m3
          mkdir -p "$d"
          for f in config.json model.onnx tokenizer.json tokenizer_config.json special_tokens_map.json; do
            : > "$d/$f"
          done

      - name: 构建 dmg
        working-directory: pinvou3-app
        run: |
          set -euo pipefail
          # universal-apple-darwin 是 Tauri 合成 target(内部跑 aarch64+x86_64 两次 cargo + lipo),
          # 产出可在 Intel + Apple Silicon 通用运行的 dmg/app。
          node scripts/tauri/build.js build --target universal-apple-darwin

          DMG="src-tauri/target/universal-apple-darwin/release/bundle/dmg/pinvou3_${VERSION}_universal.dmg"
          APP_BUNDLE="src-tauri/target/universal-apple-darwin/release/bundle/macos/pinvou3.app"

          # dmg 打包偶发失败兜底:
          # bundle_dmg.sh 调 osascript 做 Finder 图标美化,CI 无 head 交互环境下偶尔失败
          # (残留临时镜像 / Finder 进程 / osascript 自动化权限)。非 macOS 固有 bug,重跑通常就好。
          # 本 workflow 产出可用 dmg 作 artifact,不能用 continue-on-error,必须带兜底。
          if [ ! -f "$DMG" ] && [ -d "$APP_BUNDLE" ]; then
            echo "⚠️ Tauri dmg 打包未产出 dmg,重试 dmg bundling(跳过编译,只打包)"
            node scripts/tauri/build.js build --target universal-apple-darwin --bundles dmg || echo "⚠️ 重试仍失败,降级手动 hdiutil"
          fi

          # 重试后仍无 dmg:手动 hdiutil 兜底(无 Finder 图标美化,但 dmg 功能完整)。
          if [ ! -f "$DMG" ] && [ -d "$APP_BUNDLE" ]; then
            echo "⚠️ 降级手动 hdiutil 打包(无 Finder 图标美化)"
            DMG_DIR="$(dirname "$DMG")"
            rm -f "$DMG_DIR"/rw.*.dmg 2>/dev/null || true
            TMP_DMG="$DMG_DIR/rw.fallback.dmg"
            hdiutil create -ov -volname "pinvou3" -srcfolder "$APP_BUNDLE" \
              -fs HFS+ -format UDRW "$TMP_DMG" >/dev/null
            DEV=$(hdiutil attach -readwrite -noverify -noautoopen "$TMP_DMG" 2>/dev/null \
                  | grep -E '^/dev/' | sed '1q' | awk '{print $1}')
            ln -sf /Applications "/Volumes/pinvou3/Applications" 2>/dev/null || true
            hdiutil detach "$DEV" >/dev/null 2>&1
            hdiutil convert "$TMP_DMG" -format UDZO -imagekey zlib-level=9 -o "$DMG" >/dev/null
            rm -f "$TMP_DMG"
            echo "✓ 手动 dmg 打包完成(无 Finder 图标美化)"
          fi

          test -f "$DMG" || { echo "❌ dmg 产物不存在: $DMG"; exit 1; }

          # 校验 universal dmg 双架构完整性 + 写 checksum 文件(随 artifact 附带)
          BIN="src-tauri/target/universal-apple-darwin/release/bundle/macos/pinvou3.app/Contents/MacOS/pinvou3-tauri"
          echo "lipo 校验 universal 双切片:"
          lipo "$BIN" -info || { echo "❌ universal 二进制校验失败"; exit 1; }
          lipo "$BIN" -verify_arch x86_64 arm64 || { echo "❌ universal 缺 x86_64 或 arm64 切片"; exit 1; }
          echo "✓ universal 双切片齐全 (arm64 + x86_64)"

          cd src-tauri/target/universal-apple-darwin/release/bundle/dmg
          SHA=$(shasum -a 256 "pinvou3_${VERSION}_universal.dmg" | awk '{print $1}')
          echo "dmg sha256: $SHA"
          echo "$SHA  pinvou3_${VERSION}_universal.dmg" > "pinvou3_${VERSION}_universal.dmg.sha256"
          ls -lh "pinvou3_${VERSION}_universal.dmg"

      - name: 上传 dmg artifact
        uses: actions/upload-artifact@v7
        with:
          name: pinvou3-macos-${{ needs.check-version-bump.outputs.version }}-universal
          path: |
            pinvou3-app/src-tauri/target/universal-apple-darwin/release/bundle/dmg/pinvou3_${{ needs.check-version-bump.outputs.version }}_universal.dmg
            pinvou3-app/src-tauri/target/universal-apple-darwin/release/bundle/dmg/pinvou3_${{ needs.check-version-bump.outputs.version }}_universal.dmg.sha256
          retention-days: 90
          if-no-files-found: error
