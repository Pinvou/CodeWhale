permissions:
  contents: read
  actions: read

concurrency:
  group: release-packages-${{ github.ref }}
  # PR 连续更新时取消旧契约验证；main 的正式版本构建必须完整保留。
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Job 1: 发布链路变更检测(gate,跑 ubuntu 快) ────────────────────
  # push 对比事件 before..sha 的实际路径,覆盖一次 push 含多个 commit 的情况。
  # pull_request / workflow_dispatch 无条件放行 gate:PR 只跑轻量契约,
  # workflow_dispatch 还会让下游完整打包;push 则按实际发布链路 diff 判定。
  # 首次 push 或 before commit 不可达时直接放行,宁可多构建也不漏构建。
  check-version-bump:
    name: 检测发布链路变更
    runs-on: ${{ fromJSON(vars.PINVOU_LINUX_LIGHT_RUNNER || vars.PINVOU_LINUX_RUNNER || '["ubuntu-22.04"]') }}
    timeout-minutes: 10
    outputs:
      build_required: ${{ steps.diff.outputs.build_required }}
      version: ${{ steps.diff.outputs.version }}
    steps:
      # 本 job 只做文件级版本比对(sync-version --check 与其测试),不读 git
      # 历史(此前 fetch-depth:0 注释声称的 push 范围比较并不存在),浅克隆即可。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          # 同 header 凭据策略:纯文件级版本比对,不初始化子模块、无 git
          # 网络操作,不保留 job token。
          persist-credentials: false

      - name: Set up zram and swap
        # 内存扩容为尽力而为:超时/失败只告警不阻断(回退 runner 默认内存)。
        run: timeout --kill-after=15 240 sudo --preserve-env=GITHUB_ACTIONS,PINVOU3_CI_DISABLE_ZRAM,RUNNER_ENVIRONMENT bash "${{ github.workspace }}/scripts/ci-memory-setup.sh" || echo "::warning::ci-memory-setup 未完成,继续使用 runner 默认内存"

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: 版本同步脚本测试
        run: node --test scripts/tests/sync-version.test.mjs

      # 版本号单一事实来源 = 根目录 VERSION。各处版本文件必须已与其同步。
      # 否则包名/包内版本号可能不一致，直接 fail 并提示先运行 sync-version.mjs。
      - name: 校验各处版本文件与 VERSION 一致
        run: node scripts/sync-version.mjs --check

      - name: 对比发布链路
        id: diff
        run: |
          set -euo pipefail
          V=$(tr -d '[:space:]' < VERSION)
          EVENT_NAME="${{ github.event_name }}"
          BEFORE="${{ github.event.before }}"
          if [ "$EVENT_NAME" = "pull_request" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            BUILD_REQUIRED=true
          elif [ -z "$BEFORE" ] || [[ "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            BUILD_REQUIRED=true
          else
            CHANGED_FILES=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
            if printf '%s\n' "$CHANGED_FILES" | node scripts/remote-control-release-path-policy.mjs || printf '%s\n' "$CHANGED_FILES" | grep -Eq \
              '^(VERSION|scripts/(sync-version\.mjs|run-windows-remote-control-e2e\.ps1|windows-e2e-process-guard\.ps1|windows-e2e-orchestrator-helpers\.ps1|create-installer-spdx\.mjs|check-enrollment-gated-v2-rollback\.mjs|asr/(build-sensevoice-runtime\.sh|sensevoice-source\.env)|check-linux-(elf-policy|glibc-floor)\.sh)|remote-control-relay/(docs/schemas/|package(-lock)?\.json|scripts/(controller-release-gate|validate-controller-release-evidence|deploy-controller-preflight|query-controller-release-telemetry|prepare-legacy-gateway-route|verify-provider-attestation|verify-installer-supply-chain)\.mjs|controller-sensitive-scan\.js|test/(controller-(release-|sensitive-scan|telemetry)|windows-e2e-(orchestrator-contract|orchestrator-helpers|path-guard)))|\.github/workflows/(release-packages|windows-remote-control-(evidence|build-evidence))\.yml|\.gitmodules|private-runtimes/windows|pinvou3-app/(package(-lock)?\.json|scripts/(remote-control-ui-smoke\.mjs|tauri/(build|codex-bridge|linux-asr-runtime|platform-config|windows-installer|windows-runtime)\.js)|src-tauri/(config/platforms/(linux|windows)|packaging/windows)/|src-tauri/resources/platforms/linux/asr/|tests/(codex_acp_windows_|linux_asr_runtime_packaging\.test\.js|remote_control_real_ui_smoke_contract\.test\.mjs|windows_runtime_packaging_contract\.test\.js)))'; then
              BUILD_REQUIRED=true
            else
              BUILD_REQUIRED=false
            fi
          fi
          echo "build_required=$BUILD_REQUIRED" >> "$GITHUB_OUTPUT"
          echo "version=$V" >> "$GITHUB_OUTPUT"

  remote-control-release-gate:
    name: Windows 远控真实证据门禁
    needs: check-version-bump
    if: >-
      vars.PINVOU_WINDOWS_ENABLED != 'false' &&
      needs.check-version-bump.outputs.build_required == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ${{ vars.PINVOU_REMOTE_RELEASE_RUNNER || 'windows-latest' }}
    environment:
      name: windows-release
    timeout-minutes: 15
    outputs:
      evidence_artifact_id: ${{ steps.remote-evidence-identity.outputs.artifact-id }}
      evidence_run_id: ${{ steps.remote-evidence-identity.outputs.run-id }}
    env:
      PINVOU_DESKTOP_CONTROLLER_ENABLED: ${{ vars.PINVOU_DESKTOP_CONTROLLER_ENABLED || '0' }}
      PINVOU_RELEASE_COMMIT_SHA: ${{ github.sha }}
      PINVOU_REMOTE_RELEASE_EVIDENCE: ${{ github.workspace }}/remote-control-evidence/manifest.json
      PINVOU_REMOTE_LEGACY_ENDPOINT_INVENTORY: ${{ vars.PINVOU_REMOTE_LEGACY_ENDPOINT_INVENTORY }}
      PINVOU_REMOTE_GATEWAY_CONFIG_PATH: ${{ vars.PINVOU_REMOTE_GATEWAY_CONFIG_PATH }}
      PINVOU_REMOTE_PUBLIC_ENTRYPOINTS_JSON: ${{ vars.PINVOU_REMOTE_PUBLIC_ENTRYPOINTS_JSON }}
      PINVOU_REMOTE_LEGACY_RELAY_URL: ${{ vars.PINVOU_REMOTE_LEGACY_RELAY_URL }}
      PINVOU_REMOTE_LEGACY_RELAY_BIND_HOST: ${{ vars.PINVOU_REMOTE_LEGACY_RELAY_BIND_HOST }}
      PINVOU_TRUSTED_WINDOWS_SIGNER_THUMBPRINT: ${{ vars.PINVOU_TRUSTED_WINDOWS_SIGNER_THUMBPRINT }}
      PINVOU_TRUSTED_WINDOWS_SIGNER_PUBLISHER: ${{ vars.PINVOU_TRUSTED_WINDOWS_SIGNER_PUBLISHER }}
      PINVOU_REMOTE_CONTROLLER_ENV_FILE: ${{ vars.PINVOU_REMOTE_CONTROLLER_ENV_FILE }}
      PINVOU_REMOTE_CONTROLLER_DISABLED_ENV_FILE: ${{ vars.PINVOU_REMOTE_CONTROLLER_DISABLED_ENV_FILE }}
      PINVOU_REMOTE_CONTROLLER_STATE_PATH: ${{ vars.PINVOU_REMOTE_CONTROLLER_STATE_PATH }}
      PINVOU_REMOTE_ENROLLMENT_DEPLOYMENT: ${{ vars.PINVOU_REMOTE_ENROLLMENT_DEPLOYMENT }}
      PINVOU_TRUSTED_E2E_DRIVER_SHA256: ${{ vars.PINVOU_TRUSTED_E2E_DRIVER_SHA256 }}
      PINVOU_TRUSTED_E2E_NODE_SHA256: ${{ vars.PINVOU_TRUSTED_E2E_NODE_SHA256 }}
      PINVOU_TRUSTED_E2E_NODE_SIGNER_THUMBPRINT: ${{ vars.PINVOU_TRUSTED_E2E_NODE_SIGNER_THUMBPRINT }}
      PINVOU_TRUSTED_E2E_NODE_SIGNER_PUBLISHER: ${{ vars.PINVOU_TRUSTED_E2E_NODE_SIGNER_PUBLISHER }}
      PINVOU_TRUSTED_E2E_ATTESTATION_PUBLIC_KEY_SHA256: ${{ vars.PINVOU_TRUSTED_E2E_ATTESTATION_PUBLIC_KEY_SHA256 }}
      PINVOU_TRUSTED_E2E_ATTESTATION_PROVIDER: ${{ vars.PINVOU_TRUSTED_E2E_ATTESTATION_PROVIDER }}
      PINVOU_TRUSTED_E2E_ATTESTATION_KEY_ID: ${{ format('{0}/orchestrator', vars.PINVOU_TRUSTED_E2E_ATTESTATION_KEY_ID) }}
      PINVOU_TRUSTED_E2E_ATTESTATION_ACL_SHA256: ${{ vars.PINVOU_TRUSTED_E2E_ATTESTATION_ACL_SHA256 }}
      PINVOU_TRUSTED_E2E_ATTESTATION_PROVIDER_MEASUREMENT_SHA256: ${{ vars.PINVOU_TRUSTED_E2E_ATTESTATION_PROVIDER_MEASUREMENT_SHA256 }}
      PINVOU_TRUSTED_E2E_ATTESTATION_PROVIDER_VENDOR: ${{ vars.PINVOU_TRUSTED_E2E_PROVIDER_VENDOR }}
      PINVOU_TRUSTED_E2E_PROVIDER_ROOT_CERTIFICATE_SHA256: ${{ vars.PINVOU_TRUSTED_E2E_PROVIDER_ROOT_CERTIFICATE_SHA256 }}
      PINVOU_TRUSTED_E2E_PROVIDER_VERIFIER_CERTIFICATE_SHA256: ${{ vars.PINVOU_TRUSTED_E2E_PROVIDER_VERIFIER_CERTIFICATE_SHA256 }}
      PINVOU_TRUSTED_E2E_ORCHESTRATOR_ROLE_POLICY_SHA256: ${{ vars.PINVOU_TRUSTED_E2E_ORCHESTRATOR_ROLE_POLICY_SHA256 }}
      PINVOU_TRUSTED_E2E_A_ROLE_POLICY_SHA256: ${{ vars.PINVOU_TRUSTED_E2E_A_ROLE_POLICY_SHA256 }}
      PINVOU_TRUSTED_E2E_B_ROLE_POLICY_SHA256: ${{ vars.PINVOU_TRUSTED_E2E_B_ROLE_POLICY_SHA256 }}
      PINVOU_RELEASE_BUILD_PROVENANCE_SHA256: ${{ vars.PINVOU_RELEASE_BUILD_PROVENANCE_SHA256 }}
      PINVOU_RELEASE_BUILD_REPOSITORY: ${{ github.repository }}
      PINVOU_RELEASE_BUILD_WORKFLOW: .github/workflows/windows-remote-control-build-evidence.yml
      PINVOU_RELEASE_BUILD_RUN_ID: ${{ vars.PINVOU_RELEASE_INSTALLER_BUILD_RUN_ID }}
      PINVOU_TRUSTED_GH_PATH: ${{ vars.PINVOU_TRUSTED_RELEASE_GH_PATH }}
      PINVOU_RELEASE_INSTALLER_SHA256: ${{ vars.PINVOU_RELEASE_INSTALLER_SHA256 }}
      PINVOU_RELEASE_VERSION: ${{ needs.check-version-bump.outputs.version }}
      PINVOU_REMOTE_TELEMETRY_SNAPSHOT_URL: ${{ vars.PINVOU_REMOTE_TELEMETRY_SNAPSHOT_URL }}
      PINVOU_REMOTE_TELEMETRY_ADMIN_TOKEN_FILE: ${{ vars.PINVOU_REMOTE_TELEMETRY_ADMIN_TOKEN_FILE }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Node.js（开启发布门禁）
        if: env.PINVOU_DESKTOP_CONTROLLER_ENABLED == '1'
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          # No npm cache, same file-wide release contract as the jobs below:
          # setup-node cannot be told not to save, so a restore-only entry
          # still re-mints a main-scope single-lockfile entry on this rare
          # job (see the job-level rationale below).


      - name: 安装 Relay 发布门禁依赖
        if: env.PINVOU_DESKTOP_CONTROLLER_ENABLED == '1'
        run: npm --prefix remote-control-relay ci --prefer-offline --no-audit --ignore-scripts

      - name: 锁定真实双机证据 run 与 artifact 身份
        id: remote-evidence-identity
        if: env.PINVOU_DESKTOP_CONTROLLER_ENABLED == '1'
        uses: actions/github-script@v8
        env:
          EVIDENCE_RUN_ID: ${{ inputs.remote_control_evidence_run_id || vars.PINVOU_REMOTE_CONTROL_EVIDENCE_RUN_ID }}
          EVIDENCE_ARTIFACT_NAME: ${{ inputs.remote_control_evidence_artifact || vars.PINVOU_REMOTE_CONTROL_EVIDENCE_ARTIFACT }}
          EVIDENCE_ARTIFACT_DIGEST: ${{ inputs.remote_control_evidence_artifact_digest || vars.PINVOU_REMOTE_CONTROL_EVIDENCE_ARTIFACT_DIGEST }}
          EVIDENCE_WORKFLOW_ID: ${{ vars.PINVOU_REMOTE_EVIDENCE_WORKFLOW_ID }}
        with:
          script: |
            const { selectProtectedWorkflowArtifact } = require(`${process.env.GITHUB_WORKSPACE}/remote-control-relay/scripts/verify-github-workflow-run.cjs`);
            const runId = Number(process.env.EVIDENCE_RUN_ID);
            const expectedWorkflowId = Number(process.env.EVIDENCE_WORKFLOW_ID);
            const artifactName = process.env.EVIDENCE_ARTIFACT_NAME;
            const expectedDigest = process.env.EVIDENCE_ARTIFACT_DIGEST;
            if (!Number.isSafeInteger(runId) || runId <= 0 || !Number.isSafeInteger(expectedWorkflowId) || expectedWorkflowId <= 0 || !artifactName || !/^sha256:[a-f0-9]{64}$/.test(expectedDigest || '')) {
              core.setFailed('remote_evidence_identity_configuration_missing');
              return;
            }
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const { data: run } = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: runId });
            const { data: workflow } = await github.rest.actions.getWorkflow({ owner, repo, workflow_id: expectedWorkflowId });
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({ owner, repo, run_id: runId, per_page: 100 });
            let artifact;
            try {
              artifact = selectProtectedWorkflowArtifact({ run, workflow, artifacts: data.artifacts, expected: {
                workflowId: expectedWorkflowId, workflowPath: '.github/workflows/windows-remote-control-evidence.yml',
                sha: context.sha, ref: context.ref, repository: `${owner}/${repo}`,
                artifactName, artifactDigest: expectedDigest,
              }});
            } catch (error) { core.setFailed(error.code || 'remote_evidence_workflow_identity_mismatch'); return; }
            core.setOutput('artifact-id', String(artifact.id));
            core.setOutput('artifact-digest', artifact.digest);
            core.setOutput('run-id', String(runId));

      - name: 下载真实双机证据
        if: env.PINVOU_DESKTOP_CONTROLLER_ENABLED == '1'
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.remote-evidence-identity.outputs.artifact-id }}
          path: remote-control-evidence
          github-token: ${{ github.token }}
          run-id: ${{ inputs.remote_control_evidence_run_id || vars.PINVOU_REMOTE_CONTROL_EVIDENCE_RUN_ID }}

      - name: 执行远控发布门禁
        run: node remote-control-relay/scripts/controller-release-gate.mjs

  build-linux-x64:
    name: 构建 Linux x86_64 deb
    needs: check-version-bump
    if: >-
      needs.check-version-bump.outputs.build_required == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    # 较新的 Ubuntu runner 可能引入 22.04 不具备的 glibc 符号，导致启动崩溃。
    # runner 固定为 ubuntu-22.04；升级前必须调整并验证配套 glibc 下限守卫。
    runs-on: ${{ fromJSON(vars.PINVOU_LINUX_HEAVY_RUNNER || vars.PINVOU_LINUX_RUNNER || '["ubuntu-22.04"]') }}
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.check-version-bump.outputs.version }}
      # 托管 x86_64 runner 的冷 thin-LTO 构建也连续在约 30 分钟收到 shutdown
      # (exit 143)。与 ARM64 一致，仅对 CI artifact 关闭跨 crate LTO 并提高
      # 代码生成并行度；Cargo.toml 的正式本地 release profile 保持 thin LTO。
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      # v0.9.5 升级后 release(thin-LTO O3)编译 codewhale-tui 时 rustc/LLVM 栈溢出
      # (SIGBUS,Linux 与 macOS 同源风险)。.cargo/config.toml 不设置 rustc-wrapper
      # (全局键无法按平台条件化),由本 Linux 发布 job 显式注入 RUSTC_WRAPPER
      # 指向 sh 版(wrapper 只作用于编译期 rustc 进程,产物运行时语义不变)。
      # lld: BFD ld is memory-inefficient on large Rust binaries and is the
      # standalone link-OOM cause (same as arm64). The linker receives only
      # post-LTO plain objects: thin LTO's cross-crate merging completes
      # in-process in the final crate's rustc (cargo compiles dependency crates
      # with -C linker-plugin-lto), so lld is picked for object-linking time
      # and memory, not bitcode support.
      # Mechanism note (2026-10 calibration): since rustc >= 1.90,
      # x86_64-linux-gnu self-links with its bundled rust-lld by default (rustc
      # injects -B<sysroot>/.../gcc-ld into cc itself), so this flag is in
      # practice a redundant fallback under jammy gcc 11 (when gcc resolves
      # ld.lld by name, the -B directory precedes PATH). It is kept as a
      # fallback for older toolchains and local environments; do not conclude
      # from this comment that the linker is apt's ld.lld.
      # The ThinLTO backends run inside rustc's process, so no cap is needed:
      # release O3 + codegen-units=1 stays stable on 4 cores (recent releases
      # 11/11 green).
      # lld:BFD ld 处理大型 Rust binary 内存效率差,是 link OOM 独立主因(同 arm64);
      # BFD also has no --icf, so it cannot perform the identical-code folding
      # on the next line. Thin LTO itself is executed by rustc (the final unit
      # gets -C lto=thin) and is independent of the linker identity; see the
      # Cargo.toml [profile.release] comments for the mechanism.
      # --icf=safe: lld identical-code folding (merges identical code sections,
      # a size optimization). The safe tier only folds functions whose address
      # is provably never taken. The boundary between ICF and Rust function
      # address identity is a known issue (rust#160267 is one example: a
      # miscompilation occurred even under the safe tier, LLVM-side root
      # cause, still unfixed), so the conservative tier is chosen over all.
      # RUSTFLAGS is an env-level injection covering both the tauri main build
      # and the standalone knowledge-host build in this job (the latter's
      # profile lives in pinvou-knowledge/Cargo.toml).
      # --remap-path-prefix: normalizes build-machine absolute paths embedded
      # in the artifact (panic locations etc.) to /. Top-level rustc flag —
      # NOT a -C codegen option; rustc rejects `-C remap-path-prefix`.
      RUSTFLAGS: "-C link-arg=-fuse-ld=lld -C link-arg=-Wl,--icf=safe --remap-path-prefix=${{ github.workspace }}=/"
      RUSTC_WRAPPER: ${{ github.workspace }}/pinvou3-app/src-tauri/scripts/rustc-stack-wrapper
    steps:
      - name: Checkout (含 submodule)
        uses: actions/checkout@v7
        with:
          submodules: recursive
          # header 凭据策略:运行时仓库公开,按锁定 gitlink 匿名拉取,不保留 job token(同 build-windows-x64)。
          persist-credentials: false

      - name: Set up zram and swap
        # 内存扩容为尽力而为:超时/失败只告警不阻断(回退 runner 默认内存)。
        run: timeout --kill-after=15 240 sudo --preserve-env=GITHUB_ACTIONS,PINVOU3_CI_DISABLE_ZRAM,RUNNER_ENVIRONMENT bash "${{ github.workspace }}/scripts/ci-memory-setup.sh" || echo "::warning::ci-memory-setup 未完成,继续使用 runner 默认内存"

      # hosted runner 是单盘布局(/ 与 /mnt 同一 ext4)。ENOSPC 时期的记录
      # (2026-09-15 探针:x64 镜像开机仅 ~13-14G 可用):发布冷编译(700+ crate,
      # dep-level O2)曾把盘写满。2026-10-01 镜像复测(见 ci-memory-setup.sh):
      # x64/arm 开机空闲 79-102G,下方 24G 门是镜像退化时的 fail-loud 守卫。
      # 在任何工具链/缓存/依赖落盘之前删掉未使用的预装 SDK。
      - name: 为发布构建准备磁盘空间
        run: |
          if [[ "$RUNNER_ENVIRONMENT" == self-hosted ]]; then
            exec python3 scripts/ci-rust-disk.py --check-only --min-free-gib 24
          fi
          sudo env GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            python3 scripts/ci-rust-disk.py --aggressive --min-free-gib 24

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # No rust-cache here: releases are strictly read-only against the cache
      # (2026-10 quota policy, pinned by test_release_cache_policy). The
      # restore-only steps that used to live here were removed on 2026-10-15 —
      # zero release-* entries existed live (nothing has written them since the
      # save side was disabled), so every restore was a guaranteed miss and the
      # steps were dead weight. Re-adding caching to a release job needs a
      # fresh look at the quota policy first.

      # pinvou3 编译链接的系统库(gtk/webkit/soup/rsvg/openssl/X11×3/appindicator),
      # ubuntu runner 默认没装;cmake:reqwest 的 rustls 用 aws-lc-rs,其 build script
      # 需 cmake + C 编译器。清单同 pr-check.yml。
      - name: 装 Tauri + pinvou3 Linux 系统依赖
        run: |
          sudo apt-get update
          # 清单经 2026-09-15 探针逐包冗余审计(剔除单包模拟安装,安装集合
          # 不变即可移除):libgtk-3-dev/libsoup-3.0-dev/libx11-dev/libxi-dev/
          # libxtst-dev 均被 libwebkit2gtk-4.1-dev 硬依赖链传递安装,librsvg2-dev
          # 构建不需要(Cargo 无 rsvg crate)。libssl-dev 必须保留:hf-hub→
          # native-tls→openssl-sys 非 vendored,构建链接系统 OpenSSL;
          # libayatana-appindicator3-dev 托盘在用;lld/cmake/build-essential
          # 分别是链接器/aws-lc-rs/C 编译链。
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            libpipewire-0.3-dev libdrm-dev libgbm-dev libegl-dev \
            build-essential pkg-config cmake lld libclang-dev
          # 从源头减负:孤儿依赖、apt 缓存包与索引清单不留在构建盘上。
          if [[ "$RUNNER_ENVIRONMENT" == github-hosted ]]; then
            sudo apt-get autoremove -y --purge
            sudo apt-get clean
            sudo rm -rf /var/lib/apt/lists/*
          fi

      # pipewire-rs 0.10 (computer_use Wayland capture, direct + via xcap) needs
      # SPA static inline helpers that ubuntu-22.04's libpipewire 0.3.48 headers
      # lack (libspa-sys bindgens against system headers at build time). Build
      # the upstream 1.0.7 headers+lib into /usr/local so pkg-config resolves
      # the prefix; idempotent, no runner-image drift. Mirrors the pr-check
      # rust legs — the release build compiles the identical crate graph.
      # See scripts/ci-libpipewire-build.sh for the full rationale.
      - name: Build PipeWire 1.0.7 dev prefix (jammy SPA headers too old)
        run: bash scripts/ci-libpipewire-build.sh

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          # No npm cache. setup-node cannot be told not to save, so keeping
          # cache: 'npm' re-mints a main-scope single-lockfile entry
          # whenever the previous one is gone — evicted, or displaced by a
          # lockfile hash change (scopes are refs: release jobs run in main
          # scope alongside pr-check's push legs; an exact hit in scope
          # skips the re-save, and the 0.10.11 macOS release leg genuinely
          # restored 294MB from exactly such an entry). What the
          # removal costs is seconds of npm ci on a rare job (cold npm ci
          # measured 10-25s in the release runs); what it saves is ~0.2-0.3GB
          # of per-release churn against the 10GB quota. Pinned by
          # test_release_cache_policy; the other three release setup-node
          # steps below carry the same policy via a pointer comment.

      - name: 安装前端依赖
        working-directory: pinvou3-app
        run: npm ci --prefer-offline --no-audit

      # bge-m3 是 gitignored 大资源(559MB),CI 干净 checkout 没有它。
      # 当前配置已不直接引用 bge-m3,空占位是防御性保留(同 pr-check.yml 的做法),
      # 防止资源清单日后恢复引用时 tauri-build 资源校验失败。
      - name: bge-m3 占位 (防御性保留)
        run: |
          d=pinvou3-app/src-tauri/resources/bge-m3
          mkdir -p "$d"
          for f in config.json model.onnx tokenizer.json tokenizer_config.json special_tokens_map.json; do
            : > "$d/$f"
          done

      # build.js 自动构建当前 x86_64 的固定版本 SenseVoice runtime，注入 Linux
      # 平台与架构 overlay，并准备 codex bridge。
      # 只打 deb(config overlay 的 targets 也只列了 deb)。
      - name: 构建 deb
        working-directory: pinvou3-app
        run: node scripts/tauri/build.js build --bundles deb

      # The tauri bundler hardcodes data.tar to gzip-6 (tauri.conf exposes no
      # compression knob); repack as xz -9 to shrink the package. The content
      # is untouched and the sha256 is computed afterwards, so it covers the
      # final artifact.
      - name: Repack deb (data.tar gzip-6 → xz -9)
        working-directory: pinvou3-app/src-tauri/target/release/bundle/deb
        run: bash "$GITHUB_WORKSPACE/scripts/repack-deb-xz.sh" "pinvou3_${VERSION}_amd64.deb"

      # tauri deb 产物默认名 pinvou3_<version>_amd64.deb,重命名为 x64 后缀统一全平台命名。
      - name: 校验产物 + 统一命名 + sha256
        working-directory: pinvou3-app/src-tauri/target/release/bundle/deb
        run: |
          set -euo pipefail
          SRC="pinvou3_${VERSION}_amd64.deb"
          DST="pinvou3_${VERSION}_x64.deb"
          test -f "$SRC" || { echo "❌ deb 产物不存在: $SRC"; ls -la; exit 1; }
          mv "$SRC" "$DST"
          SHA=$(sha256sum "$DST" | awk '{print $1}')
          echo "deb sha256: $SHA"
          echo "$SHA  $DST" > "$DST.sha256"
          ls -lh "$DST"

      # 同时锁住包内 ELF 架构和 Ubuntu 22.04 ABI，避免把 ARM runtime 混入
      # x64 deb，或由 runner/依赖升级静默抬高运行系统要求。
      - name: ELF 架构 + glibc 下限守卫 (Ubuntu 22.04)
        run: ./scripts/check-linux-glibc-floor.sh "pinvou3-app/src-tauri/target/release/bundle/deb/pinvou3_${VERSION}_x64.deb" amd64

      - name: 上传 deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: pinvou3-linux-${{ needs.check-version-bump.outputs.version }}-x64
          path: |
            pinvou3-app/src-tauri/target/release/bundle/deb/pinvou3_${{ needs.check-version-bump.outputs.version }}_x64.deb
            pinvou3-app/src-tauri/target/release/bundle/deb/pinvou3_${{ needs.check-version-bump.outputs.version }}_x64.deb.sha256
          retention-days: 90
          if-no-files-found: error

  # ── Job 3: Linux arm64 deb(GitHub 原生 arm64 runner,公共仓库免费) ──
  build-linux-arm64:
    name: 构建 Linux arm64 deb
    needs: check-version-bump
    if: >-
      needs.check-version-bump.outputs.build_required == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-22.04-arm
    # 2026-10 实测:近 19 次完全成功的 release 构建 37m12s–46m22s
    # (历史观测峰值 48m14s 出自一次被取消 run 中的 arm64 job),
    # 旧上限 90 本有约 2x 余量。放宽到 120 为工具链滚动、缓存冷启动等
    # 长尾留余量,代价只是真挂死时多 30min 才被取消(成功时长不受影响)。
    # 本次仅放宽有实测样本的 arm64(与按 1.5x 联动的 loong64);
    # windows 150 与 macos 360 的余量比例更紧,见各自 job 注释观察。
    timeout-minutes: 120
    env:
      VERSION: ${{ needs.check-version-bump.outputs.version }}
      # thin-LTO + codegen-units=1 的冷构建在托管 ARM runner 上连续于约 25 分钟
      # 收到 shutdown(exit 143),且 runner 终止会跳过 Rust cache 保存。仅在该 CI
      # job 关闭跨 crate LTO 并提高代码生成并行度；保留 release 的 O3/strip/panic，
      # 其他平台及正式本地 release profile 仍使用 Cargo.toml 的 thin LTO。
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      # lld kept: BFD ld is slow and memory-hungry object-linking large Rust
      # binaries (same as x64); the linker receives only post-LTO plain
      # objects, and cross-crate merging completes inside the final crate's
      # rustc process.
      # Mechanism note (2026-10 calibration): rustc 1.90's default rust-lld
      # self-linking covers x86_64-unknown-linux-gnu only; on aarch64 rustc
      # still goes through cc to BFD, so this flag is the lld selection that
      # actually takes effect (apt's ld.lld), not a fallback. The ThinLTO
      # backends run inside rustc's process, so no cap is needed (same reason
      # as x64).
      # lld is required: BFD links large binaries with poor memory efficiency
      # (proven OOM) and has no --icf, so it cannot do --icf=safe. Thin LTO
      # itself is executed by rustc and is independent of the linker identity
      # (see the Cargo.toml [profile.release] comments for the mechanism).
      # --icf=safe / remap-path-prefix: same as build-linux-x64 (see that
      # job's comments for the conservative-tier trade-off and the known
      # fn-address identity boundary rust#160267; the RUSTFLAGS env covers
      # both the tauri main build and knowledge-host).
      RUSTFLAGS: "-C link-arg=-fuse-ld=lld -C link-arg=-Wl,--icf=safe --remap-path-prefix=${{ github.workspace }}=/"
      # release 编译 codewhale-tui 的 SIGBUS 同源风险防护(同 build-linux-x64,
      # 正式入口按平台注入 RUSTC_WRAPPER,见 config.toml 注释)。
      RUSTC_WRAPPER: ${{ github.workspace }}/pinvou3-app/src-tauri/scripts/rustc-stack-wrapper
    steps:
      - name: Checkout (含 submodule)
        uses: actions/checkout@v7
        with:
          submodules: recursive
          # header 凭据策略:运行时仓库公开,按锁定 gitlink 匿名拉取,不保留 job token(同 build-windows-x64)。
          persist-credentials: false

      - name: Set up zram and swap
        # 内存扩容为尽力而为:超时/失败只告警不阻断(回退 runner 默认内存)。
        run: timeout --kill-after=15 240 sudo --preserve-env=GITHUB_ACTIONS,PINVOU3_CI_DISABLE_ZRAM,RUNNER_ENVIRONMENT bash "${{ github.workspace }}/scripts/ci-memory-setup.sh" || echo "::warning::ci-memory-setup 未完成,继续使用 runner 默认内存"

      # hosted runner 是单盘布局(/ 与 /mnt 同一 ext4)。ENOSPC 时期的记录
      # (2026-09-15 探针:x64 镜像开机仅 ~13-14G 可用):发布冷编译(700+ crate,
      # dep-level O2)曾把盘写满。2026-10-01 镜像复测(见 ci-memory-setup.sh):
      # x64/arm 开机空闲 79-102G。在任何工具链/缓存/依赖落盘之前删掉未使用的预装 SDK。
      # ARM64 镜像轻量(72G 时代开机 ~34G 可用),base 档已越过 24G 门;保守不动 /opt:
      # hostedtoolcache 删了 setup-node 也只是重装一遍,徒增下载耗时
      # (与 x64 的 aggressive 档不同)。
      - name: 为发布构建准备磁盘空间
        run: |
          if [[ "$RUNNER_ENVIRONMENT" == self-hosted ]]; then
            exec python3 scripts/ci-rust-disk.py --check-only --min-free-gib 24
          fi
          sudo env GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            python3 scripts/ci-rust-disk.py --min-free-gib 24

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # No rust-cache here — same read-only quota policy as build-linux-x64
      # (see that job's comment; pinned by test_release_cache_policy).

      - name: 装 Tauri + pinvou3 Linux 系统依赖
        run: |
          sudo apt-get update
          # 清单经 2026-09-15 探针逐包冗余审计(剔除单包模拟安装,安装集合
          # 不变即可移除):libgtk-3-dev/libsoup-3.0-dev/libx11-dev/libxi-dev/
          # libxtst-dev 均被 libwebkit2gtk-4.1-dev 硬依赖链传递安装,librsvg2-dev
          # 构建不需要(Cargo 无 rsvg crate)。libssl-dev 必须保留:hf-hub→
          # native-tls→openssl-sys 非 vendored,构建链接系统 OpenSSL;
          # libayatana-appindicator3-dev 托盘在用;lld/cmake/build-essential
          # 分别是链接器/aws-lc-rs/C 编译链。
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            libpipewire-0.3-dev libdrm-dev libgbm-dev libegl-dev \
            build-essential pkg-config cmake lld libclang-dev
          # 从源头减负:孤儿依赖、apt 缓存包与索引清单不留在构建盘上。
          if [[ "$RUNNER_ENVIRONMENT" == github-hosted ]]; then
            sudo apt-get autoremove -y --purge
            sudo apt-get clean
            sudo rm -rf /var/lib/apt/lists/*
          fi

      # pipewire-rs 0.10 (computer_use Wayland capture, direct + via xcap) needs
      # SPA static inline helpers that ubuntu-22.04's libpipewire 0.3.48 headers
      # lack (libspa-sys bindgens against system headers at build time). Build
      # the upstream 1.0.7 headers+lib into /usr/local so pkg-config resolves
      # the prefix; idempotent, no runner-image drift. Mirrors the pr-check
      # rust legs — the release build compiles the identical crate graph.
      # See scripts/ci-libpipewire-build.sh for the full rationale.
      - name: Build PipeWire 1.0.7 dev prefix (jammy SPA headers too old)
        run: bash scripts/ci-libpipewire-build.sh

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          # No npm cache — same policy and rationale as the first
          # setup-node above (dropping it stops the per-release main-scope
          # re-mint; the lost warmth is seconds of npm ci), pinned by
          # test_release_cache_policy.

      - name: 安装前端依赖
        working-directory: pinvou3-app
        run: npm ci --prefer-offline --no-audit

      - name: bge-m3 占位 (防御性保留)
        run: |
          d=pinvou3-app/src-tauri/resources/bge-m3
          mkdir -p "$d"
          for f in config.json model.onnx tokenizer.json tokenizer_config.json special_tokens_map.json; do
            : > "$d/$f"
          done

      # 连接器 CLI 不在构建期下载或打入安装包；用户首次连接时，应用按
      # connectors.lock.json 在线下载、校验并安装到用户目录。
      # main VERSION bump 和 workflow_dispatch 统一使用已验证的托管 ARM
      # 发布配置；build.js 先在该原生 runner 构建固定版本的 aarch64
      # SenseVoice runtime。PR 阶段只跑轻量契约。
      - name: 构建 deb（托管 ARM64 发布配置）
        working-directory: pinvou3-app
        run: node scripts/tauri/build.js build --bundles deb

      # Repack deb (data.tar gzip-6 → xz -9), same as build-linux-x64.
      - name: Repack deb (data.tar gzip-6 → xz -9)
        working-directory: pinvou3-app/src-tauri/target/release/bundle/deb
        run: bash "$GITHUB_WORKSPACE/scripts/repack-deb-xz.sh" "pinvou3_${VERSION}_arm64.deb"

      # tauri deb 产物默认名 pinvou3_<version>_arm64.deb,与目标命名一致,无需重命名。
      - name: 校验产物 + sha256
        working-directory: pinvou3-app/src-tauri/target/release/bundle/deb
        run: |
          set -euo pipefail
          DEB="pinvou3_${VERSION}_arm64.deb"
          test -f "$DEB" || { echo "❌ deb 产物不存在: $DEB"; ls -la; exit 1; }
          SHA=$(sha256sum "$DEB" | awk '{print $1}')
          echo "deb sha256: $SHA"
          echo "$SHA  $DEB" > "$DEB.sha256"
          ls -lh "$DEB"

      - name: ELF 架构 + glibc 下限守卫 (Ubuntu 22.04)
        run: ./scripts/check-linux-glibc-floor.sh "pinvou3-app/src-tauri/target/release/bundle/deb/pinvou3_${VERSION}_arm64.deb" arm64

      - name: 上传 deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: pinvou3-linux-${{ needs.check-version-bump.outputs.version }}-arm64
          path: |
            pinvou3-app/src-tauri/target/release/bundle/deb/pinvou3_${{ needs.check-version-bump.outputs.version }}_arm64.deb
            pinvou3-app/src-tauri/target/release/bundle/deb/pinvou3_${{ needs.check-version-bump.outputs.version }}_arm64.deb.sha256
          retention-days: 90
          if-no-files-found: error

  # ── Job 4: Linux loongarch64 deb(x86_64 runner 全程交叉,GitHub 无 loong64 runner) ──
  build-linux-loongarch64:
    name: 构建 Linux loongarch64 deb
    needs: check-version-bump
    # 与 x64/arm64/macos 同一触发合同:gate 对 pull_request 无条件放行
    # build_required,缺了这层守卫每个发布链路 PR 都会发起 135 分钟重交叉构建。
    if: >-
      needs.check-version-bump.outputs.build_required == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    # GitHub 托管 runner 没有 loong64,job 跑在 x86_64 ubuntu-22.04 上,由
    # scripts/ci-build-linux-loongarch64.sh 全程交叉:sha256 钉死的
    # loong64/cross-tools 20260912(stable, gcc 14.4/glibc 2.38;只有 bfd,
    # 没有 lld)+ deepin beige (glibc 2.38) sysroot。目标基线 = deepin
    # 23/25 + UOS V25 的 glibc 2.38,由工具链/sysroot 决定而非 runner 发行版
    # (与 x64/arm64 的"链接构建机 glibc"模型不同,详见 floor 守护注释)。
    # 首次成功 release 实测 2026-10-22(0.10.14 run):54m56s,仅为 arm64
    # 实测上界(46m22s)的 ~1.2x——"交叉构建显著慢于原生"的旧假设偏悲观。
    # timeout 仍按 arm64 上限的 ~1.5x 放大(120 → 180,policy test 按联动
    # 公式钉住),对实测 ~3.3x 余量;样本尚少(n=1),先保持策略比率。
    runs-on: ${{ fromJSON(vars.PINVOU_LINUX_HEAVY_RUNNER || vars.PINVOU_LINUX_RUNNER || '["ubuntu-22.04"]') }}
    timeout-minutes: 180
    env:
      VERSION: ${{ needs.check-version-bump.outputs.version }}
      # 与 x64/arm64 同源风险:release(thin-LTO O3) 编译 codewhale-tui 的
      # rustc/LLVM 栈溢出(SIGBUS)。交叉构建的 rustc 仍是 x86_64 宿主进程,
      # 同一 sh 版 wrapper 原样生效;编排脚本原样继承本 job 的环境。
      RUSTC_WRAPPER: ${{ github.workspace }}/pinvou3-app/src-tauri/scripts/rustc-stack-wrapper
      # 交叉工具链与 sysroot 放在 cargo target 目录之外(target 归 cargo 域,
      # 钉死版本的工具链树走下面的独立 actions/cache 键)。语义注意:
      # ci-loongarch64-toolchain.sh 的 --prefix 是"接收目录"(树落在
      # <prefix>/<triple>),而本变量与 ci-loongarch64-sysroot.sh /
      # ci-build-linux-loongarch64.sh 约定的是"工具链根"(含 bin/)。
      # 缓存路径/键与 pr-check.yml 的 rust-loongarch64-check leg 逐字一致。
      PINVOU_LOONG64_CACHE_ROOT: ${{ github.workspace }}/.pinvou-loong64-cache
      PINVOU_LOONG64_TOOLCHAIN_PREFIX: ${{ github.workspace }}/.pinvou-loong64-cache/cross-tools/loongarch64-unknown-linux-gnu
      PINVOU_LOONG64_SYSROOT: ${{ github.workspace }}/.pinvou-loong64-cache/sysroot
      # RUSTFLAGS 只带 --remap-path-prefix(与 x64/arm64/macos 产物一致地把
      # 构建机绝对路径从 panic Location 里洗掉;该旗标是 rustc 侧的,不依赖
      # lld)。其余 arm64 的链接旗标刻意不复制:钉死的交叉工具链没有 lld
      # (只有 bfd ld),-C link-arg=-fuse-ld=lld 在这里必然失败;cargo 的
      # 链接改走工具链脚本物化的 rust-lld wrapper(bfd 2.41 解不了 rustc
      # LLVM 的 R_LARCH_CALL36,见 ci-loongarch64-toolchain.sh);--icf=safe
      # 同样是 lld 专属,loong64 deb 不做 identical-code folding,体积代价
      # 已知并接受。LTO 也不在此覆盖:Cargo.toml 的 thin LTO 由 rustc 进程内
      # 执行,与链接器无关(env 覆盖反而偏离已审计的 profile)。
      RUSTFLAGS: "--remap-path-prefix=${{ github.workspace }}=/"
    steps:
      - name: Checkout (含 submodule)
        uses: actions/checkout@v7
        with:
          submodules: recursive
          # header 凭据策略:运行时仓库公开,按锁定 gitlink 匿名拉取,不保留 job token(同 build-windows-x64)。
          persist-credentials: false

      - name: Set up zram and swap
        # Best effort: timeouts or failures only warn and never block (falls back to stock runner memory).
        run: timeout --kill-after=15 240 sudo --preserve-env=GITHUB_ACTIONS,PINVOU3_CI_DISABLE_ZRAM,RUNNER_ENVIRONMENT bash "${{ github.workspace }}/scripts/ci-memory-setup.sh" || echo "::warning::ci-memory-setup did not finish; continuing with stock runner memory"

      # 同 build-linux-x64:ENOSPC 时期(2026-09-15 探针)x86_64 镜像仅 ~13-14G
      # 空闲(2026-10-01 复测开机空闲 79-102G,见 ci-memory-setup.sh);
      # 交叉构建的工具链 + sysroot + 两个 cargo target 目录全部落在工作区内,先腾空间。
      - name: Prepare disk space for the release build
        run: |
          if [[ "$RUNNER_ENVIRONMENT" == self-hosted ]]; then
            exec python3 scripts/ci-rust-disk.py --check-only --min-free-gib 24
          fi
          sudo env GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            python3 scripts/ci-rust-disk.py --aggressive --min-free-gib 24
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add the loongarch64 Rust target
        # 编排脚本内部会再跑一次(幂等);显式一步让 target 缺失在该步骤
        # 即红,而不是埋在十几分钟后的编排脚本里。
        run: rustup target add loongarch64-unknown-linux-gnu

      # 工具链/sysroot 缓存:restore-only。发布 job 永不写缓存(同
      # x64/arm64 rust-cache 的 save-if: false 配额策略);写入方是
      # pr-check.yml 的 rust-loongarch64-check leg(main push 保存,同
      # "main 写、其余读"约定)。发布按冷构建规划,命中只是加速;键把
      # setup 脚本内容 hash 进去,脚本(钉的 sha256/包清单)一变即换代,
      # 旧代由 scripts/cache-janitor.sh 规则 E 去重。
      - name: Restore loong64 cross toolchain cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.PINVOU_LOONG64_CACHE_ROOT }}/cross-tools
          key: release-linux-loong64-jammy-toolchain-${{ hashFiles('scripts/ci-loongarch64-toolchain.sh') }}
          restore-keys: |
            release-linux-loong64-jammy-toolchain-

      - name: Restore loong64 sysroot cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.PINVOU_LOONG64_CACHE_ROOT }}/sysroot
          key: release-linux-loong64-jammy-sysroot-${{ hashFiles('scripts/ci-loongarch64-sysroot.sh') }}
          restore-keys: |
            release-linux-loong64-jammy-sysroot-

      # 宿主只需要构建脚本工具(cc/cmake/pkg-config):目标侧的
      # webkit/gtk/soup/openssl/pipewire 头与库全部来自 glibc 2.38 sysroot,
      # 由 ci-loongarch64-sysroot.sh 对逐个 .pc 模块校验。lld 不装(工具链
      # 只有 bfd);pipewire 不需要宿主 1.0.7 前缀(beige 已带 libpipewire
      # 1.2.5,sysroot 头部齐全,见 ci-libpipewire-build.sh 的适用范围)。
      # libclang: libspa/pipewire 的 bindgen 构建脚本在交叉构建时会给
      # libclang 传 --target=loongarch64-...,而 LoongArch 要 LLVM >= 16
      # 才是主 target(jammy 档案里的 libclang 14/15 没有该 target,bindgen
      # 直接 panic "unknown target triple")。因此钉 apt.llvm.org 的
      # llvm-toolchain-jammy-18 套件装 libclang-18-dev,并用 LIBCLANG_PATH
      # 短路 clang-sys 的多目录探测;目标头文件由 BINDGEN_EXTRA_CLANG_ARGS
      # (编排脚本导出)指向 deepin sysroot。此 run 块与 pr-check.yml 的
      # rust-loongarch64-check leg 在注释剥离后逐字一致
      # (test_release_loongarch64_policy 按剥注释文本钉等价)。
      - name: 装 Tauri + pinvou3 Linux 系统依赖 (host 侧)
        run: |
          set -euo pipefail
          sudo mkdir -p /etc/apt/keyrings
          curl --proto '=https' --tlsv1.2 --location --silent --show-error --fail \
            --retry 3 --retry-delay 2 https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --dearmor --yes -o /etc/apt/keyrings/pinvou-llvm.gpg
          echo "deb [signed-by=/etc/apt/keyrings/pinvou-llvm.gpg] https://apt.llvm.org/jammy/ llvm-toolchain-jammy-18 main" \
            | sudo tee /etc/apt/sources.list.d/pinvou-llvm-18.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake libclang-18-dev file
          # Reduce footprint at the source: orphan dependencies, apt cache packages, and index lists do not stay on the build disk.
          if [[ "$RUNNER_ENVIRONMENT" == github-hosted ]]; then
            sudo apt-get autoremove -y --purge
            sudo apt-get clean
            sudo rm -rf /var/lib/apt/lists/*
          fi
          # clang-sys probes several default locations; pin the discovery to
          # the LoongArch-capable libclang this step just installed.
          echo "LIBCLANG_PATH=/usr/lib/llvm-18/lib" >> "$GITHUB_ENV"

      # 两步均幂等:restore 命中时脚本自检(marker 含 tag/variant/host/sha;
      # manifest 含 glibc-floor/包清单)直接复用,未命中时下载 + sha256 校验
      # (工具链)或 deepin beige 索引解析 + 逐包 sha256(sysroot)。sysroot
      # 的 docker 方法需要 loong64 binfmt(本 job 未注册),脚本 auto 探测
      # 失败后自动回退 deepin 索引直连方法。dpkg arch: loong64。
      - name: Set up the pinned loong64 cross toolchain (sha256-pinned asset)
        run: bash scripts/ci-loongarch64-toolchain.sh --prefix "$PINVOU_LOONG64_CACHE_ROOT/cross-tools"

      - name: Set up the deepin glibc-2.38 loong64 sysroot
        run: bash scripts/ci-loongarch64-sysroot.sh --output "$PINVOU_LOONG64_SYSROOT" --toolchain-prefix "$PINVOU_LOONG64_TOOLCHAIN_PREFIX"
      # 全流程编排(scripts/ci-build-linux-loongarch64.sh,每步失败即停):
      # knowledge server 交叉 cargo build → SenseVoice 引擎交叉 cmake →
      # build.js build --target loongarch64-unknown-linux-gnu(--bundles none:
      # tauri-bundler 无 LoongArch 分支会 panic,build.js 把该请求翻译成
      # CLI 的 --no-bundle;deb 由 package-deb-loongarch64.sh 手工组装)→
      # repack xz -9 → glibc 2.38 下限守护(内部对解包树逐 ELF 跑
      # check-linux-elf-policy.sh)。工具链/sysroot 已在 job env 导出,
      # 编排脚本检测到后跳过内部安装。
      - name: 安装前端依赖
        working-directory: pinvou3-app
        run: npm ci --prefer-offline --no-audit

      - name: Cross build + package the loong64 deb
        run: bash scripts/ci-build-linux-loongarch64.sh

      # 编排脚本产出 pinvou3_<version>_loong64.deb(打包脚本按 dpkg 架构命名,
      # 与 arm64 的"目标命名一致、无需重命名"同款;repack xz -9 已在编排脚本内
      # 完成,此处的 sha256 覆盖最终字节)。
      - name: 校验产物 + sha256
        working-directory: pinvou3-app/src-tauri/target/release/bundle/deb
        run: |
          set -euo pipefail
          DEB="pinvou3_${VERSION}_loong64.deb"
          test -f "$DEB" || { echo "❌ deb 产物不存在: $DEB"; ls -la; exit 1; }
          SHA=$(sha256sum "$DEB" | awk '{print $1}')
          echo "deb sha256: $SHA"
          echo "$SHA  $DEB" > "$DEB.sha256"
          ls -lh "$DEB"

      # glibc 下限守护(同 build-linux-x64/arm64 的 重命名→守护→上传 序列;
      # 断言全部 ELF 的 GLIBC_ 符号 ≤ 2.38 = deepin 23/25 + UOS V25 基线,
      # 架构参数 loongarch64 同时校验包内没有异架构 ELF)。编排脚本对同一
      # 字节跑过一次;此处对最终命名产物再跑,失败即阻断发布。
      - name: glibc 下限守护 (deepin 23/25 + UOS V25 = glibc 2.38)
        run: ./scripts/check-linux-glibc-floor.sh "pinvou3-app/src-tauri/target/release/bundle/deb/pinvou3_${VERSION}_loong64.deb" loongarch64

      - name: 上传 deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: pinvou3-linux-${{ needs.check-version-bump.outputs.version }}-loong64
          path: |
            pinvou3-app/src-tauri/target/release/bundle/deb/pinvou3_${{ needs.check-version-bump.outputs.version }}_loong64.deb
            pinvou3-app/src-tauri/target/release/bundle/deb/pinvou3_${{ needs.check-version-bump.outputs.version }}_loong64.deb.sha256
          retention-days: 90
          if-no-files-found: error

  # ── Job 5: PR 的 Windows 静态验证(不接触私有凭据) ─────────────────
  validate-windows-runtime-pr:
    name: 验证 Windows 私有运行时契约
    needs: check-version-bump
    if: github.event_name == 'pull_request' && needs.check-version-bump.outputs.build_required == 'true' && vars.PINVOU_WINDOWS_ENABLED != 'false'
    runs-on: ${{ fromJSON(vars.PINVOU_WINDOWS_HEAVY_RUNNER || vars.PINVOU_WINDOWS_RUNNER || '["windows-latest"]') }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout (不初始化私有 submodule)
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: 安装前端依赖
        working-directory: pinvou3-app
        run: npm ci --prefer-offline --no-audit

      - name: 验证 Windows 打包契约
        working-directory: pinvou3-app
        run: |
          npm run test:windows-runtime
          npm run test:windows-runtime-cache
          npm run test:codex-acp-windows-runtime

  build-windows-x64:
    name: 构建 Windows x86_64 nsis
    needs: [check-version-bump, remote-control-release-gate]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.check-version-bump.outputs.build_required == 'true' && needs.remote-control-release-gate.result == 'success' && vars.PINVOU_WINDOWS_ENABLED != 'false'
    runs-on: ${{ fromJSON(vars.PINVOU_WINDOWS_HEAVY_RUNNER || vars.PINVOU_WINDOWS_RUNNER || '["windows-latest"]') }}
    # 0.10.5 的 nsis 构建耗时 ~86min,90min 上限在 post cache save 阶段被撞掉。
    timeout-minutes: 150
    environment:
      name: windows-release
    defaults:
      run:
        # 统一用 Git Bash,sha256sum/通配符逻辑三平台一致。
        shell: bash
    env:
      VERSION: ${{ needs.check-version-bump.outputs.version }}
      PINVOU_DESKTOP_CONTROLLER_ENABLED: ${{ vars.PINVOU_DESKTOP_CONTROLLER_ENABLED || '0' }}
      PINVOU_RELEASE_INSTALLER_SHA256: ${{ vars.PINVOU_RELEASE_INSTALLER_SHA256 }}
      AWS_LC_SYS_PREBUILT_NASM: "1"
      # release 编译 codewhale-tui 的 SIGBUS 同源风险防护(三端统一注入;
      # Windows 用 .exe 版 wrapper(本 job 先编译):.cmd 经 cmd /C 受 8191 字符
      # 命令行上限限制,windows-sys 等大型 crate 的 rustc 命令行会超限)。
      RUSTC_WRAPPER: ${{ github.workspace }}/pinvou3-app/src-tauri/scripts/rustc-stack-wrapper.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 公开运行时由初始化脚本按锁文件精确拉取；不向跨仓库 submodule 传递 job token。
          submodules: false
          persist-credentials: false

      - name: 初始化公共底座 submodule
        run: git submodule update --init --recursive -- CodeWhale

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # [linker consistency, 2026-10-02] Select the bundled lld (lld-link) for
      # the shipped binary too, matching the windows-rust-test leg (#642).
      # rustc hands the linker only plain objects (see the Cargo.toml lto
      # note), so this swaps the object-linking step only. #642 moved the test
      # leg because link.exe thrashed the hosted runner's pagefile there
      # (silent 3-4 h runs killed at their 180/240-minute caps; runs
      # 36919362322/36940184038) while the lld-link recipe runs green; this
      # release job has itself built every completed release with link.exe
      # (0.10.6: 94m42s of a 150 cap; a cancelled 0.10.5 attempt left no OOM
      # evidence) — the swap is for cross-leg consistency on the same
      # workspace, not an OOM fix here.
      # Same probed two-step as #642: stable has no target-spanning flag to
      # pick lld. On 1.99 `-C linker-features=+lld` is unstable on every
      # target (it parses and then hard-errors; only the `-lld` opt-out is
      # stable, x86_64-linux-gnu only), so arm 2 always wins today; arm 1
      # stays so a future +lld stabilization is picked up automatically, and
      # both arms do a real link — a pass cannot be a silent no-op.
      # No /threads:1 cap here, unlike the test leg: the job is time-bound and
      # has never recorded a link-memory thrash with link.exe — capping would
      # only slow the release.
      # NOTE for the reviewer: this changes the shipped nsis binary (different
      # linker, same source). Revert = delete this step.
      - name: Probe and export the Windows lld link flags
        shell: bash
        run: |
          set -euo pipefail
          probe="$(mktemp -d)"
          trap 'rm -rf "$probe"' EXIT
          echo 'fn main() {}' > "$probe/probe.rs"
          # --remap-path-prefix normalizes build-machine absolute paths
          # embedded in the artifact (panic locations etc.), same as the
          # job-level RUSTFLAGS of the x64/arm64/macOS jobs. It is a top-level
          # rustc flag (NOT -C); both separator variants are exported because
          # the embedded form follows whatever cargo passed to rustc.
          ws="${GITHUB_WORKSPACE}"
          ws_fwd="${ws//\\//}"
          if rustc -C linker-features=+lld -o "$probe/probe.exe" "$probe/probe.rs" 2>"$probe/a.err"; then
            flags="-C linker-features=+lld"
          elif rustc -C linker=rust-lld -C linker-flavor=lld-link \
              -o "$probe/probe.exe" "$probe/probe.rs" 2>"$probe/b.err"; then
            flags="-C linker=rust-lld -C linker-flavor=lld-link"
          else
            echo "FAIL: this toolchain has no stable flag to select lld" >&2
            cat "$probe/a.err" "$probe/b.err" >&2 || true
            exit 1
          fi
          flags="$flags --remap-path-prefix=$ws=/ --remap-path-prefix=$ws_fwd=/"
          echo "probed RUSTFLAGS=$flags"
          echo "RUSTFLAGS=$flags" >> "$GITHUB_ENV"

      # 编译 Windows 专用 .exe 栈 wrapper(源码 scripts/rustc-stack-wrapper.rs)。
      # 直接调 rustc 编译、不经 cargo,故不受本 job 的 RUSTC_WRAPPER 影响,无自举依赖。
      - name: 编译 Windows 栈 wrapper(.exe)
        shell: bash
        run: rustc -O pinvou3-app/src-tauri/scripts/rustc-stack-wrapper.rs -o pinvou3-app/src-tauri/scripts/rustc-stack-wrapper.exe

      # No rust-cache here — same read-only quota policy as build-linux-x64
      # (see that job's comment; pinned by test_release_cache_policy).

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          # No npm cache — same policy and rationale as the first
          # setup-node above (dropping it stops the per-release main-scope
          # re-mint; the lost warmth is seconds of npm ci), pinned by
          # test_release_cache_policy.

      - name: 安装前端依赖
        working-directory: pinvou3-app
        run: npm ci --prefer-offline --no-audit

      # private-runtimes/windows 在 .gitmodules 中显式 update = none，普通递归
      # checkout 会跳过；Windows 发布构建必须按锁定 gitlink 匿名初始化并拉取 LFS。
      - name: 初始化 Windows 独立运行时
        working-directory: pinvou3-app
        run: npm run runtime:windows:init

      - name: 验证 Windows ONNX Runtime 可加载
        working-directory: pinvou3-app
        run: npm run runtime:windows:onnx-smoke

      - name: bge-m3 占位 (防御性保留)
        run: |
          d=pinvou3-app/src-tauri/resources/bge-m3
          mkdir -p "$d"
          for f in config.json model.onnx tokenizer.json tokenizer_config.json special_tokens_map.json; do
            : > "$d/$f"
          done

      - name: 构建 nsis
        if: env.PINVOU_DESKTOP_CONTROLLER_ENABLED != '1'
        working-directory: pinvou3-app
        # 此 workflow 只产出无签名 GitHub artifact；正式 WoSign 依赖本地 UKey
        # 与 gitignored secrets，不能在 GitHub-hosted runner 上调用。
        run: npm run build:nsis:local

      - name: Download qualified Windows evidence artifact
        if: env.PINVOU_DESKTOP_CONTROLLER_ENABLED == '1'
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.remote-control-release-gate.outputs.evidence_artifact_id }}
          github-token: ${{ github.token }}
          run-id: ${{ needs.remote-control-release-gate.outputs.evidence_run_id }}
          path: qualified-remote-control-evidence

      - name: Reuse the exact qualified signed installer
        if: env.PINVOU_DESKTOP_CONTROLLER_ENABLED == '1'
        shell: pwsh
        run: |
          $qualified = @(Get-ChildItem -LiteralPath qualified-remote-control-evidence -Filter pinvou-installer.exe -File -Recurse)
          if ($qualified.Count -ne 1) { throw 'qualified_installer_count_invalid' }
          $actual = (Get-FileHash -LiteralPath $qualified[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:PINVOU_RELEASE_INSTALLER_SHA256) { throw 'qualified_installer_digest_mismatch' }
          $destination = "pinvou3-app/src-tauri/target/release/bundle/nsis/pinvou3_$env:VERSION`_x64-setup.exe"
          New-Item -ItemType Directory -Path (Split-Path -Parent $destination) -Force | Out-Null
          Copy-Item -LiteralPath $qualified[0].FullName -Destination $destination -Force -ErrorAction Stop
          if ((Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash.ToLowerInvariant() -ne $actual) { throw 'qualified_installer_copy_mismatch' }

      - name: 校验产物 + sha256
        working-directory: pinvou3-app/src-tauri/target/release/bundle/nsis
        run: |
          set -euo pipefail
          EXE="pinvou3_${VERSION}_x64-setup.exe"
          test -f "$EXE" || { echo "❌ nsis 产物不存在: $EXE"; ls -la; exit 1; }
          SHA=$(sha256sum "$EXE" | awk '{print $1}')
          echo "nsis sha256: $SHA"
          echo "$SHA  $EXE" > "$EXE.sha256"
          ls -lh "$EXE"

      - name: 上传 nsis artifact
        uses: actions/upload-artifact@v7
        with:
          name: pinvou3-windows-${{ needs.check-version-bump.outputs.version }}-x64
          path: |
            pinvou3-app/src-tauri/target/release/bundle/nsis/pinvou3_${{ needs.check-version-bump.outputs.version }}_x64-setup.exe
            pinvou3-app/src-tauri/target/release/bundle/nsis/pinvou3_${{ needs.check-version-bump.outputs.version }}_x64-setup.exe.sha256
          retention-days: 90
          if-no-files-found: error

  # ── Job 7: macOS universal dmg(沿用原 macOS 发布流程的做法) ──────────
  build-macos-universal:
    name: 构建 macOS universal dmg
    needs: check-version-bump
    if: >-
      vars.PINVOU_MACOS_ENABLED != 'false' &&
      needs.check-version-bump.outputs.build_required == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: macos-15
    # 冷缓存双 target + thin LTO 的临界路径持续增长：0.8.3 冷缓存全程约 110 分钟，
    # 0.8.4 依赖面扩大(+72 crate)后冷缓存估算超 160 分钟，150 分钟上限在 pass2 链接
    # 阶段将构建杀掉(run 32093220066，pass1 90m13s + pass2 被杀于 pinvou3-tauri 链接)。
    # release-macos 缓存又因仓库缓存总量顶满 10GB LRU 上限基本不可能跨发布存活，
    # 每次发布都按冷缓存规划。放宽至 240 分钟覆盖依赖增长与 runner 抖动。
    # 实测仍持续增长：0.10.0-0.10.2 分别 138/219/226 分钟(run 34747563852/
    # 34877996483/35308587808)，0.10.3(run 35377723253)在 241 分钟处撞线被取消，
    # macOS dmg 因此缺席发布而其余三平台完成。放宽至 360 分钟。
    # Link-mechanism note (2026-10 calibration): thin LTO's cross-crate merging
    # completes in-process in the final crate's rustc (Apple ld links only
    # plain objects and never touches bitcode), and there is no cap knob —
    # this job's duration and memory peak are dominated by the rustc side; the
    # mitigation is splitting the universal build (needs a Tauri
    # universal-bundler change, tracked separately) rather than swapping the
    # linker.
    timeout-minutes: 360
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      VERSION: ${{ needs.check-version-bump.outputs.version }}
      # Normalizes build-machine absolute paths embedded in the artifact
      # (panic locations etc.) to /. Top-level rustc flag — NOT a -C codegen
      # option. Apple ld/ld-prime has no ICF capability,
      # so macOS needs no (and cannot take an) icf flag; -dead_strip is
      # already passed by rustc by default.
      RUSTFLAGS: "--remap-path-prefix=${{ github.workspace }}=/"
      # v0.9.5 升级后 release(thin-LTO O3)编译 codewhale-tui 时 rustc/LLVM 栈溢出
      # (SIGBUS,run 31558490865 实证)。.cargo/config.toml 不设置 rustc-wrapper
      # (全局键无法按平台条件化),由本 macOS 发布 job 显式注入 RUSTC_WRAPPER
      # 指向 sh 版(wrapper 只作用于编译期 rustc 进程,产物运行时语义不变)。
      RUSTC_WRAPPER: ${{ github.workspace }}/pinvou3-app/src-tauri/scripts/rustc-stack-wrapper
    steps:
      - name: Checkout (含 submodule)
        uses: actions/checkout@v7
        with:
          submodules: recursive
          # header 凭据策略:运行时仓库公开,按锁定 gitlink 匿名拉取,不保留 job token(同 build-windows-x64)。
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # No rust-cache here — same read-only quota policy as build-linux-x64
      # (see that job's comment; pinned by test_release_cache_policy).

      # 实际构建工具链由 src-tauri/rust-toolchain.toml 锁定；必须在该目录下把双 target
      # 安装到 pinned toolchain。只给上面的 stable 引导工具链装 target 会导致 Tauri
      # 切换到 pinned toolchain 后找不到 x86_64 target。
      - name: 安装双 target (universal 构建)
        working-directory: pinvou3-app/src-tauri
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      # The macOS 27+ strip=none workaround is removed: every stable toolchain
      # since 1.98 (2026-09) contains the Mach-O __LINKEDIT 8-byte alignment
      # fix (rust#157750, LLVM backport #158410) — rust-toolchain.toml floats
      # stable and can never roll back below it — so strip="symbols" is safe
      # again on every macOS version and artifacts no longer keep
      # symbol tables / debug maps. See docs/binary-size-optimization.md.

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          # No npm cache — same policy and rationale as the first
          # setup-node above (dropping it stops the per-release main-scope
          # re-mint; the lost warmth is seconds of npm ci), pinned by
          # test_release_cache_policy.

      - name: 安装前端依赖
        working-directory: pinvou3-app
        run: npm ci --prefer-offline --no-audit

      # bge-m3 是 gitignored 大资源(559MB),CI 干净 checkout 没有它。
      # 当前配置已不直接引用 bge-m3,空占位是防御性保留(同 mac-build.yml 的做法),
      # 防止资源清单日后恢复引用时 tauri-build 资源校验失败。
      - name: bge-m3 占位 (防御性保留)
        run: |
          d=pinvou3-app/src-tauri/resources/bge-m3
          mkdir -p "$d"
          for f in config.json model.onnx tokenizer.json tokenizer_config.json special_tokens_map.json; do
            : > "$d/$f"
          done

      - name: 构建 dmg
        working-directory: pinvou3-app
        run: |
          set -euo pipefail
          # universal-apple-darwin 是 Tauri 合成 target(内部跑 aarch64+x86_64 两次 cargo + lipo),
          # 产出可在 Intel + Apple Silicon 通用运行的 dmg/app。
          node scripts/tauri/build.js build --target universal-apple-darwin

          DMG="src-tauri/target/universal-apple-darwin/release/bundle/dmg/pinvou3_${VERSION}_universal.dmg"
          APP_BUNDLE="src-tauri/target/universal-apple-darwin/release/bundle/macos/pinvou3.app"

          # dmg 打包偶发失败兜底:
          # bundle_dmg.sh 调 osascript 做 Finder 图标美化,CI 无 head 交互环境下偶尔失败
          # (残留临时镜像 / Finder 进程 / osascript 自动化权限)。非 macOS 固有 bug,重跑通常就好。
          # 本 workflow 产出可用 dmg 作 artifact,不能用 continue-on-error,必须带兜底。
          if [ ! -f "$DMG" ] && [ -d "$APP_BUNDLE" ]; then
            echo "⚠️ Tauri dmg 打包未产出 dmg,重试 dmg bundling(跳过编译,只打包)"
            node scripts/tauri/build.js build --target universal-apple-darwin --bundles dmg || echo "⚠️ 重试仍失败,降级手动 hdiutil"
          fi

          # 重试后仍无 dmg:手动 hdiutil 兜底(无 Finder 图标美化,但 dmg 功能完整)。
          if [ ! -f "$DMG" ] && [ -d "$APP_BUNDLE" ]; then
            echo "⚠️ 降级手动 hdiutil 打包(无 Finder 图标美化)"
            DMG_DIR="$(dirname "$DMG")"
            rm -f "$DMG_DIR"/rw.*.dmg 2>/dev/null || true
            TMP_DMG="$DMG_DIR/rw.fallback.dmg"
            hdiutil create -ov -volname "pinvou3" -srcfolder "$APP_BUNDLE" \
              -fs HFS+ -format UDRW "$TMP_DMG" >/dev/null
            DEV=$(hdiutil attach -readwrite -noverify -noautoopen "$TMP_DMG" 2>/dev/null \
                  | grep -E '^/dev/' | sed '1q' | awk '{print $1}')
            ln -sf /Applications "/Volumes/pinvou3/Applications" 2>/dev/null || true
            hdiutil detach "$DEV" >/dev/null 2>&1
            hdiutil convert "$TMP_DMG" -format UDZO -imagekey zlib-level=9 -o "$DMG" >/dev/null
            rm -f "$TMP_DMG"
            echo "✓ 手动 dmg 打包完成(无 Finder 图标美化)"
          fi

          test -f "$DMG" || { echo "❌ dmg 产物不存在: $DMG"; ls -la "$(dirname "$DMG")"; exit 1; }

          # Compression upgrade: the tauri dmg (bundler's bundle_dmg) is
          # UDZO/zlib and passes no -imagekey zlib-level, so hdiutil uses its
          # default compression level 1 (speed-oriented). The shared helper
          # converts it to ULMO (LZMA, mountable since macOS 10.15+; our
          # floor is 11.0) and degrades to keeping the original dmg on
          # failure; see scripts/convert-dmg-ulmo.sh for the rationale.
          bash "$GITHUB_WORKSPACE/scripts/convert-dmg-ulmo.sh" "$DMG"

          # 校验 universal dmg 双架构完整性 + 写 checksum 文件(随 artifact 附带)
          BIN="src-tauri/target/universal-apple-darwin/release/bundle/macos/pinvou3.app/Contents/MacOS/pinvou3-tauri"
          echo "lipo 校验 universal 双切片:"
          lipo "$BIN" -info || { echo "❌ universal 二进制校验失败"; exit 1; }
          lipo "$BIN" -verify_arch x86_64 arm64 || { echo "❌ universal 缺 x86_64 或 arm64 切片"; exit 1; }
          echo "✓ universal 双切片齐全 (arm64 + x86_64)"

          cd src-tauri/target/universal-apple-darwin/release/bundle/dmg
          SHA=$(shasum -a 256 "pinvou3_${VERSION}_universal.dmg" | awk '{print $1}')
          echo "dmg sha256: $SHA"
          echo "$SHA  pinvou3_${VERSION}_universal.dmg" > "pinvou3_${VERSION}_universal.dmg.sha256"
          ls -lh "pinvou3_${VERSION}_universal.dmg"

      - name: 上传 dmg artifact
        uses: actions/upload-artifact@v7
        with:
          name: pinvou3-macos-${{ needs.check-version-bump.outputs.version }}-universal
          path: |
            pinvou3-app/src-tauri/target/universal-apple-darwin/release/bundle/dmg/pinvou3_${{ needs.check-version-bump.outputs.version }}_universal.dmg
            pinvou3-app/src-tauri/target/universal-apple-darwin/release/bundle/dmg/pinvou3_${{ needs.check-version-bump.outputs.version }}_universal.dmg.sha256
          retention-days: 90
          if-no-files-found: error
