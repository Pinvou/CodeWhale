name: windows-remote-control-build-evidence

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

env:
  # Use the verified official source; do not inherit a failing runner mirror.
  RUSTUP_DIST_SERVER: https://static.rust-lang.org
  RUSTUP_UPDATE_ROOT: https://static.rust-lang.org/rustup

jobs:
  protected-windows-installer:
    environment: windows-release
    runs-on: ${{ vars.PINVOU_WINDOWS_RELEASE_RUNNER || 'self-hosted' }}
    timeout-minutes: 90
    env:
      PINVOU_DESKTOP_CONTROLLER_ENABLED: '1'
      AWS_LC_SYS_PREBUILT_NASM: '1'
      RUSTC_WRAPPER: ${{ github.workspace }}/pinvou3-app/src-tauri/scripts/rustc-stack-wrapper.exe
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          persist-credentials: false

      - name: Initialize public CodeWhale dependency
        shell: pwsh
        run: git submodule update --init --recursive -- CodeWhale

      - name: Configure verified Rust download source
        run: node scripts/ci-rust-network.cjs
      - uses: dtolnay/rust-toolchain@stable
      - name: Report verified Rust download diagnostics
        if: ${{ always() }}
        timeout-minutes: 1
        run: node scripts/ci-rust-network.cjs --report
      - name: Build Windows rustc stack wrapper
        shell: pwsh
        run: rustc -O pinvou3-app/src-tauri/scripts/rustc-stack-wrapper.rs -o pinvou3-app/src-tauri/scripts/rustc-stack-wrapper.exe

      - name: Prepare CI transfer runtime (1)
        timeout-minutes: 1
        working-directory: ${{ github.workspace }}
        run: node scripts/ci-network-node-options.cjs
      - uses: actions/setup-node@v7
        env:
          NODE_OPTIONS: ${{ env.PINVOU_CI_NETWORK_NODE_OPTIONS }}
          PATH: ${{ env.PINVOU_CI_NETWORK_PATH }}
          PINVOU_CI_ARTIFACT_DIAGNOSTICS: '1'
        with:
          node-version: '24'
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          package-manager-cache: ${{ runner.environment == 'github-hosted' }}
          cache-dependency-path: pinvou3-app/package-lock.json

      - name: Build signed installer from checked-out commit
        shell: pwsh
        working-directory: pinvou3-app
        run: |
          npm ci --prefer-offline --no-audit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run runtime:windows:init
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run runtime:windows:onnx-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node ../scripts/sync-version.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build:nsis
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Resolve exactly one installer
        id: installer
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -LiteralPath pinvou3-app/src-tauri/target/release/bundle/nsis -Filter '*.exe' -File)
          if ($installers.Count -ne 1) { throw 'protected_build_installer_count_invalid' }
          "path=$($installers[0].FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Generate commit-bound SPDX 2.3 SBOM
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath VERSION -Raw).Trim()
          node scripts/create-installer-spdx.mjs '${{ steps.installer.outputs.path }}' installer-sbom.spdx.json '${{ github.sha }}' $version pinvou3-app/package-lock.json pinvou3-app/src-tauri/Cargo.lock pinvou3-app/src-tauri/target/release/nsis-stage/manifest.json pinvou3-app/src-tauri/target/release/nsis-stage pinvou3-app/src-tauri/target/release/pinvou3-tauri.exe

      - name: Prepare CI transfer runtime (3)
        timeout-minutes: 1
        working-directory: ${{ github.workspace }}
        run: node scripts/ci-network-node-options.cjs
      - name: Attest installer build provenance
        id: provenance
        uses: actions/attest-build-provenance@v3
        env:
          NODE_OPTIONS: ${{ env.PINVOU_CI_NETWORK_NODE_OPTIONS }}
          PATH: ${{ env.PINVOU_CI_NETWORK_PATH }}
          PINVOU_CI_ARTIFACT_DIAGNOSTICS: '1'
        with:
          subject-path: ${{ steps.installer.outputs.path }}
          show-summary: true

      - name: Prepare CI transfer runtime (4)
        timeout-minutes: 1
        working-directory: ${{ github.workspace }}
        run: node scripts/ci-network-node-options.cjs
      - name: Attest SBOM provenance
        uses: actions/attest-build-provenance@v3
        env:
          NODE_OPTIONS: ${{ env.PINVOU_CI_NETWORK_NODE_OPTIONS }}
          PATH: ${{ env.PINVOU_CI_NETWORK_PATH }}
          PINVOU_CI_ARTIFACT_DIAGNOSTICS: '1'
        with:
          subject-path: installer-sbom.spdx.json
          show-summary: true

      - name: Verify attestation against this protected workflow
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          function Download-OneBundle([string]$subject, [string]$destination) {
            $clean = Join-Path $env:RUNNER_TEMP ([IO.Path]::GetRandomFileName())
            New-Item -ItemType Directory -Path $clean -ErrorAction Stop | Out-Null
            Push-Location $clean
            try {
              gh attestation download $subject --repo '${{ github.repository }}'
              if ($LASTEXITCODE -ne 0) { throw 'protected_build_attestation_download_failed' }
              $bundles = @(Get-ChildItem -LiteralPath $clean -Filter 'sha256-*.jsonl' -File)
              if ($bundles.Count -ne 1) { throw 'protected_build_attestation_bundle_count_invalid' }
              Move-Item -LiteralPath $bundles[0].FullName -Destination (Join-Path '${{ github.workspace }}' $destination) -ErrorAction Stop
            } finally { Pop-Location; Remove-Item -LiteralPath $clean -Recurse -Force -ErrorAction Stop }
          }
          gh attestation verify '${{ steps.installer.outputs.path }}' --repo '${{ github.repository }}' --signer-workflow '.github/workflows/windows-remote-control-build-evidence.yml'
          if ($LASTEXITCODE -ne 0) { throw 'protected_build_installer_attestation_invalid' }
          gh attestation verify installer-sbom.spdx.json --repo '${{ github.repository }}' --signer-workflow '.github/workflows/windows-remote-control-build-evidence.yml'
          if ($LASTEXITCODE -ne 0) { throw 'protected_build_sbom_attestation_invalid' }
          Download-OneBundle '${{ steps.installer.outputs.path }}' 'installer-attestation.sigstore.jsonl'
          Download-OneBundle (Resolve-Path -LiteralPath installer-sbom.spdx.json).Path 'installer-sbom-attestation.sigstore.jsonl'

      - name: Configure artifact transport for Upload installer, attestation bundle, and SPDX
        timeout-minutes: 1
        working-directory: ${{ github.workspace }}
        run: node scripts/ci-artifact-node-options.cjs --network
      - name: Upload installer, attestation bundle, and SPDX
        uses: actions/upload-artifact@v7
        env:
          NODE_OPTIONS: ${{ env.PINVOU_CI_NETWORK_NODE_OPTIONS }}
          PATH: ${{ env.PINVOU_CI_NETWORK_PATH }}
          PINVOU_CI_ARTIFACT_DIAGNOSTICS: '1'
        with:
          name: windows-remote-control-protected-build
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ steps.installer.outputs.path }}
            installer-attestation.sigstore.jsonl
            installer-sbom-attestation.sigstore.jsonl
            installer-sbom.spdx.json
