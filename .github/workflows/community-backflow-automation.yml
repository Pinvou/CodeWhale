name: Community Backflow Automation

on:
  # workflow_run 与 pull_request_target 都只使用默认分支上的受信 workflow/脚本；
  # 本工作流不得 checkout 或执行 PR head 中的代码。
  workflow_run:
    workflows: ["PR Check"]
    types: [completed]
  pull_request_target:
    types: [closed]

permissions:
  checks: read
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: community-backflow-automation-${{ github.event.workflow_run.pull_requests[0].number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  advance:
    name: 推进回流状态
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.merged == true)
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    env:
      # 仓库变量必须精确配置为 true 才允许写操作；未配置时 CLI 安全返回 skipped。
      COMMUNITY_BACKFLOW_AUTOMATION_ENABLED: ${{ vars.COMMUNITY_BACKFLOW_AUTOMATION_ENABLED }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout 默认分支受信代码
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: 校验并推进回流
        run: >-
          node scripts/community-backflow.mjs automation
          --repo "${{ github.repository }}"
          --event-file "$GITHUB_EVENT_PATH"
