name: Output envelope recovery validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wiring:
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, no-envelope, always-preserve]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      RUST_MIN_STACK: '16777216'
      VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          save-if: false
      - name: Apply isolated mutation
        shell: python
        run: |
          import os, pathlib, re
          p=pathlib.Path('crates/tui/src/core/engine/turn_loop.rs')
          s=p.read_text()
          v=os.environ['VARIANT']
          if v=='always-preserve':
              old='if super::context::tool_result_context_view('
              assert s.count(old)==1
              s=s.replace(old,'if true || super::context::tool_result_context_view(')
          elif v=='no-envelope':
              matches=list(re.finditer(r'preserve_tool_output_for_context\(',s))
              assert len(matches)==4
              i=matches[2].start()
              assert s.rfind('if tool_name == MULTI_TOOL_PARALLEL_NAME',0,i)>s.rfind('ToolExecutionBatch::Serial',0,i)
              j=s.index(');',i)+2
              args=s[i+len('preserve_tool_output_for_context('):j-2]
              s=s[:i]+'let _ = ('+args+');'+s[j:]
          p.write_text(s)
      - name: Execute native engine regressions and verify outcome
        shell: bash
        run: |
          set +e
          cargo test -p codewhale-tui --lib --all-features --locked forkguard_turn_loop_ -- --test-threads=1 > wiring.log 2>&1
          status=$?
          cat wiring.log
          export TEST_EXIT="$status"
          python3 - <<'PY'
          import os, pathlib, re
          s=re.sub(r'\x1b\[[0-9;]*m','',pathlib.Path('wiring.log').read_text())
          v=os.environ['VARIANT']
          assert 'running 6 tests' in s, 'all six real tests must execute'
          for arm in ('serial','parallel','envelope'):
              for small in (False,True):
                  suffix='_keeps_complete_output_artifact_free' if small else '_preserves_output_before_fanout'
                  name='forkguard_turn_loop_'+arm+suffix
                  fail=v=='always-preserve' and small or v=='no-envelope' and arm=='envelope' and not small
                  assert name+' ... '+('FAILED' if fail else 'ok') in s, name
          assert int(os.environ['TEST_EXIT'])==(0 if v=='baseline' else 101)
          print('Verified native regression outcome:',v)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: envelope-${{ matrix.variant }}
          path: wiring.log
