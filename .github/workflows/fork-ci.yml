name: Pinvou fork CI

on:
  pull_request:
    branches: [pinvou3-clean]
  push:
    branches: [pinvou3-clean]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      RUST_MIN_STACK: '16777216'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          save-if: ${{ github.event_name == 'push' }}
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint workspace
        run: >-
          cargo clippy --workspace --all-features --locked --
          -D warnings
          -A clippy::uninlined_format_args
          -A clippy::too_many_arguments
          -A clippy::unnecessary_map_or
          -A clippy::collapsible_if
          -A clippy::assertions_on_constants
      - uses: taiki-e/install-action@nextest
      - name: Test workspace
        run: cargo nextest run --workspace --all-features --locked --profile ci --test-threads 2
      - name: Test documentation
        run: cargo test --workspace --all-features --locked --doc
      - name: Check lockfile drift
        run: git diff --exit-code -- Cargo.lock

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks release
        shell: bash
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          printf '%s  %s\n' \
            551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb \
            "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan checked-out tree
        run: '"$RUNNER_TEMP/gitleaks" dir . --redact --no-banner'
      - name: Scan introduced commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          # New branches and manual runs have no base: scan all reachable history.
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            range=HEAD
          else
            range="$BASE_SHA..HEAD"
          fi
          "$RUNNER_TEMP/gitleaks" git . --log-opts="$range" --redact --no-banner

  gate:
    name: gate
    if: always()
    needs: [check, gitleaks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful validation
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          GITLEAKS_RESULT: ${{ needs.gitleaks.result }}
        run: |
          test "$CHECK_RESULT" = success
          test "$GITLEAKS_RESULT" = success
