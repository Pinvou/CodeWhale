name: Recovery review contract validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, no-stream-loss, no-activation]
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      RUST_MIN_STACK: '16777216'
      VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          save-if: false
      - name: Apply isolated production counterexample
        shell: python
        run: |
          import os, pathlib
          v = os.environ['VARIANT']
          if v == 'no-stream-loss':
              p = pathlib.Path('crates/tui/src/core/engine/context.rs')
              old, new = 'keep_text(stream, 800, &mut lossy)', 'keep_text(stream, 800, &mut false)'
          elif v == 'no-activation':
              p = pathlib.Path('crates/tui/src/core/engine/tool_catalog.rs')
              old, new = 'id.starts_with("art_")', 'id.starts_with("disabled_artifact_")'
          else:
              raise SystemExit(0)
          s = p.read_text()
          assert s.count(old) == 1
          p.write_text(s.replace(old, new))
      - name: Run exact contracts and check assertion outcomes
        shell: bash
        run: |
          set +e
          cargo test -p codewhale-tui --lib --all-features --locked forkguard_task_stream_summaries_are_inline_or_recoverable -- --test-threads=1 > streams.log 2>&1
          stream_exit=$?
          cargo test -p codewhale-tui --lib --all-features --locked output_recovery_tests:: -- --test-threads=1 > dispatch.log 2>&1
          dispatch_exit=$?
          cargo test -p codewhale-tui --lib --all-features --locked stamp_subagent_summary_ -- --test-threads=1 > report.log 2>&1
          report_exit=$?
          cargo test -p codewhale-tui --lib --all-features --locked truncation_footer_without_an_artifact_names_the_legacy_retrieval_route -- --test-threads=1 > legacy.log 2>&1
          legacy_exit=$?
          cat streams.log dispatch.log report.log legacy.log
          export STREAM_EXIT="$stream_exit" DISPATCH_EXIT="$dispatch_exit" REPORT_EXIT="$report_exit" LEGACY_EXIT="$legacy_exit"
          python3 - <<'PY'
          import os, pathlib, re
          v = os.environ['VARIANT']
          logs = ''.join(pathlib.Path(f).read_text() for f in ['streams.log', 'dispatch.log', 'report.log', 'legacy.log'])
          logs = re.sub(r'\x1b\[[0-9;]*m', '', logs)
          expected = {
              'forkguard_task_stream_summaries_are_inline_or_recoverable': v == 'no-stream-loss',
              'stamp_subagent_summary_appends_note_when_short': False,
              'stamp_subagent_summary_truncates_when_over_budget': False,
              'truncation_footer_without_an_artifact_names_the_legacy_retrieval_route': False,
          }
          for arm in ['serial', 'parallel', 'envelope']:
              expected['forkguard_turn_loop_' + arm + '_preserves_output_before_fanout'] = v == 'no-activation'
              expected['forkguard_turn_loop_' + arm + '_keeps_complete_output_artifact_free'] = False
          for name, fail in expected.items():
              matches = re.findall(r'::' + name + r' \.\.\. (ok|FAILED)', logs)
              assert matches == [('FAILED' if fail else 'ok')], (v, name, matches)
          assert int(os.environ['STREAM_EXIT']) == (101 if v == 'no-stream-loss' else 0)
          assert int(os.environ['DISPATCH_EXIT']) == (101 if v == 'no-activation' else 0)
          assert int(os.environ['REPORT_EXIT']) == 0
          assert int(os.environ['LEGACY_EXIT']) == 0
          print('Verified exact native assertion outcomes:', v)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-review-${{ matrix.variant }}
          path: '*.log'
