name: Returned-result recovery validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, old-footer, no-producer-note, no-discovery]
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      RUST_MIN_STACK: '16777216'
      VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          save-if: false
      - name: Apply isolated negative control
        shell: python
        run: |
          import os, pathlib
          variant = os.environ['VARIANT']
          p = pathlib.Path('crates/tui/src/core/engine/context.rs')
          text = p.read_text()
          if variant == 'old-footer':
              old = '[complete returned tool result at {path}; {}]'
              assert text.count(old) == 1
              text = text.replace(old, '[full output at {path}; {}]')
          elif variant == 'no-producer-note':
              old = 'No command log saved; returned stream summaries are producer-capped at 900 characters each. Recovery preserves this returned result, not discarded command-stream tails.'
              assert text.count(old) == 1
              text = text.replace(old, 'No command log saved.')
          p.write_text(text)
          if variant == 'no-discovery':
              p = pathlib.Path('crates/tui/src/tools/truncate.rs')
              text = p.read_text()
              start = text.index('        Some(reference) => format!(')
              end = text.index('        None => format!(', start)
              chunk = text[start:end]
              assert chunk.count('tool_search') == 1
              p.write_text(text[:start] + chunk.replace('tool_search', 'unavailable_search') + text[end:])
      - name: Execute native contracts and assert nonzero selections
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess
          tests = ["forkguard_taskless_gate_recovery_names_returned_summaries","forkguard_gate_without_active_task_keeps_both_streams_recoverable","over_budget_result_writes_the_full_output_and_names_its_ref","forkguard_structured_recovery_footer_is_single_and_route_bounded","task_gate_run_results_are_structured_before_context_insertion","spilled_preview_is_refit_not_recut"]
          variant = os.environ['VARIANT']
          for i, name in enumerate(tests):
              fail = i == 0 and variant != 'baseline'
              run = subprocess.run(['cargo', 'test', '-p', 'codewhale-tui', '--lib', '--all-features', '--locked', name, '--', '--test-threads=1'], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              pathlib.Path(name + '.log').write_text(run.stdout)
              print(run.stdout, flush=True)
              assert name in run.stdout, (variant, name, 'identity missing')
              expected = 'test result: FAILED. 0 passed; 1 failed' if fail else 'test result: ok. 1 passed; 0 failed'
              assert expected in run.stdout, (variant, name, 'not exactly one executed test')
              assert run.returncode == (101 if fail else 0), (variant, name, run.returncode)
          print('Verified six selected native contracts:', variant)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: returned-result-${{ matrix.variant }}
          path: '*.log'
