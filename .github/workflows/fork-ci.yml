name: Output recovery wiring validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wiring:
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, no-helper, no-serial, no-parallel]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      RUST_MIN_STACK: '16777216'
      VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          save-if: false
      - name: Apply isolated mutation
        shell: python
        run: |
          import os, pathlib, re
          p=pathlib.Path('crates/tui/src/core/engine/turn_loop.rs')
          s=p.read_text()
          v=os.environ['VARIANT']
          if v=='no-helper':
              old='if super::context::tool_result_context_view('
              assert s.count(old)==1
              s=s.replace(old,'if false && super::context::tool_result_context_view(')
          elif v in ('no-serial','no-parallel'):
              matches=list(re.finditer(r'preserve_tool_output_for_context\(',s))
              assert len(matches)==3
              i=matches[2 if v=='no-serial' else 1].start()
              j=s.index(');',i)+2
              s=s[:i]+s[j:]
          p.write_text(s)
      - name: Execute native engine regressions and verify expected outcome
        shell: bash
        run: |
          set +e
          cargo test -p codewhale-tui --lib --all-features --locked forkguard_turn_loop_ -- --test-threads=1 > wiring.log 2>&1
          status=$?
          cat wiring.log
          export TEST_EXIT="$status"
          python3 - <<'PY'
          import os, pathlib
          s=pathlib.Path('wiring.log').read_text()
          v=os.environ['VARIANT']
          code=int(os.environ['TEST_EXIT'])
          assert 'running 2 tests' in s, 'both real tests must execute'
          for arm in ('serial','parallel'):
              expected='ok' if v=='baseline' or v=='no-serial' and arm=='parallel' or v=='no-parallel' and arm=='serial' else 'FAILED'
              name='forkguard_turn_loop_'+arm+'_preserves_output_before_fanout'
              assert name+' ... '+expected in s, (name, expected)
          assert code==(0 if v=='baseline' else 101), code
          print('Verified native regression outcome:',v)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wiring-${{ matrix.variant }}
          path: wiring.log
