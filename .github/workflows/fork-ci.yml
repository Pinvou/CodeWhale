name: Recovery budget isolation validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, no-guards, no-summary-loss, wrong-report-bytes]
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      RUST_MIN_STACK: '16777216'
      VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          save-if: false
      - name: Add isolated concurrency oracle and counterexample
        shell: python
        run: |
          import os, pathlib
          variant = os.environ['VARIANT']
          p = pathlib.Path('crates/tui/src/core/engine/tests.rs')
          text = p.read_text()
          if variant == 'no-guards':
              for name in ["forkguard_web_body_artifact_does_not_cover_the_response_envelope","over_budget_result_without_a_saved_copy_says_so_and_asks_for_one","over_budget_result_writes_the_full_output_and_names_its_ref","structured_run_tests_summary_is_recoverable_and_leads_with_failures","structured_run_tests_summary_bounds_metadata_and_scales_both_streams"]:
                  start = text.index('fn ' + name + '() {')
                  guard = '    let _workshop = crate::tools::large_output_router::active_workshop_test_guard();'
                  at = text.index(guard, start)
                  assert text[start:at].count('fn ') == 1
                  text = text[:at] + text[at:].replace(guard, '', 1)
          text += r'''
          
          #[test]
          fn review_workshop_readers_respect_install_window() {
              use crate::tools::large_output_router::{WorkshopConfig, active_workshop_test_guard};
              use std::sync::mpsc;
              use std::time::Duration;
              let cases: &[(&str, fn(), usize)] = &[
          ("forkguard_web_body_artifact_does_not_cover_the_response_envelope", forkguard_web_body_artifact_does_not_cover_the_response_envelope as fn(), 77_824),
          ("over_budget_result_without_a_saved_copy_says_so_and_asks_for_one", over_budget_result_without_a_saved_copy_says_so_and_asks_for_one as fn(), 77_824),
          ("over_budget_result_writes_the_full_output_and_names_its_ref", over_budget_result_writes_the_full_output_and_names_its_ref as fn(), 77_824),
          ("structured_run_tests_summary_is_recoverable_and_leads_with_failures", structured_run_tests_summary_is_recoverable_and_leads_with_failures as fn(), 77_824),
          ("structured_run_tests_summary_bounds_metadata_and_scales_both_streams", structured_run_tests_summary_bounds_metadata_and_scales_both_streams as fn(), 77_824)
              ];
              let mut all_protected = true;
              for &(name, function, raised) in cases {
                  let guard = active_workshop_test_guard();
                  WorkshopConfig::install_active(Some(&WorkshopConfig {
                      tool_result_max_bytes: Some(raised), ..Default::default()
                  }));
                  let (entered_tx, entered_rx) = mpsc::channel();
                  let (finished_tx, finished_rx) = mpsc::channel();
                  let worker = std::thread::spawn(move || {
                      entered_tx.send(()).unwrap();
                      let passed = std::panic::catch_unwind(function).is_ok();
                      finished_tx.send(passed).unwrap();
                  });
                  entered_rx.recv_timeout(Duration::from_secs(10)).unwrap();
                  let early = finished_rx.recv_timeout(Duration::from_millis(200));
                  let protected = matches!(early, Err(mpsc::RecvTimeoutError::Timeout));
                  WorkshopConfig::install_active(None);
                  drop(guard);
                  let passed = early.unwrap_or_else(|_| finished_rx.recv_timeout(Duration::from_secs(30)).unwrap());
                  worker.join().unwrap();
                  println!("review reader {name}: blocked={protected} passed={passed}");
                  all_protected &= protected && passed;
              }
              assert!(all_protected, "budget readers overlapped the active install window");
          }
          
          '''
          p.write_text(text)
          if variant == 'no-summary-loss':
              p = pathlib.Path('crates/tui/src/core/engine/context.rs')
              text = p.read_text()
              old = 'keep_text(summary, TOOL_RESULT_METADATA_SUMMARY_CHARS, &mut lossy)'
              assert text.count(old) == 1
              p.write_text(text.replace(old, 'summarize_text(summary, TOOL_RESULT_METADATA_SUMMARY_CHARS)'))
          elif variant == 'wrong-report-bytes':
              p = pathlib.Path('crates/tui/src/tools/subagent/mod.rs')
              text = p.read_text()
              old = 'write_session_artifact(session_id, &artifact_id, &raw)'
              assert text.count(old) == 1
              p.write_text(text.replace(old, 'write_session_artifact(session_id, &artifact_id, "wrong report bytes")'))
      - name: Execute source contracts and exact native oracles
        shell: bash
        run: |
          set +e
          cargo test -p codewhale-tui --lib --all-features --locked review_workshop_readers_respect_install_window -- --test-threads=1 --nocapture > readers.log 2>&1
          reader_exit=$?
          cargo test -p codewhale-tui --lib --all-features --locked forkguard_run_tests_metadata_summary_cut_requests_recovery -- --test-threads=1 > summary.log 2>&1
          summary_exit=$?
          cargo test -p codewhale-tui --lib --all-features --locked forkguard_subagent_report_artifact_keeps_exact_bytes -- --test-threads=1 > report.log 2>&1
          report_exit=$?
          cargo test -p codewhale-tui --lib --all-features --locked handle_read_points_artifact_refs_to_tool_result_retrieval -- --test-threads=1 > handle.log 2>&1
          handle_exit=$?
          cargo test -p codewhale-tui --lib --all-features --locked request_builder_truncates_large_tool_result_for_wire -- --test-threads=1 > wire.log 2>&1
          wire_exit=$?
          cat readers.log summary.log report.log handle.log wire.log
          export READER_EXIT="$reader_exit" SUMMARY_EXIT="$summary_exit" REPORT_EXIT="$report_exit" HANDLE_EXIT="$handle_exit" WIRE_EXIT="$wire_exit"
          python3 - <<'PY'
          import os, pathlib
          variant = os.environ['VARIANT']
          logs = {n: pathlib.Path(n + '.log').read_text() for n in ['readers', 'summary', 'report', 'handle', 'wire']}
          expected = [('readers', 'review_workshop_readers_respect_install_window', variant == 'no-guards', 'READER_EXIT'), ('summary', 'forkguard_run_tests_metadata_summary_cut_requests_recovery', variant == 'no-summary-loss', 'SUMMARY_EXIT'), ('report', 'forkguard_subagent_report_artifact_keeps_exact_bytes', variant == 'wrong-report-bytes', 'REPORT_EXIT'), ('handle', 'handle_read_points_artifact_refs_to_tool_result_retrieval', False, 'HANDLE_EXIT'), ('wire', 'request_builder_truncates_large_tool_result_for_wire', False, 'WIRE_EXIT')]
          for log, name, fail, key in expected:
              assert name in logs[log], (variant, name, 'test identity missing')
              assert ('test result: FAILED. 0 passed; 1 failed' if fail else 'test result: ok. 1 passed; 0 failed') in logs[log], (variant, name)
              assert int(os.environ[key]) == (101 if fail else 0), (variant, key)
          names = ["forkguard_web_body_artifact_does_not_cover_the_response_envelope","over_budget_result_without_a_saved_copy_says_so_and_asks_for_one","over_budget_result_writes_the_full_output_and_names_its_ref","structured_run_tests_summary_is_recoverable_and_leads_with_failures","structured_run_tests_summary_bounds_metadata_and_scales_both_streams"]
          for name in names:
              expected = 'blocked=false passed=false' if variant == 'no-guards' else 'blocked=true passed=true'
              assert 'review reader ' + name + ': ' + expected in logs['readers'], (variant, name)
          print('Verified deterministic budget and data-integrity contracts:', variant)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-budgets-${{ matrix.variant }}
          path: '*.log'
