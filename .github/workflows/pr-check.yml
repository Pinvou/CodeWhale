              - 'scripts/tests/community-backflow.test.mjs'
              - 'scripts/tests/test_community_backflow_*'
              - 'scripts/tests/test_ci_gate_policy.py'
              - 'scripts/tests/test_ci_merge_queue_policy.py'

  # 回流可以在 Windows、macOS 或 Linux 上创建和处理。本 job 不替代实际处理
  # 平台的本地 preflight，而是在 PR current head 与 Merge Queue 组合提交上都用
  # 三平台执行一致的无依赖门禁。main push 不重复，重型产品测试仍按路径路由。
  backflow-portability:
    name: backflow-portability (${{ matrix.os }})
    needs: changes
    if: ${{ !cancelled() && github.event.action != 'closed' && (github.event_name == 'pull_request' || github.event_name == 'merge_group') && (needs.changes.outputs.trusted_backflow == 'true' || needs.changes.outputs.backflow_infra == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: 回流调度与跨平台契约测试
        run: >-
          node --test
          scripts/tests/community-backflow-automation.test.mjs
          scripts/tests/community-backflow.test.mjs

      - name: 当前组合提交轻量预检
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: node scripts/community-backflow.mjs preflight

      # Merge Group 不直接携带单个 PR 正文；来源集合已由 changes 中的
      # ci-rust-policy 通过 API 校验。PR 事件则必须证明提交由哪个平台处理。
      - name: 回读 PR 实际处理平台 provenance
        if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.trusted_backflow == 'true' }}
        env:
          GITHUB_PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/community-backflow.mjs verify

  fast-gate:
    name: fast-gate
    if: ${{ (github.event_name == 'pull_request' && github.event.action != 'closed') || github.event_name == 'merge_group' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout (含 submodule,fork 为 public 直接拉)
        uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 0

      # The workflow's own gate: YAML structure, expression typos, matrix/
      # runner labels, and cron syntax fail here before reaching a runner,
      # instead of pushing broken config onto three platforms.
      # shellcheck integration is explicitly off: its findings drift with the
      # shellcheck version, which is unfit for a deterministic gate
      # (SC2034/SC2209 are known false positives on this repo's patterns).
      # The binary is downloaded from the pinned release tag and verified
      # against the release checksums.txt digest, so CI executes no mutable
      # installer code and a tampered artifact fails the gate here.
      - name: workflow lint (actionlint)
        run: |
          curl --retry 3 -fsSL -o actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum --check -
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -shellcheck= .github/workflows/*.yml

      - name: Set up zram and swap
        # 内存扩容为尽力而为:超时/失败只告警不阻断(回退 runner 默认内存)。
        run: timeout --kill-after=15 240 sudo --preserve-env=GITHUB_ACTIONS,PINVOU3_CI_DISABLE_ZRAM bash "${{ github.workspace }}/scripts/ci-memory-setup.sh" || echo "::warning::ci-memory-setup 未完成,继续使用 runner 默认内存"

      - name: 架构边界门禁
        run: |
          base_ref="${{ github.event_name == 'merge_group' && github.event.merge_group.base_ref || github.base_ref }}"
          base_ref="${base_ref#refs/heads/}"
          python3 scripts/architecture-guard.py --base-ref "origin/$base_ref"

      - name: 文档锚点门禁
        # 文档里的「某文件的某符号」引用必须指得到真东西，并且不许把行号写回去。
        # 行号漂掉之后不会有任何东西报错——读者点过去看到一行不相干的代码，只会
        # 以为自己读错了。这道门禁就是那个「会报错的东西」。
        run: python3 scripts/check-doc-anchors.py

      - name: 公开底座 gitlink 可达性
        # Fail closed: gitlink 必须等于公开维护分支头；过渡期（fork-policy 第 0 节豁免）
        # 内不可变 tag 钉在其收口 commit，rN 收口后恢复三方相等。
        run: ./scripts/verify-public-submodule.sh

      - name: 初始化公共底座 submodule
        run: git submodule update --init --recursive -- CodeWhale

      - name: fork-guard 指纹层 (秒级,不编译)
        run: ./scripts/fork-guard.sh --fast

      - name: fork 合规联动 (gitlink ↔ fork-modifications)
        run: |
          base_ref="${{ github.event_name == 'merge_group' && github.event.merge_group.base_ref || github.base_ref }}"
          base_ref="${base_ref#refs/heads/}"
          ./scripts/ci-fork-link-check.sh "origin/$base_ref"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Session replay auditor 测试
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Python MCP server 测试 (mcp-servers/*/test_*.py)
        run: |
          python3 -m pip install --quiet python-pptx python-docx
          fail=0
          for t in pinvou3-app/resources/mcp-servers/*/test_*.py; do
            [ -f "$t" ] || continue
            echo "== $t =="
            ( cd "$(dirname "$t")" && python3 "$(basename "$t")" ) || fail=1
          done
          [ "$fail" -eq 0 ]

      - name: 内置 MCP 协议与产物契约
        run: python3 scripts/mcp-server-contract-smoke.py

  frontend-test:
    name: frontend-test
    needs: changes
    # 合并原 diff-viewer-test + pet-frontend-test:两者各自 npm ci + build:ui 纯重复,
    # pet 跑 npm test(链尾含 test:diff-parser)与 diff-viewer 的 test:diff-parser 也重复,
    # 且 pet 缺 lint:ui。统一为一个 job 后:依赖/build 各装一次、lint 全覆盖。
    # Draft runs lint/build/logic tests. Ready PRs and merge groups select browser
    # smokes from their actual base/head diff. Shared, unknown, test-infrastructure,
    # and empty diffs fail closed to the complete smoke set.
    if: ${{ !cancelled() && github.event.action != 'closed' && needs.changes.outputs.pure_release_backflow != 'true' && (github.event_name == 'pull_request' || github.event_name == 'merge_group') && (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.pet == 'true') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pinvou3-app
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up zram and swap
        # 内存扩容为尽力而为:超时/失败只告警不阻断(回退 runner 默认内存)。
        # 本 job 只跑 ubuntu,无需 runner.os 门控;曾出现重复 step,已收敛为单个。
        run: timeout --kill-after=15 240 sudo --preserve-env=GITHUB_ACTIONS,PINVOU3_CI_DISABLE_ZRAM bash "${{ github.workspace }}/scripts/ci-memory-setup.sh" || echo "::warning::ci-memory-setup 未完成,继续使用 runner 默认内存"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            pinvou3-app/package-lock.json
            remote-control-relay/package-lock.json

      - name: 安装前端依赖
        run: npm ci --prefer-offline --no-audit

      # test:webui smoke (本 job 末尾) 会 spawn remote-control-relay/server.js,
      # 其顶层 require('ws') 解析自 remote-control-relay/node_modules,故必须装 relay 依赖。
      - name: 安装 Remote relay 依赖 (供 test:webui smoke)
        if: ${{ github.event_name == 'merge_group' || github.event.pull_request.draft == false }}
        run: npm --prefix ../remote-control-relay ci --prefer-offline --no-audit

      - name: ESLint (含 pet 缺失项,现已全覆盖)
        # Official 的存量 warning 仍可由本地 lint 完整查看；CI 只打印会阻断的
        # error，避免数千条 warning 的日志与 annotation 拖慢门禁。
        run: npm run lint:ui -- --quiet

      # 静态分析栈的增量门禁：对 Official 独有的历史欠账保留 warning，
      # 硬性正确性规则仍会阻断。共用同一 node_modules 避免重复安装。
      - name: ESLint (tests/scripts/eslint.config.mjs)
        run: npm run lint:node -- --quiet

      - name: oxlint (fast pre-check)
        run: npm run lint:ox -- --quiet

      - name: Biome lint
        run: npm run lint:biome -- --diagnostic-level=error

      - name: knip (unused files/exports)
        run: npm run lint:knip

      - name: madge (circular imports)
        run: npm run lint:cycles

      - name: Vite build
        run: npm run build:ui

      - name: Credential handoff hash and Service Worker scope gate
        run: |
          node ../scripts/build-credential-handoff.mjs --check
          node ../scripts/build-credential-handoff.mjs --check-deployment

      # Web (relay) build: the startup-bundle layer and the web index contract
      # test (tests/vite_static_assets_contract.test.mjs) only cover the web
      # dist when it exists, so build it unconditionally here instead of
      # relying on the diff-selected test:webui smoke.
      - name: Vite web build (remote relay)
        run: npm run build:web

      # Dist-layer compatibility audit (a marked@16-style lookbehind parse
      # regression is caught by exactly this layer); build:ui above already
      # produced dist/, while the contract test only covers static/inline layers.
      - name: WebView compatibility audit (Safari 14 baseline)
        run: npm run audit:compat

      - name: 前端逻辑测试 (pet 全套 + diff parser + markdown)
        run: npm test

      - name: 准备浏览器
        if: ${{ github.event_name == 'merge_group' || github.event.pull_request.draft == false }}
        run: |
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$chrome"
          echo "CHROME=$chrome" >> "$GITHUB_ENV"

      - name: Password reveal real-browser security gate
        if: ${{ github.event_name == 'merge_group' || github.event.pull_request.draft == false }}
        run: npm run test:password-input-browser

      - name: Ready PR 定向浏览器 smoke
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
            | node ../scripts/select-frontend-smokes.mjs \
            > "$RUNNER_TEMP/frontend-smokes.tsv"
          while IFS="$(printf '\t')" read -r kind target; do
            case "$kind" in
              npm) npm run "$target" ;;
              node) node "$target" ;;
              *) echo "未知 smoke 类型: $kind" >&2; exit 1 ;;
            esac
          done < "$RUNNER_TEMP/frontend-smokes.tsv"

      - name: Merge Queue diff-selected browser smoke
        if: ${{ github.event_name == 'merge_group' }}
        env:
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
            | node ../scripts/select-frontend-smokes.mjs \
            > "$RUNNER_TEMP/frontend-smokes.tsv"
          while IFS="$(printf '\t')" read -r kind target; do
            case "$kind" in
              npm) npm run "$target" ;;
              node) node "$target" ;;
              *) echo "Unknown smoke kind: $kind" >&2; exit 1 ;;
            esac
          done < "$RUNNER_TEMP/frontend-smokes.tsv"

  relay-test:
    name: relay-test
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.relay == 'true' && (github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up zram and swap
        # 内存扩容为尽力而为:超时/失败只告警不阻断(回退 runner 默认内存)。
        run: timeout --kill-after=15 240 sudo --preserve-env=GITHUB_ACTIONS,PINVOU3_CI_DISABLE_ZRAM bash "${{ github.workspace }}/scripts/ci-memory-setup.sh" || echo "::warning::ci-memory-setup 未完成,继续使用 runner 默认内存"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: remote-control-relay/package-lock.json

      - name: 安装 relay 依赖
        run: npm --prefix remote-control-relay ci --prefer-offline --no-audit

      - name: Relay 与部署脚本回归
        run: |
          bash -n scripts/deploy-remote-relay.sh
          bash -n scripts/deploy-remote-relay-test.sh
          npm --prefix remote-control-relay test

  team-relay-hub-test:
    name: team-relay-hub-test
    needs: changes
    if: ${{ !cancelled() && github.event.action != 'closed' && needs.changes.outputs.team_relay_hub == 'true' && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: team_relay_ci_only
          POSTGRES_DB: team_relay_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d team_relay_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEAM_RELAY_TEST_DATABASE_URL: postgres://postgres:team_relay_ci_only@127.0.0.1:5432/team_relay_ci_test
    steps:
      - uses: actions/checkout@v7
      - name: Set up zram and swap
        # 内存扩容为尽力而为:超时/失败只告警不阻断(回退 runner 默认内存)。
        run: timeout --kill-after=15 240 sudo --preserve-env=GITHUB_ACTIONS,PINVOU3_CI_DISABLE_ZRAM bash "${{ github.workspace }}/scripts/ci-memory-setup.sh" || echo "::warning::ci-memory-setup 未完成,继续使用 runner 默认内存"


      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: team-relay-hub/package-lock.json

      - name: 安装 Hub 依赖
        run: npm --prefix team-relay-hub ci --prefer-offline --no-audit

      - name: Hub 完整测试
        run: npm --prefix team-relay-hub test

      - name: Hub 依赖审计
        run: npm --prefix team-relay-hub audit --registry=https://registry.npmjs.org --audit-level=high

  account-platform-test:
    name: account-platform-test
    needs: changes
    if: ${{ !cancelled() && github.event.action != 'closed' && needs.changes.outputs.account_platform == 'true' && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: account_platform_test
          POSTGRES_PASSWORD: account_platform_test
          POSTGRES_DB: account_platform_test
        ports:
          - 5432:5432
        options: >-
          --cpus 2
          --memory 4g
          --shm-size 1g
          --health-cmd "pg_isready -U account_platform_test -d account_platform_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PINVOU_TEST_BILLING_DATABASE_URL: postgresql://account_platform_test:account_platform_test@127.0.0.1:5432/account_platform_test?sslmode=disable
      PINVOU_TEST_ACCOUNT_DATABASE_URL: postgresql://account_platform_test:account_platform_test@127.0.0.1:5432/account_platform_test?sslmode=disable
      PINVOU_TEST_TOKEN_DATABASE_URL: postgresql://account_platform_test:account_platform_test@127.0.0.1:5432/account_platform_token_pagination_test?sslmode=disable
      PINVOU_TEST_TOKEN_OVERVIEW_PERFORMANCE_DATABASE_URL: postgresql://account_platform_test:account_platform_test@127.0.0.1:5432/account_platform_token_overview_performance_test?sslmode=disable
      PINVOU_TEST_NATS_URL: nats://127.0.0.1:4222
    steps:
      - uses: actions/checkout@v7

      - name: Set up zram and swap
        run: timeout --kill-after=15 240 sudo --preserve-env=GITHUB_ACTIONS,PINVOU3_CI_DISABLE_ZRAM bash "${{ github.workspace }}/scripts/ci-memory-setup.sh" || echo "::warning::ci-memory-setup 未完成，继续使用 runner 默认内存"

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache-dependency-path: account-platform/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: account-platform/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: account-platform/deploy/keycloak/mobile-authenticator/pom.xml

      - uses: bufbuild/buf-setup-action@v1
        with:
          version: '1.57.0'

      - name: 安装契约测试依赖
        run: npm --prefix account-platform ci --prefer-offline --no-audit

      - name: 创建 Token 分页隔离数据库
        env:
