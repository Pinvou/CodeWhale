          ! grep -F -- '--- SKIP: TestApprovedCredentialRevokeAuditPostgresIntegration' <<< "$credential_revoke_audit_output"
          formula_metering_unit_output="$(go test -run '^TestGovernedFormulaMeteringUnitPostgresIntegration$' -count=1 -timeout=3m -v ./internal/token)"
          printf '%s\n' "$formula_metering_unit_output"
          grep -F -- '--- PASS: TestGovernedFormulaMeteringUnitPostgresIntegration' <<< "$formula_metering_unit_output"
          ! grep -F -- '--- SKIP: TestGovernedFormulaMeteringUnitPostgresIntegration' <<< "$formula_metering_unit_output"
          lifecycle_pagination_output="$(go test -run '^TestLifecyclePlanPaginationPostgresIntegration$' -count=1 -timeout=3m -v ./internal/token)"
          printf '%s\n' "$lifecycle_pagination_output"
          grep -F -- '--- PASS: TestLifecyclePlanPaginationPostgresIntegration' <<< "$lifecycle_pagination_output"
          ! grep -F -- '--- SKIP: TestLifecyclePlanPaginationPostgresIntegration' <<< "$lifecycle_pagination_output"
          scheduled_publication_output="$(go test -run '^TestScheduledPublicationBaselinePostgresIntegration$' -count=1 -timeout=3m -v ./internal/token)"
          printf '%s\n' "$scheduled_publication_output"
          grep -F -- '--- PASS: TestScheduledPublicationBaselinePostgresIntegration' <<< "$scheduled_publication_output"
          ! grep -F -- '--- SKIP: TestScheduledPublicationBaselinePostgresIntegration' <<< "$scheduled_publication_output"
          restricted_migration_output="$(go test -run '^TestRestrictedMigrationLedgerPostgresIntegration$' -count=1 -timeout=2m -v ./internal/platform/migrations)"
          printf '%s\n' "$restricted_migration_output"
          grep -F -- '--- PASS: TestRestrictedMigrationLedgerPostgresIntegration' <<< "$restricted_migration_output"
          ! grep -F -- '--- SKIP: TestRestrictedMigrationLedgerPostgresIntegration' <<< "$restricted_migration_output"
          token_activation_transition_output="$(go test -run '^TestTokenGovernanceTransitionPostgresIntegration$' -count=1 -timeout=5m -v ./internal/token)"
          printf '%s\n' "$token_activation_transition_output"
          grep -F -- '--- PASS: TestTokenGovernanceTransitionPostgresIntegration' <<< "$token_activation_transition_output"
          ! grep -F -- '--- SKIP: TestTokenGovernanceTransitionPostgresIntegration' <<< "$token_activation_transition_output"
          credential_authority_output="$(go test -run '^TestProductionCredentialAuthorityPostgresIntegration$' -count=1 -timeout=3m -v ./internal/token)"
          printf '%s\n' "$credential_authority_output"
          grep -F -- '--- PASS: TestProductionCredentialAuthorityPostgresIntegration' <<< "$credential_authority_output"
          ! grep -F -- '--- SKIP: TestProductionCredentialAuthorityPostgresIntegration' <<< "$credential_authority_output"
          token_approval_nats_output="$(go test -run '^TestTokenApprovalConsumersNATSIntegration$' -count=1 -timeout=3m -v ./internal/token)"
          printf '%s\n' "$token_approval_nats_output"
          grep -F -- '--- PASS: TestTokenApprovalConsumersNATSIntegration' <<< "$token_approval_nats_output"
          ! grep -F -- '--- SKIP: TestTokenApprovalConsumersNATSIntegration' <<< "$token_approval_nats_output"
          credential_origin_output="$(PINVOU_REQUIRE_CREDENTIAL_BROWSER=1 go test -run '^TestCredentialOriginServicePostgresIntegration$' -count=1 -v ./internal/token)"
          printf '%s\n' "$credential_origin_output"
          grep -F -- '--- PASS: TestCredentialOriginServicePostgresIntegration' <<< "$credential_origin_output"
          ! grep -F -- '--- SKIP: TestCredentialOriginServicePostgresIntegration' <<< "$credential_origin_output"
          go test -short -race ./...
          go vet ./...

      - name: 专属集群的发布角色与原 CLI 实际闭环
        timeout-minutes: 8
        working-directory: account-platform
        run: |
          set -euo pipefail
          release_container="$(docker run --detach --label pinvou.ci=apt137-release --cidfile "$RUNNER_TEMP/apt137-release.cid" --cpus 1 --memory 1g --publish 127.0.0.1:5433:5432 --env POSTGRES_USER=pinvou_release_test --env POSTGRES_DB=postgres --env POSTGRES_HOST_AUTH_METHOD=trust postgres:17-alpine)"
          trap 'docker rm --force "$release_container" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if docker exec "$release_container" pg_isready -U pinvou_release_test -d postgres; then break; fi
            sleep 1
          done
          docker exec "$release_container" pg_isready -U pinvou_release_test -d postgres
          export PINVOU_TEST_RELEASE_DATABASE_URL='postgresql://pinvou_release_test@127.0.0.1:5433/postgres?sslmode=disable'
          export PINVOU_TEST_RELEASE_CLI_DIRECTORY="$RUNNER_TEMP/apt137-original-cli"
          mkdir "$PINVOU_TEST_RELEASE_CLI_DIRECTORY"
          for command in migrate token-governance token-policy-bootstrap; do
            go build -tags=nomsgpack -trimpath -o "$PINVOU_TEST_RELEASE_CLI_DIRECTORY/$command" "./cmd/$command"
          done
          for testcase in TestTokenReleasePreparationPostgresIntegration TestTokenReleaseOperationsPostgresIntegration; do
            go test -tags=nomsgpack -run "^${testcase}$" -count=1 -timeout=3m -v ./cmd/token-release-prepare | tee "$RUNNER_TEMP/$testcase.log"
            grep -F -- "--- PASS: $testcase" "$RUNNER_TEMP/$testcase.log"
            ! grep -F -- '--- SKIP:' "$RUNNER_TEMP/$testcase.log"
          done
          test "$(docker exec "$release_container" psql -U pinvou_release_test -d postgres -Atc "SELECT count(*) FROM pg_roles WHERE rolname !~ '^pg_' AND rolname <> 'pinvou_release_test'")" = 0
          test "$(docker exec "$release_container" psql -U pinvou_release_test -d postgres -Atc "SELECT count(*) FROM pg_database WHERE NOT datistemplate AND datname <> 'postgres'")" = 0

      - name: 精确清理发布角色测试实例
        if: ${{ always() }}
        run: |
          if test -f "$RUNNER_TEMP/apt137-release.cid"; then
            release_container="$(cat "$RUNNER_TEMP/apt137-release.cid")"
            [[ "$release_container" =~ ^[a-f0-9]{64}$ ]]
            if docker inspect "$release_container" >/dev/null 2>&1; then
              test "$(docker inspect --format '{{ index .Config.Labels "pinvou.ci" }}' "$release_container")" = apt137-release
              docker rm --force "$release_container"
            fi
          fi

      - name: 真实 Chromium 的只读 scope 与恶意响应门禁
        timeout-minutes: 3
        run: |
          set -euo pipefail
          test -n "$CHROME"
          test -x "$CHROME"
          node --test --test-reporter=tap pinvou3-app/tests/credential_origin_scope_probe.test.mjs | tee "$RUNNER_TEMP/apt137-scope.tap"
          grep -E '^ok [0-9]+ - real Chromium scope gate rejects hostile bytes and passive headers before receiver side effects' "$RUNNER_TEMP/apt137-scope.tap"
          grep -Fx '# skipped 0' "$RUNNER_TEMP/apt137-scope.tap"
          ! grep -E '# SKIP|^not ok' "$RUNNER_TEMP/apt137-scope.tap"

      - name: OpenAPI、事件与迁移契约
        run: |
          PINVOU_REQUIRE_PASSWORD_BROWSER_TEST=1 npm --prefix account-platform test
          buf lint account-platform/contracts/proto

      - name: PostgreSQL 迁移正反向验证
        working-directory: account-platform
        env:
          PGPASSWORD: account_platform_test
        run: |
          for domain in account billing token payment-simulator; do
            database="account_platform_test_${domain//-/_}"
            createdb --host 127.0.0.1 --username account_platform_test "$database"
            export DATABASE_URL="postgresql://account_platform_test:account_platform_test@127.0.0.1:5432/$database?sslmode=disable"
            go run ./cmd/migrate --dir "migrations/$domain"
            while psql "$DATABASE_URL" --tuples-only --no-align --command "SELECT EXISTS(SELECT 1 FROM schema_migrations)" | grep -qx t; do
              go run ./cmd/migrate --dir "migrations/$domain" --direction down
            done
            go run ./cmd/migrate --dir "migrations/$domain"
          done

      - name: Compose 配置和服务镜像构建
        run: |
          docker compose \
            --env-file account-platform/deploy/compose/.env.example \
            -f account-platform/deploy/compose/compose.yaml \
            config --quiet
          docker compose \
            --env-file account-platform/deploy/compose/.env.example \
            -f account-platform/deploy/compose/compose.yaml \
            build account-service billing-service token-gateway token-portal payment-simulator account-event-relay account-migrate
          docker run --rm -v "$PWD/account-platform/deploy/helm/account-platform:/chart:ro" alpine/helm:4.2.3 lint /chart -f /chart/values-staging.yaml
          docker run --rm -v "$PWD/account-platform/deploy/helm/account-platform:/chart:ro" alpine/helm:4.2.3 lint /chart -f /chart/values-production-new.yaml
          docker run --rm -v "$PWD/account-platform/deploy/helm/account-platform:/chart:ro" alpine/helm:4.2.3 template pinvou /chart -f /chart/values-production-new.yaml > /tmp/account-platform-production.yaml
          node scripts/account-platform-keycloak-helm-check.mjs /tmp/account-platform-production.yaml
          ! grep -E 'payment-simulator|mock-newapi|TOKEN_LOCAL_KEK_BASE64|kind: Secret' /tmp/account-platform-production.yaml

      - name: 新治理 profile 的真实配置与镜像门禁
        timeout-minutes: 8
        run: |
          set -euo pipefail
          compose=(docker compose --env-file account-platform/deploy/compose/.env.example --env-file account-platform/deploy/compose/model-token.env.example -f account-platform/deploy/compose/compose.yaml -f account-platform/deploy/compose/compose.model-token.yaml --profile model-token --profile governance-operations --profile real-newapi)
          "${compose[@]}" config --quiet
          "${compose[@]}" config --format json > "$RUNNER_TEMP/apt137-compose.json"
          node scripts/account-platform-model-token-deployment-check.mjs --compose-render "$RUNNER_TEMP/apt137-compose.json"
          PINVOU_TEST_KMS_COMPOSE=1 node --test account-platform/test/contract/kms-compose.test.mjs
          "${compose[@]}" build token-credential-portal token-command-executor token-governance-check
          chart="$PWD/account-platform/deploy/helm/account-platform"
          docker run --rm -v "$chart:/chart:ro" alpine/helm:4.2.3 lint /chart
          for values in values-staging.yaml values-production-new.yaml values-model-token-test.yaml; do
            docker run --rm -v "$chart:/chart:ro" alpine/helm:4.2.3 lint /chart -f "/chart/$values"
          done
          docker run --rm -v "$chart:/chart:ro" alpine/helm:4.2.3 template pinvou /chart -f /chart/values-model-token-test.yaml > "$RUNNER_TEMP/apt137-helm.yaml"
          node scripts/account-platform-model-token-deployment-check.mjs --helm-render "$RUNNER_TEMP/apt137-helm.yaml"
          PINVOU_TEST_KMS_HELM=1 PINVOU_TEST_KMS_HELM_IMAGE=alpine/helm:4.2.3 node --test account-platform/test/contract/kms-helm.test.mjs

      - name: nginx 1.18 真实解析和隔离响应矩阵
        timeout-minutes: 5
        run: |
          set -euo pipefail
          fixture_directory="$(mktemp -d "$RUNNER_TEMP/pinvou-nginx-ci-XXXXXX")"
          node scripts/account-platform-render-nginx-fixtures.mjs --output "$fixture_directory" --runtime-root /fixture
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -keyout "$fixture_directory/fixture.key" -out "$fixture_directory/fixture.crt" -subj /CN=localhost -addext 'subjectAltName=DNS:localhost,DNS:account-uat.pinvou.com,DNS:credentials-uat.pinvou.com,DNS:account.pinvou.com,DNS:credentials.pinvou.com' >/dev/null 2>&1
          docker build -f account-platform/test/deployment/nginx.Dockerfile -t pinvou-nginx-ci:apt137 account-platform/test/deployment
          for profile in cloud_uat-loopback cloud_uat-encrypted_tunnel cloud_uat-verified_tls production-loopback production-encrypted_tunnel production-verified_tls; do
            nginx_name="apt137-nginx-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-parser-$profile"
            trap 'docker rm --force "$nginx_name" >/dev/null 2>&1 || true' EXIT
            docker run --rm --name "$nginx_name" --label pinvou.ci=apt137-nginx --network none --read-only --cap-drop ALL --user "$(id -u):$(id -g)" --tmpfs /tmp -v "$fixture_directory:/fixture" pinvou-nginx-ci:apt137 nginx -t -p /fixture/ -c "/fixture/$profile.conf"
          done
          for profile in cloud_uat-loopback cloud_uat-encrypted_tunnel; do
            nginx_name="apt137-nginx-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$profile"
            trap 'docker rm --force "$nginx_name" >/dev/null 2>&1 || true' EXIT
            docker run --rm --name "$nginx_name" --label pinvou.ci=apt137-nginx --network none --read-only --cap-drop ALL --user "$(id -u):$(id -g)" --tmpfs /tmp -v "$fixture_directory:/fixture" -v "$PWD/account-platform/test/deployment:/tests:ro" pinvou-nginx-ci:apt137 python3 /tests/nginx-loopback-test.py --root /fixture --profile "$profile" | tee "$RUNNER_TEMP/apt137-nginx-$profile.json"
            node -e 'const r=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); if(r.result!=="PASS" || r.owned_nginx_stopped!==true || r.owned_mocks_stopped!==true || r.tunnel_header_spoofed!==false) process.exit(1)' "$RUNNER_TEMP/apt137-nginx-$profile.json"
          done
          for fault in failure cancel; do
            nginx_name="apt137-nginx-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-cleanup-$fault"
            trap 'docker rm --force "$nginx_name" >/dev/null 2>&1 || true' EXIT
            if docker run --rm --name "$nginx_name" --label pinvou.ci=apt137-nginx --network none --read-only --cap-drop ALL --user "$(id -u):$(id -g)" --tmpfs /tmp -v "$fixture_directory:/fixture" -v "$PWD/account-platform/test/deployment:/tests:ro" pinvou-nginx-ci:apt137 python3 /tests/nginx-loopback-test.py --root /fixture --profile cloud_uat-loopback --exercise-cleanup "$fault" | tee "$RUNNER_TEMP/apt137-nginx-cleanup-$fault.json"; then
              exit 1
            fi
            node -e 'const r=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); const mode=process.argv[2]; if(r.result!=="FAIL" || r.owned_nginx_stopped!==true || r.owned_mocks_stopped!==true || r.exercise_mode!==mode || r.exercise_reached!==true || r.sigterm_received!==(mode==="cancel")) process.exit(1)' "$RUNNER_TEMP/apt137-nginx-cleanup-$fault.json" "$fault"
          done

      - name: 精确清理 nginx 测试实例
        if: ${{ always() }}
        run: |
          for profile in cloud_uat-loopback cloud_uat-encrypted_tunnel cleanup-failure cleanup-cancel parser-cloud_uat-loopback parser-cloud_uat-encrypted_tunnel parser-cloud_uat-verified_tls parser-production-loopback parser-production-encrypted_tunnel parser-production-verified_tls; do
            nginx_name="apt137-nginx-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$profile"
            if docker inspect "$nginx_name" >/dev/null 2>&1; then
              test "$(docker inspect --format '{{ index .Config.Labels "pinvou.ci" }}' "$nginx_name")" = apt137-nginx
              docker rm --force "$nginx_name"
            fi
          done

      - name: Go 与 Node 高危依赖审计
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          (cd account-platform && govulncheck ./...)
          npm --prefix account-platform audit --registry=https://registry.npmjs.org --audit-level=high

  update-release-console-test:
    name: update-release-console-test (Node ${{ matrix.node-version }})
    needs: changes
    if: ${{ !cancelled() && github.event.action != 'closed' && needs.changes.outputs.update_release_console == 'true' && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "24"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up zram and swap
        # 内存扩容为尽力而为:超时/失败只告警不阻断(回退 runner 默认内存)。
        run: timeout --kill-after=15 240 sudo --preserve-env=GITHUB_ACTIONS,PINVOU3_CI_DISABLE_ZRAM bash "${{ github.workspace }}/scripts/ci-memory-setup.sh" || echo "::warning::ci-memory-setup 未完成,继续使用 runner 默认内存"

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: update-release-console/package-lock.json

      - name: 安装发布台依赖
        run: npm --prefix update-release-console ci --prefer-offline --no-audit

      - name: 发布台测试
        run: npm --prefix update-release-console test

      - name: 发布台依赖审计
        run: npm --prefix update-release-console audit --registry=https://registry.npmjs.org --audit-level=high

      - name: 发布台容器与 Compose 配置校验
        if: ${{ matrix.node-version == '20' }}
        env:
          PINVOU_UPDATE_ADMIN_TOKEN: ci-only-token-that-is-at-least-32-characters
        run: |
          docker build --file update-release-console/Dockerfile update-release-console
          docker compose --file update-release-console/deploy/compose.yaml config --quiet
          docker run --rm \
            -v "$PWD/update-release-console/deploy/nginx-test.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/update-release-console/deploy/nginx-location.conf:/etc/nginx/pinvou3-release-location.conf:ro" \
            nginx:1.27-alpine nginx -t
          sudo mkdir -p /var/www/pinvou3
          printf '%s\n' '{"platforms":{"linux-x86_64":{"version":"0.10.4"},"macos-universal":{"version":"0.10.4"}}}' \
            | sudo tee /var/www/pinvou3/latest.json >/dev/null
          sudo chown -R 1000:1000 /var/www/pinvou3
          docker compose --file update-release-console/deploy/compose.yaml up --detach --build
          for attempt in {1..30}; do
            if curl --fail --silent --show-error \
              http://127.0.0.1:8792/pinvou3/release-console/healthz; then
              break
            fi
            if [[ "$attempt" == 30 ]]; then
              docker compose --file update-release-console/deploy/compose.yaml logs
              exit 1
            fi
            sleep 2
          done
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $PINVOU_UPDATE_ADMIN_TOKEN" \
            http://127.0.0.1:8792/pinvou3/release-console/api/status

      - name: 清理发布台容器
        if: ${{ always() && matrix.node-version == '20' }}
        env:
          PINVOU_UPDATE_ADMIN_TOKEN: ci-only-token-that-is-at-least-32-characters
        run: docker compose --file update-release-console/deploy/compose.yaml down --volumes --remove-orphans

  release-contract-test:
    name: release-contract-test
    needs: changes
    # Ready PR/Queue/main 仅在发布链路相关路径变化时验证版本同步、
    # Tauri overlay 与各平台打包契约，不生成 deb/dmg/nsis。
    if: ${{ !cancelled() && github.event.action != 'closed' && needs.changes.outputs.release_contract == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up zram and swap
        # 内存扩容为尽力而为:超时/失败只告警不阻断(回退 runner 默认内存)。
        run: timeout --kill-after=15 240 sudo --preserve-env=GITHUB_ACTIONS,PINVOU3_CI_DISABLE_ZRAM bash "${{ github.workspace }}/scripts/ci-memory-setup.sh" || echo "::warning::ci-memory-setup 未完成,继续使用 runner 默认内存"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: pinvou3-app/package-lock.json

      - name: 安装前端依赖
        run: npm --prefix pinvou3-app ci --prefer-offline --no-audit

      # 版本一致性校验(--check)由 version-consistency job 无路径门全事件覆盖,
      # 此处不重复;仅跑 Tauri overlay、各平台打包与知识宿主契约。
      - name: Tauri 打包与发布配置契约
        run: |
          npm --prefix pinvou3-app run test:tauri-layout
          npm --prefix pinvou3-app run test:tauri-effective-config
          npm --prefix pinvou3-app run test:macos-phase2
          npm --prefix pinvou3-app run test:knowledge-host-packaging
          npm --prefix pinvou3-app run test:linux-asr-runtime

  # pinvou-knowledge 是可单独部署的 crate，必须直接验证自己的默认 feature 图、
  # 测试与部署入口，而不只依赖 Tauri 作为 client-only path dependency 的间接编译。
  # 各项收在同一 job 复用一份缓存，避免过度分拆。
  knowledge-rust:
    name: knowledge-rust
    needs: changes
    if: ${{ !cancelled() && github.event.action != 'closed' && needs.changes.outputs.pure_release_backflow != 'true' && (needs.changes.outputs.knowledge_rust == 'true' || needs.changes.outputs.knowledge_dependencies == 'true') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up zram and swap
        # 内存扩容为尽力而为:超时/失败只告警不阻断(回退 runner 默认内存)。
        run: timeout --kill-after=15 240 sudo --preserve-env=GITHUB_ACTIONS,PINVOU3_CI_DISABLE_ZRAM bash "${{ github.workspace }}/scripts/ci-memory-setup.sh" || echo "::warning::ci-memory-setup 未完成,继续使用 runner 默认内存"

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: clippy, rustfmt

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: pinvou-knowledge
          # v2:2026-09 CI 镜像统一到 ubuntu-22.04,旧 key 缓存由 24.04 构建,
          # 其编译产物与 jammy glibc 不兼容,换代隔离。
          shared-key: knowledge-rust-v2
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo fmt --check
        run: cargo fmt --manifest-path pinvou-knowledge/Cargo.toml -- --check

      - name: cargo clippy (all targets, all features)
        run: cargo clippy --manifest-path pinvou-knowledge/Cargo.toml --all-targets --all-features --no-deps

      # Same hard gate rust-lint applies to src-tauri: deny every warning on
      # lib/bins/tests with the server feature, only outside Drafts. This lives
      # here instead of rust-lint so the standalone workspace is compiled once
      # per knowledge change in one job and one shared cache (-D warnings on
      # --all-targets --all-features is not viable: test code legitimately uses
      # unwrap/expect beyond the [lints] table).
      - name: cargo clippy (hard gate, lib/bins/tests + server)
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: |
          cargo clippy --manifest-path pinvou-knowledge/Cargo.toml --lib --bins --no-deps --features server -- -D warnings
          cargo clippy --manifest-path pinvou-knowledge/Cargo.toml --lib --bins --tests --no-deps --features server

      - name: cargo test
        run: cargo test --manifest-path pinvou-knowledge/Cargo.toml --all-features

      - name: 部署脚本 shell 语法
        run: bash -n pinvou-knowledge/deploy/install.sh

      - name: cargo-deny
        if: ${{ needs.changes.outputs.knowledge_dependencies == 'true' }}
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      # 共用现有许可证/来源策略，但审计对象显式指向独立 crate。
      - name: cargo deny check
        if: ${{ needs.changes.outputs.knowledge_dependencies == 'true' }}
        run: >-
          cargo deny
          --manifest-path pinvou-knowledge/Cargo.toml
          --config pinvou3-app/src-tauri/deny.toml
          check advisories licenses bans sources

  # clippy/fmt/deny 独立 job:与 rust-test 并行,各自独立 cache。
  # clippy 用 clippy-driver 编译,产物不能被 cargo test(rustc)复用;在同一 job 里
  # 串行跑会导致依赖图被编译两遍。拆成并行 job 后 wall-clock ≈ max(lint, test)。
  rust-lint:
    name: rust-lint
    needs: changes
    # 纳入 rust_dependencies:只改 deny.toml 时 rust_code=false 但 rust_dependencies=true,
    # cargo-deny 子步骤(已按 rust_dependencies 门控)需本 job 启动才能运行;
    # 否则 deny.toml 策略改动会静默漏检 cargo-deny。
    if: ${{ !cancelled() && github.event.action != 'closed' && needs.changes.outputs.pure_release_backflow != 'true' && (needs.changes.outputs.rust_code == 'true' || needs.changes.outputs.rust_dependencies == 'true') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      # Draft 只跑无系统依赖的 fmt 快检；Ready PR、Queue 与 main 跑 clippy。
      RUN_HEAVY_RUST_CHECKS: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
      # clippy 编译依赖(codewhale-tui)时同样可能触发 rustc/LLVM 栈溢出
      # (v0.9.5 升级后 O2 同源风险)。正式入口按平台注入 RUSTC_WRAPPER
      # (见 config.toml 注释),与 rust-test 保持一致。
      RUSTC_WRAPPER: ${{ github.workspace }}/pinvou3-app/src-tauri/scripts/rustc-stack-wrapper
    steps:
      - name: Checkout (含 submodule)
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: 初始化公共底座 submodule
        run: git submodule update --init --recursive -- CodeWhale

      # 本 step 只作 rustup 引导;实际工具链由 pinvou3-app/src-tauri/rust-toolchain.toml
      # 锁定具体版本(下方 cargo 步骤 working-directory 在 src-tauri,rustup 按该文件
      # 自动安装并使用 pinned 版本,本地与 CI 不漂移)。
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cargo cache
        if: ${{ env.RUN_HEAVY_RUST_CHECKS == 'true' }}
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            pinvou3-app/src-tauri
            pinvou-knowledge
          # v2:镜像统一到 ubuntu-22.04 后与 24.04 时代缓存隔离(同 knowledge-rust)。
          shared-key: rust-lint-v2
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # fmt 硬门禁:风格规则见 rustfmt.toml(只用 stable 可用选项)。
      - name: cargo fmt --check (硬门禁)
        working-directory: pinvou3-app/src-tauri
        run: cargo fmt -- --check

      # clippy 需要 Tauri/WebKit 系统库；Draft 不安装，避免每次 push 消耗 ~70s。
      - name: 装 Tauri + pinvou3 Linux 系统依赖
        if: ${{ env.RUN_HEAVY_RUST_CHECKS == 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            libpipewire-0.3-dev libdrm-dev libgbm-dev libegl-dev \
            build-essential pkg-config cmake
          # 孤儿依赖、apt 缓存包与索引清单不留在构建盘上(单盘 runner 磁盘紧张)。
          sudo apt-get autoremove -y --purge
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      # pipewire-rs 0.10 (computer_use Wayland capture, direct + via xcap) needs SPA
      # static inline helpers that ubuntu-22.04's libpipewire 0.3.48 headers lack
      # (libspa-sys bindgens against system headers at build time). Build the upstream
      # 1.0.7 headers+lib into /usr/local so pkg-config resolves the prefix; idempotent,
      # no runner-image drift. See scripts/ci-libpipewire-build.sh for the full rationale.
      - name: Build PipeWire 1.0.7 dev prefix (jammy SPA headers too old)
        if: ${{ env.RUN_HEAVY_RUST_CHECKS == 'true' }}
        run: bash scripts/ci-libpipewire-build.sh

      # Clippy hard gate (no continue-on-error): lint config lives in the
      # Cargo.toml [lints] table, never CLI -W/-D (avoids divergence from
      # local runs). Two steps:
      # 1) --lib --bins -D warnings: full hard gate on production code
      #    (deny + warn all zero-tolerance, including the items cleared in
      #    this PR such as undocumented_unsafe_blocks/expect_used/unwrap_used).
      # 2) --lib --bins --tests: test code under the deny hard gate
      #    (todo!/dbg!/get_unwrap are banned in tests too); warn-level lints
      #    (unwrap/expect are a testing convention, ~3400 existing) are not
      #    enforced on test targets to keep the noise floor useful.
      # --no-deps: dependencies are not linted; warnings from the CodeWhale
      # submodule (a path dependency) are outside this [lints] table —
      # upstream backlog, displayed but never blocking.
      - name: cargo clippy (hard gate, [lints] deny hits fail)
        if: ${{ env.RUN_HEAVY_RUST_CHECKS == 'true' }}
        working-directory: pinvou3-app/src-tauri
        run: |
          cargo clippy --lib --bins --no-deps --features dev-tools -- -D warnings
          cargo clippy --lib --bins --tests --no-deps --features dev-tools

      # pinvou-knowledge clippy hard gate lives in the knowledge-rust job: the
      # standalone workspace is compiled and linted there in a single shared
      # cache instead of once more here (cargo shear below still covers both
      # workspaces statically).

      # rustdoc hard gate: the module-level documentation map once accumulated 46
      # rustdoc warnings (private_intra_doc_links / broken_intra_doc_links /
      # invalid_html_tags, cleaned up to zero in 2026-08) with no gate to surface
      # them. RUSTDOCFLAGS only applies to rustdoc itself and does not escalate
      # CodeWhale submodule rustc warnings to errors (that is upstream debt; see
      # the clippy step comment).
      - name: cargo doc --no-deps (hard gate, zero rustdoc warnings)
        if: ${{ env.RUN_HEAVY_RUST_CHECKS == 'true' }}
        working-directory: pinvou3-app/src-tauri
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps

      # cargo-shear (unused deps / unlinked source files): static parse, no
      # compile cost, rust-analyzer-grade precision (same tool as uv/oxc);
      # exemptions are registered in Cargo.toml [package.metadata.cargo-shear].
      # Gated on rust_code (not just rust_dependencies): shear also detects
      # unlinked .rs files, so an orphan source file added without touching
      # Cargo metadata must still be caught. Version is pinned: install-action
      # defaults to latest, and upstream CLI changes (e.g. --manifest-path
      # removal) would silently break the gate.
      - name: Install cargo-shear
        if: ${{ env.RUN_HEAVY_RUST_CHECKS == 'true' && needs.changes.outputs.rust_code == 'true' }}
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-shear@1.13.4
      - name: cargo shear (hard gate, both workspaces)
        if: ${{ env.RUN_HEAVY_RUST_CHECKS == 'true' && needs.changes.outputs.rust_code == 'true' }}
        run: |
          cargo shear --deny-warnings pinvou3-app/src-tauri
          cargo shear --deny-warnings pinvou-knowledge

      # dump_system_prompt is isolated behind the dev-tools feature: the
      # default lib/clippy/test targets never compile it. Check explicitly so
      # a CodeWhale Prompt API upgrade cannot slip through unadapted.
      # (clippy --lib --bins + dev-tools already includes this bin; kept here
      # as defense in depth at zero extra cost.)
      - name: cargo check --bin dump_system_prompt (dev-tools)
        if: ${{ env.RUN_HEAVY_RUST_CHECKS == 'true' }}
        working-directory: pinvou3-app/src-tauri
        run: cargo check --bin dump_system_prompt --features dev-tools

      # cargo-deny only cares about dependency/policy paths (Cargo/lock/deny/gitlink).
      - name: cargo-deny (advisories/licenses/bans/sources)
        if: ${{ env.RUN_HEAVY_RUST_CHECKS == 'true' && needs.changes.outputs.rust_dependencies == 'true' }}
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo deny check (hard gate)
        if: ${{ env.RUN_HEAVY_RUST_CHECKS == 'true' && needs.changes.outputs.rust_dependencies == 'true' }}
        working-directory: pinvou3-app/src-tauri
        run: cargo deny check advisories licenses bans sources

  rust-test:
    name: rust-test
    needs: changes
    # Ready high-risk PRs and matching merge groups run the full Linux regression.
    # Explicitly low-risk leaf changes stay on compile/lint feedback; unknown Rust
    # paths fail closed through rust_full. main push 无条件执行累计编译验证并写暖
    # cache(防 concurrency pending 替换盲区),但只编译不执行测试(见下方 --no-run)。
    # Trusted same-repository Community backflows use their dedicated portability gate.
    if: >-
      ${{
        !cancelled() &&
        github.event.action != 'closed' &&
        (
          github.event_name == 'push' ||
          (
            needs.changes.outputs.trusted_backflow != 'true' &&
            (
              (
                github.event_name == 'merge_group' &&
                needs.changes.outputs.rust_full == 'true'
              ) ||
              (
                github.event_name == 'pull_request' &&
                github.event.pull_request.draft == false &&
                (
                  needs.changes.outputs.rust_full == 'true' ||
                  (
                    needs.changes.outputs.rust_code == 'true' &&
                    contains(github.event.pull_request.labels.*.name, 'ci:full-rust')
                  )
                )
              )
            )
          )
        )
      }}
    runs-on: ubuntu-22.04
    # Tauri + fastembed + aws-lc-sys 全冷编译耗时长;设上限避免卡死 runner 占用。
    # High-risk PR, combined-tree, and main runs retain a 120-minute safety limit.
    timeout-minutes: 120
    env:
      # v0.9.5 升级后 dev 对依赖开 O2 + 256 codegen-units 时,rustc/LLVM 编译
      # codewhale-tui 会在 MachineLateinstrsCleanup 递归中栈溢出(SIGBUS)。
      # .cargo/config.toml 不设置 rustc-wrapper(全局键无法按平台条件化,且
      # Windows 上指向无扩展名 sh 会 os error 193),由本 job 显式注入
      # RUSTC_WRAPPER 指向 sh 版(wrapper 只作用于编译期 rustc 进程,
      # cargo run / cargo test 目标进程不继承 RUST_MIN_STACK)。
      RUSTC_WRAPPER: ${{ github.workspace }}/pinvou3-app/src-tauri/scripts/rustc-stack-wrapper
      # codewhale-tui 恢复依赖级 O2 后,test binary 变大,link 阶段在 ubuntu 16GB
      # runner 上内存峰值越线被 SIGTERM(merge_group run 实证,exit 143)。
      # 实测(CI 对照):thin LTO + lld 能 Finished + 1180 passed(31min);
      # lld-only(无 LTO)仍 OOM(binary 太大,lld 独立不够)。故两者都必需:
      #   - Thin LTO:跨 crate 死代码消除 → test binary 变小(rustc 给依赖 crate 传
      #     -C linker-plugin-lto,生成 LLVM bitcode,link 阶段合并——故依赖 lld)。
      #   - lld:link 阶段处理 LLVM bitcode(lld 原生支持,BFD ld 不支持)。
      #   - --thinlto-jobs=1:避免多个 ThinLTO backend 并行把 16GB runner
      #     推过内存峰值并导致 hosted runner 与 GitHub 失联。
      #   - --threads=1:also serialize lld's final link; after BrowserCore enlarged the test
      #     binary, limiting only ThinLTO backends still exhausted hosted-runner memory there.
      # dev 默认 256 个 codegen units 会把大型测试 harness 展开成过多 ThinLTO 输入，
      # 在约 7GB 的标准 Linux runner 上放大链接峰值。收敛到 16 只影响本 CI job；
      # release 仍使用 Cargo.toml 的 codegen-units=1，产品产物不变。
      CARGO_PROFILE_DEV_CODEGEN_UNITS: "16"
      CARGO_PROFILE_DEV_LTO: "thin"
      RUSTFLAGS: "-C link-arg=-fuse-ld=lld -C link-arg=-Wl,--thinlto-jobs=1 -C link-arg=-Wl,--threads=1"
      # Cargo.toml [profile.dev] 固化 line-tables-only(本地调试体验);CI 改为完全
      # 关闭 DWARF:panic 的 file:line 由 Location(rodata)提供,不依赖 debuginfo。
      # 关掉后缩小目标文件与测试二进制体积,降低 ThinLTO link 内存峰值和 target
      # 目录磁盘占用(16GB runner 上 rust-test 链接期多次把 runner 打到失联)。
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - name: Checkout (含 submodule)
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Set up zram and swap
        # 内存扩容为尽力而为:超时/失败只告警不阻断(回退 runner 默认内存)。
        run: timeout --kill-after=15 240 sudo --preserve-env=GITHUB_ACTIONS,PINVOU3_CI_DISABLE_ZRAM bash "${{ github.workspace }}/scripts/ci-memory-setup.sh" || echo "::warning::ci-memory-setup 未完成,继续使用 runner 默认内存"

      - name: 初始化公共底座 submodule
        run: git submodule update --init --recursive -- CodeWhale

      # pinvou3 编译链接的系统库(本地 pkg-config 实测:gtk/webkit/soup/rsvg/openssl/
      # X11×3/appindicator)。ubuntu runner 默认没装,否则 glib-sys 等 build script 失败。
      # cmake:reqwest 0.13 的 rustls 改用 aws-lc-rs,其 build script 需 cmake + C 编译器。
      - name: 装 Tauri + pinvou3 Linux 系统依赖
        run: |
          sudo apt-get update
          # 清单经 2026-09-15 探针逐包冗余审计(剔除单包模拟安装,安装集合
          # 不变即可移除):libgtk-3-dev/libsoup-3.0-dev/libx11-dev/libxi-dev/
          # libxtst-dev 均被 libwebkit2gtk-4.1-dev 硬依赖链传递安装,librsvg2-dev
          # 构建不需要(Cargo 无 rsvg crate)。libssl-dev 必须保留:hf-hub→
          # native-tls→openssl-sys 非 vendored,构建链接系统 OpenSSL;
          # libayatana-appindicator3-dev 托盘在用;lld/cmake/build-essential
          # 分别是链接器/aws-lc-rs/C 编译链。
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            libpipewire-0.3-dev libdrm-dev libgbm-dev libegl-dev \
            build-essential pkg-config cmake lld \
            time
          # 孤儿依赖、apt 缓存包与索引清单不留在构建盘上(单盘 runner 磁盘紧张)。
          sudo apt-get autoremove -y --purge
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      # bge-m3 是 gitignored 大资源(559M),CI 干净 checkout 没有它,而 tauri_build::build()
      # 会校验 tauri.conf resources 路径存在。单测用 mem()=embedder None、不加载真模型,真
      # bge-m3/vLLM 的 e2e 测试都已 #[ignore] —— 故造空占位文件骗过资源校验即可(已实测可行)。
      - name: bge-m3 占位 (骗过 tauri-build 资源校验)
        run: |
          d=pinvou3-app/src-tauri/resources/bge-m3
          mkdir -p "$d"
          for f in config.json model.onnx tokenizer.json tokenizer_config.json special_tokens_map.json; do
            : > "$d/$f"
          done

      # pipewire-rs 0.10 (computer_use Wayland capture, direct + via xcap) needs SPA
      # static inline helpers that ubuntu-22.04's libpipewire 0.3.48 headers lack
      # (libspa-sys bindgens against system headers at build time). Build the upstream
      # 1.0.7 headers+lib into /usr/local so pkg-config resolves the prefix; idempotent,
      # no runner-image drift. See scripts/ci-libpipewire-build.sh for the full rationale.
      - name: Build PipeWire 1.0.7 dev prefix (jammy SPA headers too old)
        run: bash scripts/ci-libpipewire-build.sh
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # rust-toolchain.toml 在 src-tauri 下,对从仓库根用 --manifest-path 调用的 cargo 不生效;
      # 把该文件锁定的工具链设为 default,保证 CI 与本地同一 pinned 版本(单一真相源是文件,
      # 版本号不在 workflow 里重复硬编码,升级只改 rust-toolchain.toml)。
      - name: 对齐 rust-toolchain.toml 锁定的工具链
        working-directory: pinvou3-app/src-tauri
        run: rustup default "$(rustup show active-toolchain | awk '{print $1}')"

      # v0.9.12 底座升级后,dev 对依赖开 O2 时 codewhale-tui 的 LLVM IR/bitcode
      # 体量使本 job 的 thin LTO 在 7GB Linux runner 上越线:2026-09-12 起 main
      # push 与 PR 的 rust-test 均在编译最终 crate(pinvou3-tauri lib test,单个
      # rustc ~7GB)时被内存看门狗按可用内存阈值提前杀掉(连续 8+ 次实证)。
      # 与 windows-rust-test job 同款缓解(见该 job 同名 step):仅在本 job 内把
      # codewhale-tui 覆盖回 dev 默认 O0,写入 CARGO_HOME/config.toml(package 级
      # profile 覆盖只能走 config,Cargo 无对应环境变量),不改动仓库 Cargo.toml,
      # 本地开发与 release 产物不受影响;overflow-checks 等其余 dev 设置继承,
      # 测试语义不变。
      - name: dev profile 内存边界覆盖(codewhale-tui O0,仅本 job)
        run: |
          config="${CARGO_HOME:-$HOME/.cargo}/config.toml"
          cat >> "$config" <<'EOF'

          [profile.dev.package.codewhale-tui]
          opt-level = 0
          EOF
          echo "appended codewhale-tui dev O0 override to $config"
          tail -n 4 "$config"

      # remote_control 的真实 relay 下载 e2e 需要 node + relay 依赖,缺 node_modules/ws 时
      # 该 e2e 会自动 skip —— 装上依赖让 CI 真正执行它,而不是绿灯假过。
      # push(main) 只编译不执行测试(见下方 --no-run),不需要 relay/Chrome 运行时依赖。
      - name: Node.js (relay e2e)
        if: ${{ github.event_name != 'push' }}
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: remote-control-relay/package-lock.json

      - name: relay 依赖 (真实 relay e2e)
        if: ${{ github.event_name != 'push' }}
        run: npm --prefix remote-control-relay ci --prefer-offline --no-audit

      - name: 浏览器驱动依赖 (真实 Chrome 下载 e2e)
        if: ${{ github.event_name != 'push' }}
        # real-browser driver 从 pinvou3-app/node_modules 加载 puppeteer-core。
        # npm --prefix pinvou3-app install 即使指定单包也会解析并安装项目完整依赖树，
        # 因此直接用 package-lock 驱动的 npm ci，避免额外维护一份硬编码版本并保证可复现。
        run: npm --prefix pinvou3-app ci --prefer-offline --no-audit

      # rust-test 的独立缓存缺失时，全冷测试会超过当前 runner 的执行窗口。
      # 先只读恢复同一工具链与锁文件下已由 main 保存的 rust-lint 目标缓存，
      # 再恢复/保存独立 rust-test 缓存；不降低测试范围，也不让 PR 写缓存。
      - name: 恢复 Rust lint 暖缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: pinvou3-app/src-tauri
          # v2:镜像统一到 ubuntu-22.04 后与 24.04 时代缓存隔离(同 knowledge-rust)。
          shared-key: rust-lint-v2
          save-if: false

      - name: Cargo test cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: pinvou3-app/src-tauri
          # 2026-08-29/30 事故:凡 restore 本 job 的 target/ 缓存并据其链接出的
          # 测试二进制,执行数秒内把 runner VM 打到失联(1s 遥测实证:内存/磁盘/
          # 负载全程健康,死亡点在套件内随机)。与 cache 内容的新旧无关——#379
          # (debug=0)之后每次 main push 保存的 target/ 都在 restore 后复现致死,
          # 而全冷编译(不吃 target/ 缓存)的对照组同 runner 池 100% 全绿;
          # 纯文档 PR 也死,与 PR 代码无关。根因定位期间先关掉 target/ 缓存:
          # 只缓存 ~/.cargo(registry/git 索引,省下载),target/ 每次全冷编译
          # (~15 分钟,与绿色对照组同构)。根因查明并验证前不要重新打开。
          cache-targets: false
          # 稳定 key 前缀(跨 PR/push 一致);restore 按前缀回退,lock 变了也增量。
          shared-key: rust-test-v2
          # 只在 main 保存(暖 cache 唯一来源);PR 侧只读,不占 10GB 限额。
          save-if: ${{ github.ref == 'refs/heads/main' }}


      # PR #988 started a cold build with only 7.3 GiB free. All 2,100 lib
      # tests passed, but the separate telemetry library exhausted the disk.
      # Reserve room after dependencies, cache restore and swap allocation;
      # only unused SDKs on this disposable hosted runner are removed.
      - name: 为两轮 Rust 测试准备磁盘空间
        run: |
          sudo env GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            python3 scripts/ci-rust-disk.py

      # High-risk/explicit PRs and matching merge groups run all lib tests
      # (含真实 relay/Chrome e2e)。Linux lib harness 显式关闭 default 的
      # local-embed feature，避免把 fastembed/ORT 及其图像、并行计算依赖重复链接进
      # 已经很大的 pinvou3_lib 测试二进制。local-embed 覆盖没有删除：
      # knowledge-rust 仍以 --all-features 测试 pinvou-knowledge，rust-lint 与原生
      # Windows 门禁仍按默认 features 编译应用集成路径。
      # 编译链接与测试执行拆成两个 step:该 job 在标准 hosted runner 上多次在
      # 本环节被打到 runner 失联(日志全丢,只剩 step 状态可查),拆开后失联时
      # 能定位是编译/链接期还是测试执行期。内存压力现由 job 开头的
      # "Set up zram and swap" step(scripts/ci-memory-setup.sh)扩大有效内存吸收。
      # 保留 --test-threads=1:虽已把 env 写测试收敛到 crate 级唯一锁
      # (bridge::paths::tests::ENV_LOCK),但进程级 env 对未持锁的读取者仍全局可见，
      # 多线程测试仍可能观察到其他测试的临时值。Mutex poison 后通过 into_inner()
      # 取得的仍是已加锁 guard，不会绕过互斥；根治需消除测试对进程级 env 的依赖
      # 或让所有读写都通过同一隔离层，超出本 PR 范围。
      # strict_mode 的三个确定性回归已并入 pinvou3_lib 单测并共用这次编译；
      # 只有下方超出单进程内存预算的 behavior-telemetry 测试使用独立目标。
      - name: cargo test --lib --no-run（编译链接测试二进制）
        if: ${{ github.event_name != 'push' }}
        run: /usr/bin/time -v cargo test --manifest-path pinvou3-app/src-tauri/Cargo.toml --no-default-features --lib --no-run

      - name: cargo test --lib（含 strict_mode 回归；真 bge-m3/vLLM 测试已 #[ignore]）
        if: ${{ github.event_name != 'push' }}
        run: |
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          export CHROME="$chrome"
          export PINVOU_REQUIRE_REMOTE_E2E=1
          cargo test --manifest-path pinvou3-app/src-tauri/Cargo.toml --no-default-features --lib -- --test-threads=1

      # The behavior-telemetry state-machine tests intentionally use a separate
      # harness. Linking their 2,300+ source lines into the already-large lib
      # harness pushed one rustc/ThinLTO process past the hosted-runner budget;
      # a source-file-only split does not change that compilation boundary.
      # The preceding lib harness is no longer needed after it has executed. Remove
      # only its large root-crate artifacts before compiling this feature-distinct
      # harness, while retaining all third-party dependency outputs. This prevents
      # a cold Merge Queue run from exhausting the hosted runner disk without
      # reducing either test scope.
      - name: 回收已完成的主测试产物
        if: ${{ github.event_name != 'push' }}
        run: |
          target="pinvou3-app/src-tauri/target/debug/deps"
          find "$target" -maxdepth 1 -type f \
            \( -name 'pinvou3_lib-*' -o -name 'libpinvou3_lib-*' \) \
            -print -delete
          df -h "$GITHUB_WORKSPACE"

      - name: cargo test --test behavior_telemetry (standalone memory-bounded harness)
        if: ${{ github.event_name != 'push' }}
        run: |
          /usr/bin/time -v cargo test \
            --manifest-path pinvou3-app/src-tauri/Cargo.toml \
            --no-default-features \
            --test behavior_telemetry \
            --features behavior-telemetry-test \
            -- --test-threads=1

      # push(main) 唯一目的是暖 cache(Swatinem/rust-cache save-if main)。
      # MQ 已对同一代码跑过完整 lib 测试,squash 合并后的 push 不再重复执行测试;
      # --no-run 编译含 test harness 的全部 target 产物(与完整 test 的编译腿一致),
      # 供热 MQ restore 后增量复用,省去测试执行时间。
      # 不需要 relay/Chrome 运行时依赖(上方 setup-node/relay/浏览器 step 已按 !=push 跳过)。
      # 2026-08-28 #372 曾让 push 改跑全量测试:main push 恢复暖 cache 后连续 5 次
      # "hosted runner lost communication"(MQ 自身也间歇性失联,push 100% 触发),
      # 故恢复只编译设计;不要在 push 上重新打开测试执行。
      - name: cargo test --lib --no-run (push main 仅编译暖 cache)
        if: ${{ github.event_name == 'push' }}
        run: /usr/bin/time -v cargo test --manifest-path pinvou3-app/src-tauri/Cargo.toml --no-default-features --lib --no-run

  # pinvou-cli contract tests: since PR #478 the product CLI surface (~20k
  # lines + ~340 contract tests) has no other automated execution leg (the
  # remaining jobs only cargo check pinvou-product-backend). Separate
  # workspace/target dir, runs in parallel with rust-test.
  cli-test:
    name: cli-test
    needs: changes
    if: >-
      ${{
        !cancelled() &&
        github.event.action != 'closed' &&
        (
          github.event_name == 'push' ||
          (
            github.event_name == 'merge_group' &&
            (
              needs.changes.outputs.cli_rust == 'true' ||
              needs.changes.outputs.rust_full == 'true'
            )
          ) ||
          (
            github.event_name == 'pull_request' &&
            github.event.pull_request.draft == false &&
            (
              needs.changes.outputs.cli_rust == 'true' ||
              needs.changes.outputs.rust_full == 'true'
            )
          )
        )
      }}
    # 镜像按全仓单一镜像公约钉到发布基线(守卫:
    # test_ci_gate_policy.test_all_linux_jobs_pin_the_release_runner_image)。
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      # The CLI workspace compiles pinvou3-tauri plus its own targets. Disable
      # dev DWARF to keep a cold target directory within hosted-runner disk.
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      # A cold CLI workspace plus pinvou3-tauri exhausts the hosted runner's
      # initial ~13 GiB. This allowlisted helper (base tier) removes only the
      # unused Android/.NET/ghcup/Julia SDKs; memory comes from zram afterwards
      # (no on-disk swapfile is created — single-disk runner).
      - name: Prepare Rust disk capacity
        run: |
          sudo env GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            python3 scripts/ci-rust-disk.py

      # Same policy as rust-test: the Linux Rust job must set up extra memory
      # first (enforced by the gate policy).
      - name: Set up zram and swap
        # 内存扩容为尽力而为:超时/失败只告警不阻断(回退 runner 默认内存)。
        run: timeout --kill-after=15 240 sudo --preserve-env=GITHUB_ACTIONS,PINVOU3_CI_DISABLE_ZRAM bash "${{ github.workspace }}/scripts/ci-memory-setup.sh" || echo "::warning::ci-memory-setup 未完成,继续使用 runner 默认内存"

      - name: Init CodeWhale submodule
        run: git submodule update --init --recursive -- CodeWhale

      # pinvou-cli compiles pinvou3-tauri as a path dependency
      # (default-features=false): same tauri_build resource check and system
      # library requirements as the rust-test job.
      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          # 清单与 rust-test/release 同源,经 2026-09-15 探针逐包冗余审计:
          # libgtk-3-dev/libsoup-3.0-dev/libx11-dev/libxi-dev/libxtst-dev 均被
          # libwebkit2gtk-4.1-dev 硬依赖链传递安装,librsvg2-dev 构建不需要
          # (Cargo 无 rsvg crate)——不得回填(守卫见 test_ci_gate_policy
          # 的 apt 冗余包断言)。libssl-dev 必须保留(链接系统 OpenSSL)。
          # Package list audited per-package on 2026-09-15: gtk/soup/x11 are installed
          # transitively via webkit-dev — that transitive set is what covers the pure-Rust
          # x11/xkbcommon/xcb crates the computer_use capture stack builds against
          # (libxkbcommon-dev via libgtk-3-dev, libxcb1-dev via libx11-dev; enigo's X11
          # input path is pure-Rust x11rb and needs no C XTest/XInput headers); librsvg2-dev
          # is not needed for the build; libssl-dev (openssl-sys is not vendored)
          # and appindicator (tray) must be kept.
          # pipewire/drm/gbm/egl are the computer_use capture-backends headers the
          # webkit-dev chain does not pull in.
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            build-essential pkg-config cmake \
            time \
            libpipewire-0.3-dev libdrm-dev libgbm-dev libegl-dev
          # 孤儿依赖、apt 缓存包与索引清单不留在构建盘上(单盘 runner 磁盘紧张)。
          sudo apt-get autoremove -y --purge
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: bge-m3 placeholder (tauri-build resource check)
        run: |
          d=pinvou3-app/src-tauri/resources/bge-m3
          mkdir -p "$d"
          for f in config.json model.onnx tokenizer.json tokenizer_config.json special_tokens_map.json; do
            : > "$d/$f"
          done
      # pipewire-rs 0.10 (computer_use Wayland capture, direct + via xcap) needs SPA
      # static inline helpers that ubuntu-22.04's libpipewire 0.3.48 headers lack
      # (libspa-sys bindgens against system headers at build time). Build the upstream
      # 1.0.7 headers+lib into /usr/local so pkg-config resolves the prefix; idempotent,
      # no runner-image drift. See scripts/ci-libpipewire-build.sh for the full rationale.
      - name: Build PipeWire 1.0.7 dev prefix (jammy SPA headers too old)
        run: bash scripts/ci-libpipewire-build.sh

      # rustfmt is required by the `cargo fmt --check` step below (minimal
      # profile otherwise).
      #
      # No RUSTC_WRAPPER/rustc-stack-wrapper here (unlike rust-test): that
      # wrapper only exists because src-tauri's own [profile.dev] raises
      # dependencies to opt-level 2 (codewhale-tui rustc stack overflow).
      # Profiles are chosen by the top-level workspace, and the pinvou-cli
      # workspace has no [profile] section, so the same crate compiles at O0
      # in this job and the overflow trigger is absent.
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      # rust-toolchain.toml lives under src-tauri and does not apply to cargo
      # invoked from the repo root with --manifest-path; like rust-test, make
      # the pinned version the default. That file is the single source of
      # truth — a hardcoded toolchain version would silently leave this leg
      # on an old toolchain at the next upgrade.
      - name: Align the toolchain pinned by rust-toolchain.toml
        working-directory: pinvou3-app/src-tauri
        run: rustup default "$(rustup show active-toolchain | awk '{print $1}')"

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: pinvou-cli
          # Same standing incident directive as rust-test (see its Cargo cache
          # comment): target/ caches took runners down with the root cause
          # still unidentified - cache ~/.cargo only until then.
          cache-targets: false
          shared-key: cli-test
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # --all is required: pinvou-cli is a virtual workspace (no [package]),
      # and plain `cargo fmt --manifest-path` fails with "Failed to find
      # targets" on it.
      - name: cargo fmt --check
        run: cargo fmt --all --check --manifest-path pinvou-cli/Cargo.toml

      # main push only warms the dependency cache and proves compilation: the
      # merge queue already executed the combined tree (same --no-run policy
      # as rust-test).
      - name: cargo test (all targets, no-fail-fast)
        if: github.event_name != 'push'
        run: cargo test --manifest-path pinvou-cli/Cargo.toml --locked --no-fail-fast

      - name: cargo compile check (push)
        if: github.event_name == 'push'
        run: cargo test --manifest-path pinvou-cli/Cargo.toml --locked --no-run

      # dataset_contract is gated behind `required-features = ["test-support"]`
      # and is silently skipped by the workspace-wide run above; the gaia
      # timeout pins edited by this PR live there, so the leg must execute it.
      - name: cargo test (adapter-gaia test-support)
        if: github.event_name != 'push'
        working-directory: pinvou-cli
        run: cargo test -p adapter-gaia --features test-support --locked --no-fail-fast

      - name: cargo compile check (push, adapter-gaia test-support)
        if: github.event_name == 'push'
        working-directory: pinvou-cli
        run: cargo test -p adapter-gaia --features test-support --locked --no-run

  windows-static-updater-contract:
    name: windows-static-updater-contract
    needs: changes
    if: ${{ !cancelled() && github.event.action != 'closed' && needs.changes.outputs.windows_static_updater == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Windows 静态更新契约
        run: npm --prefix pinvou3-app run test:windows-static-updater

  windows-rust-test:
    name: windows-rust-test (${{ matrix.phase }})
    needs: changes
    # Native Windows coverage runs once on ready high-risk/explicit PRs and on main.
    # Native Windows coverage runs once on ready high-risk/explicit PRs and on main.
    # Trusted backflows are classified from the actual base/head diff: malformed or
    # mixed release changes fail closed; Windows/Cargo/native semantics stay full;
    # mechanical releases and portable Rust defer cumulative Windows coverage to main.
    # Merge Queue does not repeat this native leg; Linux validates the combined tree.
    # It only runs on the queue when policy/API/diff resolution fails and mode=full,
    # so skipped cannot mask uncertainty.
    if: >-
      ${{
        !cancelled() &&
        (
          github.event_name == 'push' ||
          (
            github.event_name == 'pull_request' &&
            github.event.pull_request.draft == false &&
            (
              needs.changes.outputs.backflow_mode == 'full' ||
              needs.changes.outputs.backflow_mode == 'windows_full' ||
              (
                needs.changes.outputs.backflow_mode == 'ordinary' &&
                (
                  needs.changes.outputs.rust_full == 'true' ||
                  needs.changes.outputs.cli_rust == 'true' ||
                  (
                    needs.changes.outputs.rust_code == 'true' &&
                    contains(github.event.pull_request.labels.*.name, 'ci:full-rust')
                  )
                )
              )
            )
          ) ||
          (
            github.event_name == 'merge_group' &&
            needs.changes.outputs.backflow_mode == 'full'
          )
        )
      }}
    # `cargo check --all-targets --features dev-tools` produces a metadata-only graph,
    # while `cargo test --lib --no-run` must codegen/link the default-feature test
    # harness. Running them sequentially made both compile graphs part of the 47-78 minute
    # critical path. Keep both required under this aggregate matrix job, but run them
    # independently so wall time is the slower leg rather than their sum.
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        phase: [all-targets-check, regression]
    runs-on: windows-latest
    # 状态机回归使用 Bash 循环；job 级固定 shell 也覆盖 merge ref 从 base
    # 带入该步骤的场景。本 job 其余 run 命令均兼容 Bash。
    defaults:
      run:
        shell: bash
    # Full cargo check --all-targets plus the lib link check runs without a
    # warm cache, and a hung build burns runner minutes. Cold compile grew
    # after sccache removal (aws-lc-sys prebuilt NASM objects compile even
    # slower). Since 2026-09 several runs died at the 90-minute cap during
    # the link step while passing runs already took 85-87 minutes, so the
    # cap is raised to 180 minutes. PR #478 additionally compiles the whole
    # pinvou-cli workspace on this Windows-only leg, and lockfile changes
    # miss the rust-cache key (full cold compile); a 90-minute run was
    # cancelled mid-build (run 34802015051), so 180 minutes leaves headroom
    # for two cold workspaces. Each independent leg can still compile cold on
    # a cache miss, so the cap is kept per leg until the phase timings below
    # justify a tighter one.
    timeout-minutes: 180
    env:
      # reqwest 0.13 → aws-lc-sys(非 FIPS)。Windows x86_64 需 NASM 汇编;runner 默认无 NASM,
      # 用预生成 NASM 对象规避(aws-lc-rs 官方支持,无需额外装 NASM)。
      AWS_LC_SYS_PREBUILT_NASM: "1"
      # Windows 经 RUSTC_WRAPPER 注入 rustc-stack-wrapper.exe(本 job 先编译)。
      # .cmd 经 cmd /C 执行,cmd.exe 命令行上限 8191 字符,windows-sys/windows 等
      # 大型 crate 的 rustc 命令行(数千个 --cfg feature=...)会超限报
      # "The command line is too long";.exe 经 CreateProcess 直启(上限 32767),
      # 只在编译期 rustc 注入 RUST_MIN_STACK=16MiB,不泄漏到 cargo test 目标进程。
      # 必须用 ${{ github.workspace }} 绝对路径(避免按 cwd 双拼解析)。
      RUSTC_WRAPPER: ${{ github.workspace }}/pinvou3-app/src-tauri/scripts/rustc-stack-wrapper.exe
      # 完全关闭 dev debuginfo(line-tables-only 仍产生 PDB 数据):缩小目标文件与
      # 测试二进制,降低 Windows 链接期内存峰值;panic 的 file:line 由
      # Location(rodata) 提供,不依赖 debuginfo。与 Linux rust-test job 的同名
      # 缓解一致。
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: 初始化公共底座 submodule
        run: |
          started=$SECONDS
          set +e
          git submodule update --init --recursive -- CodeWhale
          status=$?
          set -e
          echo "WINDOWS_RUST_TIMING phase=${{ matrix.phase }} step=codewhale-init elapsed_seconds=$((SECONDS-started)) status=$status"
          exit "$status"

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # 同 rust-test:把 src-tauri/rust-toolchain.toml 锁定的工具链设为 default,
      # 保证从仓库根 --manifest-path 调用 cargo 时与本地同一 pinned 版本。
      - name: 对齐 rust-toolchain.toml 锁定的工具链
        working-directory: pinvou3-app/src-tauri
        shell: bash
        run: rustup default "$(rustup show active-toolchain | awk '{print $1}')"

      # v0.9.12 底座升级后,dev 对依赖开 O2 时 rustc/LLVM 编译 codewhale-tui(lib)
      # 在 16GB Windows hosted runner 上越线(rustc-LLVM out of memory,PR #1037
      # regression 实证);收敛 codegen-units 又使编译超出 120 分钟 job 上限(同 PR
      # 第二轮实证)。故仅在本 job 内把 codewhale-tui 覆盖回 dev 默认 O0:
      # 写入 CARGO_HOME/config.toml(package 级 profile 覆盖只能走 config,
      # Cargo 无对应环境变量),不改动仓库 Cargo.toml,本地与 Linux job 的
      # 依赖级 O2 不受影响;仓库此前亦有引擎 dev-O0 的先例。release 产物
      # 仍由 Cargo.toml 的 release profile 决定。
      - name: dev profile 内存边界覆盖(codewhale-tui O0,仅本 job)
        shell: pwsh
        run: |
          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $env:USERPROFILE ".cargo" }
          $config = Join-Path $cargoHome "config.toml"
          Add-Content -Path $config -Value @"

          [profile.dev.package.codewhale-tui]
          opt-level = 0
          "@
          Write-Host "appended codewhale-tui dev O0 override to $config"
          Get-Content -Path $config | Select-Object -Last 4

      # 编译 Windows 专用 .exe 栈 wrapper(源码 scripts/rustc-stack-wrapper.rs)。
      # 直接调 rustc 编译、不经 cargo,故不受本 job 的 RUSTC_WRAPPER 影响,无自举依赖。
      - name: 编译 Windows 栈 wrapper(.exe)
        shell: bash
        run: rustc -O pinvou3-app/src-tauri/scripts/rustc-stack-wrapper.rs -o pinvou3-app/src-tauri/scripts/rustc-stack-wrapper.exe

      # This job's cargo steps do not need frontend dependencies: under the
      # debug profile tauri's generate_context! uses devUrl, dist/ is never
      # packaged, and build.rs only depends on tauri-build/cc (verified on
      # macOS in 2026-08: cargo check --all-targets passes after moving
      # node_modules away). The regression leg uses the runner's preinstalled
      # Node only for a dependency-free static updater contract, so setup-node
      # and npm ci remain unnecessary.

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          # This job compiles the CodeWhale Windows-only regression target as
          # well as the application workspace. Cache both target directories.
          workspaces: |
            pinvou3-app/src-tauri
            CodeWhale
          # Both legs restore the established namespace on their isolated runners.
          # Only regression/main may save, so parallelization adds neither a new
          # cache namespace nor a second writer racing the existing 10GB cache.
          shared-key: windows-rust-test
          save-if: ${{ matrix.phase == 'regression' && github.ref == 'refs/heads/main' }}

      - name: Windows Rust 缓存基线诊断
        shell: pwsh
        run: |
          $target = Join-Path $env:GITHUB_WORKSPACE "pinvou3-app/src-tauri/target"
          $fingerprints = Join-Path $target "debug/.fingerprint"
          $deps = Join-Path $target "debug/deps"
          $fingerprintCount = if (Test-Path -LiteralPath $fingerprints) {
            @(Get-ChildItem -LiteralPath $fingerprints -Directory -ErrorAction SilentlyContinue).Count
          } else { 0 }
          $depFileCount = if (Test-Path -LiteralPath $deps) {
            @(Get-ChildItem -LiteralPath $deps -File -ErrorAction SilentlyContinue).Count
          } else { 0 }
          Write-Host "WINDOWS_RUST_CACHE phase=${{ matrix.phase }} target_exists=$(Test-Path -LiteralPath $target) fingerprint_crates=$fingerprintCount dep_files=$depFileCount"

      - name: Windows Rust 全目标检查
        if: ${{ matrix.phase == 'all-targets-check' }}
        run: |
          started=$SECONDS
          set +e
          cargo check --manifest-path pinvou3-app/src-tauri/Cargo.toml \
            --all-targets --features dev-tools
          status=$?
          set -e
          echo "WINDOWS_RUST_TIMING phase=all-targets-check step=cargo-check elapsed_seconds=$((SECONDS-started)) status=$status"
          exit "$status"

      # The pinvou-cli Windows branches (exe/cmd candidates, cmd /D /S /C
      # shims, taskkill tree kill, CREATE_NO_WINDOW) only compile-check on a
      # Windows runner. It is metadata-only as well, so it shares the check leg.
      - name: pinvou-cli Windows compile check
        if: ${{ matrix.phase == 'all-targets-check' }}
        run: |
          started=$SECONDS
          set +e
          cargo check --manifest-path pinvou-cli/Cargo.toml \
            --workspace --all-targets --locked
          status=$?
          set -e
          echo "WINDOWS_RUST_TIMING phase=all-targets-check step=cli-check elapsed_seconds=$((SECONDS-started)) status=$status"
          exit "$status"

      - name: Windows Rust 单元测试链接检查
        if: ${{ matrix.phase == 'regression' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $timer = [System.Diagnostics.Stopwatch]::StartNew()
          $records = @(& cargo test --manifest-path pinvou3-app/src-tauri/Cargo.toml `
            --lib --no-run --message-format=json)
          $cargoExit = $LASTEXITCODE
          $timer.Stop()
          Write-Host "WINDOWS_RUST_TIMING phase=regression step=cargo-test-link elapsed_seconds=$([math]::Round($timer.Elapsed.TotalSeconds)) status=$cargoExit"
          $records | ForEach-Object { Write-Host $_ }
          if ($cargoExit -ne 0) {
            throw "FAIL: Windows Rust 单元测试链接检查失败(exit=$cargoExit)"
          }

          $testExe = $null
          foreach ($line in $records) {
            try {
              $record = $line.ToString() | ConvertFrom-Json -ErrorAction Stop
            } catch {
              continue
            }
            if ($record.reason -eq "compiler-artifact" -and
                $record.target.name -eq "pinvou3_lib" -and
                $record.profile.test -eq $true -and
                $record.executable) {
              $testExe = $record.executable
            }
          }
          if (-not $testExe -or -not (Test-Path -LiteralPath $testExe -PathType Leaf)) {
            throw "FAIL: cargo 未报告 pinvou3_lib 测试 exe"
          }
          "PINVOU3_TEST_EXE=$testExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Windows Rust 测试 exe: $testExe"

      # 0xc0000139 根因(已由诊断定位):muda 静态导入 TaskDialogIndirect,该符号仅
      # 存在于 Common-Controls v6 side-by-side 程序集;主 exe 由 tauri-build 嵌入声明该
      # 依赖的清单,而 cargo test 的 pinvou3_lib-*.exe 没有 v6 依赖声明。
      # link.exe 已给测试 exe 嵌入默认清单,Windows 会优先使用内嵌资源而忽略同目录
      # <exe>.manifest；因此必须用 runner 自带的 Windows SDK mt.exe 更新 resource #1。
      - name: Windows 测试 exe 嵌入 Common-Controls v6 清单
        if: ${{ matrix.phase == 'regression' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $manifestPath = Join-Path $env:RUNNER_TEMP "pinvou3-test-common-controls.manifest"
          @'
          <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
          <assembly xmlns="urn:schemas-microsoft-com:asm.v1" manifestVersion="1.0">
            <dependency>
              <dependentAssembly>
                <assemblyIdentity type="win32" name="Microsoft.Windows.Common-Controls"
                  version="6.0.0.0" processorArchitecture="*"
                  publicKeyToken="6595b64144ccf1df" language="*"/>
              </dependentAssembly>
            </dependency>
          </assembly>
          '@ | Set-Content -LiteralPath $manifestPath -Encoding utf8NoBOM

          $sdkBin = Join-Path ${env:ProgramFiles(x86)} "Windows Kits\10\bin"
          $mt = Get-ChildItem -Path (Join-Path $sdkBin "*\x64\mt.exe") -File |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending |
            Select-Object -First 1
          if (-not $mt) {
            throw "FAIL: Windows SDK mt.exe 不存在"
          }

          if (-not $env:PINVOU3_TEST_EXE) {
            throw "FAIL: PINVOU3_TEST_EXE 未设置"
          }
          $testExe = Get-Item -LiteralPath $env:PINVOU3_TEST_EXE
          & $mt.FullName -nologo -manifest $manifestPath "-outputresource:$($testExe.FullName);#1"
          if ($LASTEXITCODE -ne 0) {
            throw "FAIL: 无法向 $($testExe.Name) 嵌入 Common-Controls v6 清单"
          }
          Write-Host "已嵌入清单的测试 exe: $($testExe.FullName)"

      # 测试 exe 曾在回归步骤启动即挂(exit code 0xc0000139,STATUS_ENTRYPOINT_NOT_FOUND),
      # Windows 不指明缺哪个 DLL/符号。此步骤静态解析 PE 导入表作对照输出,纯诊断不阻断。
      # 纯诊断不阻断:脚本异常(如解析到截断 PE)不得挂掉本 job,故 continue-on-error。
      # 必须位于「嵌入 Common-Controls v6 清单」之后:脚本读 exe 已嵌入的清单来豁免
      # SxS 程序集 DLL(如 comctl32)的缺符号假阳性,嵌入前读到的是无 v6 声明的默认清单;
      # 直接传 $PINVOU3_TEST_EXE 保证诊断对象就是刚嵌入清单、回归将运行的那个 exe。
      - name: Windows 测试二进制导入诊断
        if: ${{ matrix.phase == 'regression' }}
        continue-on-error: true
        shell: pwsh
        run: python scripts/ci-windows-imports-diagnose.py "$env:PINVOU3_TEST_EXE"

      # Parent application jobs do not execute a dependency crate's lib tests;
      # this Windows leg explicitly runs the CodeWhale shell regressions. Assert
      # that every filter still matches so a rename cannot become a silent pass.
      - name: CodeWhale Windows PowerShell regressions
        if: ${{ matrix.phase == 'regression' }}
        shell: bash
        run: |
          set -euo pipefail
          started=$SECONDS
          # The tested fallback chooses pwsh.exe only when SHELL is absent.
          # Make that runner assumption explicit and deterministic.
          unset SHELL
          cd CodeWhale
          for filter in forkguard_powershell forkguard_windows_shell_text; do
            log="/tmp/codewhale_windows_${filter}.log"
            cargo test -p codewhale-tui --lib --locked "$filter" -- --test-threads=1 2>&1 | tee "$log"
            grep -qE 'running [1-9][0-9]* tests?' "$log" || {
              echo "FAIL: CodeWhale filter '$filter' matched zero tests" >&2
              exit 1
            }
          done
          echo "WINDOWS_RUST_TIMING phase=regression step=codewhale-powershell elapsed_seconds=$((SECONDS-started)) status=0"

      - name: Windows 静态更新契约
        if: ${{ matrix.phase == 'regression' }}
        run: npm --prefix pinvou3-app run test:windows-static-updater

      - name: Windows 原子替换状态机回归
        if: ${{ matrix.phase == 'regression' }}
        shell: bash
        run: |
          set -euo pipefail
          total_started=$SECONDS
          # 直接运行已经由 mt.exe 修补的链接产物。这里不能再次调用 cargo test，
          # 否则 Cargo 可能重链并覆盖 exe，导致 Common-Controls v6 清单丢失。
          test_exe="$(cygpath -u "$PINVOU3_TEST_EXE")"
          [[ -f "$test_exe" ]] || {
            echo "FAIL: 测试 exe 不存在:$test_exe" >&2
            exit 1
          }
          cd pinvou3-app/src-tauri
          # 逐过滤器断言至少命中 1 个测试,避免测试改名后过滤器 0 匹配却 exit 0
          # 导致的静默空跑。
          index=0
          for filter in \
            'platform::filesystem::tests::windows_' \
            'platform::paths::tests::managed_python_' \
            'artifact_read_recovers_an_occupied_1177_layout_after_release' \
            'artifact_writes_never_expose_partial_utf8_to_concurrent_readers' \
            'artifact_public_read_' \
            'features::voice::platform::windows::tests::closed_temp_wav_can_be_reopened_when_asr_denies_write_sharing' \
            'features::memory::tests::topic_migration_' \
            'connector_introspection_guard_matches_complete_names_only' \
            'features::projects::tests::' \
            'run_with_timeout_reaps_and_stays_bounded' \
            'reap_killed_child_' \
            'features::browser::platform::windows::tests::' \
            'features::updater::platform::windows::tests::' \
            'features::monitor::platform::windows_cpu::tests::' \
            'features::monitor::platform::windows_memory::tests::' \
            'features::monitor::platform::windows_gpu::tests::' \
            'features::remote_control::platform::windows::tests::' \
            'features::computer_use::platform::windows::tests::'; do
            index=$((index+1))
            started=$SECONDS
            "$test_exe" "$filter" --test-threads=1 2>&1 | tee /tmp/windows_regression.log
            grep -qE 'running [1-9][0-9]* tests?' /tmp/windows_regression.log || {
              echo "FAIL: 回归过滤器 '$filter' 匹配 0 个测试(疑似测试改名导致静默空跑)" >&2
              exit 1
            }
            echo "WINDOWS_RUST_TIMING phase=regression step=test-filter-$index elapsed_seconds=$((SECONDS-started)) status=0"
          done
          echo "WINDOWS_RUST_TIMING phase=regression step=regression-filter-suite elapsed_seconds=$((SECONDS-total_started)) status=0"

  windows-rustup-repair-test:
    name: windows-rustup-repair-test
    needs: changes
    if: ${{ !cancelled() && github.event.action != 'closed' && needs.changes.outputs.pure_release_backflow != 'true' && needs.changes.outputs.windows_rustup_repair == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: 安装锁定的 Rust 工具链
        shell: pwsh
        run: |
          $config = Get-Content pinvou3-app/src-tauri/rust-toolchain.toml -Raw
          $match = [regex]::Match($config, '(?m)^\s*channel\s*=\s*"([^"]+)"')
          if (-not $match.Success) {
            throw "Unable to read the pinned Rust toolchain."
          }
          rustup toolchain install $match.Groups[1].Value `
            --profile minimal --component clippy --component rustfmt --no-self-update

      - name: 隔离工具链损坏修复与下载源回退
        run: npm --prefix pinvou3-app run test:windows-rustup-repair

  macos-rust-check:
    name: macos-rust-check
    needs: changes
    # Native macOS compile coverage plus computer_use test execution for ready
    # high-risk/explicit PRs and main; same gate as windows-rust-test. Type
    # errors in platform-specific code (e.g. computer_use/platform/macos.rs)
    # are only caught by a native cargo check; the Linux leg (ubuntu) never
    # compiles the macOS target. Round-17: this leg also RUNS the
    # computer_use unit tests — macOS-only tests previously executed on no CI
    # leg at all (check does not run tests; the Windows leg runs Windows
    # filters; the Linux leg runs Linux tests), leaving macOS runtime behavior
    # author-machine-only. The Merge Queue does not repeat this leg; the Linux
    # rust-test verifies the combined tree; check does not link, so no
    # signing/packaging/frontend artifacts are needed (same as windows-rust-test: verified
    # empirically on macOS in 2026-08 that cargo check --all-targets does not depend on
    # node_modules, hence no node/npm install).
    if: >-
      ${{
        !cancelled() &&
        (
          github.event_name == 'push' ||
          (
            github.event_name == 'pull_request' &&
            github.event.pull_request.draft == false &&
            (
            needs.changes.outputs.rust_full == 'true' ||
              needs.changes.outputs.cli_rust == 'true' ||
              (
                needs.changes.outputs.rust_code == 'true' &&
                contains(github.event.pull_request.labels.*.name, 'ci:full-rust')
              )
            )
          )
        )
      }}
    runs-on: macos-15
    # A cold check build is slow (macOS runners slower still); same cap as windows-rust-test
    # (180: the 90-minute cap was once killed at the link phase on the Windows leg, see
    # that job), so a hang does not burn runner minutes for long.
    timeout-minutes: 180
    env:
      # Same as mac-build: inject the sh stack wrapper per platform (the rustc/LLVM stack
      # overflow from codewhale-tui's O2 build has actually been triggered on macOS, see
      # the rustc-stack-wrapper header comment).
      # Must use the ${{ github.workspace }} absolute path so Cargo does not double-join
      # the per-process cwd when resolving it.
      RUSTC_WRAPPER: ${{ github.workspace }}/pinvou3-app/src-tauri/scripts/rustc-stack-wrapper
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Init CodeWhale submodule
        run: git submodule update --init --recursive -- CodeWhale

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Same as rust-test/windows-rust-test: set the toolchain pinned by
      # src-tauri/rust-toolchain.toml as default, so cargo invoked from the repo root via
      # --manifest-path uses the same pinned version as locally (the file is the single
      # source of truth; the version number is not re-hardcoded in the workflow).
      - name: Align rust-toolchain.toml pinned toolchain
        working-directory: pinvou3-app/src-tauri
        run: rustup default "$(rustup show active-toolchain | awk '{print $1}')"

      # bge-m3 is a gitignored large asset (559MB); a clean CI checkout does not have it.
      # Same as mac-build and the Linux rust-test: create empty placeholder files to pass
      # tauri-build's resource validation.
      - name: bge-m3 placeholder (satisfies tauri-build resource check)
        run: |
          d=pinvou3-app/src-tauri/resources/bge-m3
          mkdir -p "$d"
          for f in config.json model.onnx tokenizer.json tokenizer_config.json special_tokens_map.json; do
            : > "$d/$f"
          done

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: pinvou3-app/src-tauri
          # Separate key: macOS artifacts are not interchangeable with Linux/Windows; do not
          # share with the sibling legs.
          shared-key: macos-rust-check
          # Save only on main (the sole source of warm cache); the PR side is read-only and
          # does not eat the 10GB quota.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: macOS Rust all-targets check
        run: >-
          cargo check --manifest-path pinvou3-app/src-tauri/Cargo.toml
          --all-targets --features dev-tools --locked

      # Round-17: execute the computer_use unit tests on this leg — macOS-only
      # tests (macos.rs, screen_capture_kit.rs) ran on no CI leg before. The
      # 0-match guard keeps a test rename from silently skipping the suite.
      - name: macOS computer_use unit tests
        run: |
          set -euo pipefail
          cd pinvou3-app/src-tauri
          cargo test --lib --features benchmark-hooks --locked computer_use -- --test-threads=1 2>&1 | tee /tmp/macos_computer_use.log
          grep -qE 'running [1-9][0-9]* tests?' /tmp/macos_computer_use.log || {
            echo "FAIL: the computer_use filter matched 0 tests (silent no-op guard)" >&2
            exit 1
          }

  windows-codex-runtime-test:
    name: windows-codex-runtime-test
    needs: changes
    if: ${{ !cancelled() && github.event.action != 'closed' && needs.changes.outputs.pure_release_backflow != 'true' && (needs.changes.outputs.windows_codex == 'true' || needs.changes.outputs.acp_runtime == 'true') && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: pinvou3-app/package-lock.json

      # Ubuntu npm tests skip these suites outside win32. They use only Node
      # built-ins and fake MCP/host fixtures to exercise the real wrapper
      # subprocess, protocol, heartbeat, tombstone, and commit-unknown paths.
      - name: Windows browser wrapper lifecycle regression
        env:
          PINVOU3_TEST_BROWSER_NO_HOST: "1"
        run: |
          node --test pinvou3-app/tests/browser_wrapper_windows_lifecycle.test.mjs
          node pinvou3-app/tests/browser_wrapper_lazy.test.mjs

      - name: 安装构建依赖
        run: npm --prefix pinvou3-app ci --prefer-offline --no-audit

      - name: Windows Codex Runtime 原生打包冒烟
        run: |
          npm --prefix pinvou3-app run test:windows-runtime
          npm --prefix pinvou3-app run test:codex-acp-windows-runtime

  windows-runtime-test:
    name: windows-runtime-test
    needs: changes
    if: ${{ !cancelled() && github.event.action != 'closed' && needs.changes.outputs.pure_release_backflow != 'true' && needs.changes.outputs.windows_runtime == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Windows 私有 runtime 缓存行为回归
        run: powershell -NoProfile -ExecutionPolicy Bypass -File pinvou3-app/tests/windows_runtime_cache_behavior.ps1

  macos-codex-runtime-test:
    name: macos-codex-runtime-test
    needs: changes
    if: ${{ !cancelled() && github.event.action != 'closed' && needs.changes.outputs.pure_release_backflow != 'true' && needs.changes.outputs.acp_runtime == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: 准备 macOS universal ACP Bridge
        run: ./pinvou3-app/scripts/prepare-codex-bridge-runtime.sh

      - name: macOS Codex 与 Claude Runtime 原生打包冒烟
        run: npm --prefix pinvou3-app run test:codex-acp-macos-runtime

  account-platform-edge-test:
    name: account-platform-edge-test
    needs: changes
    if: ${{ !cancelled() && github.event.action != 'closed' && needs.changes.outputs.account_platform == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            account-platform/package-lock.json
            pinvou3-app/package-lock.json
      - name: 安装登录主题浏览器测试依赖
        shell: pwsh
        run: |
          npm --prefix account-platform ci --prefer-offline --no-audit --ignore-scripts
          npm --prefix pinvou3-app ci --prefer-offline --no-audit --ignore-scripts
      - name: Windows Edge 密码显隐视觉门禁
        shell: pwsh
        env:
          CHROME: C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe
          EDGE: C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe
          PINVOU_REQUIRE_PASSWORD_BROWSER_TEST: "1"
          PINVOU_REQUIRE_PASSWORD_EDGE_VISUAL_TEST: "1"
        run: node --test account-platform/test/contract/browser-login-theme.test.mjs

  required-gate:
    name: required-gate
    needs:
      - commit-message
      - version-consistency
      - changes
      - backflow-portability
      - fast-gate
      - frontend-test
      - relay-test
      - team-relay-hub-test
      - account-platform-test
      - account-platform-edge-test
      - update-release-console-test
      - release-contract-test
      - knowledge-rust
      - rust-lint
      - rust-test
      - cli-test
      - windows-rust-test
      - macos-rust-check
      - windows-static-updater-contract
      - macos-codex-runtime-test
      - windows-codex-runtime-test
      - windows-runtime-test
      - windows-rustup-repair-test
    if: ${{ always() && ((github.event_name == 'pull_request' && github.event.action != 'closed') || github.event_name == 'merge_group') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up zram and swap
        # 内存扩容为尽力而为:超时/失败只告警不阻断(回退 runner 默认内存)。
        run: timeout --kill-after=15 240 sudo --preserve-env=GITHUB_ACTIONS,PINVOU3_CI_DISABLE_ZRAM bash "${{ github.workspace }}/scripts/ci-memory-setup.sh" || echo "::warning::ci-memory-setup 未完成,继续使用 runner 默认内存"

      - name: 汇总所有适用检查
        env:
          COMMIT_MESSAGE_RESULT: ${{ needs.commit-message.result }}
          VERSION_CONSISTENCY_RESULT: ${{ needs.version-consistency.result }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          BACKFLOW_PORTABILITY_RESULT: ${{ needs.backflow-portability.result }}
          FAST_GATE_RESULT: ${{ needs.fast-gate.result }}
          FRONTEND_RESULT: ${{ needs.frontend-test.result }}
          RELAY_RESULT: ${{ needs.relay-test.result }}
          TEAM_RELAY_HUB_RESULT: ${{ needs.team-relay-hub-test.result }}
          ACCOUNT_PLATFORM_RESULT: ${{ needs.account-platform-test.result }}
          ACCOUNT_PLATFORM_EDGE_RESULT: ${{ needs.account-platform-edge-test.result }}
          UPDATE_RELEASE_CONSOLE_RESULT: ${{ needs.update-release-console-test.result }}
          RELEASE_CONTRACT_RESULT: ${{ needs.release-contract-test.result }}
          KNOWLEDGE_RUST_RESULT: ${{ needs.knowledge-rust.result }}
          RUST_LINT_RESULT: ${{ needs.rust-lint.result }}
          RUST_RESULT: ${{ needs.rust-test.result }}
          CLI_TEST_RESULT: ${{ needs.cli-test.result }}
          WINDOWS_RUST_RESULT: ${{ needs.windows-rust-test.result }}
          MACOS_RUST_CHECK_RESULT: ${{ needs.macos-rust-check.result }}
          WINDOWS_STATIC_UPDATER_RESULT: ${{ needs.windows-static-updater-contract.result }}
          MACOS_CODEX_RESULT: ${{ needs.macos-codex-runtime-test.result }}
          WINDOWS_CODEX_RESULT: ${{ needs.windows-codex-runtime-test.result }}
          WINDOWS_RUNTIME_RESULT: ${{ needs.windows-runtime-test.result }}
          WINDOWS_RUSTUP_REPAIR_RESULT: ${{ needs.windows-rustup-repair-test.result }}
          BACKFLOW_MODE: ${{ needs.changes.outputs.backflow_mode }}
          WINDOWS_RUST_REQUIRED_BY_POLICY: ${{ (github.event_name == 'merge_group' && needs.changes.outputs.backflow_mode == 'full') || (github.event_name == 'pull_request' && github.event.pull_request.draft == false && (needs.changes.outputs.backflow_mode == 'full' || needs.changes.outputs.backflow_mode == 'windows_full')) }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "merge_group" ]]; then
            # 队列提交由 GitHub 生成，不重复校验人工 commit message；
            # 其余基础与产品门禁必须验证当前组合提交。
            if [[ "$VERSION_CONSISTENCY_RESULT" != success || "$CHANGES_RESULT" != success || "$FAST_GATE_RESULT" != success ]]; then
              echo "Merge Queue 基础检查失败: version-consistency=$VERSION_CONSISTENCY_RESULT changes=$CHANGES_RESULT fast-gate=$FAST_GATE_RESULT" >&2
              exit 1
            fi
          elif [[ "$COMMIT_MESSAGE_RESULT" != success || "$VERSION_CONSISTENCY_RESULT" != success || "$CHANGES_RESULT" != success || "$FAST_GATE_RESULT" != success ]]; then
            echo "基础检查失败: commit-message=$COMMIT_MESSAGE_RESULT version-consistency=$VERSION_CONSISTENCY_RESULT changes=$CHANGES_RESULT fast-gate=$FAST_GATE_RESULT" >&2
            exit 1
          fi

          if [[ "$WINDOWS_RUST_REQUIRED_BY_POLICY" == "true" && "$WINDOWS_RUST_RESULT" != success ]]; then
            echo "回流策略 $BACKFLOW_MODE 要求完整 Windows Rust，但结果为 $WINDOWS_RUST_RESULT" >&2
            exit 1
          fi

          failed=0
          for item in \
            "backflow-portability:$BACKFLOW_PORTABILITY_RESULT" \
            "frontend-test:$FRONTEND_RESULT" \
            "relay-test:$RELAY_RESULT" \
            "team-relay-hub-test:$TEAM_RELAY_HUB_RESULT" \
            "account-platform-test:$ACCOUNT_PLATFORM_RESULT" \
            "account-platform-edge-test:$ACCOUNT_PLATFORM_EDGE_RESULT" \
            "update-release-console-test:$UPDATE_RELEASE_CONSOLE_RESULT" \
            "release-contract-test:$RELEASE_CONTRACT_RESULT" \
            "knowledge-rust:$KNOWLEDGE_RUST_RESULT" \
            "rust-lint:$RUST_LINT_RESULT" \
            "rust-test:$RUST_RESULT" \
            "cli-test:$CLI_TEST_RESULT" \
            "windows-rust-test:$WINDOWS_RUST_RESULT" \
            "macos-rust-check:$MACOS_RUST_CHECK_RESULT" \
            "windows-static-updater-contract:$WINDOWS_STATIC_UPDATER_RESULT" \
            "macos-codex-runtime-test:$MACOS_CODEX_RESULT" \
            "windows-codex-runtime-test:$WINDOWS_CODEX_RESULT" \
            "windows-runtime-test:$WINDOWS_RUNTIME_RESULT" \
            "windows-rustup-repair-test:$WINDOWS_RUSTUP_REPAIR_RESULT"; do
            name="${item%%:*}"
            result="${item#*:}"
            case "$result" in
              success|skipped) ;;
              *)
                echo "$name 未通过: $result" >&2
                failed=1
                ;;
            esac
          done
          [[ "$failed" -eq 0 ]]
