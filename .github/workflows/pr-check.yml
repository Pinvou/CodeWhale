          ! grep -F -- '--- SKIP: TestFormulaDraftUnitValidationPostgresIntegration' <<< "$formula_validation_output"
          impact_pricing_output="$(go test -run '^TestBillingImpactPriceCoveragePostgresIntegration$' -count=1 -v ./internal/billing)"
