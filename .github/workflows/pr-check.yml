      - name: Prepare Account integration roles
        env:
          PGPASSWORD: account_platform_test
        run: |
          psql --host 127.0.0.1 --username account_platform_test --dbname postgres --set=ON_ERROR_STOP=1 <<'SQL'
          SELECT 'CREATE ROLE account_service LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS'
          WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'account_service') \gexec
          SELECT 'CREATE ROLE account_approval_control_owner NOLOGIN NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS'
          WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'account_approval_control_owner') \gexec
          SELECT 'CREATE ROLE account_migrator LOGIN NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS'
          WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'account_migrator') \gexec
          SELECT 'CREATE ROLE account_approval_authorization_owner NOLOGIN NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS'
          WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'account_approval_authorization_owner') \gexec
          SELECT 'CREATE ROLE account_approval_writer LOGIN NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS'
          WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'account_approval_writer') \gexec
          SELECT 'CREATE ROLE account_approval_backfill LOGIN NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS'
          WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'account_approval_backfill') \gexec
          SELECT 'CREATE ROLE account_approval_relay LOGIN NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS'
          WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'account_approval_relay') \gexec
          SELECT 'CREATE ROLE account_approval_recovery NOLOGIN NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS'
          WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'account_approval_recovery') \gexec
          GRANT account_service, account_approval_control_owner TO account_migrator;
          GRANT account_approval_authorization_owner TO account_migrator WITH INHERIT FALSE, SET TRUE, ADMIN TRUE;
          SQL

      - name: 启动隔离 Token 审批事件测试队列
        run: |
