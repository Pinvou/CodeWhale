name: PR Check

# Jobs:
# - commit-message:强制校验 PR/push 的 Git commit 信息规范。
# - version-consistency:强制校验 VERSION 单一事实来源与 SemVer 规则。
# - fast-gate (seconds, runs on every PR): fork-guard fingerprints + fork
#   compliance linkage + actionlint + Python determinism tests.
# - changes:检测本 PR 有没有 Rust 代码、发布契约、L1 harness 或前端改动,给后续 job 做 paths filter。
# - frontend-test:Draft 跑 lint/build/逻辑测试；Ready PR 与 Merge Queue 按实际
#   base/head diff 选择浏览器 smoke；未知或共享路径保守执行全部 smoke。
# - team-relay-hub-test:Hub 或迁移变化时使用隔离 PostgreSQL 跑完整测试与依赖审计。
# - account-platform-test:账号平台变化时验证 Go、API/事件契约、迁移和 Compose 构建。
# - release-contract-test:发布链路改动只跑配置/脚本契约,不在 PR 构建安装包。
# - knowledge-rust:独立 pinvou-knowledge crate/部署入口改动跑 fmt/clippy/test 与 shell
#   语法检查；依赖或策略改动时追加 cargo-deny，不依赖 Tauri workspace 间接覆盖。
# - rust-test: Draft and explicitly low-risk Rust changes skip the large test
#   binary. Ready high-risk PRs and their combined Merge Queue tree run Linux
#   regressions; Windows runs once on the ready PR, and trusted same-repository
#   backflows use their dedicated portability gate. main push 无条件累计编译验证并
#   写暖 cache(--no-run,不执行测试;MQ 已对同一组合树跑过全量测试)。
# - cli-test: pinvou-cli workspace contract suite (fmt + all-target tests),
#   triggered by cli_rust/rust_full changes; follows the rust-test push and
#   cache policies (memory setup, --no-run on push, ~/.cargo-only cache).
# - rust-lint:Draft 只跑 fmt；Ready/Queue/main 跑 clippy；cargo-deny 仅在依赖
#   或策略路径变化时追加，三项均无 continue-on-error。
#   与 rust-test 并行,各自独立 cache。clippy 规则见 Cargo.toml [lints] 表:
#   只启用实测零欠账的 lint(deny),有欠账的 lint/group 显式 allow,
#   欠账由清理 PR(#35 及后续)消化后逐个升 deny。
# - windows-rust-test:Windows 全目标 check 与六组原生回归使用同一路由并行执行；
#   Ready 高风险 PR 或 ci:full-rust 标签触发一次。可信回流按 base→head 内容语义
#   区分纯版本、普通跨平台 Rust 和 Windows 高风险；Merge Queue 不重复，main 保留
#   累计原生验证。
# - windows-rustup-repair-test:相关 PR 在隔离目录破坏工具链并验证下载源回退与重装。
# - macos-rust-check:macOS 原生编译检查(check 不链接,无签名/打包),与
#   windows-rust-test 同门禁口径;Linux 跑不出平台专属类型错误(computer-use
#   的 ScreenCaptureKit 等平台后端需要原生腿)。
# - windows-codex-runtime-test:相关 PR 在 Windows 原生验证 browser-wrapper 生命周期、
#   准备 Node + ACP Bridge，并核对安装包资源。
# - backflow-portability:可信回流 PR/Queue 在 Windows、macOS、Linux 并行运行
#   无依赖轻门禁；本地实际处理平台由 PR provenance 绑定到当前 head。
# - Benchmarks stay outside product PR/MQ gates and run manually in an isolated environment.
# - required-gate:PR 阶段汇总所有适用检查，作为唯一 required check。
# - merge_group:按 base/head 的真实组合 diff 运行适用门禁，保证验证对象就是
#   最新 main + 入队 PR；因此无冲突 PR 不需要为主线日常前进反复人工 rebase。
#
# Cache 策略(2026-07 诊断:PR cache 挂 refs/pull/N/merge 作用域互不可见 + 1.3GB/份
# 顶死 10GB 限额被 LRU 秒驱逐 → 每轮全冷编译 ~9min):
# - Main compiles rust-test targets (--no-run) and stores a main-scoped cache for
#   high-risk/explicit PRs; full test execution stays on the Merge Queue/PR leg.
# - save-if 仅 main:PR 侧只读不写,不再刷爆限额挤掉暖 cache。
# - rust-cache 的 restore 有前缀回退(restoreKey 不含 lockfile hash),PR 改 Cargo.lock
#   也能从 main cache 增量编译,不再全冷。

on:
  pull_request:
    # 不限制 base 分支:堆叠 PR(base 为功能分支而非 main)同样必须跑完整
    # lint + test gate。此前 `branches: [main]` 使栈中段 PR(base=功能分支)
    # 只触发无 base 过滤的 DCO/Gitleaks/dependency-review,整条 pr-check
    # (含 lint:ui / npm test / 浏览器 smoke / required-gate)被静默跳过,
    # 导致 no-undef 与签名回归在栈中段漏检(见 #166/#168 评审)。changes
    # job 已按路径短路无关 job(rust-test 默认跳过等),不会无差别烧 CI 分钟。
    # ready/converted 事件用于切换 Draft 快检与 Ready 定向门禁；标签事件用于
    # 按需开启/关闭 ci:full-rust。
    # closed 事件会进入同一个 concurrency group，及时取消已合并/关闭 PR 的旧任务。
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, labeled, unlabeled, closed]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]   # 暖 cache:见上方 Cache 策略

permissions:
  contents: read
  pull-requests: read   # dorny/paths-filter 调 API 读 PR 改了哪些文件

# 同一 PR 连续 push 或被合并/关闭时,取消上一次未跑完的检查,省 runner。
# main push 保留当前正在运行的暖缓存任务；GitHub 同一 concurrency group 最多保留
# 一个 running 和一个 pending，新 push 会替换旧 pending。为避免被替换的 pending
# 恰好包含 Rust 变更、而保留下来的后续 push 只看相邻非 Rust diff，main 的 Linux
# 与 Windows Rust job 均无条件执行累计验证，不依赖单次 push 的 paths-filter。
concurrency:
  group: pr-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  commit-message:
    name: commit-message
    if: ${{ (github.event_name == 'pull_request' && github.event.action != 'closed') || github.event_name == 'push' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up zram and swap
        # 内存扩容为尽力而为:超时/失败只告警不阻断(回退 runner 默认内存)。
        run: timeout --kill-after=15 240 sudo --preserve-env=GITHUB_ACTIONS,PINVOU3_CI_DISABLE_ZRAM bash "${{ github.workspace }}/scripts/ci-memory-setup.sh" || echo "::warning::ci-memory-setup 未完成,继续使用 runner 默认内存"

      - name: 校验 commit 信息规范
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 scripts/validate-commit-msg.py --range "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
          else
            before="${{ github.event.before }}"
            if [ "$before" = "0000000000000000000000000000000000000000" ]; then
              before="$(git rev-list --max-parents=0 HEAD)"
            fi
            python3 scripts/validate-commit-msg.py --range "$before" "${{ github.sha }}" --allow-signoff-author-mismatch
          fi

  version-consistency:
    name: version-consistency
    if: ${{ (github.event_name == 'pull_request' && github.event.action != 'closed') || github.event_name == 'merge_group' || github.event_name == 'push' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up zram and swap
        # 内存扩容为尽力而为:超时/失败只告警不阻断(回退 runner 默认内存)。
        run: timeout --kill-after=15 240 sudo --preserve-env=GITHUB_ACTIONS,PINVOU3_CI_DISABLE_ZRAM bash "${{ github.workspace }}/scripts/ci-memory-setup.sh" || echo "::warning::ci-memory-setup 未完成,继续使用 runner 默认内存"

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: 版本与 CI 路由脚本测试
        run: >-
          node --test
          scripts/tests/community-backflow-automation.test.mjs
          scripts/tests/community-backflow.test.mjs
          scripts/tests/sync-version.test.mjs
          scripts/tests/select-frontend-smokes.test.mjs
          scripts/tests/pr-check-routing.test.mjs

      - name: 校验 VERSION 与各版本文件一致
        run: node scripts/sync-version.mjs --check

  # PR、Merge Queue 与 main push 均按实际改动路径选择检查。
  # paths-filter v4 在 merge_group 上使用事件 base/head SHA 比较队列组合提交。
  # push(main) 下 dorny/paths-filter 用 before..sha 本地 diff(需 fetch-depth:0)，
  # 供其他按路径 job 与审计输出使用；Linux/Windows Rust 累计验证为规避 pending
  # 替换盲区，有意不依赖单次 push 的相邻 diff。
  changes:
    name: changes
    if: ${{ (github.event_name == 'pull_request' && github.event.action != 'closed') || github.event_name == 'merge_group' || github.event_name == 'push' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      rust_code: ${{ steps.filter.outputs.rust_code }}
      rust_dependencies: ${{ steps.filter.outputs.rust_dependencies }}
      rust_full: ${{ steps.filter.outputs.rust_full }}
      cli_rust: ${{ steps.filter.outputs.cli_rust }}
      knowledge_rust: ${{ steps.filter.outputs.knowledge_rust }}
      knowledge_dependencies: ${{ steps.filter.outputs.knowledge_dependencies }}
      release_contract: ${{ steps.filter.outputs.release_contract }}
      l1: ${{ steps.filter.outputs.l1 }}
      pet: ${{ steps.filter.outputs.pet }}
      frontend: ${{ steps.filter.outputs.frontend }}
      relay: ${{ steps.filter.outputs.relay }}
      team_relay_hub: ${{ steps.filter.outputs.team_relay_hub }}
      account_platform: ${{ steps.filter.outputs.account_platform }}
      update_release_console: ${{ steps.filter.outputs.update_release_console }}
      acp_runtime: ${{ steps.filter.outputs.acp_runtime }}
      windows_codex: ${{ steps.filter.outputs.windows_codex }}
      windows_runtime: ${{ steps.filter.outputs.windows_runtime }}
      windows_rustup_repair: ${{ steps.filter.outputs.windows_rustup_repair }}
      windows_static_updater: ${{ steps.filter.outputs.windows_static_updater }}
      backflow_infra: ${{ steps.filter.outputs.backflow_infra }}
      trusted_backflow: ${{ steps.pr-rust-policy.outputs.trusted_backflow || steps.queue-rust-policy.outputs.trusted_backflow || 'false' }}
      backflow_mode: ${{ steps.pr-rust-policy.outputs.backflow_mode || steps.queue-rust-policy.outputs.backflow_mode || 'full' }}
      pure_release_backflow: ${{ steps.pr-rust-policy.outputs.pure_release_backflow || steps.queue-rust-policy.outputs.pure_release_backflow || 'false' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up zram and swap
        # 内存扩容为尽力而为:超时/失败只告警不阻断(回退 runner 默认内存)。
        run: timeout --kill-after=15 240 sudo --preserve-env=GITHUB_ACTIONS,PINVOU3_CI_DISABLE_ZRAM bash "${{ github.workspace }}/scripts/ci-memory-setup.sh" || echo "::warning::ci-memory-setup 未完成,继续使用 runner 默认内存"



      - name: 校验 PR 的 Community 回流来源
        id: pr-rust-policy
        if: ${{ github.event_name == 'pull_request' }}
        run: python3 scripts/ci-rust-policy.py

      - name: 校验 Merge Group 的 Community 回流来源
        id: queue-rust-policy
        if: ${{ github.event_name == 'merge_group' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ci-rust-policy.py

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            rust_code:
              - '**/*.rs'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - '**/build.rs'
              - 'scripts/ci-libpipewire-build.sh'
              - 'CodeWhale'
              - '.gitmodules'
              - '.github/workflows/pr-check.yml'
              - '.github/workflows/mac-build.yml'
            rust_dependencies:
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - '**/deny.toml'
              - 'CodeWhale'
              - '.gitmodules'
              - '.github/workflows/pr-check.yml'
              - '.github/workflows/mac-build.yml'
            # All unclassified Rust paths fail closed to full regression. Only
            # isolated leaf-feature boundaries are explicitly low risk; changes
            # to their registration or app command surface still run full tests.
            rust_full:
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - '**/deny.toml'
              - '**/build.rs'
              - 'pinvou3-app/src-tauri/.cargo/**'
              - '.gitmodules'
              - 'CodeWhale'
              - 'pinvou3-app/src-tauri/rust-toolchain.toml'
              - 'pinvou3-app/src-tauri/**/*.rs'
              - '!pinvou3-app/src-tauri/src/features/feedback/**'
              - '!pinvou3-app/src-tauri/src/features/personas/**'
              - '!pinvou3-app/src-tauri/src/features/pet/**'
            cli_rust:
              - 'pinvou-cli/**/*.rs'
              - 'pinvou-cli/**/Cargo.toml'
              - 'pinvou-cli/**/Cargo.lock'
              - 'CodeWhale'
              # The CLI path-depends on the app crate: leaf features exempt
              # from the full app suite still gate through the CLI suite, so
              # a consumer-breaking change cannot escape pre-merge CI.
              - 'pinvou3-app/src-tauri/src/features/feedback/**'
              - 'pinvou3-app/src-tauri/src/features/personas/**'
            knowledge_rust:
              - 'pinvou-knowledge/**/*.rs'
              - 'pinvou-knowledge/Cargo.toml'
              - 'pinvou-knowledge/Cargo.lock'
              - 'pinvou-knowledge/deploy/**'
              - '.github/workflows/pr-check.yml'
            knowledge_dependencies:
              - 'pinvou-knowledge/Cargo.toml'
              - 'pinvou-knowledge/Cargo.lock'
              - 'pinvou3-app/src-tauri/deny.toml'
              - '.github/workflows/pr-check.yml'
            release_contract:
              - 'VERSION'
              - 'scripts/sync-version.mjs'
              - 'scripts/check-linux-glibc-floor.sh'
              - 'scripts/check-linux-elf-policy.sh'
              - 'scripts/asr/build-sensevoice-runtime.sh'
              - 'scripts/asr/sensevoice-source.env'
              - 'scripts/tests/sync-version.test.mjs'
              - 'scripts/tests/test_ci_gate_policy.py'
              - 'scripts/tests/test_release_arm64_policy.py'
              - 'scripts/tests/test_release_cache_policy.py'
              - 'scripts/tests/test_release_linux_floor_policy.py'
              - 'scripts/tests/test_release_manifest_probe.py'
              - '.github/workflows/release-packages.yml'
              - '.github/workflows/pr-check.yml'
              - '.github/workflows/mac-build.yml'
              - '.gitmodules'
              - 'private-runtimes/windows'
              - 'pinvou3-app/package.json'
              - 'pinvou3-app/package-lock.json'
              - 'pinvou3-app/scripts/tauri/**'
              # tauri_effective_config.test.js 会解析备料脚本的 --target 目标词表，
              # 钉住交叉构建的 Node 架构映射；该测试跑在 release-contract-test，
              # 不列入则只改备料脚本的 PR 会静默跳过这条契约门禁
              # (test_ci_gate_policy 锁定此路由)。
              - 'pinvou3-app/scripts/prepare-codex-bridge-runtime.sh'
              - 'pinvou3-app/src-tauri/tauri.conf.json'
              - 'pinvou3-app/src-tauri/config/**'
              - 'pinvou3-app/src-tauri/packaging/**'
              - 'pinvou3-app/src-tauri/resources/**'
              - 'pinvou3-app/tests/knowledge_host_packaging.test.mjs'
              - 'pinvou3-app/tests/macos_phase2_contract.test.js'
              - 'pinvou3-app/tests/linux_asr_runtime_packaging.test.js'
              - 'pinvou3-app/tests/tauri_effective_config.test.js'
            l1:
              - 'pinvou3-app/src-tauri/tests/l1_dialog_harness.rs'
              - 'pinvou3-app/src-tauri/src/features/assistant/strict_mode_validation_tests.rs'
              - 'pinvou3-app/src-tauri/src/features/assistant/platform/**'
              - 'pinvou3-app/src-tauri/src/features/assistant/engine.rs'
              - 'pinvou3-app/src-tauri/src/lib.rs'
              - 'pinvou3-app/src-tauri/Cargo.toml'
              - 'pinvou3-app/src-tauri/Cargo.lock'
              - 'CodeWhale'
              - '.github/workflows/pr-check.yml'
              - '.github/workflows/mac-build.yml'
            pet:
              - 'pinvou3-app/src/assets/pet/**'
              - 'pinvou3-app/src/features/pet/**'
              - 'pinvou3-app/src/features/chat/ChatView.jsx'
              - 'pinvou3-app/src/features/settings/SettingsView.jsx'
              - 'pinvou3-app/src/hooks/useReducedMotion.js'
              - 'pinvou3-app/src/index.html'
              - 'pinvou3-app/src/app/main.jsx'
              - 'pinvou3-app/src/app/pet-main.jsx'
              - 'pinvou3-app/scripts/validate-pet-assets.mjs'
              - 'pinvou3-app/tests/pet_*'
              - 'pinvou3-app/src/platform/tauri/bridge.js'
              - 'pinvou3-app/src-tauri/capabilities/default.json'
              - 'pinvou3-app/src-tauri/src/platform/prefs/**'
              - 'pinvou3-app/src-tauri/src/lib.rs'
              - 'pinvou3-app/src-tauri/src/features/pet/pet_window.rs'
              - 'pinvou3-app/src-tauri/src/features/pet/selected_pet.rs'
              - 'pinvou3-app/src-tauri/tauri.conf.json'
              - 'pinvou3-app/src-tauri/config/**'
              - 'pinvou3-app/src-tauri/packaging/**'
              - 'pinvou3-app/package.json'
              - 'pinvou3-app/package-lock.json'
              - 'pinvou3-app/vite.config.mjs'
              - 'pinvou3-app/eslint.config.mjs'
              - '.github/workflows/pr-check.yml'
            frontend:
              - 'pinvou3-app/src/**'
              - 'pinvou3-app/tests/**'
              # multiagent_plan_normalize.test.mjs 读取下列 Rust 源做跨语言
              # 契约断言(蜂群契约/同快照不变式/编辑重发等);不列出则
              # Rust-only 改动会静默跳过该 node 门禁(同 resources/** 的
              # connector 契约测试先例;test_ci_gate_policy 锁定此路由)。
              # sessions 与 remote_control/manager 是 readdirSync 整目录拼接
              # 读取,必须整目录路由——只列单个文件必漏其余模块。
              - 'pinvou3-app/src-tauri/src/features/assistant/**'
              - 'pinvou3-app/src-tauri/src/features/multiagent/transcripts.rs'
              - 'pinvou3-app/src-tauri/src/features/remote_control/manager/**'
              - 'pinvou3-app/src-tauri/src/features/sessions/**'
              - 'pinvou3-app/src-tauri/src/features/personas/mod.rs'
              - 'pinvou3-app/src-tauri/src/features/files/file_ingest.rs'
              - 'pinvou3-app/src-tauri/src/app/commands/multiagent.rs'
              - 'pinvou3-app/src-tauri/src/app/commands/chat.rs'
              - 'pinvou3-app/src-tauri/src/app/commands/memory.rs'
              - 'pinvou3-app/src-tauri/src/app/commands/interaction.rs'
              - 'pinvou3-app/src-tauri/src/app/commands/remote_control.rs'
              - 'pinvou3-app/src-tauri/src/app/commands/personas.rs'
              - 'pinvou3-app/src-tauri/src/lib.rs'
              # The atomic-write helper has staging+rename contract assertions;
              # leaving the file out of this list means Rust-only changes to it
              # silently skip the node gate (same locking mechanism as above).
              - 'pinvou3-app/src-tauri/src/platform/filesystem.rs'
              - 'pinvou3-app/scripts/tauri/**'
              - 'pinvou3-app/src-tauri/config/**'
              - 'pinvou3-app/src-tauri/packaging/**'
              # bundle 技能树变更须跑 connector 契约测试(版本联动/口径 lint 经
              # node --test 自动发现),否则 bundle-only 同步 PR 会静默跳过该门禁。
              - 'pinvou3-app/src-tauri/resources/**'
              - 'remote-control-relay/**'
              - 'scripts/deploy-remote-relay.sh'
              - 'scripts/run-user-journey-tests.sh'
              - 'scripts/run-frontend-smokes.mjs'
              - 'scripts/select-frontend-smokes.mjs'
              - 'scripts/mcp-server-contract-smoke.py'
              - 'pinvou3-app/package.json'
              - 'pinvou3-app/package-lock.json'
              - 'pinvou3-app/vite.config.mjs'
              - 'pinvou3-app/eslint.config.mjs'
              # 静态门禁配置(oxlint/Biome/knip/jsconfig)与 Safari 14 兼容审计脚本
              # 只在 frontend-test 内消费;不列入则 config-only PR 会静默跳过
              # 全部 lint 门禁(test_ci_gate_policy 锁定此路由)。
              - 'pinvou3-app/.oxlintrc.json'
              - 'pinvou3-app/biome.jsonc'
              - 'pinvou3-app/knip.json'
              - 'pinvou3-app/jsconfig.json'
              - 'pinvou3-app/scripts/audit-compat.mjs'
              - 'pinvou3-app/src-tauri/tauri.conf.json'
              - '.gitmodules'
              - '.github/workflows/pr-check.yml'
            relay:
              - 'remote-control-relay/**'
              - 'scripts/deploy-remote-relay.sh'
              - 'scripts/deploy-remote-relay-test.sh'
              - '.github/workflows/pr-check.yml'
            team_relay_hub:
              - 'team-relay-hub/**'
              - 'docs/team-relay/migrations/**'
