# cargo-deny configuration for CodeWhale
# https://embarkstudios.github.io/cargo-deny/

[graph]
# Scan all workspace members with all features
all-features = true

[advisories]
# Deny unmaintained and unsound crates
unmaintained = "all"
unsound = "all"
# Ignore specific advisories (known issues in dependencies)
ignore = [
    "RUSTSEC-2025-0141",  # bincode unmaintained - transitive via syntect, no safe upgrade (syntect 5.3.0 is latest)
    "RUSTSEC-2024-0320",  # yaml-rust unmaintained - transitive via syntect, no safe upgrade (syntect 5.3.0 is latest)
    # zvariant / zbus_names / zvariant_derive unmaintained as standalone crates
    # (merged into zbus 6 as modules). Arrive via secret-service 5 -> zbus 5,
    # needed for keyring 4's zbus Secret Service store; no safe upgrade until
    # secret-service depends on zbus 6.
    "RUSTSEC-2026-0370",
    "RUSTSEC-2026-0371",
    "RUSTSEC-2026-0372",
]

[bans]
# Duplicate-version ratchet (Epic #5249, issue #5248): keep the gate in
# warn/dry-run until Hunter approves enforcement. Each entry below is a
# duplicate that survives the round-3 shrink and is blocked on an upstream
# crate that has not yet released a compatible version. Adding a new
# duplicate without extending this list will surface as a new `cargo deny`
# warning, so the ratchet is warm but not yet blocking CI.
# Surviving duplicates after the 688 -> 669 shrink (see PR body):
# - sha2 0.10 vs 0.11 — blocked on oauth2 (0.10) vs the workspace (0.11)
# - thiserror 1 vs 2 — blocked on portable-pty 0.9 via filedescriptor 0.8 (v1) vs workspace v2
# - toml 0.8 vs 1.1 + toml_edit 0.22 vs 0.25 + winnow 0.7 vs 1.0 — blocked on rust-i18n 4.2 (0.8 stack) vs workspace 1.1
multiple-versions = "warn"
wildcards = "deny"
# Explicitly allow the surviving duplicates so `cargo deny` does not warn
# on them again, but will warn on any *new* duplicate crate.
skip = [
    # sha2 0.10 survives via oauth2 5.0.0 (requires it non-optionally).
    { name = "sha2", version = "0.10.9" },
    { name = "thiserror", version = "1.0.69" },
    { name = "thiserror-impl", version = "1.0.69" },
    { name = "toml", version = "0.8.23" },
    { name = "toml_datetime", version = "0.6.11" },
    { name = "toml_edit", version = "0.22.27" },
    { name = "winnow", version = "0.7.14" },
    { name = "serde_spanned", version = "0.6.9" },
    # dirs 6 stays for shellexpand 3's tilde expansion and teletypewriter
    # 0.5.28 (rio-vt's optional pty chain), both in the tui; the workspace is on 7.
    { name = "dirs", version = "6.0.0" },
    { name = "fancy-regex", version = "0.16.2" },
    { name = "itertools", version = "0.13.0" },
    # miniz_oxide 0.8 stays for png 0.18 (via image/arboard); flate2 1.1.10 moved to 0.9.
    { name = "miniz_oxide", version = "0.8.9" },
    # windows-sys 0.42 survives via rio-vt's corcovado chain (dev-only,
    # Windows) and drags its own windows_* 0.42.2 import libraries alongside
    # the workspace's 0.52.6 set. Those windows_* duplicates are deliberately
    # NOT skipped: on the ubuntu-only deny lane they resolve to a single
    # version, so any skip here trips unnecessary-skip/unmatched-skip and
    # breaks the warn-only ratchet. Windows hosts will see the duplicate
    # warnings locally — that is the accepted, host-dependent trade-off.
    { name = "windows-sys" },
]
# For crates where the version is not the discriminator, use skip-tree to
# allow the duplicate tree regardless of version.
skip-tree = [
    { name = "portable-pty" },
    { name = "rust-i18n" },
    { name = "oauth2" },
]

[sources]
# Deny unknown registries and git sources
unknown-registry = "deny"
unknown-git = "deny"
# Allow only crates.io
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Allow git sources used by the project (add as needed)
allow-git = []

[licenses]
# Confidence threshold for license inference from text
confidence-threshold = 0.93
# Allowed licenses (MIT for CodeWhale, plus common transitive deps)
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]
# License exceptions for specific crates if needed
exceptions = []
