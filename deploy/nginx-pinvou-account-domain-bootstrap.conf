# account.pinvou.com certificate bootstrap. Keep only until the dedicated
# certificate is issued, then replace it with nginx-pinvou-account-domain.conf.

server {
    listen 80;
    server_name account.pinvou.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 503;
    }
}
