# pinvou.com 正式 HTTPS 入口。
# OTA/模型文件仍复用 /var/www/pinvou3，Relay/遥测仍反向代理到
# 47.120.8.237:8787；域名迁移不复制文件、不迁移后端数据。
#
# 2026-09-28:本文件现部署在两台机器上——发布源站与 nginx-edge
# (pinvou.com DNS 当前入口,机器地址见私有运维资料)。线上副本已按机器本地化
# (edge 侧证书走 acme.sh/ZeroSSL 的 /etc/nginx/ssl/,443 为 default_server,
# 并挂官网静态路由),细节以各机 /etc/nginx/sites-available/pinvou 为准。
# 本仓库文件即发布源站侧副本,不可直接当 edge 配置使用。
# 注意:下方 include 的 /etc/pinvou3/ 为迁移后目标,源站线上迁移完成前
# 仍为 ~/pinvou3-deploy/ 旧路径,迁移步骤见 docs/应用内升级-设计.md。

server {
    listen 80;
    server_name pinvou.com www.pinvou.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://pinvou.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name pinvou.com www.pinvou.com;

    ssl_certificate     /etc/letsencrypt/live/pinvou.com/fullchain.pem;   # 源站侧证书(edge 走 acme.sh/ZeroSSL,见文件头注)
    ssl_certificate_key /etc/letsencrypt/live/pinvou.com/privkey.pem;     # 源站侧证书私钥
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 32m;
    access_log /var/log/nginx/pinvou.access.log;
    error_log  /var/log/nginx/pinvou.error.log;

    include /etc/nginx/snippets/pinvou-llmapi.conf;
    include /etc/nginx/snippets/pinvou3-remote-relay.conf;
    include /etc/nginx/snippets/pinvou3-telemetry-stats.conf;
    include /etc/pinvou3/nginx-pinvou3-updates.conf;

    # 品牌首页不在本次域名迁移范围；避免落入其他站点的默认 root。
    location / {
        return 404;
    }
}
