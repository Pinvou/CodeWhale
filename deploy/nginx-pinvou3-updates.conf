# pinvou3 更新源 — 静态托管 latest.json + 各平台不可变安装包。
# include 进 pinvou.com 的 HTTPS server block。迁移期旧域名的 server block
# 也继续 include 本文件，保证旧版客户端可以完成升级。
# 前提(发布源站侧): sudo mkdir -p /var/www/pinvou3 && sudo chown admin:admin /var/www/pinvou3
#       （release-deb.sh 以 PINVOU3_RELEASE_SERVER 提供的发布账号 rsync 直传,无需 sudo;
#         edge 侧属主为 pinvou-update,见 docs/应用内升级-设计.md「服务端现状」）
#
# 部署位置(2026-09-28):发布源站的副本在 ~/pinvou3-deploy/;
# nginx-edge(pinvou.com 公网入口,机器地址见私有运维资料)的副本在
# /etc/nginx/snippets/nginx-pinvou3-updates.conf,其副本另含遗留
# /pinvou3-global/stable/ 海外旧通道(ma-xiao 时代产物,latest.json 仍指 www.ma-xiao.com),以线上为准。
# 两机无自动同步,发版须双端落文件:见 docs/应用内升级-设计.md「服务端现状」。
# 放置目标:仓库副本的 server block include /etc/pinvou3/ 本文件;
# 源站从 ~/pinvou3-deploy/ 旧路径迁移的步骤见 docs/应用内升级-设计.md「配置放置与迁移」,
# 迁移完成前线上仍以旧路径为准。

# 清单不缓存:客户端每次检查都要拿最新版本
location = /pinvou3/latest.json {
    alias /var/www/pinvou3/latest.json;
    add_header Cache-Control "no-cache";
}

# 管理发布台的 location 必须定义在同一 server block 中；参考
# update-release-console/deploy/nginx-location.conf。更长的前缀会优先于这里。

# 安装包(文件名带版本号,内容不可变,可放心长缓存)
location /pinvou3/ {
    alias /var/www/pinvou3/;
    autoindex off;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
