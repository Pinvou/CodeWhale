# Temporary HTTP-only entry used to obtain the first certificate for
# llmapi.pinvou.com. Replace it with nginx-pinvou-llmapi-domain.conf after
# successful issuance.
server {
    listen 80;
    server_name llmapi.pinvou.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 503;
    }
}
