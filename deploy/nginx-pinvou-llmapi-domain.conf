# Dedicated HTTPS edge for the production New API console and API endpoint.
server {
    listen 80;
    server_name llmapi.pinvou.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://llmapi.pinvou.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name llmapi.pinvou.com;

    ssl_certificate     /etc/letsencrypt/live/llmapi.pinvou.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/llmapi.pinvou.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 32m;
    access_log /var/log/nginx/pinvou-llmapi.access.log;
    error_log  /var/log/nginx/pinvou-llmapi.error.log;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:18180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Pinvou-Tunnel-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 3s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
