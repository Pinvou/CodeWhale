# Dedicated HTTPS entry for the Pinvou Web Personal Center and the two public
# provider-neutral payment callback endpoints.

server {
    listen 80;
    server_name account.pinvou.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://account.pinvou.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name account.pinvou.com;

    ssl_certificate     /etc/letsencrypt/live/account.pinvou.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/account.pinvou.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 4m;
    access_log /var/log/nginx/pinvou-account.access.log;
    error_log  /var/log/nginx/pinvou-account.error.log;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /api/v1/payment-callback/token {
        client_max_body_size 8k;
        proxy_pass http://127.0.0.1:18102;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    location = /api/v1/payment-callbacks {
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:18102;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    location / {
        proxy_pass http://127.0.0.1:18105;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
    }
}
