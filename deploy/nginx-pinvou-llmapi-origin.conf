# Private origin reached only through the existing account-platform reverse
# tunnel. New API remains bound to loopback on the production host.
server {
    listen 80;
    listen [::]:80;
    server_name llmapi.pinvou.com;

    allow 127.0.0.1;
    allow ::1;
    deny all;

    client_max_body_size 32m;
    access_log /var/log/nginx/pinvou-llmapi-origin.access.log;
    error_log  /var/log/nginx/pinvou-llmapi-origin.error.log;

    location / {
        proxy_pass http://127.0.0.1:18206;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Pinvou-Client-Source "";
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 3s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
