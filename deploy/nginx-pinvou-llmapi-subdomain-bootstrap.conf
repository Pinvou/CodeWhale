# Pre-certificate site for llmapi.pinvou.com. Keep this active until DNS exists
# and the dedicated certificate has been issued.
# Do not enable alongside nginx-pinvou-llmapi-subdomain.conf.
server {
    listen 80;
    server_name llmapi.pinvou.com;

    access_log /var/log/nginx/pinvou-llmapi.access.log;
    error_log  /var/log/nginx/pinvou-llmapi.error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        add_header Retry-After 300 always;
        return 503;
    }
}
