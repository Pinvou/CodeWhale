# Pinvou built-in model API. The local upstream is provided by the restricted
# tunnel service; New API and PostgreSQL remain unreachable from the Internet.
location = /llmapi {
    return 302 /dashboard;
}

location = /llmapi/ {
    return 302 /dashboard;
}

location ^~ /llmapi/ {
    rewrite ^/llmapi/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:13000;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # This Internet-facing proxy is the trust boundary. Discard any
    # client-supplied forwarding chain so backend IP rate limits cannot be poisoned.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    client_max_body_size 32m;
}

# New API v1.0.0-rc.20 does not support a frontend base path. Its embedded
# console uses root-relative assets, API calls, and browser routes. Proxy only
# those console-owned paths so the Pinvou website keeps its existing routes.
location ^~ /static/ {
    proxy_pass http://127.0.0.1:13000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /api/ {
    proxy_pass http://127.0.0.1:13000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    client_max_body_size 32m;
}

location = /logo.png {
    proxy_pass http://127.0.0.1:13000;
}

location = /favicon.ico {
    proxy_pass http://127.0.0.1:13000;
}

location ~ ^/(?:401|403|404|500|503|channels|chat|chat2link|console|dashboard|errors|forgot-password|keys|models|oauth|otp|playground|profile|rankings|redemption-codes|register|reset|setup|sign-in|sign-up|subscriptions|system-info|system-settings|usage-logs|user/reset|users|wallet)(?:/|$) {
    proxy_pass http://127.0.0.1:13000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # New API owns root-relative SPA routes. Force attempts to navigate to `/`
    # back through Nginx so the Pinvou website, rather than the in-memory SPA, wins.
    proxy_set_header Accept-Encoding "";
    sub_filter_once on;
    sub_filter '</head>' '<script>(function(){var h=window.history;["pushState","replaceState"].forEach(function(n){var f=h[n];h[n]=function(s,t,u){if(u&&new URL(u,location.href).pathname==="/"){location.assign(new URL(u,location.href).href);return;}return f.apply(this,arguments);};});addEventListener("popstate",function(){if(location.pathname==="/")location.reload();});})();</script></head>';
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    client_max_body_size 32m;
}
