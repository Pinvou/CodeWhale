# Install this file as /etc/nginx/snippets/pinvou-llmapi.conf.
# The local upstream is provided by the restricted tunnel service; New API and
# PostgreSQL remain unreachable from the Internet.
location = /llmapi {
    return 302 https://llmapi.pinvou.com/$is_args$args;
}

location = /llmapi/ {
    return 302 https://llmapi.pinvou.com/$is_args$args;
}

# Keep only the API routes used by released clients on the legacy origin.
# Regex locations are evaluated in order, so this must precede the catch-all
# redirect below. Both exact endpoints and their subpaths are supported.
location ~ ^/llmapi/(?:api|v1)(?:/|$) {
    rewrite ^/llmapi(/.*)$ $1 break;
    proxy_pass http://127.0.0.1:13000;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # This Internet-facing proxy is the trust boundary. Discard any
    # client-supplied forwarding chain so backend IP rate limits cannot be poisoned.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    client_max_body_size 32m;
}

# Console and other browser routes belong on the dedicated origin. Preserve
# the suffix and query string while removing the obsolete /llmapi prefix.
location ~ ^/llmapi/(.*)$ {
    return 302 https://llmapi.pinvou.com/$1$is_args$args;
}
