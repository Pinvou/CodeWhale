# Formal HTTPS site for llmapi.pinvou.com. Activate only after the dedicated
# certificate exists under /etc/letsencrypt/live/llmapi.pinvou.com/.
# Do not enable alongside nginx-pinvou-llmapi-subdomain-bootstrap.conf.
server {
    listen 80;
    server_name llmapi.pinvou.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://llmapi.pinvou.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name llmapi.pinvou.com;

    ssl_certificate     /etc/letsencrypt/live/llmapi.pinvou.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/llmapi.pinvou.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 32m;
    access_log /var/log/nginx/pinvou-llmapi.access.log;
    error_log  /var/log/nginx/pinvou-llmapi.error.log;

    location / {
        proxy_pass http://127.0.0.1:13000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # This proxy is the public trust boundary. Never accept a caller-supplied chain.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
