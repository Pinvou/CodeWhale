# DEV-02 rollback perimeter. The legacy v2 Relay MUST bind only to 127.0.0.1:8787.
# Every public remote-control route goes through the enrollment-aware gateway.
location = /pinvou3/remote/ws {
    proxy_pass http://127.0.0.1:8790;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    # Overwrite rather than append so a public client cannot inject a trusted
    # X-Forwarded-For chain. The gateway accepts it only from this proxy.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /pinvou3/remote/healthz {
    proxy_pass http://127.0.0.1:8790;
    proxy_set_header Host $host;
}
