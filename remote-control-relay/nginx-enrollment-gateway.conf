# Generated rollback perimeter; never proxy the legacy Relay directly.
# Regenerate/check with scripts/enrollment-nginx-config.js after env overrides.
location = /pinvou3/remote/ws {
    proxy_pass http://127.0.0.1:8790;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    # Explicit transport budget; keepalive does not renew authorization.
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
    proxy_set_header Host $host;
    # Overwrite rather than append the immediate proxy source.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /pinvou3/remote/healthz {
    proxy_pass http://127.0.0.1:8790;
    proxy_set_header Host $host;
}
