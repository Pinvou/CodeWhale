# 安全模板：必须在仓库外配置已确认代理地址，不能直接用于生产。
[Service]
Environment=PINVOU_REMOTE_ALLOWED_PROXY_IPS=REPLACE_WITH_CONFIRMED_PROXY_IP
Environment=PINVOU_REMOTE_TRUSTED_PROXY_IPS=REPLACE_WITH_CONFIRMED_PROXY_IP
Environment=MAX_ROOMS=2000
Environment=ROOM_CREATE_LIMIT=20
Environment=ROOM_CREATE_WINDOW_MS=60000
Environment=MAX_PAYLOAD_BYTES=4194304
Environment=MAX_WS_CONNECTIONS=5000
Environment=WS_CONNECT_LIMIT=120
Environment=WS_CONNECT_WINDOW_MS=60000
Environment=WS_AUTH_TIMEOUT_MS=10000
