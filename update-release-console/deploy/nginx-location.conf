# Add inside the existing pinvou.com HTTPS server block. The console itself
# remains on loopback and requires a bearer admin token for every API request.
location /pinvou3/release-console/ {
    proxy_pass http://127.0.0.1:8792;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;

    # 4 GiB installer limit plus multipart fields/headers and framing overhead.
    client_max_body_size 4224m;
    # Large installers can pause while the browser or endpoint security reads the file.
    # Keep the client-body ingress timeout aligned with the upstream upload timeouts.
    client_body_timeout 1h;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    add_header X-Content-Type-Options nosniff always;
}
