name: pinvou-update-release-console

services:
  console:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PINVOU_UPDATE_ADMIN_TOKEN: ${PINVOU_UPDATE_ADMIN_TOKEN:?set PINVOU_UPDATE_ADMIN_TOKEN}
      PINVOU_UPDATE_HOST: 0.0.0.0
      PINVOU_UPDATE_PORT: 8792
      PINVOU_UPDATE_CONSOLE_BASE_PATH: /pinvou3/release-console
      PINVOU_UPDATE_PUBLIC_ROOT: /srv/pinvou3
      PINVOU_UPDATE_STATE_ROOT: /var/lib/pinvou-update-console
      PINVOU_UPDATE_PUBLIC_BASE_URL: https://pinvou.com/pinvou3
      PINVOU_UPDATE_MAX_UPLOAD_BYTES: 4294967296
      PINVOU_UPDATE_ONLINE_VERIFY_TIMEOUT_MS: 900000
      PINVOU_UPDATE_TRUSTED_PROXIES: 172.16.0.0/12
    ports:
      - "127.0.0.1:8792:8792"
    volumes:
      - /var/www/pinvou3:/srv/pinvou3
      - console-state:/var/lib/pinvou-update-console
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8792/pinvou3/release-console/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  console-state:
