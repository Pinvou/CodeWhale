# cargo-audit configuration (read by `cargo audit`).
#
# The advisories below are all "unmaintained" warnings — NOT security
# vulnerabilities. Three accepted clusters:
#
# 1. The zbus 5 family, which arrived with keyring 4's Secret Service store
#    (secret-service 5 -> zbus 5). The standalone crates are unmaintained —
#    merged into zbus 6 as modules — and there is no safe upgrade until
#    secret-service adopts zbus 6. Tracked identically in deny.toml.
#
# 2. Pulled in transitively only by the `syntect` 5.x family, tracked
#    identically in deny.toml.
#
# 3. Mirrored from deny.toml, which waived them during the 2026-11
#    dependency sweeps: humantime (transitive via cucumber, a tui
#    dev-dependency, no safe upgrade — 2.4.0 is latest) and chrono (direct
#    workspace dependency in nine crates plus oauth2 and rmcp; migrating to
#    jiff/time is a dedicated refactor, not a dep-sweep item). The former
#    starlark cluster (derivative / fxhash / paste) is gone: starlark left
#    the lock with the 2026-08-02 execpolicy removal, so those waivers had
#    nothing left to match.
#
# Entries are accepted so `cargo audit` stays clean for genuinely new
# advisories; none is exploitable here.
[advisories]
ignore = [
    "RUSTSEC-2026-0370", # zvariant unmaintained — via secret-service 5 -> zbus 5; clears with zbus 6
    "RUSTSEC-2026-0371", # zbus_names unmaintained — via secret-service 5 -> zbus 5; clears with zbus 6
    "RUSTSEC-2026-0372", # zvariant_derive unmaintained — via secret-service 5 -> zbus 5; clears with zbus 6
    "RUSTSEC-2025-0141", # bincode unmaintained — transitive via syntect, no safe upgrade
    "RUSTSEC-2024-0320", # yaml-rust unmaintained — transitive via syntect, no safe upgrade
    # humantime unmaintained - transitive via cucumber (dev-only), no safe
    # upgrade (2.4.0 is latest). Mirrors deny.toml.
    "RUSTSEC-2026-0542",
    # chrono unmaintained - direct workspace dependency (nine crates) plus
    # oauth2 and rmcp; migrating to jiff/time is a dedicated refactor, not a
    # dep-sweep item. Waived until that migration lands. Mirrors deny.toml.
    "RUSTSEC-2026-0543",
]
