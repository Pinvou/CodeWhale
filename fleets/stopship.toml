# Fleet roles: stopship
#
# Named stopship fleet binding workflow roles → Fleet roles. Spawns resolve
# roles only — there are no saved members to bind, and Fleet does NOT spawn
# tmux or manage worktrees (Runtime owns those).
#
# Load path (when wired by workflow run --fleet):
#   1. $CODEWHALE_HOME/fleets/stopship.toml
#   2. <workspace>/fleets/stopship.toml  (this file)
#
# Values use the canonical Fleet role vocabulary (scout, builder, reviewer,
# verifier, advisor); keys are the workflow's own step names.

name = "stopship"
description = "Read-only current release orchestration acceptance fleet"

[roles]
# workflow role name = Fleet role (canonical or legacy alias)
explore = "scout"
implement = "builder"
reviewer = "reviewer"
test = "verifier"
release_lead = "advisor"

# Role intents (documentation only — the minimal TOML parser reads just
# `name`, `description`, and `[roles]`; there is no `[role_intents.*]`
# surface). Read-only enforcement lives in the workflow's own per-node
# mode/deny_all_tools, not here:
#   explore:      read-only — source-level runtime and receipt reconnaissance
#   implement:    read-only — no-edit acceptance evidence plan
#   reviewer:     read-only — false-green and receipt-contract review
#   test:         read-only — static test and receipt serialization verification
#   release_lead: read-only — final evidence-only acceptance receipt
