# cargo-deny 配置 —— pinvou3-app/src-tauri
# 用法:先在仓库根运行 `python3 scripts/guard-webpki-roots-exception.py`，
# 成功后再运行 cargo deny。裸 cargo-deny 不执行图守卫，不能替代组合检查。
# Python 3.11+；完整本地命令与变更控制边界见 docs/webpki-roots-exception.md。
# 四类检查:advisories(RUSTSEC 漏洞)、licenses(开源合规)、bans(重复 crate / 禁用 crate)、
# sources(只允许 crates.io + 本地 path 依赖)。

[graph]
# 只检查本 crate 的依赖图(含 path 依赖 CodeWhale)。
all-features = true

[advisories]
version = 2
# CI 里 `cargo deny check advisories` 命中新漏洞就 fail;下面是已评估、暂不能在本仓修复的条目。
# 真漏洞(anyhow RUSTSEC-2026-0190、crossbeam-epoch RUSTSEC-2026-0204)已通过 cargo update
# 修掉(anyhow 1.0.104 / crossbeam-epoch 0.9.20),不再命中。
ignore = [
    # RUSTSEC-2026-0381 now explicitly excludes the 0.26.11 compatibility
    # wrapper. Keep it scanned normally: no ID ignore, including for older
    # 0.26.x packages or affected 1.x root data. The mandatory lock guard
    # remains a separate change-control check for the reviewed wrapper graph.
    # RUSTSEC-2026-0194 (quick-xml quadratic complexity) and
    # RUSTSEC-2026-0195 (NsReader memory exhaustion) no longer match:
    # both advisories are fixed in quick-xml >=0.41.0, and the lockfile
    # resolves 0.41.0 + 0.42.0（0.42 来自本仓直接依赖与 calamine 0.37；
    # 残留的 0.41.0 走 plist 1.10.0 与 wayland-scanner/xcb 的 Linux 构建
    # 链,同样在修复线上）。 Without an ignore entry, a future dependency
    # downgrade below 0.41 would trip the advisory and fail CI again —
    # reassess then.
    #
    # RUSTSEC-2026-0367/0368/0369 (zip 8.x extract-family) RETIRED:
    # calamine 0.37 requires zip ^9, and all three workspaces now pin
    # calamine = "0.37" — the graph converges on a single zip 9.0.5 and no
    # longer contains a vulnerable zip. The reachability note (the
    # graph never calls the wholesale `ZipArchive::extract()` /
    # stream-extract APIs — every direct zip consumer iterates `by_index`
    # with `enclosed_name()` guards) remains true and is the fallback
    # posture: if a future downgrade below zip 9 re-enters the tree, these
    # three advisories trip CI again.
    #
    # RUSTSEC-2026-0387 (crypto-bigint constant-time timing variability,
    # DB 刷新于 2026-10-23——community#761 移植当日,其线上 deny 全绿先于本通告):
    # patched 仅 >= 0.7.6,而本图 crypto-bigint 0.5.5 由 elliptic-curve 0.13 →
    # p256 0.13 / hpke 0.12 钉住,再往上由 age 0.12 锁定;升级到 0.7.x 需要
    # RustCrypto elliptic-curve/p256 全生态大版本迁移,非本仓可单独完成。
    # 影响面:age 0.12 的本地静态数据加密(会话/密钥落盘),不存在能观测
    # EC 运算时序的远程攻击者;timing 侧信道在本威胁模型下不可实际利用。
    # Reassess on any age/elliptic-curve/p256 bump.
    "RUSTSEC-2026-0387",
]
# unmaintained 保留 "workspace":父 crate 依赖图比子模块深
# (子模块 + Tauri GTK3/glib + fastembed),实测 unmaintained="all" 会命中 gtk-rs GTK3、
# glib VariantStrIter(unsound)、number_prefix、proc-macro-error、unic-* 等良性/上游锁定
# 的条目并 fail CI。这些非本仓可修(等 tauri/gtk-rs 升级),"workspace" 仅报 workspace crate,
# 把噪声挡在 CI 之外;真漏洞仍由上面的 ignore 显式管理 + cargo update 修复。
unmaintained = "workspace"
# unsound 是独立的 informational 类别,cargo-deny 0.20 默认同为 "workspace";
# 写明以示有意为之:它(而非上面的 unmaintained 行)屏蔽的是传递依赖里的
# glib 0.18.5 RUSTSEC-2024-0429(VariantStrIter unsound,Dependabot #13/#35),
# 由 wry 0.55.1 → gtk ^0.18 钉住,修复版 glib 0.20 要等 GTK3 hold 解除;
# unsound="all" 探针恰好只命中它。GTK hold 移动时在此重评。
unsound = "workspace"
# Restored to "deny": the supported non-yanked dependency update this block
# waited for has landed — calamine 0.37 with a single zip 9.0.5 in the graph —
# so yanked releases are denied again. Reassess immediately if an advisory
# affects the pinned version.
yanked = "deny"
# 被忽略条目不再命中任何 crate 时直接报错(默认 warn):上面按 id 的 advisory
# 例外(现为 RUSTSEC-2026-0387)都是带重评条件的临时豁免——依赖升级使条目
# 失效的同一提交里 CI 就会变红,摘除协议因此自强制,不依赖注释自觉。
unused-ignored-advisory = "deny"

[licenses]
version = 2
# 允许的许可证白名单(宽松许可)。补充 MIT-0 / BSL-1.0 / NCSA / CDLA-Permissive-2.0:
# 这些是 fastembed/ort/tauri 生态里出现的宽松许可,均允许商用、无 copyleft 传染。
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",       # Boost Software License(tauri 生态)
    "NCSA",          # University of Illinois/NCSA(llvm/MLIR 相关)
    "CDLA-Permissive-2.0", # Community Data License(fastembed/ort 模型元数据)
]
confidence-threshold = 0.8

[bans]
# Tauri + CodeWhale 共享图里天然有上百个多版本(reqwest 0.12/0.13、toml_edit×4 等),
# 逐个去重是长期工程,不该卡 CI,也不应让每次审计输出数十万字的已知重复图。
# 这里关闭重复版本报告;漏洞、许可证、来源和通配依赖仍按各自规则独立审计。
# multiple-versions 对 cargo-deny 实际选中的依赖图生效（默认排除 dev）；下方 bans.deny 支持 version 范围。
multiple-versions = "allow"
# Defense in depth: affected 1.x root data remains forbidden independently
# of the lock-graph guard and the advisory database's version classifications.
deny = [
    { name = "webpki-roots", version = ">=1.0.0, <1.0.10" },
    { name = "webpki-roots", version = ">=0.26.0, <0.26.11" },
    # Round-22 review: 上面 [advisories] 的 RUSTSEC-2026-0387 id 级忽略没有
    # 版本维度——半升级形态(age/p256 升到修复线,而新的第三方依赖把旧
    # elliptic-curve 重新带进图、crypto-bigint 0.5.5 残留)不会触发任何
    # 重评信号。这里独立封禁漏洞窗口(现图 0.5.5 恰在窗口外,bans 全绿);
    # 与 id 忽略同一提交摘除时同步收窄为 "<0.7.6" 或删除本条。
    { name = "crypto-bigint", version = ">0.5.5, <0.7.6" },
]
# wildcards 保留 "warn"(不能升 deny):本仓 3 个 CodeWhale 子模块依赖是
# path = "../../CodeWhale/..." 形式(AGENTS.md §2 禁止给它们加版本约束),
# cargo-deny 把无版本的 path 依赖判为 "wildcard"。升 deny 会把这 3 个**不可改**的
# 子模块依赖直接 fail CI。warn 维持可见性,真正的 `dep = "*"` 版本通配仍会被报出。
wildcards = "warn"
highlight = "all"

[sources]
# 只允许 crates.io + 本地 path 依赖。禁止任何 git/未知 registry。
# 注意:[sources] 不支持 version 键(只有 [advisories]/[licenses] 支持)。
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
