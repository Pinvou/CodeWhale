[package]
name = "pinvou-controller-crypto-harness"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
aes-gcm = { version = "0.10.3", features = ["zeroize"] }
aes = { version = "0.8.4", features = ["zeroize"] }
base64 = "0.22"
hkdf = "0.12.4"
ring = "0.17.14"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
sha2_10 = { package = "sha2", version = "0.10.9" }
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
zeroize = "1.9.0"
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"
rand = "0.10"
async-trait = "0.1"
chrono = "0.4"
tokio = { version = "1.49", features = ["full", "test-util"] }
tokio-util = { version = "0.7.16", features = ["compat", "io"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
