[package]
name = "pinvou-controller-crypto-harness"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
aes-gcm = "0.10.3"
base64 = "0.22"
hkdf = "0.12.4"
ring = "0.17.14"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
sha2_10 = { package = "sha2", version = "0.10.9" }
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
zeroize = "1.9.0"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1.53.1", features = ["sync", "time", "macros", "rt", "test-util"] }
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
