        "207": { description: Independent per-grant success or stable failure results }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://identity.example.invalid/realms/pinvou/.well-known/openid-configuration
    serviceToken:
      type: http
      scheme: bearer
      bearerFormat: workload identity JWT
  responses:
    Error:
      description: Stable error response
      content:
        application/json:
          schema:
            $ref: "common.yaml#/components/schemas/Error"
    RateLimited:
      description: The request exceeds an atomic multidimensional rate or concurrency limit
      headers:
        Retry-After:
          required: true
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema:
            $ref: "common.yaml#/components/schemas/Error"
    UpgradeRequired:
      description: The desktop client sunset has passed for remote write operations
      headers:
        Link: { required: true, schema: { type: string } }
        X-API-Contract-Version: { required: true, schema: { type: string } }
        X-Minimum-Supported-Client-Version: { required: true, schema: { type: string } }
      content:
        application/json:
          schema:
            $ref: "common.yaml#/components/schemas/Error"
  schemas:
    ApprovalSnapshotRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [command_type, target_resource_type, target_resource_id, normalized_command]
          properties:
            command_type: { type: string, const: TOKEN_MODEL_LIFECYCLE_CHANGE }
            target_resource_type: { type: string, const: MODEL }
            target_resource_id: { type: string, format: uuid }
            normalized_command:
              type: object
              additionalProperties: false
              required: [model_id, target_lifecycle, effective_at, existing_session_cutoff_at, replacement_model_id]
              properties:
                model_id: { type: string, format: uuid }
                target_lifecycle: { type: string, enum: [DEPRECATED, REMOVED] }
                effective_at: { type: string, format: date-time }
                existing_session_cutoff_at: { type: [string, "null"], format: date-time }
                replacement_model_id: { type: [string, "null"], format: uuid }
        - type: object
          additionalProperties: false
          required: [command_type, target_resource_type, target_resource_id, normalized_command]
          properties:
            command_type: { type: string, const: TOKEN_MODEL_CATALOG_ROLLBACK }
            target_resource_type: { type: string, const: MODEL_CATALOG }
            target_resource_id: { type: string, pattern: '^[1-9][0-9]{0,18}$' }
            normalized_command:
              type: object
              additionalProperties: false
              required: [source_catalog_version]
              properties:
                source_catalog_version: { type: integer, format: int64, minimum: 1 }
        - type: object
          additionalProperties: false
          required: [command_type, target_resource_type, target_resource_id, normalized_command]
          properties:
            command_type: { type: string, const: TOKEN_CREDENTIAL_REVOKE }
            target_resource_type: { type: string, const: PROVIDER_CREDENTIAL }
            target_resource_id: { type: string, format: uuid }
            normalized_command:
              type: object
              additionalProperties: false
              required: [token_account_id, expected_account_version, credential_id, credential_version]
              properties:
                token_account_id: { type: string, format: uuid }
                expected_account_version: { type: integer, format: int64, minimum: 1 }
                credential_id: { type: string, format: uuid }
                credential_version: { type: integer, minimum: 1 }
    TokenFinancialSnapshot:
      type: object
      additionalProperties: false
      required: [billing_price_revision, price_set_fingerprint, models_checked, models_covered, fully_covered, billing_as_of]
      properties:
        billing_price_revision: { type: integer, format: int64, minimum: 1 }
        price_set_fingerprint: { type: string, pattern: '^[0-9a-f]{64}$' }
        models_checked: { type: integer, minimum: 1 }
        models_covered: { type: integer, minimum: 0 }
        fully_covered: { type: boolean, const: true }
        billing_as_of: { type: string, format: date-time }
    ModelLifecycleCriticalResourceVersions:
      type: object
      additionalProperties: false
      required: [model_id, catalog_version, current_lifecycle, target_lifecycle, lifecycle_plan_version, effective_at, existing_session_cutoff_at, replacement_model_id, billing_price_version, route_set_fingerprint, provisioning_set_fingerprint, inflight_request_set_fingerprint, policy_version]
      properties:
        model_id: { type: string, format: uuid }
        catalog_version: { type: integer, format: int64, minimum: 1 }
        current_lifecycle: { type: string, enum: [PUBLISHED, DEPRECATED] }
        target_lifecycle: { type: string, enum: [DEPRECATED, REMOVED] }
        lifecycle_plan_version: { type: integer, const: 0 }
        effective_at: { type: string, format: date-time }
        existing_session_cutoff_at: { type: [string, "null"], format: date-time }
        replacement_model_id: { type: [string, "null"], format: uuid }
        billing_price_version: { type: integer, format: int64, minimum: 1 }
        route_set_fingerprint: { type: string, pattern: '^[0-9a-f]{64}$' }
        provisioning_set_fingerprint: { type: string, pattern: '^[0-9a-f]{64}$' }
        inflight_request_set_fingerprint: { type: string, pattern: '^[0-9a-f]{64}$' }
        policy_version: { type: integer, const: 2 }
    CatalogRollbackCriticalResourceVersions:
      type: object
      additionalProperties: false
      required: [current_catalog_version, source_catalog_version, catalog_diff_fingerprint, billing_price_version, route_set_fingerprint, provisioning_set_fingerprint, inflight_request_set_fingerprint, policy_version]
      properties:
        current_catalog_version: { type: integer, format: int64, minimum: 1 }
        source_catalog_version: { type: integer, format: int64, minimum: 1 }
        catalog_diff_fingerprint: { type: string, pattern: '^[0-9a-f]{64}$' }
        billing_price_version: { type: integer, format: int64, minimum: 1 }
        route_set_fingerprint: { type: string, pattern: '^[0-9a-f]{64}$' }
        provisioning_set_fingerprint: { type: string, pattern: '^[0-9a-f]{64}$' }
        inflight_request_set_fingerprint: { type: string, pattern: '^[0-9a-f]{64}$' }
        policy_version: { type: integer, const: 2 }
    CredentialRevokeCriticalResourceVersions:
      type: object
      additionalProperties: false
      required: [token_account_id, token_account_version, credential_id, credential_version, credential_status, credential_fingerprint, active_route_set_fingerprint, provisioning_lease_set_fingerprint, inflight_request_set_fingerprint, replacement_credential_version, policy_version]
      properties:
        token_account_id: { type: string, format: uuid }
        token_account_version: { type: integer, format: int64, minimum: 1 }
        credential_id: { type: string, format: uuid }
        credential_version: { type: integer, minimum: 1 }
        credential_status: { type: string, enum: [PENDING, CANDIDATE, ACTIVE, RETIRING, RETIRED, REVOKED] }
        credential_fingerprint: { type: string, pattern: '^[0-9a-f]{64}$' }
        active_route_set_fingerprint: { type: string, pattern: '^[0-9a-f]{64}$' }
        provisioning_lease_set_fingerprint: { type: string, pattern: '^[0-9a-f]{64}$' }
        inflight_request_set_fingerprint: { type: string, pattern: '^[0-9a-f]{64}$' }
        replacement_credential_version: { type: [integer, "null"], minimum: 1 }
        policy_version: { type: integer, const: 1 }
    EmptyFinancialSnapshot:
      type: object
      additionalProperties: false
      maxProperties: 0
    ApprovalSnapshotProjection:
      type: object
      additionalProperties: false
      required: [command_type, target_resource_type, target_resource_id, critical_resource_versions, financial_snapshot, precheck_fingerprint, token_observed_at]
      properties:
        command_type: { type: string, enum: [TOKEN_MODEL_LIFECYCLE_CHANGE, TOKEN_MODEL_CATALOG_ROLLBACK, TOKEN_CREDENTIAL_REVOKE] }
        target_resource_type: { type: string, enum: [MODEL, MODEL_CATALOG, PROVIDER_CREDENTIAL] }
        target_resource_id: { type: string, minLength: 1, maxLength: 160 }
        critical_resource_versions:
          oneOf:
            - { $ref: "#/components/schemas/ModelLifecycleCriticalResourceVersions" }
            - { $ref: "#/components/schemas/CatalogRollbackCriticalResourceVersions" }
            - { $ref: "#/components/schemas/CredentialRevokeCriticalResourceVersions" }
        financial_snapshot:
          oneOf:
            - { $ref: "#/components/schemas/TokenFinancialSnapshot" }
            - { $ref: "#/components/schemas/EmptyFinancialSnapshot" }
        precheck_fingerprint: { type: string, pattern: '^[0-9a-f]{64}$' }
        token_observed_at: { type: string, format: date-time }
        billing_observed_at: { type: string, format: date-time }
      allOf:
        - if: { properties: { command_type: { const: TOKEN_MODEL_LIFECYCLE_CHANGE } }, required: [command_type] }
          then:
            properties:
              target_resource_type: { const: MODEL }
              target_resource_id: { type: string, format: uuid }
              critical_resource_versions: { $ref: "#/components/schemas/ModelLifecycleCriticalResourceVersions" }
              financial_snapshot: { $ref: "#/components/schemas/TokenFinancialSnapshot" }
              billing_observed_at: { type: string, format: date-time }
            required: [billing_observed_at]
        - if: { properties: { command_type: { const: TOKEN_MODEL_CATALOG_ROLLBACK } }, required: [command_type] }
          then:
            properties:
              target_resource_type: { const: MODEL_CATALOG }
              target_resource_id: { type: string, pattern: '^[1-9][0-9]{0,18}$' }
              critical_resource_versions: { $ref: "#/components/schemas/CatalogRollbackCriticalResourceVersions" }
              financial_snapshot: { $ref: "#/components/schemas/TokenFinancialSnapshot" }
              billing_observed_at: { type: string, format: date-time }
            required: [billing_observed_at]
        - if: { properties: { command_type: { const: TOKEN_CREDENTIAL_REVOKE } }, required: [command_type] }
          then:
            properties:
              target_resource_type: { const: PROVIDER_CREDENTIAL }
              target_resource_id: { type: string, format: uuid }
              critical_resource_versions: { $ref: "#/components/schemas/CredentialRevokeCriticalResourceVersions" }
              financial_snapshot: { $ref: "#/components/schemas/EmptyFinancialSnapshot" }
              billing_observed_at: false
    GovernedTokenCommandEnvelope:
      type: object
      additionalProperties: false
      required: [command_type, reason, target_resource_type, target_resource_id, expected_versions, precheck_fingerprint, command]
      properties:
        command_type: { type: string, enum: [TOKEN_MODEL_LIFECYCLE_CHANGE, TOKEN_MODEL_CATALOG_ROLLBACK, TOKEN_CREDENTIAL_REVOKE] }
        reason: { type: string, minLength: 10, maxLength: 2000 }
        target_resource_type: { type: string, minLength: 1, maxLength: 80 }
        target_resource_id: { type: string, minLength: 1, maxLength: 160 }
        expected_versions: { type: object, additionalProperties: true }
        precheck_fingerprint: { type: string, pattern: '^[0-9a-f]{64}$' }
        command: { type: object, additionalProperties: true, description: Account-frozen normalized command without secrets or provider internals. }
      allOf:
        - if: { properties: { command_type: { const: TOKEN_CREDENTIAL_REVOKE } }, required: [command_type] }
          then:
            properties:
              target_resource_type: { const: PROVIDER_CREDENTIAL }
              target_resource_id: { type: string, format: uuid }
              expected_versions: { $ref: "#/components/schemas/CredentialRevokeCriticalResourceVersions" }
              command:
                type: object
                additionalProperties: false
                required: [token_account_id, expected_account_version, credential_id, credential_version]
                properties:
                  token_account_id: { type: string, format: uuid }
                  expected_account_version: { type: integer, format: int64, minimum: 1 }
                  credential_id: { type: string, format: uuid }
                  credential_version: { type: integer, minimum: 1 }
    ApprovedTokenCommandExecution:
      type: object
      additionalProperties: false
      description: Executor identity is taken only from the authenticated workload context; it is never accepted in this body. Account issues the stable execution key and retries must reuse it unchanged.
      required: [approval_request_id, requester_user_id, authorization_version, command_fingerprint, execution_idempotency_key, command]
      properties:
        approval_request_id: { type: string, format: uuid }
        requester_user_id: { type: string, format: uuid }
        authorization_version: { type: integer, format: int64, minimum: 1 }
        command_fingerprint: { type: string, pattern: '^[0-9a-f]{64}$' }
        execution_idempotency_key: { type: string, minLength: 16, maxLength: 512, description: Account-issued stable execution key; every domain adapter must persist and replay this exact key. }
        critical_resource_versions: { type: object }
        financial_snapshot: { type: object }
        command: { $ref: "#/components/schemas/GovernedTokenCommandEnvelope" }
      allOf:
        - if:
            properties:
              command:
                properties: { command_type: { const: TOKEN_CREDENTIAL_REVOKE } }
                required: [command_type]
            required: [command]
          then:
            required: [critical_resource_versions, financial_snapshot]
            properties:
              critical_resource_versions: { $ref: "#/components/schemas/CredentialRevokeCriticalResourceVersions" }
              financial_snapshot: { $ref: "#/components/schemas/EmptyFinancialSnapshot" }
    GovernedTokenCommandResult:
      type: object
      additionalProperties: false
      required: [command_reference, command_type, policy_version, actor_user_id, actor_permission, authorization_version, idempotency_fingerprint, target_resource_type, target_resource_id, status, approval_request_id, audit_request_id, created_at]
