        wallet_id: { type: string, format: uuid }
        pinvou_order_id: { type: string, format: uuid }
        source_payment_transaction_id: { type: string, format: uuid }
        provider_order_reference: { type: string, description: Supplier-neutral external order correlation reference. }
        source_type: { type: string, enum: [PAYMENT, MANUAL_ADJUSTMENT, SYSTEM] }
        source_reference: { type: string, minLength: 1 }
        plan_id: { type: string }
        plan_name: { type: string }
        sku_code: { type: string }
        amount_fen: { type: integer, format: int64, minimum: 0 }
        points_total_microcredits: { type: integer, format: int64, minimum: 1 }
        points_reserved_microcredits: { type: integer, format: int64, minimum: 0 }
        points_used_microcredits: { type: integer, format: int64, minimum: 0 }
        points_remaining_microcredits: { type: integer, format: int64, minimum: 0 }
        points_expired_microcredits: { type: integer, format: int64, minimum: 0 }
        points_revoked_microcredits: { type: integer, format: int64, minimum: 0 }
        credited_at: { type: string, format: date-time }
        valid_from: { type: string, format: date-time }
        valid_until: { type: string, format: date-time }
        status: { type: string, enum: [ACTIVE, CONSUMED, EXPIRED, CREDIT_FAILED, REPAIRED, FROZEN] }
        components:
          type: array
          items: { $ref: "#/components/schemas/EntitlementComponent" }
    EntitlementComponent:
      type: object
      additionalProperties: false
      required: [component_id, component_type, original_microcredits, available_microcredits, reserved_microcredits, used_microcredits, active_grant_microcredits, suspended_grant_microcredits, expired_microcredits, revoked_microcredits, credited_at, expires_at, status]
      properties:
        component_id: { type: string, format: uuid }
        component_type: { type: string, enum: [BASE, BONUS] }
        original_microcredits: { type: integer, format: int64, minimum: 1 }
        available_microcredits: { type: integer, format: int64, minimum: 0 }
        reserved_microcredits: { type: integer, format: int64, minimum: 0 }
        used_microcredits: { type: integer, format: int64, minimum: 0 }
        active_grant_microcredits: { type: integer, format: int64, minimum: 0 }
        suspended_grant_microcredits: { type: integer, format: int64, minimum: 0 }
        expired_microcredits: { type: integer, format: int64, minimum: 0 }
        revoked_microcredits: { type: integer, format: int64, minimum: 0 }
        credited_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        status: { type: string, enum: [ACTIVE, CONSUMED, EXPIRED, REVOKED, FROZEN] }
    GatewayProtocolCapabilities:
      type: object
      additionalProperties: false
      required: [adapter_version, protocols]
      properties:
        adapter_version:
          type: string
          minLength: 1
        protocols:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [protocol_code, protocol_version, path, streaming]
            properties:
              protocol_code: { type: string, enum: [CHAT, EMBEDDING, RERANK, IMAGE, OTHER] }
              protocol_version: { type: integer, format: int64, minimum: 1 }
              path: { type: string, pattern: '^/' }
              streaming: { type: boolean }
    UsageRequestStatus:
      type: object
      additionalProperties: false
      required: [usage_request_id, status, execution_status, delivery_status, cancel_status, settlement_status, display_status, model, maximum_microcredits, last_persisted_sequence, last_client_confirmed_sequence, started_at, updated_at]
      properties:
        usage_request_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [CREATED, RESERVED, UPSTREAM_ACTIVE, SETTLEMENT_PENDING, COMMITTED, RELEASED, REVIEW]
        execution_status:
          type: string
          enum: [RECEIVED, HOLD_RESERVING, HOLD_RESERVED, DISPATCH_INTENT_PERSISTED, UPSTREAM_DISPATCHING, STREAMING, SETTLEMENT_PENDING, SUCCEEDED, FAILED, CANCELLED_BEFORE_DISPATCH, REVIEW]
        delivery_status:
          type: string
          enum: [NOT_STARTED, DELIVERING, DISCONNECTED, DELIVERED, USER_STOPPED]
        cancel_status:
          type: string
          enum: [NOT_REQUESTED, CANCEL_REQUESTED, LOCAL_CONFIRMED, PROVIDER_SENT, PROVIDER_CONFIRMED, PROVIDER_REJECTED, UNSUPPORTED, RESULT_UNKNOWN, ALREADY_TERMINAL]
        settlement_status:
          type: string
          enum: [HOLD_PENDING, HOLD_ACTIVE, USAGE_PENDING, SETTLED, RELEASED, REVIEW]
        display_status:
          type: string
          enum: [IN_PROGRESS, SETTLED, SETTLEMENT_PENDING, RELEASED, MANUAL_REVIEW, DISPLAY_STOPPED_EXECUTION_CONTINUES, CANCELLED_BEFORE_DISPATCH]
        model:
          type: string
        maximum_microcredits:
          type: integer
          format: int64
          minimum: 1
        actual_microcredits:
          type: [integer, "null"]
          format: int64
          minimum: 0
        cancel_requested_at: { type: [string, "null"], format: date-time }
        provider_terminal_at: { type: [string, "null"], format: date-time }
        final_usage_observed_at: { type: [string, "null"], format: date-time }
        last_persisted_sequence: { type: integer, format: int64, minimum: 0 }
        last_client_confirmed_sequence: { type: integer, format: int64, minimum: 0 }
        started_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CancellationStatus:
      type: object
      additionalProperties: false
      required: [usage_request_id, execution_status, cancel_status, delivery_status, settlement_status]
      properties:
        usage_request_id: { type: string, format: uuid }
        execution_status: { type: string }
        cancel_status: { type: string }
        delivery_status: { type: string }
        settlement_status: { type: string }
        cancel_requested_at: { type: [string, "null"], format: date-time }
        provider_terminal_at: { type: [string, "null"], format: date-time }
        final_usage_observed_at: { type: [string, "null"], format: date-time }
    UsageReplayStatus:
      type: object
      additionalProperties: false
      required: [code, usage_request_id, execution_status, status_url]
      properties:
        code: { type: string }
        usage_request_id: { type: string, format: uuid }
        execution_status:
          type: string
          enum: [RECEIVED, HOLD_RESERVING, HOLD_RESERVED, DISPATCH_INTENT_PERSISTED, UPSTREAM_DISPATCHING, STREAMING, SETTLEMENT_PENDING, REVIEW]
        status_url: { type: string }
    UserUsageRecord:
      type: object
      additionalProperties: false
      required: [usage_request_id, model, display_status, execution_status, delivery_status, cancel_status, settlement_status, actual_microcredits, input_tokens, output_tokens, cached_input_tokens, started_at, completed_at, updated_at]
      properties:
        usage_request_id:
          type: string
          format: uuid
        model:
          type: string
        display_status:
          type: string
          enum: [IN_PROGRESS, SETTLED, SETTLEMENT_PENDING, RELEASED, MANUAL_REVIEW, DISPLAY_STOPPED_EXECUTION_CONTINUES, CANCELLED_BEFORE_DISPATCH]
        execution_status: { type: string }
        delivery_status: { type: string }
        cancel_status: { type: string }
        settlement_status: { type: string }
        actual_microcredits:
          type: [integer, "null"]
          format: int64
          minimum: 0
        input_tokens:
          type: [integer, "null"]
          format: int64
          minimum: 0
        output_tokens:
          type: [integer, "null"]
          format: int64
          minimum: 0
        cached_input_tokens:
          type: [integer, "null"]
          format: int64
          minimum: 0
        started_at:
          type: string
          format: date-time
        completed_at:
          type: [string, "null"]
          format: date-time
        updated_at:
          type: string
          format: date-time
