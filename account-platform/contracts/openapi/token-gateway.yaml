openapi: 3.1.0
info:
  title: Pinvou Token Gateway API
  version: 0.1.0
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /v1
security:
  - oidc: []
paths:
  /payment-capabilities:
    get:
      operationId: getPaymentCapabilities
      summary: Discover the selected Payment Provider behavior for the active context
      responses:
        "200":
          description: Provider-neutral, versioned capability declaration
          content:
            application/json:
              schema:
                $ref: "billing.yaml#/components/schemas/PaymentCapabilities"
        "401":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /token-accounts:
    get:
      operationId: listManagedTokenAccounts
      summary: List Token accounts managed in the active personal or organization context
      responses:
        "200":
          description: Managed Token accounts
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/TokenAccount"
        "403":
          $ref: "#/components/responses/Error"
    post:
      operationId: createTokenAccount
      summary: Create a personal or organization Token account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [owner_type, owner_id, name, share_scope]
              properties:
                owner_type:
                  type: string
                  enum: [USER, ORG, ORG_UNIT]
                owner_id:
                  type: string
                  format: uuid
                owner_organization_id:
                  type: [string, "null"]
                  format: uuid
                owner_unit_id:
                  type: [string, "null"]
                  format: uuid
                name:
                  type: string
                  minLength: 1
                  maxLength: 120
                share_scope:
                  type: string
                  enum: [OWNER_UNIT_ONLY, OWNER_SUBTREE, ORG_ALL, EXPLICIT_MEMBERS]
                default_priority:
                  type: integer
                  minimum: 0
                  maximum: 10000
      responses:
        "201":
          description: Token account created
        "403":
          $ref: "#/components/responses/Error"
  /token-accounts/{token_account_id}/credentials:
    get:
      operationId: listProviderCredentials
      summary: List credential metadata without secret material
      parameters:
        - name: token_account_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Credential metadata newest first
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProviderCredential"
        "403":
          $ref: "#/components/responses/Error"
    post:
      operationId: rotateProviderCredential
      summary: Validate and atomically activate a new provider credential
      parameters:
        - name: token_account_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [provider, base_url, secret, allowed_models]
              properties:
                provider:
                  type: string
                base_url:
                  type: string
                  format: uri
                secret:
                  type: string
                  minLength: 8
                  writeOnly: true
                allowed_models:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items:
                    type: string
      responses:
        "201":
          description: Credential validated and activated
        "422":
          $ref: "#/components/responses/Error"
  /token-accounts/{token_account_id}/status:
    patch:
      operationId: setTokenAccountStatus
      summary: Disable or reactivate an owned Token account with an audit reason
      parameters:
        - $ref: "#/components/parameters/TokenAccountId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status, reason]
              properties:
                status:
                  type: string
                  enum: [ACTIVE, DISABLED]
                reason:
                  type: string
                  minLength: 1
      responses:
        "200":
          description: Updated Token account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenAccount"
        "403":
          $ref: "#/components/responses/Error"
  /token-accounts/{token_account_id}/sharing:
    put:
      operationId: replaceTokenSharingPolicy
      summary: Atomically replace the sharing scope and explicit-member set
      parameters:
        - $ref: "#/components/parameters/TokenAccountId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [share_scope, explicit_user_ids]
              properties:
                share_scope:
                  $ref: "#/components/schemas/ShareScope"
                explicit_user_ids:
                  type: array
                  uniqueItems: true
                  items:
                    type: string
                    format: uuid
      responses:
        "200":
          description: Updated sharing policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenAccount"
        "403":
          $ref: "#/components/responses/Error"
  /token-accounts/{token_account_id}/routes:
    put:
      operationId: upsertTokenRoute
      summary: Configure deterministic routing for one allowed model
      parameters:
        - $ref: "#/components/parameters/TokenAccountId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoutePolicy"
      responses:
        "200":
          description: Updated route policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutePolicy"
        "404":
          $ref: "#/components/responses/Error"
  /token-accounts/{token_account_id}/credentials/{credential_id}/revoke:
    post:
      operationId: revokeProviderCredential
      summary: Irreversibly revoke an active or retired provider credential
      parameters:
        - $ref: "#/components/parameters/TokenAccountId"
        - name: credential_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 1
      responses:
        "200":
          description: Revoked credential metadata; secret material is never returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderCredential"
        "404":
          $ref: "#/components/responses/Error"
  /token-accounts/eligible:
    get:
      operationId: listEligibleTokenAccounts
      summary: List Token accounts authorized for the active context
      parameters:
        - name: model
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Eligible Token accounts
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/EligibleTokenAccount"
        "403":
          $ref: "#/components/responses/Error"
  /usage-requests/{usage_request_id}:
    get:
      operationId: getUsageRequestStatus
      summary: Read settlement state for a usage request in the same session and active context
      parameters:
        - name: usage_request_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Context-bound usage and settlement status
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageRequestStatus"
        "404":
          $ref: "#/components/responses/Error"
  /me/usage-requests:
    get:
      operationId: listMyUsageRequests
      summary: List the current user's model usage in the active personal or organization context
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          description: Opaque cursor returned by the previous page.
          schema:
            type: string
            minLength: 1
            maxLength: 256
      responses:
        "200":
          description: User-facing usage history without routing or credential identifiers
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/UserUsageRecord"
                  next_cursor:
                    type: [string, "null"]
        "403":
          $ref: "#/components/responses/Error"
  /chat/completions:
    post:
      operationId: createChatCompletion
      summary: Authorize, reserve, proxy once, and settle an OpenAI-compatible model request
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Optional client key. When omitted, the gateway derives a stable key from the authenticated user, OIDC session, and request body.
          schema:
            type: string
            minLength: 16
            maxLength: 128
        - name: X-Pinvou-Token-Account-ID
          in: header
          required: false
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, messages]
              properties:
                model:
                  type: string
                messages:
                  type: array
                  items: {}
                stream:
                  type: boolean
                max_completion_tokens:
                  type: integer
                  minimum: 1
              additionalProperties: true
      responses:
        "200":
          description: OpenAI-compatible JSON or SSE response
          headers:
            X-Pinvou-Usage-Request-ID:
              required: true
              schema:
                type: string
                format: uuid
        "402":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /recharge/products:
    get:
      operationId: listRechargeProducts
      summary: Proxy the Billing recharge catalog
      responses:
        "200":
          description: Billing recharge catalog
        "401":
          $ref: "#/components/responses/Error"
  /recharge/orders:
    get:
      operationId: listMyRechargeOrders
      summary: List recharge orders for the current personal wallet
      responses:
        "200":
          description: Personal recharge order history
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "billing.yaml#/components/schemas/RechargeOrderList"
        "401":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
    post:
      operationId: createRechargeOrder
      summary: Create a recharge order for the current permitted wallet
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 16
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [product_id, channel]
              properties:
                product_id:
                  type: string
                  enum: [PLAN_TRIAL, PLAN_STANDARD, PLAN_ADVANCED, PLAN_FLAGSHIP]
                channel:
                  type: string
                  pattern: '^[A-Z0-9_]{1,32}$'
      responses:
        "201":
          description: Recharge order created by Billing Service
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
        "409":
          description: The payment requires a Commerce Customer mapping that is not READY
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /recharge/orders/recent:
    get:
      operationId: getRecentRechargeOrder
      summary: Restore the newest recharge order in the active wallet context
      responses:
        "200":
          description: The newest active-context order, or null when none exists
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "billing.yaml#/components/schemas/RecentRechargeOrder"
        "401":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /recharge/orders/{order_id}:
    get:
      operationId: getRechargeOrder
      summary: Read only a recharge order owned by the current user
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Recharge order
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
        "404":
          $ref: "#/components/responses/Error"
  /recharge/orders/{order_id}/close:
    post:
      operationId: closeRechargeOrder
      summary: Close only a pending recharge order owned by the current user
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Closed recharge order
        "404":
          $ref: "#/components/responses/Error"
  /me/balance:
    get:
      operationId: getMyBalance
      summary: Read the active context wallet directly from Billing
      parameters:
        - name: consistency
          in: query
          schema:
            type: string
            const: strong
      responses:
        "200":
          description: Strongly consistent active-context balance
        "401":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /me/entitlement-packages:
    get:
      operationId: listMyEntitlementPackages
      summary: List entitlement packages for the active personal or authorized organization wallet
      responses:
        "200":
          description: Active-context entitlement packages
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [summary, items]
                properties:
                  summary:
                    $ref: "#/components/schemas/EntitlementPackageSummary"
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/EntitlementPackage"
        "401":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /organizations/{organization_id}/recharge/orders:
    post:
      operationId: createOrganizationRechargeOrder
      summary: Purchase benefits for an explicit active organization when the caller has org.entitlements.purchase
      parameters:
        - { name: organization_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 16, maxLength: 128 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [product_id, channel]
              properties:
                product_id: { type: string, minLength: 1 }
                channel: { type: string, pattern: '^[A-Z0-9_]{1,32}$' }
      responses:
        "201": { description: Order records the paying user and beneficiary organization }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /organizations/{organization_id}/quota-grants:
    get:
      operationId: listOrganizationQuotaGrants
      summary: List the caller grant or all member grants according to organization quota permissions
      parameters:
        - { name: organization_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: member_user_id, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Component-bound member grants
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/MemberQuotaGrant" } }
        "403": { $ref: "#/components/responses/Error" }
  /organizations/{organization_id}/quota-grants:batch:
    post:
      operationId: allocateOrganizationQuotaBatch
      summary: Allocate exact package components using independent per-item transactions and stable derived idempotency keys
      parameters:
        - { name: organization_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 16, maxLength: 128 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items: { $ref: "#/components/schemas/MemberQuotaAllocation" }
      responses:
        "207": { description: "Per-item success, replay, or stable failure result" }
        "403": { $ref: "#/components/responses/Error" }
  /organizations/{organization_id}/quota-grants/{grant_id}/revoke:
    post:
      operationId: revokeOrganizationQuotaGrant
      summary: Revoke the unconsumed and unheld remainder back to its original component
      parameters:
        - { name: organization_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: grant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 16, maxLength: 128 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "200": { description: Grant revoked without changing consumed or held amounts }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://identity.example.invalid/realms/pinvou/.well-known/openid-configuration
  responses:
    Error:
      description: Stable error response
      content:
        application/json:
          schema:
            $ref: "common.yaml#/components/schemas/Error"
  parameters:
    TokenAccountId:
      name: token_account_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    MemberQuotaAllocation:
      type: object
      additionalProperties: false
      required: [member_user_id, package_id, component_id, component_type, amount_microcredits, membership_version]
      properties:
        member_user_id: { type: string, format: uuid }
        package_id: { type: string, format: uuid }
        component_id: { type: string, format: uuid }
        component_type: { type: string, enum: [BASE, BONUS] }
        amount_microcredits: { type: integer, format: int64, minimum: 1 }
        membership_version: { type: integer, format: int64, minimum: 1 }
    MemberQuotaGrant:
      type: object
      additionalProperties: false
      required: [grant_id, organization_id, member_user_id, package_id, component_id, component_type, original_microcredits, available_microcredits, reserved_microcredits, used_microcredits, expired_microcredits, revoked_microcredits, status, membership_version, allocation_version, created_by, expires_at, created_at, updated_at]
      properties:
        grant_id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        member_user_id: { type: string, format: uuid }
        package_id: { type: string, format: uuid }
        component_id: { type: string, format: uuid }
        component_type: { type: string, enum: [BASE, BONUS] }
        original_microcredits: { type: integer, format: int64, minimum: 1 }
        available_microcredits: { type: integer, format: int64, minimum: 0 }
        reserved_microcredits: { type: integer, format: int64, minimum: 0 }
        used_microcredits: { type: integer, format: int64, minimum: 0 }
        expired_microcredits: { type: integer, format: int64, minimum: 0 }
        revoked_microcredits: { type: integer, format: int64, minimum: 0 }
        status: { type: string, enum: [ACTIVE, SUSPENDED, REVOKED, EXPIRED, RECLAIMED_ACCOUNT_CLOSED] }
        suspension_reason: { type: [string, "null"], enum: [MEMBER_REMOVED, ACCOUNT_CLOSED, null] }
        membership_version: { type: integer, format: int64, minimum: 1 }
        allocation_version: { type: integer, format: int64, minimum: 1 }
        created_by: { type: string, format: uuid }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    EntitlementPackageSummary:
      type: object
      additionalProperties: false
      required: [available_microcredits, base_available_microcredits, bonus_available_microcredits, reserved_microcredits, used_microcredits, active_package_count, next_expiry_microcredits]
      properties:
        available_microcredits: { type: integer, format: int64, minimum: 0 }
        base_available_microcredits: { type: integer, format: int64, minimum: 0 }
        bonus_available_microcredits: { type: integer, format: int64, minimum: 0 }
        reserved_microcredits: { type: integer, format: int64, minimum: 0 }
        used_microcredits: { type: integer, format: int64, minimum: 0 }
        active_package_count: { type: integer, minimum: 0 }
        next_expiry_at: { type: string, format: date-time }
        next_expiry_microcredits: { type: integer, format: int64, minimum: 0 }
    EntitlementPackage:
      type: object
      additionalProperties: false
      required: [package_id, provider_order_reference, source_type, source_reference, plan_id, plan_name, sku_code, amount_fen, points_total_microcredits, points_reserved_microcredits, points_used_microcredits, points_remaining_microcredits, points_expired_microcredits, points_revoked_microcredits, credited_at, valid_from, valid_until, status, components]
      properties:
        package_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        wallet_id: { type: string, format: uuid }
        pinvou_order_id: { type: string, format: uuid }
        source_payment_transaction_id: { type: string, format: uuid }
        provider_order_reference: { type: string, description: Supplier-neutral external order correlation reference. }
        source_type: { type: string, enum: [PAYMENT, MANUAL_ADJUSTMENT, SYSTEM] }
        source_reference: { type: string, minLength: 1 }
        plan_id: { type: string }
        plan_name: { type: string }
        sku_code: { type: string }
        amount_fen: { type: integer, format: int64, minimum: 0 }
        points_total_microcredits: { type: integer, format: int64, minimum: 1 }
        points_reserved_microcredits: { type: integer, format: int64, minimum: 0 }
        points_used_microcredits: { type: integer, format: int64, minimum: 0 }
        points_remaining_microcredits: { type: integer, format: int64, minimum: 0 }
        points_expired_microcredits: { type: integer, format: int64, minimum: 0 }
        points_revoked_microcredits: { type: integer, format: int64, minimum: 0 }
        credited_at: { type: string, format: date-time }
        valid_from: { type: string, format: date-time }
        valid_until: { type: string, format: date-time }
        status: { type: string, enum: [ACTIVE, CONSUMED, EXPIRED, CREDIT_FAILED, REPAIRED, FROZEN] }
        components:
          type: array
          items: { $ref: "#/components/schemas/EntitlementComponent" }
    EntitlementComponent:
      type: object
      additionalProperties: false
      required: [component_id, component_type, original_microcredits, available_microcredits, reserved_microcredits, used_microcredits, active_grant_microcredits, suspended_grant_microcredits, expired_microcredits, revoked_microcredits, credited_at, expires_at, status]
      properties:
        component_id: { type: string, format: uuid }
        component_type: { type: string, enum: [BASE, BONUS] }
        original_microcredits: { type: integer, format: int64, minimum: 1 }
        available_microcredits: { type: integer, format: int64, minimum: 0 }
        reserved_microcredits: { type: integer, format: int64, minimum: 0 }
        used_microcredits: { type: integer, format: int64, minimum: 0 }
        active_grant_microcredits: { type: integer, format: int64, minimum: 0 }
        suspended_grant_microcredits: { type: integer, format: int64, minimum: 0 }
        expired_microcredits: { type: integer, format: int64, minimum: 0 }
        revoked_microcredits: { type: integer, format: int64, minimum: 0 }
        credited_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        status: { type: string, enum: [ACTIVE, CONSUMED, EXPIRED, REVOKED, FROZEN] }
    ShareScope:
      type: string
