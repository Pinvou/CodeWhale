openapi: 3.1.0
info:
  title: Pinvou Token Gateway API
  version: 0.1.0
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /v1
security:
  - oidc: []
paths:
  /internal/v1/approval-command-prechecks:
    post:
      servers: [{ url: / }]
      security: [{ serviceToken: [] }]
      operationId: precheckTokenApprovalCommandInternal
      summary: Recompute the authoritative Token and Billing snapshots for Account approval CAS
      description: Read-only and fail-closed. This contract does not activate or execute Token governance commands.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApprovalSnapshotRequest" }
      responses:
        "200": { description: Authoritative frozen snapshot, content: { application/json: { schema: { $ref: "#/components/schemas/ApprovalSnapshotProjection" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /internal/v1/commands/model-lifecycle/execute:
    post:
      servers: [{ url: / }]
      security: [{ serviceToken: [] }]
      operationId: executeApprovedModelLifecycleInternal
      summary: Execute one Account-authorized lifecycle command as token-command-executor
      description: The route is installed but returns TOKEN_COMMAND_GOVERNANCE_INACTIVE until APT-138 activation; it is never exposed through Portal or ingress.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ApprovedTokenCommandExecution" } } } }
      responses:
        "200": { description: Existing or completed redacted result, content: { application/json: { schema: { $ref: "#/components/schemas/GovernedTokenCommandResult" } } } }
        "202": { description: Outcome unknown; query the same command reference, content: { application/json: { schema: { $ref: "#/components/schemas/GovernedTokenCommandResult" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /internal/v1/commands/catalog-rollback/execute:
    post:
      servers: [{ url: / }]
      security: [{ serviceToken: [] }]
      operationId: executeApprovedCatalogRollbackInternal
      summary: Execute one Account-authorized catalog rollback as token-command-executor
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ApprovedTokenCommandExecution" } } } }
      responses:
        "200": { description: Existing or completed redacted result, content: { application/json: { schema: { $ref: "#/components/schemas/GovernedTokenCommandResult" } } } }
        "202": { description: Outcome unknown, content: { application/json: { schema: { $ref: "#/components/schemas/GovernedTokenCommandResult" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /internal/v1/commands/credential-revoke/execute:
    post:
      servers: [{ url: / }]
      security: [{ serviceToken: [] }]
      operationId: executeApprovedCredentialRevokeInternal
      summary: Execute one Account-authorized credential revoke as token-command-executor
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ApprovedTokenCommandExecution" } } } }
      responses:
        "200": { description: Existing or completed redacted result, content: { application/json: { schema: { $ref: "#/components/schemas/GovernedTokenCommandResult" } } } }
        "202": { description: Outcome unknown, content: { application/json: { schema: { $ref: "#/components/schemas/GovernedTokenCommandResult" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /client-compatibility:
    get:
      security: []
      operationId: getClientCompatibility
      summary: Publish updater-safe compatibility and attestation verification metadata
      responses:
        "200":
          description: Current environment and supported desktop client range without internal probe credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientCompatibility"
        "400": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /models:
    get:
      operationId: listCatalogModels
      summary: List the immutable current catalog independently from context eligibility and balance
      description: Requires personal.models.read in a personal context or org.models.read for the active organization.
      responses:
        "200":
          description: Current CATALOG_VISIBLE models and monotonic catalog version
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [catalog_version, context_version, authorization_version, items]
                properties:
                  catalog_version: { type: integer, format: int64, minimum: 0 }
                  context_version: { type: integer, format: int64, minimum: 1 }
                  authorization_version: { type: integer, format: int64, minimum: 1 }
                  items: { type: array, items: { $ref: "#/components/schemas/CatalogModel" } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /organizations/{organization_id}/model-policy:
    parameters:
      - name: organization_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getOrganizationModelPolicy
      summary: Read only the business model policy for an explicit organization
      responses:
        "200": { description: Organization model policy, content: { application/json: { schema: { $ref: "#/components/schemas/OrganizationModelPolicy" } } } }
        "403": { $ref: "#/components/responses/Error" }
    put:
      operationId: updateOrganizationModelPolicy
      summary: CAS-update an organization business policy without accepting routing or credential fields
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 16, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_version, mode, model_ids, reason]
              properties:
                expected_version: { type: integer, format: int64, minimum: 0 }
                mode: { type: string, enum: [ALLOW_ALL, ALLOW_LIST, DENY_LIST] }
                model_ids: { type: array, uniqueItems: true, items: { type: string, format: uuid } }
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "200": { description: Updated organization model policy, content: { application/json: { schema: { $ref: "#/components/schemas/OrganizationModelPolicy" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /payment-capabilities:
    get:
      operationId: getPaymentCapabilities
      summary: Discover the selected Payment Provider behavior for the active context
      responses:
        "200":
          description: Provider-neutral, versioned capability declaration
          content:
            application/json:
              schema:
                $ref: "billing.yaml#/components/schemas/PaymentCapabilities"
        "401":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /usage-requests/{usage_request_id}:
    get:
      operationId: getUsageRequestStatus
      summary: Read settlement state for a usage request in the same session and active context
      description: Requires personal.usage.read in a personal context or org.usage.read.self for the active organization.
      parameters:
        - name: usage_request_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Context-bound usage and settlement status
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageRequestStatus"
        "404":
          $ref: "#/components/responses/Error"
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /usage-requests/{usage_request_id}/cancel:
    post:
      operationId: cancelUsageRequest
      summary: Idempotently stop client delivery and request cancellation for the original stable user
      description: Requires personal.usage.cancel and binds ownership to the stable user independently of the current session or active organization. Before a dispatch intent this releases the whole Hold and prevents provider dispatch. After a dispatch intent, unsupported adapters keep provider execution and trusted-usage settlement running in the background.
      parameters:
        - name: usage_request_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 16, maxLength: 128 }
      responses:
        "200":
          description: Durable cancellation state; intent is not proof of provider cancellation
          content: { application/json: { schema: { $ref: "#/components/schemas/CancellationStatus" } } }
        "202":
          description: Cancellation is durable while Hold or provider evidence is converging
          content: { application/json: { schema: { $ref: "#/components/schemas/CancellationStatus" } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /me/usage-requests:
    get:
      operationId: listMyUsageRequests
      summary: List the current user's model usage in the active personal or organization context
      description: Requires personal.usage.read in a personal context or org.usage.read.self for the active organization.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          description: Opaque cursor returned by the previous page.
          schema:
            type: string
            minLength: 1
            maxLength: 256
      responses:
        "200":
          description: User-facing usage history without routing or credential identifiers
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/UserUsageRecord"
                  next_cursor:
                    type: [string, "null"]
        "403":
          $ref: "#/components/responses/Error"
        "503": { $ref: "#/components/responses/Error" }
  /model-protocols:
    get:
      operationId: listModelGatewayProtocols
      summary: List protocols explicitly supported by the active Model Gateway Adapter
      description: Requires personal.models.read in a personal context or org.models.read for the active organization.
      responses:
        "200":
          description: Provider-neutral protocol capabilities; undeclared protocols must not be inferred
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayProtocolCapabilities"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /chat/completions:
    post:
      operationId: createChatCompletion
      summary: Idempotently execute or replay an encrypted, durable model request
      description: Requires personal.model.invoke in a personal context or org.model.invoke for the active organization before all catalog, route, wallet, Hold, rate, and upstream checks.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Unique logical-request key in the authenticated stable user's fixed model-inference namespace. The raw value is never persisted.
          schema:
            type: string
            minLength: 16
            maxLength: 128
        - name: Last-Event-ID
          in: header
          required: false
          description: Last confirmed normalized stream sequence. Replays begin strictly after this value.
          schema:
            type: integer
            format: int64
            minimum: 0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, messages]
              properties:
                model:
                  type: string
                messages:
                  type: array
                  items: {}
                stream:
                  type: boolean
                max_completion_tokens:
                  type: integer
                  minimum: 1
              additionalProperties: true
      responses:
        "200":
          description: Newly executed or replayed JSON/SSE response. SSE events carry a monotonic id and normalized event type.
          headers:
            X-Pinvou-Usage-Request-ID:
              required: true
              schema:
                type: string
                format: uuid
        "202":
          description: Existing execution is still running, awaiting settlement, or under review; no second upstream request was created.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageReplayStatus"
        "402":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "410":
          $ref: "#/components/responses/Error"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
        "429":
          $ref: "#/components/responses/RateLimited"
        "403":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /recharge/products:
    get:
      operationId: listRechargeProducts
      summary: Proxy the Billing recharge catalog
      responses:
        "200":
          description: Billing recharge catalog
        "401":
          $ref: "#/components/responses/Error"
  /recharge/orders:
    get:
      operationId: listMyRechargeOrders
      summary: List recharge orders for the current personal wallet
      responses:
        "200":
          description: Personal recharge order history
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "billing.yaml#/components/schemas/RechargeOrderList"
        "401":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
    post:
      operationId: createRechargeOrder
      summary: Create a recharge order for the current permitted wallet
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 16
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [product_id, channel]
              properties:
                product_id:
                  type: string
                  enum: [PLAN_TRIAL, PLAN_STANDARD, PLAN_ADVANCED, PLAN_FLAGSHIP]
                channel:
                  type: string
                  pattern: '^[A-Z0-9_]{1,32}$'
      responses:
        "201":
          description: Recharge order created by Billing Service
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
        "409":
          description: The payment requires a Commerce Customer mapping that is not READY
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
        "429":
          $ref: "#/components/responses/RateLimited"
  /recharge/orders/recent:
    get:
      operationId: getRecentRechargeOrder
      summary: Restore the newest recharge order in the active wallet context
      responses:
        "200":
          description: The newest active-context order, or null when none exists
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "billing.yaml#/components/schemas/RecentRechargeOrder"
        "401":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /recharge/orders/{order_id}:
    get:
      operationId: getRechargeOrder
      summary: Read only a recharge order owned by the current user
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Recharge order
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
        "404":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
  /recharge/orders/{order_id}/close:
    post:
      operationId: closeRechargeOrder
      summary: Close only a pending recharge order owned by the current user
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Closed recharge order
        "404":
          $ref: "#/components/responses/Error"
  /recharge/orders/{order_id}/payment-claims:
    post:
      operationId: addLatePaymentClaim
      summary: Add user-supplied evidence to an existing late-payment review without changing payment facts
      parameters:
        - name: order_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [statement]
              properties:
                statement: { type: string, minLength: 10, maxLength: 1000 }
      responses:
        "201": { description: Immutable payment claim accepted and review awakened }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /me/balance:
    get:
      operationId: getMyBalance
      summary: Read the personal wallet with personal.billing.read
      parameters:
        - name: consistency
          in: query
          schema:
            type: string
            const: strong
      responses:
        "200":
          description: Strongly consistent personal balance
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /me/entitlement-packages:
    get:
      operationId: listMyEntitlementPackages
      summary: List personal entitlement packages with personal.billing.read
      responses:
        "200":
          description: Personal entitlement packages
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [summary, items]
                properties:
                  summary:
                    $ref: "#/components/schemas/EntitlementPackageSummary"
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/EntitlementPackage"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /organizations/{organization_id}/balance:
    get:
      operationId: getOrganizationBalance
      summary: Read an explicit organization wallet with org.wallet.read without switching active context
      parameters:
        - { name: organization_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Strongly consistent organization balance }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /organizations/{organization_id}/entitlement-packages:
    get:
      operationId: listOrganizationEntitlementPackages
      summary: List explicit organization entitlements with org.wallet.read without switching active context
      parameters:
        - { name: organization_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Organization entitlement packages }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /organizations/{organization_id}/recharge/orders:
    post:
      operationId: createOrganizationRechargeOrder
      summary: Purchase for an explicit organization with org.entitlements.purchase without switching active context
      parameters:
        - { name: organization_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 16, maxLength: 128 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [product_id, channel]
              properties:
                product_id: { type: string, minLength: 1 }
                channel: { type: string, pattern: '^[A-Z0-9_]{1,32}$' }
      responses:
        "201": { description: Order records the paying user and beneficiary organization }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /organizations/{organization_id}/recharge/orders/{order_id}:
    get:
      operationId: getOrganizationRechargeOrder
      summary: Read a caller-owned recharge order only when its beneficiary and wallet match the explicit organization
      parameters:
        - { name: organization_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: order_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Organization recharge order
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Error" }
  /organizations/{organization_id}/quota-grants:
    get:
      operationId: listOrganizationQuotaGrants
      summary: List the caller grant or all member grants according to organization quota permissions
      parameters:
        - { name: organization_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: member_user_id, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Component-bound member grants
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/MemberQuotaGrant" } }
        "403": { $ref: "#/components/responses/Error" }
  /organizations/{organization_id}/quota-grants:batch:
    post:
      operationId: allocateOrganizationQuotaBatch
      summary: Allocate exact package components using independent per-item transactions and stable derived idempotency keys
      parameters:
        - { name: organization_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 16, maxLength: 128 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items: { $ref: "#/components/schemas/MemberQuotaAllocation" }
      responses:
        "207": { description: "Per-item success, replay, or stable failure result" }
        "403": { $ref: "#/components/responses/Error" }
  /organizations/{organization_id}/quota-grants/{grant_id}/revoke:
    post:
      operationId: revokeOrganizationQuotaGrant
      summary: Revoke the unconsumed and unheld remainder back to its original component
      parameters:
        - { name: organization_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: grant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 16, maxLength: 128 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "200": { description: Grant revoked without changing consumed or held amounts }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /organizations/{organization_id}/account-closed-grants/{grant_id}/reclaim:
    post:
      operationId: reclaimAccountClosedGrant
      summary: Reclaim the entire eligible remainder of an irreversibly account-closed grant to its original component
      parameters:
        - { name: organization_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: grant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 16, maxLength: 128 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "200": { description: Full eligible remainder returned to the same package and BASE/BONUS component }
        "400": { $ref: "#/components/responses/Error" }
