openapi: 3.1.0
info:
  title: Pinvou Identity Adapter API
  version: 0.1.0
  description: Password-bearing registration and recovery boundary. Account and SMS APIs accept only the returned opaque reference.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /v1
security: []
paths:
  /realms/pinvou/protocol/openid-connect/token:
    post:
      servers:
        - url: /
      operationId: exchangeOidcTokenWithRiskAdmission
      summary: Exchange password, SMS, or refresh credentials behind multidimensional risk admission
      parameters:
        - name: X-Device-ID
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: true
              required: [grant_type, client_id]
              properties:
                grant_type: { type: string, enum: [password, refresh_token] }
                client_id: { type: string }
                username: { type: string }
                password: { type: string, writeOnly: true }
                refresh_token: { type: string, writeOnly: true }
                sms_challenge_id: { type: string, format: uuid }
                sms_code: { type: string, writeOnly: true }
      responses:
        "200":
          description: Standard no-store OIDC token response
        "400":
          description: Unsupported or malformed grant
        "401":
          description: Stable invalid_grant response independent of account existence
        "429":
          description: Multidimensional risk limit reached
          headers:
            Retry-After: { required: true, schema: { type: integer, minimum: 1 } }
        "503":
          description: Risk admission or identity provider unavailable; authentication fails closed
  /registration/password-prechecks:
    post:
      operationId: precheckRegistrationPassword
      summary: Validate an exact registration or replacement password and create a short-lived opaque reference
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
                  writeOnly: true
      responses:
        "201":
          description: Password accepted
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [password_handle, password_policy_version, expires_at]
                properties:
                  password_handle: { type: string, minLength: 43, maxLength: 43 }
                  password_policy_version: { type: string, const: user-v1 }
                  expires_at: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/Error" }
components:
  responses:
    Error:
      description: Stable identity error
      content:
        application/json:
          schema:
            type: object
            required: [code, message, request_id]
            properties:
              code: { type: string }
              message: { type: string }
              request_id: { type: string }
