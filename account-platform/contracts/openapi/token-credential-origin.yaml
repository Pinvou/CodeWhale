{
  "openapi": "3.1.0",
  "info": {
    "title": "Isolated credential origin",
    "version": "F04",
    "description": "Separate origin. Launch is one-use and actor/browser bound; state, nonce, PKCE and recent authenticated identity are required. All responses set no-store, no-referrer and frame isolation headers. Secret is submitted only to this origin and is never part of management result JSON."
  },
  "paths": {
    "/assets/credential-auth.js": {
      "get": {
        "operationId": "authenticationScript",
        "x-go-handler": "authenticationScript",
        "responses": {
          "200": {
            "description": "Owned static CSS or JavaScript; no credential payload.",
            "content": {
              "text/javascript": {
                "schema": {
                  "type": "string"
                }
              }
            }
          },
          "default": {
            "description": "Static error or isolated HTML response; no secret projection."
          }
        },
        "security": []
      }
    },
    "/assets/credential-submit.js": {
      "get": {
        "operationId": "credentialSubmitScript",
        "x-go-handler": "credentialSubmitScript",
        "responses": {
          "200": {
            "description": "Owned static CSS or JavaScript; no credential payload.",
            "content": {
              "text/javascript": {
                "schema": {
                  "type": "string"
                }
              }
            }
          },
          "default": {
            "description": "Static error or isolated HTML response; no secret projection."
          }
        },
        "security": []
      }
    },
    "/assets/credential.css": {
      "get": {
        "operationId": "stylesheet",
        "x-go-handler": "stylesheet",
        "responses": {
          "200": {
            "description": "Owned static CSS or JavaScript; no credential payload.",
            "content": {
              "text/css": {
                "schema": {
                  "type": "string"
                }
              }
            }
          },
          "default": {
            "description": "Static error or isolated HTML response; no secret projection."
          }
        },
        "security": []
      }
    },
    "/oidc/callback": {
      "get": {
        "operationId": "callback",
        "x-go-handler": "callback",
        "responses": {
          "200": {
            "description": "Isolated authentication completion HTML; verified issuer, subject, nonce, state, PKCE and session authority."
          },
          "default": {
            "description": "Static error or isolated HTML response; no secret projection."
          }
        },
        "security": [
          {
            "CredentialSession": [],
            "CredentialBinding": []
          }
        ],
        "parameters": [
          {
            "name": "state",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "code",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ]
      }
    },
    "/session": {
      "get": {
        "operationId": "session",
        "x-go-handler": "session",
        "responses": {
          "200": {
            "description": "Isolated authentication, credential input or completion HTML; live actor/browser-bound session only."
          },
          "default": {
            "description": "Static error or isolated HTML response; no secret projection."
          }
        },
        "security": [
          {
            "CredentialSession": [],
            "CredentialBinding": []
          }
        ]
      }
    },
    "/credentials": {
      "post": {
        "operationId": "submitCredential",
        "x-go-handler": "submitCredential",
        "responses": {
          "303": {
            "description": "Credential validated and persisted under live session authority; redirects to /session. A failed validation is not success."
          },
          "default": {
            "description": "Static error or isolated HTML response; no secret projection."
          }
        },
        "security": [
          {
            "CredentialSession": [],
            "CredentialBinding": []
          }
        ],
        "parameters": [
          {
            "name": "Origin",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string"
            },
            "description": "Exact configured isolated credential origin."
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/x-www-form-urlencoded": {
              "schema": {
                "$ref": "#/components/schemas/CredentialSubmit"
              }
            }
          }
        }
      }
    },
    "/launch": {
      "post": {
        "operationId": "launch",
        "x-go-handler": "launch",
        "responses": {
          "303": {
            "description": "One-use launch consumed; sets HttpOnly session and browser-binding cookies and redirects to /session."
          },
          "default": {
            "description": "Static error or isolated HTML response; no secret projection."
          }
        },
        "security": [],
        "parameters": [
          {
            "name": "Origin",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string"
            },
            "description": "Exact configured Portal origin, validated before consuming a launch."
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/x-www-form-urlencoded": {
              "schema": {
                "$ref": "#/components/schemas/LaunchForm"
              }
            }
          }
        }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "CredentialSession": {
        "type": "apiKey",
        "in": "cookie",
        "name": "__Host-pinvou-credential-session"
      },
      "CredentialBinding": {
        "type": "apiKey",
        "in": "cookie",
        "name": "__Host-pinvou-credential-binding"
      }
    },
    "schemas": {
      "LaunchForm": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "launch_id"
        ],
        "properties": {
          "launch_id": {
            "type": "string",
            "format": "uuid"
          }
        }
      },
      "CredentialSubmit": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "csrf",
          "provider",
          "base_url",
          "allowed_models",
          "secret"
        ],
        "properties": {
          "csrf": {
            "type": "string",
            "writeOnly": true
          },
          "provider": {
            "type": "string"
          },
          "base_url": {
            "type": "string",
            "format": "uri"
          },
          "allowed_models": {
            "type": "string",
            "description": "Comma-separated model IDs, validated by the current provider/model policy."
          },
          "secret": {
            "type": "string",
            "writeOnly": true,
            "description": "Never returned, logged or forwarded through the Portal."
          }
        }
      }
    }
  }
}
