            additionalProperties: true
            required: [package_id, source_payment_transaction_id, status, points_remaining_microcredits, components]
            properties:
              package_id: { type: string, format: uuid }
              source_payment_transaction_id: { type: string, format: uuid }
              status: { type: string, enum: [ACTIVE, CONSUMED, EXPIRED, CREDIT_FAILED, REPAIRED, FROZEN, REVOKED] }
              points_remaining_microcredits: { type: integer, format: int64, minimum: 0 }
              components:
                type: array
                items:
                  type: object
                  additionalProperties: true
                  required: [component_id, component_type, available_microcredits, reserved_microcredits, used_microcredits, active_grant_microcredits, suspended_grant_microcredits, expired_microcredits, revoked_microcredits, status]
                  properties:
                    component_id: { type: string, format: uuid }
                    component_type: { type: string, enum: [BASE, BONUS] }
                    available_microcredits: { type: integer, format: int64, minimum: 0 }
                    reserved_microcredits: { type: integer, format: int64, minimum: 0 }
                    used_microcredits: { type: integer, format: int64, minimum: 0 }
                    active_grant_microcredits: { type: integer, format: int64, minimum: 0 }
                    suspended_grant_microcredits: { type: integer, format: int64, minimum: 0 }
                    expired_microcredits: { type: integer, format: int64, minimum: 0 }
                    revoked_microcredits: { type: integer, format: int64, minimum: 0 }
                    status: { type: string }
        evidence: { type: array, items: { $ref: "#/components/schemas/PaymentEvidence" } }
    AdjustmentRequestCreate:
      type: object
      additionalProperties: false
      required: [wallet_id, amount_microcredits, reason, idempotency_key]
      properties:
        wallet_id: { type: string, format: uuid }
        amount_microcredits: { type: integer, format: int64, not: { const: 0 } }
        reason: { type: string, minLength: 10, maxLength: 2000 }
        idempotency_key: { type: string, minLength: 8, maxLength: 120 }
    ReconciliationCreate:
      type: object
      additionalProperties: false
      required: [channel, business_date]
      properties:
        channel: { type: string, pattern: '^[A-Z0-9_]{1,32}$' }
        business_date: { type: string, format: date }
    PaymentAnomalyCase:
      type: object
      additionalProperties: false
      required: [case_id, anomaly_type, severity, status, financial_action_status, resource_snapshot, claim_due_at, first_response_due_at, mitigation_due_at, resolution_due_at, version, created_at, updated_at]
      properties:
        case_id: { type: string, format: uuid }
        anomaly_type: { type: string, enum: [CHARGEBACK, FORCED_REFUND, DUPLICATE_PAYMENT, LATE_PAYMENT_CONFLICT, REFUND_FAILURE, PAYMENT_FACT_CONFLICT, ILLEGAL_TRANSITION] }
        severity: { type: string, enum: [P0, P1, P2] }
        status: { type: string, enum: [OPEN, RESOLVED] }
        owner_id: { type: string, format: uuid }
        payment_order_id: { type: string, format: uuid }
        payment_transaction_id: { type: string, format: uuid }
        payment_evidence_id: { type: string, format: uuid }
        refund_id: { type: string, format: uuid }
        forced_refund_case_id: { type: string, format: uuid }
        chargeback_case_id: { type: string, format: uuid }
        resolution_code: { type: string }
        resolution_reason: { type: string }
        financial_action_status: { type: string, enum: [NONE, PENDING, APPLIED, FAILED] }
        resource_snapshot: { type: object, additionalProperties: true }
        claimed_at: { type: string, format: date-time }
        claim_due_at: { type: string, format: date-time }
        first_response_due_at: { type: string, format: date-time }
        mitigation_due_at: { type: string, format: date-time }
        resolution_due_at: { type: string, format: date-time }
        version: { type: integer, format: int64, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time }
    PaymentAnomalyDetail:
      type: object
      additionalProperties: false
      required: [case, events]
      properties:
        case: { $ref: "#/components/schemas/PaymentAnomalyCase" }
        events:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [event_id, event_type, details, created_at]
            properties:
              event_id: { type: string, format: uuid }
              event_type: { type: string }
              actor_id: { type: string, format: uuid }
              details: { type: object, additionalProperties: true }
              created_at: { type: string, format: date-time }
    PaymentAnomalyResolution:
      type: object
      additionalProperties: false
      required: [resolution, reason]
      properties:
        resolution: { type: string, enum: [CONFIRM_CHARGEBACK, CONFIRM_FORCED_REFUND, CONFIRM_PAYMENT, CONFIRM_PROVIDER_FAILED, DISMISS, ESCALATE_FINANCIAL_REPAIR] }
        reason: { type: string, minLength: 10, maxLength: 2000 }
    ReconciliationCase:
      type: object
      additionalProperties: false
      required: [case_id, reconciliation_run_id, merchant_order_no, case_type, status, severity, provider_snapshot, internal_snapshot, created_at, updated_at, version]
      properties:
        case_id: { type: string, format: uuid }
        reconciliation_run_id: { type: string, format: uuid }
        payment_order_id: { type: string, format: uuid }
        merchant_order_no: { type: string }
        case_type: { type: string }
        status: { type: string, enum: [OPEN, IN_REVIEW, RESOLVED, IGNORED] }
        severity: { type: string, enum: [P0, P1, P2] }
        owner_id: { type: string, format: uuid }
        repair_action: { type: string }
        review_result: { type: string }
        provider_snapshot: { type: object, additionalProperties: true }
        internal_snapshot: { type: object, additionalProperties: true }
        refund_snapshot: { type: object, additionalProperties: true }
        ledger_snapshot: { type: object, additionalProperties: true }
        resolution: { type: string }
        created_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version: { type: integer, format: int64, minimum: 1 }
    ReconciliationCaseCommand:
      type: object
      additionalProperties: false
      required: [action, reason]
      properties:
        action: { type: string, enum: [CLAIM, ASSIGN, SET_REPAIR_ACTION, RESOLVE, IGNORE, REOPEN] }
        owner_id: { type: string, format: uuid }
        repair_action: { type: string, maxLength: 500 }
        review_result: { type: string, maxLength: 2000 }
        reason: { type: string, minLength: 10, maxLength: 2000 }
    LatePaymentReviewCase:
      type: object
      additionalProperties: false
      required: [case_id, payment_order_id, review_status, severity, provider_id, provider_version, merchant_order_no, provider_capability_snapshot, policy_snapshot, evidence_summary, claim_due_at, first_response_due_at, mitigation_due_at, resolution_due_at, escalation_level, next_review_at, created_at, updated_at]
      properties:
        case_id: { type: string, format: uuid }
        payment_order_id: { type: string, format: uuid }
        review_status: { type: string, enum: [REVIEW_REQUIRED_LATE_PAYMENT, PROVIDER_BLIND, ARCHIVED_CONFIRMED_UNPAID, RESOLVED_PAID] }
        severity: { type: string, enum: [P0, P1, P2] }
        owner_id: { type: string, format: uuid }
        provider_id: { type: string }
        provider_version: { type: string }
        merchant_order_no: { type: string }
        provider_capability_snapshot: { type: object, additionalProperties: true }
        policy_snapshot: { type: object, additionalProperties: true }
        evidence_summary: { type: object, additionalProperties: true }
        claimed_at: { type: string, format: date-time }
        first_response_at: { type: string, format: date-time }
        claim_due_at: { type: string, format: date-time }
        first_response_due_at: { type: string, format: date-time }
        mitigation_due_at: { type: string, format: date-time }
        resolution_due_at: { type: string, format: date-time }
        escalation_level: { type: integer, minimum: 0 }
        last_escalated_at: { type: string, format: date-time }
        last_query_at: { type: string, format: date-time }
        last_query_result: { type: string }
        next_review_at: { type: string, format: date-time }
        blind_reason: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time }
    LatePaymentReviewDetail:
      type: object
      additionalProperties: false
      required: [case, events, evidence]
      properties:
        case: { $ref: "#/components/schemas/LatePaymentReviewCase" }
        events:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [event_id, event_type, details, created_at]
            properties:
              event_id: { type: string, format: uuid }
              event_type: { type: string }
              actor_id: { type: string, format: uuid }
              details: { type: object, additionalProperties: true }
              created_at: { type: string, format: date-time }
        evidence:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [evidence_id, evidence_type, payload_digest, payload_snapshot, created_at]
            properties:
              evidence_id: { type: string, format: uuid }
              evidence_type: { type: string, enum: [BOUNDARY_QUERY, MANUAL_QUERY, USER_PAYMENT_CLAIM, ARCHIVE_QUERY, PROVIDER_BLIND] }
              payment_evidence_id: { type: string, format: uuid }
              actor_id: { type: string, format: uuid }
              payload_digest: { type: string, pattern: '^[0-9a-f]{64}$' }
              payload_snapshot: { type: object, additionalProperties: true }
              created_at: { type: string, format: date-time }
    LatePaymentReviewSchedule:
      type: object
      additionalProperties: false
      required: [next_review_at, reason]
      properties:
        next_review_at: { type: string, format: date-time }
        reason: { type: string, minLength: 10, maxLength: 500 }
    ReconciliationImport:
      type: object
      additionalProperties: false
      required: [channel, business_date, items]
      properties:
        channel: { type: string, pattern: '^[A-Z0-9_]{1,32}$' }
        business_date: { type: string, format: date }
        items:
          type: array
          maxItems: 100000
          items:
            type: object
            additionalProperties: false
            required: [merchant_order_no, channel_transaction_id, amount_fen, currency, status, paid_at]
            properties:
              entry_type: { type: string, enum: [PAYMENT, REFUND, CHARGEBACK] }
              provider_reference_id: { type: string }
              merchant_order_no: { type: string, minLength: 1 }
              channel_transaction_id: { type: string, minLength: 1 }
              amount_fen: { type: integer, format: int64, minimum: 1 }
              currency: { type: string, minLength: 3, maxLength: 3 }
              status: { type: string, minLength: 1 }
              paid_at: { type: string, format: date-time }
  responses:
    SystemStatus:
      description: Aggregated internal operational status without internal endpoint addresses
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
            required: [checked_at, services, relays, reconciliation, recent_errors]
            properties:
              checked_at: { type: string, format: date-time }
              services: { type: array, items: { type: object, additionalProperties: true } }
              relays: { type: array, items: { type: object, additionalProperties: true } }
              reconciliation: { type: object, additionalProperties: true }
              recent_errors: { type: array, items: { type: object, additionalProperties: true } }
    AccountOverview:
      description: Permission-filtered account and organization counters
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              users: { type: integer, format: int64, minimum: 0 }
              active_users: { type: integer, format: int64, minimum: 0 }
              disabled_users: { type: integer, format: int64, minimum: 0 }
              organizations: { type: integer, format: int64, minimum: 0 }
              active_memberships: { type: integer, format: int64, minimum: 0 }
              pending_invitations: { type: integer, format: int64, minimum: 0 }
    BillingOverview:
      description: Wallet, balance, payment, adjustment, and hold counters
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [wallets, posted_microcredits, reserved_microcredits, receivable_microcredits, pending_payment_orders, expired_payment_orders, review_payment_orders, pending_adjustments, active_or_review_usage_holds, payment_capabilities]
            properties:
              wallets: { type: integer, format: int64, minimum: 0 }
              posted_microcredits: { type: integer, format: int64 }
              reserved_microcredits: { type: integer, format: int64, minimum: 0 }
              receivable_microcredits: { type: integer, format: int64, minimum: 0 }
              pending_payment_orders: { type: integer, format: int64, minimum: 0 }
              expired_payment_orders: { type: integer, format: int64, minimum: 0 }
              review_payment_orders: { type: integer, format: int64, minimum: 0 }
              pending_adjustments: { type: integer, format: int64, minimum: 0 }
              active_or_review_usage_holds: { type: integer, format: int64, minimum: 0 }
              payment_capabilities: { type: object, additionalProperties: true }
    FinanceAccountsOverview:
      description: Atomic account-finance overview with fixed metrics and no time window
      content:
        application/json:
          schema: { $ref: "#/components/schemas/FinanceAccountsOverview" }
    FinancePaymentsOverview:
      description: Atomic payment overview with a bounded UTC half-open window
      content:
        application/json:
          schema: { $ref: "#/components/schemas/FinancePaymentsOverview" }
    FinancePricingOverview:
      description: Atomic point-in-time pricing and metering overview
      content:
        application/json:
          schema: { $ref: "#/components/schemas/FinancePricingOverview" }
    FinanceProductsOverview:
      description: Atomic point-in-time product lifecycle and admission overview
      content:
        application/json:
          schema: { $ref: "#/components/schemas/FinanceProductsOverview" }
    FinanceOverviewUnavailable:
      description: The complete overview query failed; no partial metric set is returned
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [code, message]
            properties:
              code: { type: string, const: FINANCE_OVERVIEW_UNAVAILABLE }
              message: { type: string }
              request_id: { type: string }
    TokenOverview:
      description: Permission-filtered Token route and usage counters
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              token_accounts: { type: integer, format: int64, minimum: 0 }
              active_accounts: { type: integer, format: int64, minimum: 0 }
              active_credentials: { type: integer, format: int64, minimum: 0 }
              routes: { type: integer, format: int64, minimum: 0 }
              healthy_routes: { type: integer, format: int64, minimum: 0 }
              usage_requests: { type: integer, format: int64, minimum: 0 }
              review_usage_requests: { type: integer, format: int64, minimum: 0 }
              reconciliation_pending: { type: integer, format: int64, minimum: 0 }
              reconciliation_stopped: { type: integer, format: int64, minimum: 0 }
    Overview:
      description: Generic service detail or command result
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    Collection:
      description: A bounded collection ordered by recent activity
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [items]
            properties:
              items:
                type: array
                maxItems: 200
                items:
                  type: object
                  additionalProperties: true
    TokenAdminFormulaCollection:
      description: Stable formula snapshot page with a closed projection.
      content: { application/json: { schema: { $ref: "#/components/schemas/TokenAdminFormulaPage" } } }
    TokenAdminReconciliationCollection:
      description: Stable reconciliation snapshot page with a closed projection.
      content: { application/json: { schema: { $ref: "#/components/schemas/TokenAdminReconciliationPage" } } }
    TokenAdminOwnerCandidateCollection:
      description: Stable owner-candidate snapshot page; limit and items are capped at 50 and each item has exactly four fields.
      content: { application/json: { schema: { $ref: "#/components/schemas/TokenAdminOwnerCandidatePage" } } }
    TokenAdminResourceAuditCollection:
      description: Stable redacted resource-audit snapshot page.
      content: { application/json: { schema: { $ref: "#/components/schemas/TokenAdminResourceAuditPage" } } }
    TokenAdminUsageEvidenceCollection:
      description: Stable sanitized evidence snapshot page.
      content: { application/json: { schema: { $ref: "#/components/schemas/TokenAdminUsageEvidencePage" } } }
    TokenAdminAccountCollection:
      description: Gate-compatible Token Account collection; both legacy and snapshot items use the same closed projection.
      content:
        application/json:
          schema:
            oneOf:
              - { type: object, additionalProperties: false, required: [items], properties: { items: { type: array, maxItems: 200, items: { $ref: "#/components/schemas/TokenAdminAccountSummary" } } } }
              - { $ref: "#/components/schemas/TokenAdminAccountPage" }
    TokenAdminProvisioningCollection:
      description: Gate-compatible provisioning collection with closed items.
      content:
        application/json:
          schema:
            oneOf:
              - { type: object, additionalProperties: false, required: [items], properties: { items: { type: array, maxItems: 200, items: { $ref: "#/components/schemas/RouteProvisioning" } } } }
              - { $ref: "#/components/schemas/TokenAdminProvisioningPage" }
    TokenAdminUsageCollection:
      description: Gate-compatible usage collection; gate-off preserves the historical full AdminUsageRequest while gate-on returns the minimal redacted list DTO.
      content:
        application/json:
          schema:
            oneOf:
              - { type: object, additionalProperties: false, required: [items], properties: { items: { type: array, maxItems: 200, items: { $ref: "#/components/schemas/AdminUsageRequest" } } } }
              - { $ref: "#/components/schemas/TokenAdminUsagePage" }
    TokenAdminProtocolCollection:
      description: Gate-compatible protocol response with the existing aggregate while disabled and a stable protocol snapshot page while enabled.
      content:
        application/json:
          schema:
            oneOf:
              - { $ref: "#/components/schemas/TokenAdminProtocolAggregate" }
              - { $ref: "#/components/schemas/TokenAdminProtocolPage" }
    TokenAdminModelCollection:
      description: "Gate-compatible model response: legacy catalog while disabled, stable snapshot page while enabled."
      content:
        application/json:
          schema:
            oneOf:
              - { $ref: "#/components/schemas/AdminModelCatalog" }
              - { $ref: "#/components/schemas/TokenAdminModelPage" }
    TokenAdminQueryLimited:
      description: The query or snapshot-creation budget was exhausted.
      headers:
        Retry-After: { required: true, schema: { type: integer, minimum: 1, maximum: 60 } }
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [code, message, request_id]
            properties:
              code:
                allOf:
                  - { $ref: "token-gateway.yaml#/components/schemas/AdminPaginationErrorCode" }
                  - { type: string, enum: [RATE_LIMITED, PAGINATION_SNAPSHOT_LIMITED] }
              message: { type: string }
              request_id: { type: string }
    SnapshotCollection:
      description: A subject-, resource-, scope-, and filter-bound stable snapshot page. Resource state is read live while membership and order remain frozen for 15 minutes.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [items, next_cursor, snapshot_as_of]
            properties:
              items:
                type: array
                maxItems: 200
                items:
                  type: object
                  additionalProperties: true
              next_cursor: { type: string }
              snapshot_as_of: { type: string, format: date-time }
    PaginationSnapshotLimited:
      description: Snapshot creation is rate- or capacity-limited. Retry after the declared number of seconds.
      headers:
        Retry-After:
          required: true
          description: Minimum number of seconds before creating another snapshot.
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema:
            type: object
            required: [code, message]
            properties:
              code: { type: string, enum: [PAGINATION_SNAPSHOT_LIMITED] }
              message: { type: string }
              request_id: { type: string }
    PaginationSnapshotUnavailable:
      description: Snapshot storage or its bounded query is temporarily unavailable. Retry after the declared number of seconds.
      headers:
        Retry-After:
          required: true
          description: Minimum number of seconds before retrying the snapshot request.
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema:
            type: object
            required: [code, message]
            properties:
              code: { type: string, enum: [PAGINATION_SNAPSHOT_UNAVAILABLE] }
              message: { type: string }
              request_id: { type: string }
    PrecheckTimeout:
      description: The single five-second cross-domain precheck deadline expired or complete downstream evidence could not be established. No write is authorized.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [code, message, request_id]
            properties:
              code: { type: string, const: PRECHECK_TIMEOUT }
              message: { type: string }
              request_id: { type: string }
    CommandResultUnknown:
      description: The command deadline expired after execution may have started. Clients must query the stable command reference and must not retry blindly.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [code, message, request_id, details]
            properties:
              code: { type: string, const: COMMAND_RESULT_UNKNOWN }
              message: { type: string }
              request_id: { type: string }
              details:
                type: object
                additionalProperties: false
                required: [command_reference, result_query]
                properties:
                  command_reference: { type: string, pattern: '^[0-9a-f]{64}$' }
                  result_query: { type: string, pattern: '^/token/admin/v1/commands/[0-9a-f]{64}$' }
    Error:
      description: JSON API error
      content:
        application/json:
          schema:
            type: object
            required: [code, message]
            properties:
              code: { type: string }
              message: { type: string }
              request_id: { type: string }
              details:
                type: object
                additionalProperties: true
