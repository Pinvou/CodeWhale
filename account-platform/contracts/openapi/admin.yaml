openapi: 3.1.0
info:
  title: Pinvou Operations Console API
  version: 0.2.0
  description: Platform operations API. Every operation requires its documented Account permission code; OIDC proves identity only and mutations are audited.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /api/admin
security:
  - oidc: []
paths:
  /system/status:
    get:
      operationId: getAdminSystemStatus
      summary: Get internal service health, event backlog, reconciliation state, and recent errors
      responses:
        "200": { $ref: "#/components/responses/SystemStatus" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /account/admin/v1/overview:
    get:
      operationId: getAdminAccountOverview
      summary: Get platform-wide account and organization counts
      responses:
        "200": { $ref: "#/components/responses/Overview" }
        "403": { $ref: "#/components/responses/Error" }
  /account/admin/v1/users:
    get:
      operationId: listAdminUsers
      summary: List and search platform users
      parameters: [{ $ref: "#/components/parameters/Search" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200": { $ref: "#/components/responses/Collection" }
        "403": { $ref: "#/components/responses/Error" }
  /account/admin/v1/user-code-lookups/{user_code}:
    get:
      operationId: getAdminUserByCode
      summary: Resolve one authorized user by a complete, checksum-valid user code
      description: Requires platform.users.read. Prefix, substring, fuzzy, range, autocomplete, and batch code lookup are not supported.
      parameters: [{ $ref: "#/components/parameters/UserCode" }]
      responses:
        "200":
          description: Authorized exact-match result
          headers:
            Cache-Control:
              required: true
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /account/admin/v1/roles:
    get:
      operationId: listAdminRoleDefinitions
      summary: List platform and organization role definitions, scopes, and permission codes
      responses:
        "200": { $ref: "#/components/responses/Collection" }
        "403": { $ref: "#/components/responses/Error" }
  /account/admin/v1/role-bindings:
    get:
      operationId: listAdminRoleBindings
      summary: List platform and organization role associations with validity, grant source, and lifecycle state
      parameters:
        - { name: user_id, in: query, schema: { type: string, format: uuid } }
        - { name: organization_id, in: query, schema: { type: string, format: uuid } }
      responses:
        "200": { $ref: "#/components/responses/Collection" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: grantAdminRoleBinding
      summary: Idempotently grant a non-owner, non-super-admin role with an optional validity window
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleBindingGrant" }
      responses:
        "201": { description: Role binding created or idempotent original returned }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /account/admin/v1/role-bindings/{binding_id}:
    delete:
      operationId: revokeAdminRoleBinding
      summary: Idempotently revoke one ordinary role binding and invalidate authorization caches
      parameters: [{ name: binding_id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Revoked binding or already revoked original }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /account/admin/v1/users/{user_id}/memberships:
    get:
      operationId: listAdminUserMemberships
      summary: List a user's organization memberships and roles
      parameters: [{ $ref: "#/components/parameters/UserID" }]
      responses:
        "200": { $ref: "#/components/responses/Collection" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /account/admin/v1/users/{user_id}/status:
    patch:
      operationId: setAdminUserStatus
      summary: Enable or disable a platform user
      parameters: [{ $ref: "#/components/parameters/UserID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StatusChange" }
      responses:
        "204": { description: User status updated }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /account/admin/v1/users/{user_id}:
    delete:
      operationId: deleteAdminUser
      summary: Soft-delete a user and revoke sessions and memberships
      parameters: [{ $ref: "#/components/parameters/UserID" }]
      responses:
        "204": { description: User deleted }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /account/admin/v1/organizations:
    get:
      operationId: listAdminOrganizations
      summary: List and search organizations
      parameters: [{ $ref: "#/components/parameters/Search" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200": { $ref: "#/components/responses/Collection" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: createAdminOrganization
      summary: Create an organization with an initial owner
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationCreate" }
      responses:
        "201":
          description: Organization created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /account/admin/v1/organizations/{organization_id}/units:
    get:
      operationId: listAdminOrganizationUnits
      summary: List the complete organization unit hierarchy
      parameters: [{ $ref: "#/components/parameters/OrganizationID" }]
      responses:
        "200": { $ref: "#/components/responses/Collection" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createAdminOrganizationUnit
      summary: Create a root or child organization unit
      parameters: [{ $ref: "#/components/parameters/OrganizationID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationUnitCreate" }
      responses:
        "201":
          description: Organization unit created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationUnit" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /account/admin/v1/organizations/{organization_id}/members:
    get:
      operationId: listAdminOrganizationMembers
      summary: List active organization members and their roles
      parameters: [{ $ref: "#/components/parameters/OrganizationID" }]
      responses:
        "200": { $ref: "#/components/responses/Collection" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: addAdminOrganizationMember
      summary: Add or reactivate a platform user as an organization member
      parameters: [{ $ref: "#/components/parameters/OrganizationID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberRoleChange" }
      responses:
        "201": { description: Member added }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /account/admin/v1/organizations/{organization_id}/members/{user_id}:
    delete:
      operationId: removeAdminOrganizationMember
      summary: Revoke a non-owner organization membership
      parameters: [{ $ref: "#/components/parameters/OrganizationID" }, { $ref: "#/components/parameters/UserID" }]
      responses:
        "204": { description: Member removed }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /account/admin/v1/organizations/{organization_id}/members/{user_id}/roles:
    put:
      operationId: replaceAdminOrganizationMemberRoles
      summary: Replace assignable organization roles and unit administrator scopes
      parameters: [{ $ref: "#/components/parameters/OrganizationID" }, { $ref: "#/components/parameters/UserID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberRoleChange" }
      responses:
        "200": { description: Member roles updated }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /account/admin/v1/organizations/{organization_id}/ownership:
    post:
      operationId: transferAdminOrganizationOwnership
      summary: Replace the organization owner with an active member
      parameters: [{ $ref: "#/components/parameters/OrganizationID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OwnershipTransfer" }
      responses:
        "204": { description: Organization ownership transferred }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /account/admin/v1/organizations/{organization_id}/units/{unit_id}:
    patch:
      operationId: renameAdminOrganizationUnit
      summary: Rename an organization unit
      parameters: [{ $ref: "#/components/parameters/OrganizationID" }, { $ref: "#/components/parameters/UnitID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NameChange" }
      responses:
        "204": { description: Organization unit renamed }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteAdminOrganizationUnit
      summary: Delete a leaf organization unit and clear its assignments
      parameters: [{ $ref: "#/components/parameters/OrganizationID" }, { $ref: "#/components/parameters/UnitID" }]
      responses:
        "204": { description: Organization unit deleted }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /account/admin/v1/organizations/{organization_id}/status:
    patch:
      operationId: setAdminOrganizationStatus
      summary: Enable or disable an organization and its memberships
      parameters: [{ $ref: "#/components/parameters/OrganizationID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StatusChange" }
      responses:
        "204": { description: Organization status updated }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /account/admin/v1/organizations/{organization_id}:
    patch:
      operationId: renameAdminOrganization
      summary: Rename an organization
      parameters: [{ $ref: "#/components/parameters/OrganizationID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NameChange" }
      responses:
        "204": { description: Organization renamed }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteAdminOrganization
      summary: Soft-delete an organization and revoke its memberships
      parameters: [{ $ref: "#/components/parameters/OrganizationID" }]
      responses:
        "204": { description: Organization deleted }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /account/admin/v1/audit-logs:
    get:
      operationId: listAdminAuditLogs
      summary: Filter recent account audit events by actor, resource, action, time, and result
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { name: actor, in: query, schema: { type: string, maxLength: 320 } }
        - { name: action, in: query, schema: { type: string, maxLength: 160 } }
        - { name: resource, in: query, schema: { type: string, maxLength: 320 } }
        - { name: result, in: query, schema: { type: string, enum: [SUCCEEDED, DENIED, FAILED] } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        "200": { $ref: "#/components/responses/Collection" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /account/admin/v1/audit-logs/{audit_id}:
    get:
      operationId: getAdminAuditLog
      summary: Get one audit event with its change summary
      parameters: [{ $ref: "#/components/parameters/AuditID" }]
      responses:
        "200": { $ref: "#/components/responses/Overview" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /account/admin/v1/registration-operations:
    get:
      operationId: listRegistrationRepairQueue
      summary: List redacted registration and wallet provisioning operations requiring repair
      description: Requires platform.registrations.repair. Passwords, password fingerprints, SMS codes, mobile numbers, usernames, provider text, and Identity subjects are never returned.
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - name: status
          in: query
          schema: { type: string, enum: [REPAIR_REQUIRED, COMPENSATION_PENDING] }
        - name: stage
          in: query
          description: Failed or pending recovery stage derived from persisted operation facts.
          schema: { type: string, enum: [IDENTITY_CREATING, ACCOUNT_COMMITTING, WALLET_PROVISIONING, COMPENSATION] }
        - name: responsibility
          in: query
          schema: { type: string, enum: [IDENTITY, ACCOUNT, BILLING] }
        - name: older_than_minutes
          in: query
          schema: { type: integer, minimum: 0, maximum: 43200 }
        - name: sla
          in: query
          schema: { type: string, enum: [OVERDUE, WITHIN] }
      responses:
        "200": { $ref: "#/components/responses/Collection" }
        "403": { $ref: "#/components/responses/Error" }
  /account/admin/v1/registration-operations/{registration_operation_id}/actions/retry:
    post:
      operationId: retryRegistrationRepair
      summary: Idempotently retry the current proven registration or wallet provisioning stage
      parameters: [{ $ref: "#/components/parameters/RegistrationOperationID" }]
      responses:
        "202": { $ref: "#/components/responses/Overview" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /account/admin/v1/registration-operations/{registration_operation_id}/actions/compensate:
    post:
      operationId: compensateOrphanRegistration
      summary: Disable an orphan Identity and release its reservation only after the 24-hour no-facts proof gate
      parameters: [{ $ref: "#/components/parameters/RegistrationOperationID" }]
      responses:
        "204": { description: Identity is confirmed non-authenticating and the reservation is released }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /account/admin/v1/profile-change-requests:
    get:
      operationId: listProfileChangeRepairQueue
      summary: List redacted retry and repair-required profile changes
      description: Requires platform.profile-changes.repair. Old/new identifiers, Identity subjects, SMS details, and provider errors are never returned.
      responses:
        "200": { $ref: "#/components/responses/Collection" }
        "403": { $ref: "#/components/responses/Error" }
  /account/admin/v1/profile-change-requests/{request_id}/actions/retry:
    post:
      operationId: retryProfileChangeRepair
      summary: Return one repair-required profile change to the forward-only recovery worker
      parameters:
        - name: request_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "202": { $ref: "#/components/responses/Overview" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /billing/admin/v1/overview:
    get:
      operationId: getAdminBillingOverview
      summary: Get platform-wide wallet, order, adjustment, and hold counts
      responses:
        "200": { description: Billing counters and exact financial totals, content: { application/json: { schema: { $ref: "#/components/schemas/BillingOverview" } } } }
        "403": { $ref: "#/components/responses/Error" }
  /billing/admin/v1/wallets:
    get:
      operationId: listAdminWallets
      summary: List recently updated wallets
      parameters: [{ $ref: "#/components/parameters/Limit" }]
      responses:
        "200": { description: Wallet collection, content: { application/json: { schema: { $ref: "#/components/schemas/WalletCollection" } } } }
        "403": { $ref: "#/components/responses/Error" }
  /billing/admin/v1/wallets/{wallet_id}/ledger:
    get:
      operationId: listAdminWalletLedger
      summary: List immutable wallet ledger entries
      parameters: [{ $ref: "#/components/parameters/WalletID" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200": { description: Exact wallet ledger collection, content: { application/json: { schema: { $ref: "#/components/schemas/LedgerCollection" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /billing/admin/v1/pricing-versions:
    get:
      operationId: listAdminPricingVersions
      summary: List current and historical model prices
      responses:
        "200": { description: Exact pricing version collection, content: { application/json: { schema: { $ref: "#/components/schemas/PriceVersionCollection" } } } }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: createAdminPricingVersion
      summary: Activate a new model price while retaining price history
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PricingVersionCreate" }
      responses:
        "201": { description: Pricing version activated, content: { application/json: { schema: { $ref: "#/components/schemas/PriceVersion" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /billing/admin/v1/payment-orders:
    get:
      operationId: listAdminPaymentOrders
      summary: Search recently updated payment orders
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - name: q
          in: query
          description: Mobile, Pinvou order ID, Mall order ID, payment transaction ID, or SKU
          schema: { type: string, maxLength: 160 }
        - name: status
          in: query
          schema: { type: string, enum: [CREATED, PENDING, PAID, PAID_LATE, FAILED, CLOSED, PARTIALLY_REFUNDED, REFUNDED, MANUAL_REVIEW] }
      responses:
        "200": { description: Payment order collection, content: { application/json: { schema: { $ref: "#/components/schemas/PaymentOrderCollection" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /billing/admin/v1/payment-orders/{order_id}/sync:
    post:
      operationId: syncAdminPaymentOrder
      summary: Query the payment provider and converge an order
      parameters: [{ $ref: "#/components/parameters/OrderID" }]
      responses:
        "200": { description: Synchronized payment order, content: { application/json: { schema: { $ref: "#/components/schemas/ExactPaymentOrder" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /billing/admin/v1/payment-orders/{order_id}/repair:
    post:
      operationId: repairAdminPaymentOrder
      summary: Re-verify and fulfill a late payment held for manual review
      parameters: [{ $ref: "#/components/parameters/OrderID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Reason" }
      responses:
        "200": { description: Repaired and fulfilled payment order }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /billing/admin/v1/payment-orders/{order_id}/refunds:
    post:
      operationId: createAdminPaymentRefund
      summary: Refund a settled payment order subject to refundable balance
      parameters: [{ $ref: "#/components/parameters/OrderID" }, { $ref: "#/components/parameters/RefundIdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefundCreate" }
      responses:
        "201": { description: Refund created, content: { application/json: { schema: { $ref: "#/components/schemas/ExactRefund" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /billing/admin/v1/adjustments:
    get:
      operationId: listAdminAdjustments
      summary: List recent manual billing adjustments
      parameters: [{ $ref: "#/components/parameters/Limit" }]
      responses:
        "200": { description: Adjustment collection, content: { application/json: { schema: { $ref: "#/components/schemas/AdjustmentCollection" } } } }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: createAdminAdjustmentRequest
      summary: Create an idempotent pending adjustment before submitting its immutable approval command
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdjustmentRequestCreate" }
      responses:
        "201": { description: Pending manual adjustment created }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /billing/admin/v1/adjustments/{adjustment_id}/approve:
    post:
      operationId: approveAdminAdjustment
      summary: Approve and post a pending manual adjustment
      parameters: [{ $ref: "#/components/parameters/AdjustmentID" }]
      requestBody: { $ref: "#/components/requestBodies/Decision" }
      responses:
        "200": { description: Adjustment approved, content: { application/json: { schema: { $ref: "#/components/schemas/ExactAdjustment" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /billing/admin/v1/adjustments/{adjustment_id}/reject:
    post:
      operationId: rejectAdminAdjustment
      summary: Reject a pending manual adjustment
      parameters: [{ $ref: "#/components/parameters/AdjustmentID" }]
      requestBody: { $ref: "#/components/requestBodies/Decision" }
      responses:
        "200": { description: Adjustment rejected, content: { application/json: { schema: { $ref: "#/components/schemas/ExactAdjustment" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /billing/admin/v1/usage-holds:
    get:
      operationId: listAdminUsageHolds
      summary: List recent usage reservations
      parameters: [{ $ref: "#/components/parameters/Limit" }]
      responses:
        "200": { description: Hold collection, content: { application/json: { schema: { $ref: "#/components/schemas/HoldCollection" } } } }
        "403": { $ref: "#/components/responses/Error" }
  /billing/admin/v1/usage-holds/{hold_id}/release:
    post:
      operationId: releaseAdminUsageHold
      summary: Finally waive this call with an audit reason; active upstream execution is rejected and a prior commit cannot be waived
      parameters: [{ $ref: "#/components/parameters/HoldID" }]
      requestBody: { $ref: "#/components/requestBodies/Decision" }
      responses:
        "200":
          description: Billing and Token confirm final zero charge
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "billing.yaml#/components/schemas/UsageWaiverAuthority/properties/hold"
                  - type: object
                    properties:
                      status: { const: RELEASED }
                      actual_microcredits: { const: "0" }
        "503": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /billing/admin/v1/reconciliation-runs:
    get:
      operationId: listAdminReconciliationRuns
      summary: List recent payment reconciliation runs
      responses:
        "200": { $ref: "#/components/responses/Collection" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: runAdminReconciliation
      summary: Reconcile one payment channel and business date
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReconciliationCreate" }
      responses:
        "200": { description: Reconciliation completed }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /billing/admin/v1/reconciliation-runs/{run_id}/cases:
    get:
      operationId: listAdminReconciliationCases
      summary: List differences found by a reconciliation run
      parameters: [{ $ref: "#/components/parameters/RunID" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200": { description: Reconciliation evidence with exact financial strings, content: { application/json: { schema: { $ref: "#/components/schemas/ReconciliationCaseCollection" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /token/admin/v1/overview:
    get:
      operationId: getAdminTokenOverview
      summary: Get platform-wide Token account, route, and usage counts
      responses:
        "200": { $ref: "#/components/responses/Overview" }
        "403": { $ref: "#/components/responses/Error" }
  /token/admin/v1/token-accounts:
    get:
      operationId: listAdminTokenAccounts
      summary: List recently updated Token accounts without credential secrets
      parameters: [{ $ref: "#/components/parameters/Limit" }]
      responses:
        "200": { $ref: "#/components/responses/Collection" }
        "403": { $ref: "#/components/responses/Error" }
  /token/admin/v1/token-accounts/{token_account_id}:
    get:
      operationId: getAdminTokenAccount
      summary: Get a Token account with routes and credential metadata only
      parameters: [{ $ref: "#/components/parameters/TokenAccountID" }]
      responses:
        "200": { $ref: "#/components/responses/Overview" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /token/admin/v1/token-accounts/{token_account_id}/status:
    patch:
      operationId: setAdminTokenAccountStatus
      summary: Enable or disable a Token account
      parameters: [{ $ref: "#/components/parameters/TokenAccountID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenAccountStatusChange" }
      responses:
        "200": { $ref: "#/components/responses/Overview" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /token/admin/v1/token-accounts/{token_account_id}/routes:
    put:
      operationId: upsertAdminTokenRoute
      summary: Create or replace a model routing policy
      parameters: [{ $ref: "#/components/parameters/TokenAccountID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenRouteChange" }
      responses:
        "200": { $ref: "#/components/responses/Overview" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteAdminTokenRoute
      summary: Delete a model routing policy
      parameters: [{ $ref: "#/components/parameters/TokenAccountID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model]
              properties: { model: { type: string } }
      responses:
        "204": { description: Route deleted }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /token/admin/v1/token-accounts/{token_account_id}/credentials/{credential_id}/validate:
    post:
      operationId: validateAdminProviderCredential
      summary: Validate a provider credential without returning its secret, ciphertext, or endpoint
      parameters: [{ $ref: "#/components/parameters/TokenAccountID" }, { $ref: "#/components/parameters/CredentialID" }]
      responses:
        "200": { $ref: "#/components/responses/Overview" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /token/admin/v1/usage-requests:
    get:
      operationId: listAdminUsageRequests
      summary: List recent model usage and settlement requests
      parameters: [{ $ref: "#/components/parameters/Limit" }]
      responses:
        "200": { description: Usage collection, content: { application/json: { schema: { $ref: "#/components/schemas/UsageCollection" } } } }
        "403": { $ref: "#/components/responses/Error" }
  /token/admin/v1/usage-requests/{usage_request_id}:
    get:
      operationId: getAdminUsageRequest
      summary: Get settlement, attempt, and NewAPI correlation metadata without conversation content
      parameters: [{ $ref: "#/components/parameters/UsageRequestID" }]
      responses:
        "200": { $ref: "#/components/responses/Overview" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /token/admin/v1/usage-requests/{usage_request_id}/retry-reconciliation:
    post:
      operationId: retryAdminUsageReconciliation
      summary: Reschedule a failed automatic usage reconciliation
      parameters: [{ $ref: "#/components/parameters/UsageRequestID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Reason" }
      responses:
        "200": { $ref: "#/components/responses/Overview" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /account/admin/v1/approval-policies:
    get:
      operationId: listAdminApprovalPolicies
      summary: List the immutable command classifications for the active policy version
      responses:
        "200":
          description: Active command policy registry
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [policy_version, items]
                properties:
                  policy_version: { type: integer, format: int64, minimum: 1 }
                  items: { type: array, items: { $ref: "#/components/schemas/ApprovalPolicy" } }
        "403": { $ref: "#/components/responses/Error" }
  /account/admin/v1/approval-requests:
    get:
      operationId: listAdminApprovalRequests
      summary: Search approval requests visible to the requester or an authorized approver
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { name: command_type, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/ApprovalStatus" } }
        - { name: risk_class, in: query, schema: { type: string } }
        - { name: requester_user_id, in: query, schema: { type: string, format: uuid } }
        - { name: target, in: query, schema: { type: string, maxLength: 160 } }
        - { name: submitted_from, in: query, schema: { type: string, format: date-time } }
        - { name: submitted_to, in: query, schema: { type: string, format: date-time } }
        - { name: expires_from, in: query, schema: { type: string, format: date-time } }
        - { name: expires_to, in: query, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: Approval requests with server-authorized actions
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items: { type: array, maxItems: 200, items: { $ref: "#/components/schemas/ApprovalRequest" } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: createAdminApprovalDraft
      summary: Create an idempotent draft for a command classified as approval-required
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApprovalDraft" }
      responses:
        "201":
          description: Approval draft created
          content: { application/json: { schema: { $ref: "#/components/schemas/ApprovalRequest" } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /account/admin/v1/approval-requests/{approval_request_id}:
    get:
      operationId: getAdminApprovalRequest
      summary: Get one immutable approval command and its current allowed actions
      parameters: [{ $ref: "#/components/parameters/ApprovalRequestID" }]
      responses:
        "200": { description: Approval request, content: { application/json: { schema: { $ref: "#/components/schemas/ApprovalRequest" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      operationId: updateAdminApprovalDraft
      summary: Replace a draft before submission using optimistic concurrency
      parameters: [{ $ref: "#/components/parameters/ApprovalRequestID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApprovalDraftUpdate" }
      responses:
        "200": { description: Updated approval draft, content: { application/json: { schema: { $ref: "#/components/schemas/ApprovalRequest" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /account/admin/v1/approval-requests/{approval_request_id}/actions/submit:
    post:
      operationId: submitAdminApprovalRequest
      summary: Freeze and submit a draft for independent approval
      parameters: [{ $ref: "#/components/parameters/ApprovalRequestID" }]
      requestBody: { $ref: "#/components/requestBodies/VersionTransition" }
      responses:
        "200": { description: Submitted approval request, content: { application/json: { schema: { $ref: "#/components/schemas/ApprovalRequest" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /account/admin/v1/approval-requests/{approval_request_id}/actions/withdraw:
    post:
      operationId: withdrawAdminApprovalRequest
      summary: Withdraw the requester's own submitted approval request
      parameters: [{ $ref: "#/components/parameters/ApprovalRequestID" }]
      requestBody: { $ref: "#/components/requestBodies/VersionTransition" }
      responses:
        "200": { description: Withdrawn approval request, content: { application/json: { schema: { $ref: "#/components/schemas/ApprovalRequest" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /account/admin/v1/approval-requests/{approval_request_id}/actions/decide:
    post:
      operationId: decideAdminApprovalRequest
      summary: Approve or reject using an independent current authorization binding
      parameters: [{ $ref: "#/components/parameters/ApprovalRequestID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApprovalDecision" }
      responses:
        "200": { description: Decided approval request, content: { application/json: { schema: { $ref: "#/components/schemas/ApprovalRequest" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: /realms/pinvou/.well-known/openid-configuration
  parameters:
    RefundIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: One stable identity per logical refund; retries reuse the same facts and key.
      schema: { type: string, minLength: 16 }
    Search:
      name: q
      in: query
      description: Case-insensitive display name, email, or exact UUID search.
      schema: { type: string, maxLength: 320 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    UserID:
      name: user_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserCode:
      name: user_code
      in: path
      required: true
      description: Complete user code; ASCII hyphens and letter case are ignored before validation.
      schema:
        type: string
        minLength: 21
        maxLength: 26
    OrganizationID:
      name: organization_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    UnitID:
      name: unit_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    WalletID:
      name: wallet_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    OrderID:
      name: order_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AdjustmentID:
      name: adjustment_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    HoldID:
      name: hold_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    RunID:
      name: run_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    TokenAccountID:
      name: token_account_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    CredentialID:
      name: credential_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    UsageRequestID:
      name: usage_request_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AuditID:
      name: audit_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    RegistrationOperationID:
      name: registration_operation_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ApprovalRequestID:
      name: approval_request_id
      in: path
      required: true
      schema: { type: string, format: uuid }
  requestBodies:
    Decision:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [reason]
            properties:
              reason: { type: string, minLength: 1, maxLength: 500 }
    VersionTransition:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [expected_version]
            properties:
              expected_version: { type: integer, format: int64, minimum: 1 }
  schemas:
    DecimalMoney:
      type: string
      pattern: '^-?(0|[1-9][0-9]*)$'
      description: Exact decimal integer in the named currency unit; never a JSON number.
    BillingOverview:
      type: object
      required: [posted_microcredits, reserved_microcredits]
      properties:
        payment_capabilities:
          type: object
          additionalProperties: false
          required: [provider, order_sync_supported, refund_supported, close_supported, notification_supported, reconciliation_supported, manual_repair_supported, commerce_customer_required]
          properties:
            provider: { type: string }
            order_sync_supported: { type: boolean }
            refund_supported: { type: boolean }
            close_supported: { type: boolean }
            notification_supported: { type: boolean }
            reconciliation_supported: { type: boolean }
            manual_repair_supported: { type: boolean }
            commerce_customer_required: { type: boolean }
        posted_microcredits: { $ref: "#/components/schemas/DecimalMoney" }
        reserved_microcredits: { $ref: "#/components/schemas/DecimalMoney" }
      additionalProperties: { type: integer, format: int64, minimum: 0 }
    WalletCollection:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            type: object
            required: [posted_microcredits, reserved_microcredits, available_microcredits]
            properties:
              posted_microcredits: { $ref: "#/components/schemas/DecimalMoney" }
              reserved_microcredits: { $ref: "#/components/schemas/DecimalMoney" }
              available_microcredits: { $ref: "#/components/schemas/DecimalMoney" }
    PaymentOrderCollection:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            type: object
            required: [amount_fen, credit_microcredits]
            properties:
              amount_fen: { $ref: "#/components/schemas/DecimalMoney" }
              credit_microcredits: { $ref: "#/components/schemas/DecimalMoney" }
    AdjustmentCollection:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            type: object
            required: [amount_microcredits]
            properties:
              amount_microcredits: { $ref: "#/components/schemas/DecimalMoney" }
    HoldCollection:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            type: object
            required: [max_microcredits]
            properties:
              max_microcredits: { $ref: "#/components/schemas/DecimalMoney" }
              actual_microcredits: { $ref: "#/components/schemas/DecimalMoney" }
    PriceVersion:
      type: object
      required: [price_version_id, model, input_per_million, output_per_million, cached_input_per_million, effective_from, created_at]
      properties:
        price_version_id: { type: string, format: uuid }
        model: { type: string }
        input_per_million: { $ref: "#/components/schemas/DecimalMoney" }
        output_per_million: { $ref: "#/components/schemas/DecimalMoney" }
        cached_input_per_million: { $ref: "#/components/schemas/DecimalMoney" }
        effective_from: { type: string, format: date-time }
        effective_to: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    PriceVersionCollection:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/PriceVersion" }
    LedgerCollection:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            type: object
            required: [posting_id, journal_entry_id, delta_microcredits]
            properties:
              posting_id: { type: string, format: uuid }
              journal_entry_id: { type: string, format: uuid }
              delta_microcredits: { $ref: "#/components/schemas/DecimalMoney" }
    ExactPaymentOrder:
      type: object
      required: [order_id, amount_fen, credit_microcredits]
      properties:
        order_id: { type: string, format: uuid }
        amount_fen: { $ref: "#/components/schemas/DecimalMoney" }
        credit_microcredits: { $ref: "#/components/schemas/DecimalMoney" }
    ExactRefund:
      type: object
      required: [refund_id, amount_fen, credit_microcredits]
      properties:
        refund_id: { type: string, format: uuid }
        amount_fen: { $ref: "#/components/schemas/DecimalMoney" }
        credit_microcredits: { $ref: "#/components/schemas/DecimalMoney" }
    ExactAdjustment:
      type: object
      required: [amount_microcredits]
      properties:
        amount_microcredits: { $ref: "#/components/schemas/DecimalMoney" }
    FinancialSnapshot:
      type: [object, "null"]
      properties:
        amount_fen: { $ref: "#/components/schemas/DecimalMoney" }
        credit_microcredits: { $ref: "#/components/schemas/DecimalMoney" }
    ReconciliationCaseCollection:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            type: object
            required: [case_id, reconciliation_run_id, case_type, status]
            properties:
              case_id: { type: string, format: uuid }
              reconciliation_run_id: { type: string, format: uuid }
              case_type: { type: string }
              status: { type: string }
              provider_snapshot: { $ref: "#/components/schemas/FinancialSnapshot" }
              internal_snapshot: { $ref: "#/components/schemas/FinancialSnapshot" }
    UsageCollection:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required: [usage_request_id, model, status, maximum_microcredits, actual_microcredits, error_class, started_at, updated_at]
            properties:
              user_id: { type: string, format: uuid }
              session_id: { type: string }
              organization_id: { type: string, format: uuid }
              token_account_id: { type: string, format: uuid }
              credential_id: { type: string, format: uuid }
              wallet_id: { type: string, format: uuid }
              price_version_id: { type: string, format: uuid }
              hold_id: { type: string, format: uuid }
              newapi_request_id: { type: string }
              provider_request_id: { type: string }
              attempt_status: { type: string }
              input_tokens: { type: integer }
              output_tokens: { type: integer }
              cached_input_tokens: { type: integer }
              reconciliation_attempts: { type: integer, minimum: 0 }
              reconciliation_last_error: { type: string }
              reconciliation_stopped_at: { type: string, format: date-time }
              usage_request_id: { type: string, format: uuid }
              model: { type: string }
              status: { type: string, enum: [CREATED, RESERVED, UPSTREAM_ACTIVE, SETTLEMENT_PENDING, COMMITTED, RELEASED, REVIEW] }
              maximum_microcredits: { $ref: "#/components/schemas/DecimalMoney" }
              actual_microcredits:
                anyOf:
                  - { $ref: "#/components/schemas/DecimalMoney" }
                  - { type: "null" }
              error_class: { type: [string, "null"] }
              started_at: { type: string, format: date-time }
              updated_at: { type: string, format: date-time }
    ApprovalStatus:
      type: string
      enum: [DRAFT, SUBMITTED, APPROVED, REJECTED, WITHDRAWN, EXPIRED, INVALIDATED, EXECUTING, EXECUTED, EXECUTION_FAILED]
    ApprovalPolicy:
      type: object
      additionalProperties: false
      required: [command_type, approval_mode, requester_permission, risk_class, approval_count, self_approval_forbidden, snapshot_schema_version, critical_resource_fields, expires_after_nanoseconds, execution_window_nanoseconds, executor_identity]
      properties:
        command_type: { type: string }
        approval_mode: { type: string, enum: [APPROVAL_REQUIRED, AUDIT_ONLY] }
        requester_permission: { type: string }
        approver_permission: { type: string }
        risk_class: { type: string }
        approval_count: { type: integer, minimum: 0 }
        self_approval_forbidden: { type: boolean }
        snapshot_schema_version: { type: integer, minimum: 1 }
        critical_resource_fields: { type: array, items: { type: string } }
        expires_after_nanoseconds: { type: integer, format: int64, minimum: 1 }
        execution_window_nanoseconds: { type: integer, format: int64, minimum: 1 }
        executor_identity: { type: string }
    ApprovalDraft:
      type: object
      additionalProperties: false
      required: [command_type, idempotency_key, normalized_command, target_resource_type, target_resource_id, reason, critical_resource_versions, financial_snapshot]
      properties:
        command_type: { type: string }
        idempotency_key: { type: string, minLength: 8, maxLength: 120 }
        normalized_command: { type: object, additionalProperties: true }
        target_resource_type: { type: string, minLength: 1, maxLength: 80 }
        target_resource_id: { type: string, minLength: 1, maxLength: 160 }
        reason: { type: string, minLength: 10, maxLength: 2000 }
        redacted_evidence: { type: [array, object] }
        expected_impact: { type: object, additionalProperties: true }
        critical_resource_versions: { type: object, additionalProperties: true }
        financial_snapshot: { type: object, additionalProperties: true }
        supersedes_request_id: { type: string, format: uuid }
    ApprovalDraftUpdate:
      type: object
      additionalProperties: false
      required: [expected_version, command_type, idempotency_key, normalized_command, target_resource_type, target_resource_id, reason, critical_resource_versions, financial_snapshot]
      properties:
        expected_version: { type: integer, format: int64, minimum: 1 }
        command_type: { $ref: "#/components/schemas/ApprovalDraft/properties/command_type" }
        idempotency_key: { $ref: "#/components/schemas/ApprovalDraft/properties/idempotency_key" }
        normalized_command: { $ref: "#/components/schemas/ApprovalDraft/properties/normalized_command" }
        target_resource_type: { $ref: "#/components/schemas/ApprovalDraft/properties/target_resource_type" }
        target_resource_id: { $ref: "#/components/schemas/ApprovalDraft/properties/target_resource_id" }
        reason: { $ref: "#/components/schemas/ApprovalDraft/properties/reason" }
        redacted_evidence: { $ref: "#/components/schemas/ApprovalDraft/properties/redacted_evidence" }
        expected_impact: { $ref: "#/components/schemas/ApprovalDraft/properties/expected_impact" }
        critical_resource_versions: { $ref: "#/components/schemas/ApprovalDraft/properties/critical_resource_versions" }
        financial_snapshot: { $ref: "#/components/schemas/ApprovalDraft/properties/financial_snapshot" }
        supersedes_request_id: { $ref: "#/components/schemas/ApprovalDraft/properties/supersedes_request_id" }
    ApprovalDecision:
      type: object
      additionalProperties: false
      required: [expected_version, decision, reason, observed_versions]
      properties:
        expected_version: { type: integer, format: int64, minimum: 1 }
        decision: { type: string, enum: [APPROVE, REJECT] }
        reason: { type: string, minLength: 3, maxLength: 2000 }
        observed_versions: { type: object, additionalProperties: true }
    ApprovalRequest:
      type: object
      additionalProperties: true
      required: [approval_request_id, command_type, policy_version, approval_mode, risk_class, requester_user_id, normalized_command, command_fingerprint, target_resource_type, target_resource_id, reason, status, version, expires_at, created_at, updated_at, critical_resource_versions, financial_snapshot, policy_snapshot, allowed_actions]
      properties:
        approval_request_id: { type: string, format: uuid }
        command_type: { type: string }
        policy_version: { type: integer, format: int64, minimum: 1 }
        approval_mode: { type: string, enum: [APPROVAL_REQUIRED] }
        risk_class: { type: string }
        requester_user_id: { type: string, format: uuid }
        requester_binding_id: { type: string, format: uuid }
        requester_authorization_version: { type: integer, format: int64, minimum: 1 }
        normalized_command: { type: object, additionalProperties: true }
        command_fingerprint: { type: string, pattern: '^[0-9a-f]{64}$' }
        target_resource_type: { type: string }
        target_resource_id: { type: string }
        reason: { type: string }
        redacted_evidence: { type: [array, object] }
        expected_impact: { type: object, additionalProperties: true }
        status: { $ref: "#/components/schemas/ApprovalStatus" }
        version: { type: integer, format: int64, minimum: 1 }
        supersedes_request_id: { type: string, format: uuid }
        expires_at: { type: string, format: date-time }
        execution_deadline: { type: string, format: date-time }
        invalidation_code: { type: string }
        invalidation_details: { type: object, additionalProperties: true }
        submitted_at: { type: string, format: date-time }
        decided_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        critical_resource_versions: { type: object, additionalProperties: true }
        financial_snapshot: { type: object, additionalProperties: true }
        policy_snapshot: { type: object, additionalProperties: true }
        allowed_actions: { type: array, uniqueItems: true, items: { type: string, enum: [EDIT, SUBMIT, WITHDRAW, APPROVE, REJECT] } }
    RoleBindingGrant:
      type: object
      additionalProperties: false
      required: [user_id, role_code, idempotency_key]
      properties:
        user_id: { type: string, format: uuid }
        role_code: { type: string }
        organization_id: { type: string, format: uuid }
        unit_id: { type: string, format: uuid }
        starts_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        idempotency_key: { type: string, minLength: 8, maxLength: 120 }
    AdminUser:
      type: object
      additionalProperties: false
      required: [user_id, user_code, status, organization_count, created_at, updated_at]
      properties:
        user_id: { type: string, format: uuid }
        user_code:
          type: string
          pattern: '^USR-[0-9A-HJKMNP-TV-Z]{4}-[0-9A-HJKMNP-TV-Z]{4}-[0-9A-HJKMNP-TV-Z]{4}-[0-9A-HJKMNP-TV-Z]{4}-[0-9A-HJKMNP-TV-Z]{2}$'
        username: { type: [string, "null"] }
        display_name: { type: [string, "null"] }
        email: { type: [string, "null"] }
        status: { type: string, enum: [PROVISIONING, ACTIVE, DISABLED, DELETED] }
        organization_count: { type: integer, format: int64, minimum: 0 }
        last_seen_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    NameChange:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
    OrganizationCreate:
      type: object
      additionalProperties: false
      required: [name, owner_user_id]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        owner_user_id: { type: string, format: uuid }
    OwnershipTransfer:
      type: object
      additionalProperties: false
      required: [new_owner_user_id]
      properties:
        new_owner_user_id: { type: string, format: uuid }
    MemberRoleChange:
      type: object
      additionalProperties: false
      required: [roles, unit_admin_unit_ids]
      properties:
        user_id: { type: string, format: uuid }
        roles:
          type: array
          uniqueItems: true
          items: { type: string, enum: [ORG_ADMIN, BILLING_ADMIN, MEMBER, AUDITOR] }
        unit_admin_unit_ids:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
    OrganizationUnitCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        parent_id:
          oneOf:
            - { type: string, format: uuid }
            - { type: "null" }
    Organization:
      type: object
      additionalProperties: false
      required: [organization_id, name, status, version]
      properties:
        organization_id: { type: string, format: uuid }
        name: { type: string }
        status: { type: string, enum: [ACTIVE, DISABLED] }
        version: { type: integer, format: int64, minimum: 1 }
        roles:
          type: array
          items: { type: string }
    OrganizationUnit:
      type: object
      additionalProperties: false
      required: [unit_id, organization_id, name, status, version]
      properties:
        unit_id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        parent_id:
          oneOf:
            - { type: string, format: uuid }
            - { type: "null" }
        name: { type: string }
        status: { type: string, enum: [ACTIVE, DISABLED] }
        version: { type: integer, format: int64, minimum: 1 }
    StatusChange:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [ACTIVE, DISABLED] }
    TokenAccountStatusChange:
      type: object
      additionalProperties: false
      required: [status, reason]
      properties:
        status: { type: string, enum: [ACTIVE, DISABLED] }
        reason: { type: string, minLength: 1, maxLength: 500 }
    TokenRouteChange:
      type: object
      additionalProperties: false
      required: [model, priority, default_scope, health_status]
      properties:
        model: { type: string, minLength: 1, maxLength: 160 }
        priority: { type: integer, minimum: 0, maximum: 10000 }
        default_scope: { type: string, enum: [NONE, UNIT, ORG] }
        health_status: { type: string, enum: [HEALTHY, DEGRADED, UNHEALTHY] }
    Reason:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
    PricingVersionCreate:
      type: object
      additionalProperties: false
      required: [model, input_per_million, output_per_million, cached_input_per_million]
      properties:
        model: { type: string, minLength: 1, maxLength: 160 }
        input_per_million: { type: integer, format: int64, minimum: 0 }
        output_per_million: { type: integer, format: int64, minimum: 0 }
        cached_input_per_million: { type: integer, format: int64, minimum: 0 }
    RefundCreate:
      type: object
      additionalProperties: false
      required: [amount_fen, reason]
      properties:
        amount_fen: { type: integer, format: int64, minimum: 1 }
        reason: { type: string, minLength: 1, maxLength: 500 }
    AdjustmentRequestCreate:
      type: object
      additionalProperties: false
      required: [wallet_id, amount_microcredits, reason, idempotency_key]
      properties:
        wallet_id: { type: string, format: uuid }
        amount_microcredits: { type: integer, format: int64, not: { const: 0 } }
        reason: { type: string, minLength: 10, maxLength: 2000 }
        idempotency_key: { type: string, minLength: 8, maxLength: 120 }
    ReconciliationCreate:
      type: object
      additionalProperties: false
      required: [channel, business_date]
      properties:
        channel: { type: string, enum: [UNIONPAY, ALIPAY, WECHAT] }
        business_date: { type: string, format: date }
  responses:
    SystemStatus:
      description: Aggregated internal operational status without internal endpoint addresses
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
            required: [checked_at, services, relays, reconciliation, recent_errors]
            properties:
              checked_at: { type: string, format: date-time }
              services: { type: array, items: { type: object, additionalProperties: true } }
              relays: { type: array, items: { type: object, additionalProperties: true } }
              reconciliation: { type: object, additionalProperties: true }
              recent_errors: { type: array, items: { type: object, additionalProperties: true } }
    Overview:
      description: Service overview counters
      content:
        application/json:
          schema:
            type: object
            additionalProperties:
              type: integer
              format: int64
              minimum: 0
    Collection:
      description: A bounded collection ordered by recent activity
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [items]
            properties:
              items:
                type: array
                maxItems: 200
                items:
                  type: object
                  additionalProperties: true
    Error:
      description: JSON API error
      content:
        application/json:
          schema:
            type: object
            required: [code, message]
            properties:
              code: { type: string }
              message: { type: string }
              request_id: { type: string }
