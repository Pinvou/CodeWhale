openapi: 3.1.0
info:
  title: Pinvou Operations Console API
  version: 0.2.0
  description: Platform operations API. Every operation requires its documented Account permission code; OIDC proves identity only and mutations are audited.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /api/admin
security:
  - oidc: []
paths:
  /system/status:
    get:
      operationId: getAdminSystemStatus
      summary: Get internal service health, event backlog, reconciliation state, and recent errors
      responses:
        "200": { $ref: "#/components/responses/SystemStatus" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /account/admin/v1/overview:
    get:
      operationId: getAdminAccountOverview
      summary: Get platform-wide account and organization counts
      description: Requires platform.users.read or platform.organizations.read. The response omits each permission domain that is not granted.
      responses:
        "200": { $ref: "#/components/responses/AccountOverview" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /account/admin/v1/users:
    get:
      operationId: listAdminUsers
      summary: List and search platform users
      parameters:
        - { $ref: "#/components/parameters/Search" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - name: exclude_organization_id
          in: query
          description: Exclude users who already have a non-revoked membership in this organization; also requires platform.organizations.read.
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Stable user page ordered by update time and user ID
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserPage" }
        "403": { $ref: "#/components/responses/Error" }
  /account/admin/v1/user-code-lookups/{user_code}:
    get:
      operationId: getAdminUserByCode
      summary: Resolve one authorized user by a complete, checksum-valid user code
      description: Requires platform.users.read. Prefix, substring, fuzzy, range, autocomplete, and batch code lookup are not supported.
      parameters: [{ $ref: "#/components/parameters/UserCode" }]
      responses:
        "200":
          description: Authorized exact-match result
          headers:
            Cache-Control:
              required: true
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /account/admin/v1/roles:
    get:
      operationId: listAdminRoleDefinitions
      summary: List platform and organization role definitions, scopes, and permission codes
      responses:
        "200": { $ref: "#/components/responses/Collection" }
        "403": { $ref: "#/components/responses/Error" }
  /account/admin/v1/role-bindings:
    get:
      operationId: listAdminRoleBindings
      summary: List platform and organization role associations with validity, grant source, and lifecycle state
      parameters:
        - { name: user_id, in: query, schema: { type: string, format: uuid } }
        - { name: organization_id, in: query, schema: { type: string, format: uuid } }
      responses:
        "200": { $ref: "#/components/responses/Collection" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: grantAdminRoleBinding
      summary: Idempotently grant a non-owner, non-super-admin role with an optional validity window
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleBindingGrant" }
      responses:
        "201": { description: Role binding created or idempotent original returned }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /account/admin/v1/role-bindings/{binding_id}:
    delete:
      operationId: revokeAdminRoleBinding
      summary: Idempotently revoke one ordinary role binding and invalidate authorization caches
      parameters: [{ name: binding_id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Revoked binding or already revoked original }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /account/admin/v1/users/{user_id}/memberships:
    get:
      operationId: listAdminUserMemberships
      summary: List a user's organization memberships and roles
      parameters: [{ $ref: "#/components/parameters/UserID" }]
      responses:
        "200": { $ref: "#/components/responses/Collection" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /account/admin/v1/users/{user_id}/status:
    patch:
      operationId: setAdminUserStatus
      summary: Enable or disable a platform user
      parameters: [{ $ref: "#/components/parameters/UserID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StatusChange" }
      responses:
        "204": { description: User status updated }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /account/admin/v1/organizations:
    get:
      operationId: listAdminOrganizations
      summary: List and search organizations
      parameters:
        - { $ref: "#/components/parameters/Search" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - name: status
          in: query
          schema: { type: string, enum: [ACTIVE, DISABLED, DELETED] }
      responses:
        "200":
          description: Stable organization page ordered by updated time and identifier
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOrganizationPage" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: createAdminOrganization
      summary: Create an organization with an initial owner
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationCreate" }
      responses:
        "201":
          description: Organization created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /account/admin/v1/organizations/{organization_id}/units:
    get:
      operationId: listAdminOrganizationUnits
      summary: List the complete organization unit hierarchy
      parameters: [{ $ref: "#/components/parameters/OrganizationID" }]
      responses:
        "200":
          description: Organization unit tree and its optimistic concurrency version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationUnitTree" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createAdminOrganizationUnit
      summary: Create a root or child organization unit
      description: Requires platform.organizations.units.manage.
      parameters: [{ $ref: "#/components/parameters/OrganizationID" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationUnitCreate" }
      responses:
        "201":
          description: Organization unit created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationUnitMutation" }
        "200":
          description: Existing result replayed for the same idempotency key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationUnitMutation" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /account/admin/v1/organizations/{organization_id}/members:
    get:
      operationId: listAdminOrganizationMembers
      summary: Search and page active organization members and their roles
      parameters:
        - { $ref: "#/components/parameters/OrganizationID" }
        - { $ref: "#/components/parameters/Search" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - name: role
          in: query
          schema: { type: string, enum: [OWNER, ORG_ADMIN, ORG_MODEL_ADMIN, BILLING_ADMIN, AUDITOR, MEMBER, UNIT_ADMIN] }
      responses:
        "200":
          description: Stable member page ordered by join time and membership identifier
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOrganizationMemberPage" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: addAdminOrganizationMember
      summary: Add or reactivate a platform user as an organization member
      description: Requires platform.organizations.members.manage.
      parameters: [{ $ref: "#/components/parameters/OrganizationID" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberRoleChange" }
      responses:
        "201":
          description: Member added
          content: { application/json: { schema: { $ref: "#/components/schemas/MembershipMutationResult" } } }
        "200":
          description: Existing membership result replayed
          content: { application/json: { schema: { $ref: "#/components/schemas/MembershipMutationResult" } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /account/admin/v1/organizations/{organization_id}/members/{user_id}:
    delete:
      operationId: removeAdminOrganizationMember
      summary: Idempotently revoke a non-owner membership, reset its active sessions, and suspend grants
      description: Requires platform.organizations.members.manage.
      parameters: [{ $ref: "#/components/parameters/OrganizationID" }, { $ref: "#/components/parameters/UserID" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200":
          description: Member removed or existing terminal result returned
          content: { application/json: { schema: { $ref: "#/components/schemas/MembershipMutationResult" } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /account/admin/v1/organizations/{organization_id}/members/{user_id}/roles:
    put:
      operationId: replaceAdminOrganizationMemberRoles
      summary: Replace assignable organization roles and unit administrator scopes
      description: Requires platform.organizations.members.manage.
      parameters: [{ $ref: "#/components/parameters/OrganizationID" }, { $ref: "#/components/parameters/UserID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberRoleChange" }
      responses:
        "200": { description: Member roles updated }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /account/admin/v1/organizations/{organization_id}/ownership:
    post:
      operationId: transferAdminOrganizationOwnership
      summary: Atomically and idempotently replace the unique organization owner with an active member
      parameters: [{ $ref: "#/components/parameters/OrganizationID" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OwnershipTransfer" }
      responses:
        "200":
          description: Organization ownership transferred or existing result returned
          content: { application/json: { schema: { $ref: "#/components/schemas/OwnershipTransferResult" } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /account/admin/v1/organizations/{organization_id}/units/{unit_id}:
    patch:
      operationId: renameAdminOrganizationUnit
      summary: Rename an organization unit
      description: Requires platform.organizations.units.manage.
      parameters: [{ $ref: "#/components/parameters/OrganizationID" }, { $ref: "#/components/parameters/UnitID" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationUnitNameChange" }
      responses:
        "200":
          description: Organization unit renamed or idempotently replayed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationUnitMutation" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteAdminOrganizationUnit
      summary: Logically delete an unreferenced organization unit after cross-domain preflight
      description: Requires platform.organizations.units.manage.
      parameters: [{ $ref: "#/components/parameters/OrganizationID" }, { $ref: "#/components/parameters/UnitID" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200":
          description: Organization unit logically deleted or idempotently replayed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationUnitMutation" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /account/admin/v1/organizations/{organization_id}/units/{unit_id}/parent:
    patch:
      operationId: moveAdminOrganizationUnit
      summary: Move an organization unit to another parent or the organization root with optimistic concurrency
      description: Requires platform.organizations.units.manage. A stale structure version fails with ACCOUNT_CONFLICT and must be refreshed before retry.
      parameters: [{ $ref: "#/components/parameters/OrganizationID" }, { $ref: "#/components/parameters/UnitID" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_structure_version]
              properties:
                parent_id:
                  oneOf:
                    - { type: string, format: uuid }
                    - { type: "null" }
                expected_structure_version: { type: integer, format: int64, minimum: 1 }
                idempotency_key: { type: string, minLength: 8, maxLength: 120 }
      responses:
        "200":
          description: Organization unit moved or idempotently replayed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationUnitMutation" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /account/admin/v1/organizations/{organization_id}/status:
    patch:
      operationId: setAdminOrganizationStatus
      summary: Enable or disable an organization and its memberships
      description: Requires platform.organizations.status.manage.
      parameters: [{ $ref: "#/components/parameters/OrganizationID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StatusChange" }
      responses:
        "204": { description: Organization status updated }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /account/admin/v1/organizations/{organization_id}/deletion-readiness:
    get:
      operationId: getAdminOrganizationDeletionReadiness
      summary: Assess all known blockers before an organization is deleted
      parameters: [{ $ref: "#/components/parameters/OrganizationID" }]
      responses:
        "200":
          description: Current organization deletion readiness without mutating lifecycle state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationDeletionReadiness" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /account/admin/v1/organizations/{organization_id}:
    patch:
      operationId: renameAdminOrganization
      summary: Rename an organization
      description: Requires platform.organizations.profile.manage.
      parameters: [{ $ref: "#/components/parameters/OrganizationID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NameChange" }
      responses:
        "204": { description: Organization renamed }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteAdminOrganization
      summary: Soft-delete a disabled and deletion-ready organization, revoke memberships, and record an audit reason
      parameters: [{ $ref: "#/components/parameters/OrganizationID" }]
      requestBody:
        required: false
        description: New clients provide a reason; an absent body remains accepted for legacy clients.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationDeleteRequest" }
      responses:
        "204": { description: Organization deleted }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /account/admin/v1/audit-logs:
    get:
      operationId: listAdminAuditLogs
      summary: Filter recent account audit events by actor, resource, action, time, and result
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { name: actor, in: query, schema: { type: string, maxLength: 320 } }
        - { name: action, in: query, schema: { type: string, maxLength: 160 } }
        - { name: resource, in: query, schema: { type: string, maxLength: 320 } }
        - { name: result, in: query, schema: { type: string, enum: [SUCCEEDED, DENIED, FAILED] } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        "200": { $ref: "#/components/responses/Collection" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /account/admin/v1/audit-logs/{audit_id}:
    get:
      operationId: getAdminAuditLog
      summary: Get one audit event with its change summary
      parameters: [{ $ref: "#/components/parameters/AuditID" }]
      responses:
        "200": { $ref: "#/components/responses/Overview" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /account/admin/v1/audit-exports:
    post:
      operationId: createAdminAuditExport
      summary: Create a server-side encrypted, watermarked audit export under strict quotas
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AuditExportRequest" } } }
      responses:
        "202": { description: Export accepted; the file decryption key is returned only while the wrapped key remains available, content: { application/json: { schema: { $ref: "#/components/schemas/AuditExportJob" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /account/admin/v1/audit-exports/{export_id}:
    get:
      operationId: getAdminAuditExport
      summary: Get the requesting operator's export task without file contents or keys
      parameters: [{ $ref: "#/components/parameters/ExportID" }]
      responses:
        "200": { description: Export status, content: { application/json: { schema: { $ref: "#/components/schemas/AuditExportJob" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /account/admin/v1/audit-exports/{export_id}/download-tickets:
    post:
      operationId: issueAdminAuditExportDownloadTicket
      summary: Issue the only 15-minute single-use download ticket after recent authentication
      parameters: [{ $ref: "#/components/parameters/ExportID" }]
      responses:
        "201": { description: Single-use ticket, content: { application/json: { schema: { $ref: "#/components/schemas/AuditExportDownloadTicket" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /account/admin/v1/audit-exports/{export_id}/download:
    get:
      operationId: downloadAdminAuditExport
      summary: Atomically consume a download ticket and return the encrypted signed envelope once
      parameters:
        - { $ref: "#/components/parameters/ExportID" }
        - { name: X-Pinvou-Download-Token, in: header, required: true, schema: { type: string, minLength: 40, maxLength: 100 } }
      responses:
        "200": { description: Encrypted audit envelope, content: { application/vnd.pinvou.audit-envelope+json: { schema: { type: string, format: binary } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /account/admin/v1/registration-operations:
    get:
      operationId: listRegistrationRepairQueue
      summary: List redacted registration and wallet provisioning operations requiring repair
      description: Requires platform.registrations.repair. Passwords, password fingerprints, SMS codes, mobile numbers, usernames, provider text, and Identity subjects are never returned.
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - name: status
          in: query
          schema: { type: string, enum: [REPAIR_REQUIRED, COMPENSATION_PENDING] }
        - name: stage
          in: query
          description: Failed or pending recovery stage derived from persisted operation facts.
          schema: { type: string, enum: [IDENTITY_CREATING, ACCOUNT_COMMITTING, WALLET_PROVISIONING, COMPENSATION] }
        - name: responsibility
          in: query
          schema: { type: string, enum: [IDENTITY, ACCOUNT, BILLING] }
        - name: older_than_minutes
          in: query
          schema: { type: integer, minimum: 0, maximum: 43200 }
        - name: sla
          in: query
          schema: { type: string, enum: [OVERDUE, WITHIN] }
      responses:
        "200": { $ref: "#/components/responses/Collection" }
        "403": { $ref: "#/components/responses/Error" }
  /account/admin/v1/registration-operations/{registration_operation_id}/actions/retry:
    post:
      operationId: retryRegistrationRepair
      summary: Idempotently retry the current proven registration or wallet provisioning stage
      parameters: [{ $ref: "#/components/parameters/RegistrationOperationID" }]
      responses:
        "202": { $ref: "#/components/responses/Overview" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /account/admin/v1/registration-operations/{registration_operation_id}/actions/compensate:
    post:
      operationId: compensateOrphanRegistration
      summary: Disable an orphan Identity and release its reservation only after the 24-hour no-facts proof gate
      parameters: [{ $ref: "#/components/parameters/RegistrationOperationID" }]
      responses:
        "204": { description: Identity is confirmed non-authenticating and the reservation is released }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /account/admin/v1/profile-change-requests:
    get:
      operationId: listProfileChangeRepairQueue
      summary: List redacted retry and repair-required profile changes
      description: Requires platform.profile-changes.repair. Old/new identifiers, Identity subjects, SMS details, and provider errors are never returned.
      responses:
        "200": { $ref: "#/components/responses/Collection" }
        "403": { $ref: "#/components/responses/Error" }
  /account/admin/v1/profile-change-requests/{request_id}/actions/retry:
    post:
      operationId: retryProfileChangeRepair
      summary: Return one repair-required profile change to the forward-only recovery worker
      parameters:
        - name: request_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "202": { $ref: "#/components/responses/Overview" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /account/admin/v1/account-closure-requests:
    get:
      operationId: listAccountClosureRepairQueue
      summary: List redacted non-completed account-closure stages and blockers
      description: Requires platform.account-closures.read. Domain resource identifiers remain restricted to administrators.
      responses:
        "200": { $ref: "#/components/responses/Collection" }
        "403": { $ref: "#/components/responses/Error" }
  /account/admin/v1/account-closure-requests/{closure_request_id}/actions/retry:
    post:
      operationId: retryAccountClosureStage
      summary: Retry the current forward-only stage without bypassing any blocker
      parameters:
        - name: closure_request_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 16, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "200": { description: Retry accepted and current stage returned }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /billing/admin/v1/overview:
    get:
      operationId: getAdminBillingOverview
      summary: Get platform-wide wallet, order, adjustment, and hold counts
      description: Requires platform.billing.wallets.read. Available points are posted minus reserved minus receivable microcredits.
      responses:
        "200": { $ref: "#/components/responses/BillingOverview" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /billing/admin/v1/finance-overviews/accounts:
    get:
      operationId: getAdminFinanceAccountsOverview
      summary: Get point-in-time wallet, receivable, adjustment, and hold metrics
      description: Requires platform.billing.wallets.read. The response is atomic; any metric query failure returns FINANCE_OVERVIEW_UNAVAILABLE without partial metrics.
      responses:
        "200": { $ref: "#/components/responses/FinanceAccountsOverview" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/FinanceOverviewUnavailable" }
  /billing/admin/v1/finance-overviews/payments:
    get:
      operationId: getAdminFinancePaymentsOverview
      summary: Get windowed payment facts and point-in-time exception metrics
      description: Requires platform.billing.wallets.read. Defaults to the UTC half-open interval [now-24h,now); explicit from/to must both be UTC RFC3339 values and span at most 31 days. Each PAID or LATE_PAID payment transaction contributes once using provider_paid_at, falling back to verified_at. The response is atomic.
      parameters:
        - name: from
          in: query
          description: Inclusive UTC RFC3339 lower bound; must be supplied with to.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: Exclusive UTC RFC3339 upper bound; must be supplied with from and be no more than 31 days later.
          schema: { type: string, format: date-time }
      responses:
        "200": { $ref: "#/components/responses/FinancePaymentsOverview" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/FinanceOverviewUnavailable" }
  /billing/admin/v1/finance-overviews/pricing:
    get:
      operationId: getAdminFinancePricingOverview
      summary: Get point-in-time derived price and metering-unit metrics
      description: Requires platform.pricing.read and never depends on wallet permission or the Token model catalog. Price states are mutually exclusive. The response is atomic.
      responses:
        "200": { $ref: "#/components/responses/FinancePricingOverview" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/FinanceOverviewUnavailable" }
  /billing/admin/v1/finance-overviews/products:
    get:
      operationId: getAdminFinanceProductsOverview
      summary: Get point-in-time recharge-product lifecycle and admission metrics
      description: Requires platform.products.read and never depends on wallet permission. Deleted tombstones are excluded from active lifecycle and admission metrics and reported separately. Latest PENDING admission and blocked admission are mutually exclusive. The response is atomic.
      responses:
        "200": { $ref: "#/components/responses/FinanceProductsOverview" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/FinanceOverviewUnavailable" }
  /billing/admin/v1/wallets:
    get:
      operationId: listAdminWallets
      summary: List wallets through a subject-bound stable snapshot
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - { name: owner_type, in: query, schema: { type: string, enum: [PERSONAL, ORGANIZATION, ORG_UNIT] } }
        - { name: status, in: query, schema: { type: string, enum: [ACTIVE, FROZEN, CLOSED] } }
        - { name: q, in: query, schema: { type: string, maxLength: 160 } }
      responses:
        "200": { $ref: "#/components/responses/SnapshotCollection" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/PaginationSnapshotLimited" }
        "503": { $ref: "#/components/responses/PaginationSnapshotUnavailable" }
  /billing/admin/v1/wallets/{wallet_id}/ledger:
    get:
      operationId: listAdminWalletLedger
      summary: List immutable wallet ledger entries
      parameters:
        - { $ref: "#/components/parameters/WalletID" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - { name: entry_type, in: query, schema: { type: string, enum: [RECHARGE, USAGE, REFUND, REVERSAL, ADJUSTMENT, EXPIRY, RECEIVABLE, CHARGEBACK] } }
        - { name: business_reference, in: query, schema: { type: string, maxLength: 160 } }
        - { $ref: "#/components/parameters/CreatedFrom" }
        - { $ref: "#/components/parameters/CreatedTo" }
      responses:
        "200": { $ref: "#/components/responses/SnapshotCollection" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/PaginationSnapshotLimited" }
        "503": { $ref: "#/components/responses/PaginationSnapshotUnavailable" }
  /billing/admin/v1/receivables:
    get:
      operationId: listAdminReceivables
      summary: Query wallet receivables and their settlement state
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - { name: wallet_id, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [OPEN, PARTIALLY_SETTLED, SETTLED, WRITTEN_OFF] } }
        - { name: source_type, in: query, schema: { type: string, enum: [USAGE_OVERAGE, CHARGEBACK] } }
        - { $ref: "#/components/parameters/CreatedFrom" }
        - { $ref: "#/components/parameters/CreatedTo" }
      responses:
        "200":
          description: Receivable collection
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, next_cursor, snapshot_as_of]
                properties:
                  items: { type: array, maxItems: 200, items: { $ref: "#/components/schemas/Receivable" } }
                  next_cursor: { type: string }
                  snapshot_as_of: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/PaginationSnapshotLimited" }
        "503": { $ref: "#/components/responses/PaginationSnapshotUnavailable" }
  /billing/admin/v1/receivables/{receivable_id}/allocations:
    get:
      operationId: listAdminReceivableAllocations
      summary: List immutable settlement allocations for one receivable
      parameters:
        - { name: receivable_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Immutable settlement allocation collection
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ReceivableAllocation" } }
        "403": { $ref: "#/components/responses/Error" }
  /billing/admin/v1/pricing-versions:
    get:
      operationId: listAdminPricingVersions
      summary: List current and historical model prices
      responses:
        "200": { $ref: "#/components/responses/Collection" }
        "403": { $ref: "#/components/responses/Error" }
  /billing/admin/v1/metering-units:
    get:
      operationId: listAdminMeteringUnitVersions
      summary: List immutable versioned metering unit definitions
      responses:
        "200": { $ref: "#/components/responses/Collection" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: createAdminMeteringUnitVersion
      summary: Create a new metering unit version
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MeteringUnitCreate" } } }
      responses:
        "201": { description: Metering unit version created }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /billing/admin/v1/metering-units/{unit_definition_id}/deactivate:
    post:
      operationId: deactivateAdminMeteringUnitVersion
      summary: Deactivate a metering unit version without deleting or changing its facts
      parameters: [{ name: unit_definition_id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Metering unit deactivated }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /billing/admin/v1/pricing:
    get:
      operationId: listAdminManagedPrices
      summary: List price lifecycle versions, read one exact version, or project one exact pricing space and its current ETag
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { name: price_version_id, in: query, schema: { type: string, format: uuid } }
        - { name: scope_type, in: query, schema: { type: string, enum: [GLOBAL, MODEL] } }
        - { name: scope_id, in: query, schema: { type: string, maxLength: 160 } }
        - { name: protocol_code, in: query, schema: { type: string } }
        - { name: formula_version_id, in: query, schema: { type: string, format: uuid } }
        - { name: credit_unit, in: query, schema: { type: string, default: MICROCREDIT } }
      responses:
        "200": { $ref: "#/components/responses/Collection" }
        "403": { $ref: "#/components/responses/Error" }
  /billing/admin/v1/pricing/drafts:
    post:
      operationId: createAdminPriceDraft
      summary: Create an ETag-protected global or model price draft
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PriceDraft" } } }
      responses:
        "201": { description: Price draft created }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/Error" }
  /billing/admin/v1/pricing/{price_version_id}/draft:
    put:
      operationId: updateAdminPriceDraft
      summary: Replace mutable draft facts before publication
      parameters: [{ name: price_version_id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PriceDraft" } } }
      responses:
        "200": { description: Price draft updated }
        "403": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/Error" }
  /billing/admin/v1/pricing/{price_version_id}/preview:
    get:
      operationId: previewAdminPrice
      summary: Resolve all inherited units and preview the exact immutable price snapshot
      parameters: [{ name: price_version_id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Resolved price preview }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /billing/admin/v1/pricing/{price_version_id}/publish:
    post:
      operationId: publishAdminPrice
      summary: Idempotently publish a non-overlapping price version with compare-and-swap
      parameters:
        - { name: price_version_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 16, maxLength: 128 } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [expected_etag], properties: { expected_etag: { type: integer, format: int64, minimum: 1 } } } } }
      responses:
        "200": { description: Price published }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/Error" }
  /billing/admin/v1/pricing/{price_version_id}/transition:
    post:
      operationId: transitionAdminPriceLifecycle
      summary: Cancel a future price or end an active price with continuation, global fallback, or explicit block
      parameters:
        - { name: price_version_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 16, maxLength: 128 } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PriceTransition" } } }
      responses:
        "200": { description: Price lifecycle transitioned }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /billing/admin/v1/recharge-products:
    get:
      operationId: listRechargeProducts
      summary: List recharge product drafts, lifecycle, mappings, and admission state
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: lifecycle_status, in: query, schema: { type: string, enum: [DRAFT, ON_SALE, OFF_SALE, DELETED] } }
        - { name: include_deleted, in: query, schema: { type: boolean, default: false } }
      responses:
        "200": { description: Stable cursor page, content: { application/json: { schema: { $ref: "#/components/schemas/RechargeProductPage" } } } }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: createRechargeProduct
      summary: Create a non-purchasable recharge product draft
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RechargeProductCreate" } } } }
      responses:
        "201": { description: Draft created, content: { application/json: { schema: { $ref: "#/components/schemas/RechargeProduct" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /billing/admin/v1/recharge-products/{catalog_item_id}/publish:
    post:
      operationId: publishRechargeProduct
      summary: Publish a verified recharge product snapshot
      parameters:
        - { $ref: "#/components/parameters/CatalogItemID" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RechargeProductCommand" } } } }
      responses:
        "200": { description: Transition applied, content: { application/json: { schema: { $ref: "#/components/schemas/RechargeProduct" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /billing/admin/v1/recharge-products/{catalog_item_id}/unpublish:
    post:
      operationId: unpublishRechargeProduct
      summary: Stop new orders for an on-sale recharge product
      parameters: [{ $ref: "#/components/parameters/CatalogItemID" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RechargeProductCommand" } } } }
      responses:
        "200": { description: Product taken off sale, content: { application/json: { schema: { $ref: "#/components/schemas/RechargeProduct" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /billing/admin/v1/recharge-products/{catalog_item_id}/delete:
    post:
      operationId: deleteRechargeProduct
      summary: Logically delete an eligible draft or off-sale product
      parameters: [{ $ref: "#/components/parameters/CatalogItemID" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RechargeProductCommand" } } } }
      responses:
        "200": { description: Product tombstone returned, content: { application/json: { schema: { $ref: "#/components/schemas/RechargeProduct" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /billing/admin/v1/recharge-products/{catalog_item_id}/admission-verifications:
    get:
      operationId: listProductAdmissionVerifications
      summary: List immutable admission verification history
      parameters: [{ $ref: "#/components/parameters/CatalogItemID" }]
      responses:
        "200": { description: Verification history, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/ProductAdmissionVerification" } } } } } } }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: startProductAdmissionVerification
      summary: Start an asynchronous provider admission verification
      parameters: [{ $ref: "#/components/parameters/CatalogItemID" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RechargeProductCommand" } } } }
      responses:
        "202": { description: Verification queued, content: { application/json: { schema: { $ref: "#/components/schemas/ProductAdmissionVerification" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /billing/admin/v1/recharge-products/{catalog_item_id}/admission-verifications/{verification_id}/retry:
    post:
      operationId: retryProductAdmissionVerification
      summary: Retry a failed admission verification
      parameters:
        - { $ref: "#/components/parameters/CatalogItemID" }
        - { name: verification_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RechargeProductCommand" } } } }
      responses:
        "202": { description: Retry queued }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /billing/admin/v1/recharge-products/{catalog_item_id}/admission-verifications/{verification_id}/revoke:
    post:
      operationId: revokeProductAdmissionEvidence
      summary: Append a human revocation fact for verified admission evidence
      parameters:
        - { $ref: "#/components/parameters/CatalogItemID" }
        - { name: verification_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RechargeProductCommand" } } } }
      responses:
        "200": { description: Revocation appended }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /billing/admin/v1/payment-provider-controls:
    get:
      operationId: getPaymentProviderControls
      summary: Inspect tiered stop-loss evidence and obtain independent, version-frozen Provider or product recovery drafts
      responses:
        "200":
          description: Current Provider/product controls, trigger metrics, policy/evaluation versions and observation gaps. Top-level resume_draft only resumes the Provider; each paused product has its own resume_draft and neither command opens the other layer.
          content: { application/json: { schema: { type: object, additionalProperties: true } } }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /billing/admin/v1/payment-orders:
    get:
      operationId: listAdminPaymentOrders
      summary: Search recently updated payment orders
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - name: q
          in: query
          description: Mobile, Pinvou order ID, Mall order ID, payment transaction ID, or SKU
          schema: { type: string, maxLength: 160 }
        - name: status
          in: query
          schema: { type: string, enum: [CREATED, PENDING, PAID, PAID_LATE, FAILED, CLOSED, EXPIRED, MANUAL_REVIEW] }
        - { name: provider_id, in: query, schema: { type: string, maxLength: 120 } }
        - { name: channel, in: query, schema: { type: string, pattern: '^[A-Z0-9_]{1,32}$' } }
        - { $ref: "#/components/parameters/CreatedFrom" }
        - { $ref: "#/components/parameters/CreatedTo" }
      responses:
        "200": { $ref: "#/components/responses/SnapshotCollection" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/PaginationSnapshotLimited" }
        "503": { $ref: "#/components/responses/PaginationSnapshotUnavailable" }
  /billing/admin/v1/payment-orders/{order_id}/sync:
    post:
      operationId: syncAdminPaymentOrder
      summary: Query the payment provider and converge an order
      parameters: [{ $ref: "#/components/parameters/OrderID" }]
      responses:
        "200": { description: Synchronized payment order }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /billing/admin/v1/payment-orders/{order_id}:
    get:
      operationId: getAdminPaymentOrder
      summary: Inspect an order with its independently versioned transactions, immutable evidence, and derived summaries
      parameters: [{ $ref: "#/components/parameters/OrderID" }]
      responses:
        "200":
          description: Payment order operations detail
          content: { application/json: { schema: { $ref: "#/components/schemas/PaymentOrderDetail" } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /billing/admin/v1/payment-orders/{order_id}/repair:
    post:
      operationId: repairAdminPaymentOrder
      summary: Re-verify and fulfill a late payment held for manual review
      parameters: [{ $ref: "#/components/parameters/OrderID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Reason" }
      responses:
        "200": { description: Repaired and fulfilled payment order }
