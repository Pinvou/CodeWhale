        "503": { $ref: "#/components/responses/Error" }
        "504": { $ref: "#/components/responses/PrecheckTimeout" }
  /token/admin/v1/token-accounts/{token_account_id}/impact/credential:
    get:
      operationId: precheckAdminTokenCredentialImpact
      summary: Read redacted route, lease, request and alternative-credential impact
      parameters:
        - { name: token_account_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: action, in: query, required: true, schema: { type: string, enum: [ENROLL, ROTATE, REVOKE, VALIDATE] } }
        - { name: credential_id, in: query, description: Required except for ENROLL, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Read-only evidence; a later command must repeat CAS and dependency validation, content: { application/json: { schema: { $ref: "#/components/schemas/TokenImpactPrecheck" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
        "504": { $ref: "#/components/responses/PrecheckTimeout" }
  /token/admin/v1/reconciliation-cases:
    get:
      operationId: listAdminTokenReconciliationCases
      summary: Page Token usage and reconciliation manual-review cases
      description: domain is fixed to TOKEN and ordering is updated_at DESC, id DESC.
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - { name: q, in: query, schema: { type: string, maxLength: 160 } }
        - { name: status, in: query, schema: { type: string, enum: [OPEN, RESOLVED, LONG_TERM_PLAN] } }
        - { name: severity, in: query, schema: { type: string, enum: [P0, P1, P2] } }
        - { name: case_type, in: query, schema: { type: string, maxLength: 120 } }
        - { name: owner_id, in: query, schema: { type: string, format: uuid } }
        - { name: sla_overdue, in: query, schema: { type: boolean } }
      responses:
        "200": { $ref: "#/components/responses/TokenAdminReconciliationCollection" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TokenAdminQueryLimited" }
        "503": { $ref: "#/components/responses/PaginationSnapshotUnavailable" }
        "504": { $ref: "#/components/responses/Error" }
  /token/admin/v1/owner-candidates:
    get:
      operationId: listAdminTokenOwnerCandidates
      summary: Page the minimal authoritative owner projection for Token Account creation
      description: Account is scanned by immutable type/id; the Token snapshot is ordered by NFKC and Unicode case-fold label, owner type, owner id.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - { $ref: "#/components/parameters/Cursor" }
        - { name: q, in: query, schema: { type: string, maxLength: 160 } }
        - { name: owner_type, in: query, schema: { type: string, enum: [USER, ORGANIZATION, UNIT] } }
        - { name: status, in: query, schema: { type: string, enum: [ACTIVE, DISABLED, PROVISIONING] } }
        - { name: organization_id, in: query, schema: { type: string, format: uuid } }
      responses:
        "200": { $ref: "#/components/responses/TokenAdminOwnerCandidateCollection" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TokenAdminQueryLimited" }
        "503": { $ref: "#/components/responses/PaginationSnapshotUnavailable" }
        "504": { $ref: "#/components/responses/Error" }
  /token/admin/v1/resource-audit:
    get:
      operationId: listAdminTokenResourceAudit
      summary: Page a single model or Token Account audit history
      description: Requires platform.audit.read and the matching model or Token resource read permission. It is not an export endpoint.
      parameters:
        - { name: resource_type, in: query, required: true, schema: { type: string, enum: [MODEL, TOKEN_ACCOUNT] } }
        - { name: resource_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: action, in: query, schema: { type: string, maxLength: 120 } }
        - { name: actor_id, in: query, schema: { type: string, format: uuid } }
        - { name: occurred_from, in: query, schema: { type: string, format: date-time } }
        - { name: occurred_to, in: query, schema: { type: string, format: date-time } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200": { $ref: "#/components/responses/TokenAdminResourceAuditCollection" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TokenAdminQueryLimited" }
        "503": { $ref: "#/components/responses/PaginationSnapshotUnavailable" }
        "504": { $ref: "#/components/responses/Error" }
  /token/admin/v1/provisionings:
    get:
      operationId: listAdminRouteProvisionings
      summary: List managed route provisioning state without credential secrets
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - { name: q, in: query, schema: { type: string, maxLength: 160 } }
        - { name: status, in: query, schema: { type: string, enum: [PENDING, READY, FAILED, REPAIR_REQUIRED] } }
        - { name: model_id, in: query, schema: { type: string, format: uuid } }
        - { name: token_account_id, in: query, schema: { type: string, format: uuid } }
        - { name: scope_type, in: query, schema: { type: string, enum: [PERSONAL, ORGANIZATION] } }
        - { name: scope_id, in: query, schema: { type: string, format: uuid } }
        - { name: sla_overdue, in: query, schema: { type: boolean } }
      responses:
        "200": { $ref: "#/components/responses/TokenAdminProvisioningCollection" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TokenAdminQueryLimited" }
        "503": { $ref: "#/components/responses/PaginationSnapshotUnavailable" }
        "504": { $ref: "#/components/responses/Error" }
  /token/admin/v1/provisionings/{provisioning_id}:
    get:
      operationId: getAdminRouteProvisioning
      summary: Get one provisioning generation and its bounded attempt history
      parameters: [{ $ref: "#/components/parameters/ProvisioningID" }]
      responses:
        "200": { description: Provisioning detail, content: { application/json: { schema: { $ref: "#/components/schemas/ProvisioningDetail" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /token/admin/v1/provisionings/{provisioning_id}/repair:
    post:
      operationId: repairAdminRouteProvisioning
      summary: Start a new bounded repair round for a terminal failed provisioning
      parameters: [{ $ref: "#/components/parameters/ProvisioningID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "202": { description: Repair round accepted, content: { application/json: { schema: { $ref: "#/components/schemas/RouteProvisioning" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /account/admin/v1/approval-policies:
    get:
      operationId: listAdminApprovalPolicies
      summary: List the immutable command classifications for the active policy version
      responses:
        "200":
          description: Active command policy registry
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [policy_version, items]
                properties:
                  policy_version: { type: integer, format: int64, minimum: 1 }
                  items: { type: array, items: { $ref: "#/components/schemas/ApprovalPolicy" } }
        "403": { $ref: "#/components/responses/Error" }
  /account/admin/v1/approval-requests:
    get:
      operationId: listAdminApprovalRequests
      summary: Search approval requests visible to the requester or an authorized approver
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { name: command_type, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/ApprovalStatus" } }
        - { name: risk_class, in: query, schema: { type: string } }
        - { name: requester_user_id, in: query, schema: { type: string, format: uuid } }
        - { name: target, in: query, schema: { type: string, maxLength: 160 } }
        - { name: submitted_from, in: query, schema: { type: string, format: date-time } }
        - { name: submitted_to, in: query, schema: { type: string, format: date-time } }
        - { name: expires_from, in: query, schema: { type: string, format: date-time } }
        - { name: expires_to, in: query, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: Approval requests with server-authorized actions
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items: { type: array, maxItems: 200, items: { $ref: "#/components/schemas/ApprovalRequest" } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: createAdminApprovalDraft
      summary: Create an idempotent draft for a command classified as approval-required
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApprovalDraft" }
      responses:
        "201":
          description: Approval draft created
          content: { application/json: { schema: { $ref: "#/components/schemas/ApprovalRequest" } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /account/admin/v1/approval-requests/{approval_request_id}:
    get:
      operationId: getAdminApprovalRequest
      summary: Get one immutable approval command and its current allowed actions
      parameters: [{ $ref: "#/components/parameters/ApprovalRequestID" }]
      responses:
        "200": { description: Approval request, content: { application/json: { schema: { $ref: "#/components/schemas/ApprovalRequest" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      operationId: updateAdminApprovalDraft
      summary: Replace a draft before submission using optimistic concurrency
      parameters: [{ $ref: "#/components/parameters/ApprovalRequestID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/ApprovalDraft" }
                - type: object
                  required: [expected_version]
                  properties: { expected_version: { type: integer, format: int64, minimum: 1 } }
      responses:
        "200": { description: Updated approval draft, content: { application/json: { schema: { $ref: "#/components/schemas/ApprovalRequest" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /account/admin/v1/approval-requests/{approval_request_id}/actions/submit:
    post:
      operationId: submitAdminApprovalRequest
      summary: Freeze and submit a draft for independent approval
      parameters: [{ $ref: "#/components/parameters/ApprovalRequestID" }]
      requestBody: { $ref: "#/components/requestBodies/VersionTransition" }
      responses:
        "200": { description: Submitted approval request, content: { application/json: { schema: { $ref: "#/components/schemas/ApprovalRequest" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /account/admin/v1/approval-requests/{approval_request_id}/actions/withdraw:
    post:
      operationId: withdrawAdminApprovalRequest
      summary: Withdraw the requester's own submitted approval request
      parameters: [{ $ref: "#/components/parameters/ApprovalRequestID" }]
      requestBody: { $ref: "#/components/requestBodies/VersionTransition" }
      responses:
        "200": { description: Withdrawn approval request, content: { application/json: { schema: { $ref: "#/components/schemas/ApprovalRequest" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /account/admin/v1/approval-requests/{approval_request_id}/actions/decide:
    post:
      operationId: decideAdminApprovalRequest
      summary: Approve or reject using an independent current authorization binding
      parameters: [{ $ref: "#/components/parameters/ApprovalRequestID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApprovalDecision" }
      responses:
        "200": { description: Decided approval request, content: { application/json: { schema: { $ref: "#/components/schemas/ApprovalRequest" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /token/admin/v1/commands:
    post:
      operationId: createGovernedTokenCommand
      summary: Create or recover one governed Token command result
      description: Installed in APT-123 but returns TOKEN_COMMAND_GOVERNANCE_INACTIVE until the single APT-138 activation transition. Approval-required commands are never accepted here.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TokenCommandEnvelope" } } }
      responses:
        "200": { description: Existing result for the same idempotency key and fingerprint, content: { application/json: { schema: { $ref: "#/components/schemas/TokenCommandResult" } } } }
        "202": { description: Command accepted or its outcome remains unknown, content: { application/json: { schema: { $ref: "#/components/schemas/TokenCommandResult" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /token/admin/v1/commands/{command_reference}:
    get:
      operationId: getGovernedTokenCommandResult
      summary: Recover the current redacted result owned by the authenticated actor
      description: Installed in APT-123 but returns TOKEN_COMMAND_GOVERNANCE_INACTIVE before APT-138 activation; a different actor receives the same not-found response as an unknown reference.
      parameters:
        - name: command_reference
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Current immutable command result, content: { application/json: { schema: { $ref: "#/components/schemas/TokenCommandResult" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: /realms/pinvou/.well-known/openid-configuration
  parameters:
    CatalogItemID:
      name: catalog_item_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ModelID:
      name: model_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Search:
      name: q
      in: query
      description: Case-insensitive username or display name search, or exact UUID search.
      schema: { type: string, maxLength: 320 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      schema: { $ref: "token-gateway.yaml#/components/schemas/AdminPaginationCursor" }
    CreatedFrom:
      name: created_from
      in: query
      description: Inclusive RFC3339 UTC lower bound. When paired with created_to the interval must not exceed 366 days.
      schema: { type: string, format: date-time }
    CreatedTo:
      name: created_to
      in: query
      description: Exclusive RFC3339 UTC upper bound.
      schema: { type: string, format: date-time }
    ReconciliationCaseType:
      name: case_type
      in: query
      schema:
        type: string
        enum:
          - PROVIDER_PAID_INTERNAL_MISSING
          - INTERNAL_PAID_PROVIDER_MISSING
          - AMOUNT_MISMATCH
          - DUPLICATE_TRANSACTION
          - PROVIDER_REFUND_INTERNAL_MISSING
          - INTERNAL_REFUND_PROVIDER_MISSING
          - REFUND_AMOUNT_MISMATCH
          - PROVIDER_CHARGEBACK_INTERNAL_MISSING
          - INTERNAL_CHARGEBACK_PROVIDER_MISSING
          - PAYMENT_LEDGER_MISSING
          - REFUND_LEDGER_MISSING
          - CHARGEBACK_LEDGER_MISSING
          - UNSUPPORTED_PROVIDER_ENTRY
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 128 }
    UserID:
      name: user_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserCode:
      name: user_code
      in: path
      required: true
      description: Complete user code; ASCII hyphens and letter case are ignored before validation.
      schema:
        type: string
        minLength: 21
        maxLength: 26
    OrganizationID:
      name: organization_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    UnitID:
      name: unit_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    WalletID:
      name: wallet_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    OrderID:
      name: order_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AdjustmentID:
      name: adjustment_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    HoldID:
      name: hold_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    RunID:
      name: run_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    CaseID:
      name: case_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProvisioningID:
      name: provisioning_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    TokenAccountID:
      name: token_account_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    CredentialID:
      name: credential_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    UsageRequestID:
      name: usage_request_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AuditID:
      name: audit_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ExportID:
      name: export_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    RegistrationOperationID:
      name: registration_operation_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ApprovalRequestID:
      name: approval_request_id
      in: path
      required: true
      schema: { type: string, format: uuid }
  requestBodies:
    Decision:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [reason]
            properties:
              reason: { type: string, minLength: 1, maxLength: 500 }
    VersionTransition:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [expected_version]
            properties:
              expected_version: { type: integer, format: int64, minimum: 1 }
  schemas:
    TokenCommandEnvelope:
      type: object
      additionalProperties: false
      required: [command_type, reason, target_resource_type, target_resource_id, expected_versions, precheck_fingerprint, command]
      properties:
        command_type:
          type: string
          enum: [TOKEN_PROTOCOL_DRAFT_CREATE, TOKEN_PROTOCOL_PUBLISH, TOKEN_FORMULA_DRAFT_CREATE, TOKEN_FORMULA_PUBLISH, TOKEN_MODEL_DRAFT_SAVE, TOKEN_MODEL_PUBLISH, TOKEN_MODEL_LIFECYCLE_CHANGE, TOKEN_MODEL_CATALOG_SYNC, TOKEN_MODEL_CATALOG_ROLLBACK, TOKEN_ACCOUNT_CREATE, TOKEN_ACCOUNT_STATUS_CHANGE, TOKEN_ROUTE_UPSERT, TOKEN_ROUTE_DELETE, TOKEN_CREDENTIAL_ENROLL, TOKEN_CREDENTIAL_ROTATE, TOKEN_CREDENTIAL_REVOKE, TOKEN_CREDENTIAL_VALIDATE, TOKEN_ROUTE_PROVISIONING_REPAIR, TOKEN_USAGE_RECONCILIATION_RETRY]
        reason: { type: string, minLength: 10, maxLength: 2000 }
        target_resource_type: { type: string, minLength: 1, maxLength: 80, pattern: '^[A-Z][A-Z0-9_]*$' }
        target_resource_id: { type: string, minLength: 1, maxLength: 160 }
        expected_versions: { type: object, additionalProperties: true }
        precheck_fingerprint: { type: string, pattern: '^[0-9a-f]{64}$' }
        command: { type: object, additionalProperties: true, description: "Command-specific normalized input. Secret, ciphertext, key identifiers, provider URLs, force, and ignore_blocker fields are forbidden." }
    TokenCommandResult:
      type: object
      additionalProperties: false
      required: [command_reference, command_type, policy_version, actor_user_id, actor_permission, authorization_version, idempotency_fingerprint, target_resource_type, target_resource_id, status, audit_request_id, created_at]
      properties:
        command_reference: { type: string, format: uuid }
        command_type: { type: string }
        policy_version: { type: integer, format: int64, minimum: 1 }
        actor_user_id: { type: string, format: uuid }
        actor_permission: { type: string }
        authorization_version: { type: integer, format: int64, minimum: 1 }
        idempotency_fingerprint: { type: string, pattern: '^[0-9a-f]{64}$' }
        target_resource_type: { type: string }
        target_resource_id: { type: string }
        status: { type: string, enum: [PENDING, SUCCEEDED, REJECTED, FAILED, UNKNOWN] }
        redacted_result: { type: object, additionalProperties: true }
        stable_error_code: { type: string, minLength: 1, maxLength: 120, pattern: '^[A-Z][A-Z0-9_]*$', description: "Stable classification only; raw errors and Token, Key, Secret, Password, or Credential text are forbidden." }
        approval_request_id: { type: string, format: uuid }
        audit_request_id: { type: string }
        created_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
    TokenImpactPrecheck:
      type: object
      additionalProperties: false
      description: Token and Billing evidence are independently observed domain snapshots; this response never claims one distributed transaction or cross-domain as-of time.
      required: [action, evidence, blockers, token_observed_at, snapshot_semantics, precheck_fingerprint, requires_cas_revalidation]
      properties:
        action: { type: string, pattern: '^[A-Z][A-Z0-9_]{0,119}$' }
        evidence:
          type: object
          additionalProperties: false
          required: [resource_type, resource_id, current_status, current_version, dependencies]
          properties:
            resource_type: { type: string, enum: [MODEL, MODEL_CATALOG, TOKEN_ACCOUNT, TOKEN_ROUTE, PROVIDER_CREDENTIAL] }
            resource_id: { type: string, minLength: 1, maxLength: 400 }
            current_status: { type: string, minLength: 1, maxLength: 80 }
            current_version:
              type: object
              additionalProperties: false
              required: [evidence_etag, evidence_set_sha256]
              properties:
                catalog_version: { type: integer, format: int64, minimum: 1 }
                model_capability_version_id: { type: string, format: uuid }
                protocol_definition_id: { type: string, format: uuid }
                account_updated_at: { type: string, format: date-time }
                account_version: { type: integer, format: int64, minimum: 1 }
                route_generation: { type: integer, format: int64, minimum: 0 }
                route_version: { type: integer, format: int64, minimum: 0 }
                credential_version: { type: integer, minimum: 1 }
                evidence_etag: { type: string, pattern: '^"impact-[0-9a-f]{64}"$' }
                evidence_set_sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
            dependencies:
              type: object
              additionalProperties: false
              required: [routes, healthy_routes, provisionings, ready_provisionings, active_leases, inflight_requests, active_sessions, alternative_credentials, alternative_accounts, affected_coverage_tuples, remaining_ready_coverage, coverage_gaps]
              properties:
                routes: { type: integer, format: int64, minimum: 0 }
                healthy_routes: { type: integer, format: int64, minimum: 0 }
                provisionings: { type: integer, format: int64, minimum: 0 }
                ready_provisionings: { type: integer, format: int64, minimum: 0 }
                active_leases: { type: integer, format: int64, minimum: 0 }
                inflight_requests: { type: integer, format: int64, minimum: 0 }
                active_sessions: { type: integer, format: int64, minimum: 0 }
                alternative_credentials: { type: integer, format: int64, minimum: 0 }
                alternative_accounts: { type: integer, format: int64, minimum: 0 }
                affected_coverage_tuples:
                  type: integer
                  format: int64
                  minimum: 0
                  description: Count of distinct currently serviceable target route/account tuples `(scope_type, scope_id, wallet_id, model_id, upstream_model_ref, protocol_code)` frozen from the Token snapshot.
                remaining_ready_coverage:
                  type: integer
                  format: int64
                  minimum: 0
                  description: Count of affected tuples for which at least one candidate Token Account other than the target account provides an exact currently serviceable match on all six tuple fields.
                coverage_gaps:
                  type: integer
                  format: int64
                  minimum: 0
                  description: Exact invariant `coverage_gaps = affected_coverage_tuples - remaining_ready_coverage`; every gap is an affected tuple with no exact candidate after excluding the target account.
            replacement_model_id: { type: string, format: uuid }
            replacement_model_ready: { type: boolean }
        price_coverage:
          type: object
          additionalProperties: false
          required: [models_checked, models_covered, fully_covered, versions, billing_observed_at]
          properties:
            models_checked: { type: integer, minimum: 1, maximum: 5000 }
            models_covered: { type: integer, minimum: 0, maximum: 5000 }
            fully_covered: { type: boolean }
            versions:
              type: array
              maxItems: 5000
              items:
                type: object
                additionalProperties: false
                required: [model_id, protocol_code, credit_unit, covered]
                properties:
                  model_id: { type: string, format: uuid }
                  protocol_code: { type: string, pattern: '^[A-Z][A-Z0-9_]{0,79}$' }
                  formula_version_id: { type: string, format: uuid }
                  credit_unit: { type: string, const: MICROCREDIT }
                  covered: { type: boolean }
                  price_version_id: { type: string, format: uuid }
                  effective_from: { type: string, format: date-time }
                  effective_to: { type: string, format: date-time }
                oneOf:
                  - type: object
                    required: [formula_version_id, price_version_id, effective_from]
                    properties:
                      covered: { type: boolean, const: true }
                  - type: object
                    properties:
                      covered: { type: boolean, const: false }
                    not:
                      anyOf:
                        - required: [formula_version_id]
                          properties: { formula_version_id: {} }
                        - required: [price_version_id]
                          properties: { price_version_id: {} }
                        - required: [effective_from]
                          properties: { effective_from: {} }
                        - required: [effective_to]
                          properties: { effective_to: {} }
            billing_observed_at: { type: string, format: date-time }
        blockers: { type: array, uniqueItems: true, items: { type: string, pattern: '^[A-Z][A-Z0-9_]{0,119}$' } }
        token_observed_at: { type: string, format: date-time }
        billing_observed_at: { type: string, format: date-time }
        snapshot_semantics: { type: string, const: INDEPENDENT_TOKEN_AND_BILLING_SNAPSHOTS }
        precheck_fingerprint: { type: string, pattern: '^[0-9a-f]{64}$' }
        requires_cas_revalidation: { type: boolean, const: true }
