      parameters:
        - { name: anomaly_type, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [OPEN, RESOLVED] } }
        - { name: severity, in: query, schema: { type: string, enum: [P0, P1, P2] } }
        - { name: owner_id, in: query, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200": { $ref: "#/components/responses/Collection" }
        "403": { $ref: "#/components/responses/Error" }
  /billing/admin/v1/payment-anomalies/{case_id}:
    get:
      operationId: getAdminPaymentAnomaly
      summary: Get immutable evidence snapshot and audited case timeline
      parameters: [{ $ref: "#/components/parameters/CaseID" }]
      responses:
        "200": { description: Payment anomaly detail, content: { application/json: { schema: { $ref: "#/components/schemas/PaymentAnomalyDetail" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /billing/admin/v1/payment-anomalies/{case_id}/claim:
    post:
      operationId: claimAdminPaymentAnomaly
      summary: Idempotently claim a payment anomaly without resetting its SLA clock
      parameters: [{ $ref: "#/components/parameters/CaseID" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200": { description: Claimed case, content: { application/json: { schema: { $ref: "#/components/schemas/PaymentAnomalyCase" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /billing/admin/v1/payment-anomalies/{case_id}/resolve:
    post:
      operationId: resolveAdminPaymentAnomaly
      summary: Record a constrained audited conclusion; arbitrary financial repairs remain approval-gated
      parameters: [{ $ref: "#/components/parameters/CaseID" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PaymentAnomalyResolution" } } }
      responses:
        "200": { description: Resolved case, content: { application/json: { schema: { $ref: "#/components/schemas/PaymentAnomalyCase" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /billing/admin/v1/reconciliation-runs:
    get:
      operationId: listAdminReconciliationRuns
      summary: List recent payment reconciliation runs
      responses:
        "200": { $ref: "#/components/responses/Collection" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: runAdminReconciliation
      summary: Reconcile one payment channel and business date
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReconciliationCreate" }
      responses:
        "200": { description: Reconciliation completed }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /billing/admin/v1/reconciliation-imports:
    post:
      operationId: importAdminProviderBill
      summary: Import an immutable bounded Provider bill when the frozen adapter declares file support
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ReconciliationImport" } } }
      responses:
        "201": { description: File rows imported and reconciled }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /billing/admin/v1/reconciliation-runs/{run_id}/cases:
    get:
      operationId: listAdminReconciliationCases
      summary: List differences found by a reconciliation run
      parameters: [{ $ref: "#/components/parameters/RunID" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200": { $ref: "#/components/responses/Collection" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /billing/admin/v1/reconciliation-cases/{case_id}/commands:
    post:
      operationId: updateAdminReconciliationCase
      summary: Idempotently claim, assign, plan, resolve, ignore, or reopen one immutable reconciliation difference
      parameters: [{ $ref: "#/components/parameters/CaseID" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ReconciliationCaseCommand" } } }
      responses:
        "200": { description: Updated reconciliation case, content: { application/json: { schema: { $ref: "#/components/schemas/ReconciliationCase" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /token/admin/v1/overview:
    get:
      operationId: getAdminTokenOverview
      summary: Get platform-wide Token account, route, and usage counts
      description: Requires platform.tokens.read, platform.usage.read, or platform.system.status.read. Token and usage fields are independently omitted unless their permission domain is granted; system status receives reconciliation fields only.
      responses:
        "200": { $ref: "#/components/responses/TokenOverview" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /token/admin/v1/token-accounts:
    get:
      operationId: listAdminTokenAccounts
      summary: List recently updated Token accounts without credential secrets
      parameters: [{ $ref: "#/components/parameters/Limit" }]
      responses:
        "200": { $ref: "#/components/responses/Collection" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: createAdminTokenAccount
      summary: Create a PLATFORM-managed Token account for a personal, organization, or organization-unit scope
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminTokenAccountCreate" }
      responses:
        "201": { description: PLATFORM-managed Token account created, content: { application/json: { schema: { $ref: "#/components/schemas/AdminTokenAccount" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /token/admin/v1/token-accounts/{token_account_id}:
    get:
      operationId: getAdminTokenAccount
      summary: Get a Token account with routes and credential metadata only
      parameters: [{ $ref: "#/components/parameters/TokenAccountID" }]
      responses:
        "200": { $ref: "#/components/responses/Overview" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /token/admin/v1/token-accounts/{token_account_id}/status:
    patch:
      operationId: setAdminTokenAccountStatus
      summary: Enable or disable a Token account
      parameters: [{ $ref: "#/components/parameters/TokenAccountID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenAccountStatusChange" }
      responses:
        "200": { $ref: "#/components/responses/Overview" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /token/admin/v1/token-accounts/{token_account_id}/routes:
    put:
      operationId: upsertAdminTokenRoute
      summary: Create or replace a model routing policy
      parameters: [{ $ref: "#/components/parameters/TokenAccountID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenRouteChange" }
      responses:
        "200": { $ref: "#/components/responses/Overview" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteAdminTokenRoute
      summary: Delete a model routing policy
      parameters: [{ $ref: "#/components/parameters/TokenAccountID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model]
              properties: { model: { type: string } }
      responses:
        "204": { description: Route deleted }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /token/admin/v1/token-accounts/{token_account_id}/credentials/{credential_id}/validate:
    post:
      operationId: validateAdminProviderCredential
      summary: Validate a provider credential without returning its secret, ciphertext, or endpoint
      parameters: [{ $ref: "#/components/parameters/TokenAccountID" }, { $ref: "#/components/parameters/CredentialID" }]
      responses:
        "200": { description: Uniform redacted credential validation result, content: { application/json: { schema: { $ref: "#/components/schemas/CredentialValidationResult" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /token/admin/v1/usage-requests:
    get:
      operationId: listAdminUsageRequests
      summary: List recent model usage and settlement requests
      parameters: [{ $ref: "#/components/parameters/Limit" }]
      responses:
        "200": { $ref: "#/components/responses/Collection" }
        "403": { $ref: "#/components/responses/Error" }
  /token/admin/v1/usage-requests/{usage_request_id}:
    get:
      operationId: getAdminUsageRequest
      summary: Get settlement and provider-neutral Adapter correlation metadata without conversation content
      parameters: [{ $ref: "#/components/parameters/UsageRequestID" }]
      responses:
        "200": { $ref: "#/components/responses/Overview" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /token/admin/v1/usage-requests/{usage_request_id}/retry-reconciliation:
    post:
      operationId: retryAdminUsageReconciliation
      summary: Idempotently retry evidence reconciliation without resending the model request
      parameters:
        - { $ref: "#/components/parameters/UsageRequestID" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Reason" }
      responses:
        "200": { $ref: "#/components/responses/Overview" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /token/admin/v1/protocols:
    get:
      operationId: listAdminProtocolsAndFormulas
      summary: List versioned protocol definitions and safe formula versions
      responses:
        "200": { description: Protocol and formula versions }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: createAdminProtocolDraft
      summary: Create a new protocol definition draft version
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProtocolDraft" } } }
      responses:
        "201": { description: Protocol draft created }
        "403": { $ref: "#/components/responses/Error" }
  /token/admin/v1/protocols/{protocol_definition_id}/publish:
    post:
      operationId: publishAdminProtocol
      summary: Publish an immutable protocol definition version
      parameters: [{ name: protocol_definition_id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Protocol version published }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /token/admin/v1/protocols/{protocol_definition_id}/formulas:
    post:
      operationId: createAdminFormulaDraft
      summary: Create a safe parameter-map formula draft bound to exact unit versions
      parameters: [{ name: protocol_definition_id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/FormulaDraft" } } }
      responses:
        "201": { description: Formula draft created }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /token/admin/v1/formulas/{formula_version_id}/publish:
    post:
      operationId: publishAdminFormula
      summary: Publish an immutable formula and synchronize its snapshot to Billing
      parameters: [{ name: formula_version_id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Formula published and synchronized }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /token/admin/v1/formulas/{formula_version_id}/preview:
    get:
      operationId: previewAdminFormula
      summary: Validate and preview deterministic zero-default evaluation without executing arbitrary code
      parameters: [{ name: formula_version_id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Safe formula preview }
        "403": { $ref: "#/components/responses/Error" }
  /token/admin/v1/models:
    get:
      operationId: listAdminCatalogModels
      summary: List current catalog models, immutable tombstones, and editable drafts
      responses:
        "200": { description: Current model catalog and drafts, content: { application/json: { schema: { $ref: "#/components/schemas/AdminModelCatalog" } } } }
        "403": { $ref: "#/components/responses/Error" }
  /token/admin/v1/models/{model_id}/draft:
    put:
      operationId: saveAdminModelDraft
      summary: Create or CAS-update a DRAFT without mutating published history
      parameters: [{ $ref: "#/components/parameters/ModelID" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ModelDraftChange" } } } }
      responses:
        "200": { description: Draft saved }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /token/admin/v1/models/{model_id}/publish:
    post:
      operationId: publishAdminModelDraft
      summary: Publish an immutable catalog revision with stable idempotency
      parameters: [{ $ref: "#/components/parameters/ModelID" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ModelPublishCommand" } } } }
      responses:
        "200": { description: New catalog version published }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /token/admin/v1/models/{model_id}/lifecycle:
    post:
      operationId: transitionAdminModelLifecycle
      summary: Deprecate or remove a model using legal forward-only transitions and explicit cutoffs
      parameters: [{ $ref: "#/components/parameters/ModelID" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ModelLifecycleCommand" } } } }
      responses:
        "200": { description: New catalog version published }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /token/admin/v1/models:sync:
    post:
      operationId: synchronizeAdminModelCatalog
      summary: Discover models through the selected Adapter and record consecutive absence evidence
      responses:
        "200": { description: Synchronization result }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /token/admin/v1/model-catalog:rollback:
    post:
      operationId: rollbackAdminModelCatalog
      summary: Copy a historical version forward after current validation without reviving REMOVED models
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ModelCatalogRollbackCommand" } } } }
      responses:
        "200": { description: Forward rollback version published }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /token/admin/v1/provisionings:
    get:
      operationId: listAdminRouteProvisionings
      summary: List managed route provisioning state without credential secrets
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { name: status, in: query, schema: { type: string, enum: [PENDING, READY, FAILED, REPAIR_REQUIRED] } }
      responses:
        "200":
          description: Managed route provisioning state
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/RouteProvisioning" } }
        "403": { $ref: "#/components/responses/Error" }
  /token/admin/v1/provisionings/{provisioning_id}:
    get:
      operationId: getAdminRouteProvisioning
      summary: Get one provisioning generation and its bounded attempt history
      parameters: [{ $ref: "#/components/parameters/ProvisioningID" }]
      responses:
        "200": { description: Provisioning detail, content: { application/json: { schema: { $ref: "#/components/schemas/ProvisioningDetail" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /token/admin/v1/provisionings/{provisioning_id}/repair:
    post:
      operationId: repairAdminRouteProvisioning
      summary: Start a new bounded repair round for a terminal failed provisioning
      parameters: [{ $ref: "#/components/parameters/ProvisioningID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "202": { description: Repair round accepted, content: { application/json: { schema: { $ref: "#/components/schemas/RouteProvisioning" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /account/admin/v1/approval-policies:
    get:
      operationId: listAdminApprovalPolicies
      summary: List the immutable command classifications for the active policy version
      responses:
        "200":
          description: Active command policy registry
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [policy_version, items]
                properties:
                  policy_version: { type: integer, format: int64, minimum: 1 }
                  items: { type: array, items: { $ref: "#/components/schemas/ApprovalPolicy" } }
        "403": { $ref: "#/components/responses/Error" }
  /account/admin/v1/approval-requests:
    get:
      operationId: listAdminApprovalRequests
      summary: Search approval requests visible to the requester or an authorized approver
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { name: command_type, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/ApprovalStatus" } }
        - { name: risk_class, in: query, schema: { type: string } }
        - { name: requester_user_id, in: query, schema: { type: string, format: uuid } }
        - { name: target, in: query, schema: { type: string, maxLength: 160 } }
        - { name: submitted_from, in: query, schema: { type: string, format: date-time } }
        - { name: submitted_to, in: query, schema: { type: string, format: date-time } }
        - { name: expires_from, in: query, schema: { type: string, format: date-time } }
        - { name: expires_to, in: query, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: Approval requests with server-authorized actions
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items: { type: array, maxItems: 200, items: { $ref: "#/components/schemas/ApprovalRequest" } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: createAdminApprovalDraft
      summary: Create an idempotent draft for a command classified as approval-required
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApprovalDraft" }
      responses:
        "201":
          description: Approval draft created
          content: { application/json: { schema: { $ref: "#/components/schemas/ApprovalRequest" } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /account/admin/v1/approval-requests/{approval_request_id}:
    get:
      operationId: getAdminApprovalRequest
      summary: Get one immutable approval command and its current allowed actions
      parameters: [{ $ref: "#/components/parameters/ApprovalRequestID" }]
      responses:
        "200": { description: Approval request, content: { application/json: { schema: { $ref: "#/components/schemas/ApprovalRequest" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      operationId: updateAdminApprovalDraft
      summary: Replace a draft before submission using optimistic concurrency
      parameters: [{ $ref: "#/components/parameters/ApprovalRequestID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/ApprovalDraft" }
                - type: object
                  required: [expected_version]
                  properties: { expected_version: { type: integer, format: int64, minimum: 1 } }
      responses:
        "200": { description: Updated approval draft, content: { application/json: { schema: { $ref: "#/components/schemas/ApprovalRequest" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /account/admin/v1/approval-requests/{approval_request_id}/actions/submit:
    post:
      operationId: submitAdminApprovalRequest
      summary: Freeze and submit a draft for independent approval
      parameters: [{ $ref: "#/components/parameters/ApprovalRequestID" }]
      requestBody: { $ref: "#/components/requestBodies/VersionTransition" }
      responses:
        "200": { description: Submitted approval request, content: { application/json: { schema: { $ref: "#/components/schemas/ApprovalRequest" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /account/admin/v1/approval-requests/{approval_request_id}/actions/withdraw:
    post:
      operationId: withdrawAdminApprovalRequest
      summary: Withdraw the requester's own submitted approval request
      parameters: [{ $ref: "#/components/parameters/ApprovalRequestID" }]
      requestBody: { $ref: "#/components/requestBodies/VersionTransition" }
      responses:
        "200": { description: Withdrawn approval request, content: { application/json: { schema: { $ref: "#/components/schemas/ApprovalRequest" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /account/admin/v1/approval-requests/{approval_request_id}/actions/decide:
    post:
      operationId: decideAdminApprovalRequest
      summary: Approve or reject using an independent current authorization binding
      parameters: [{ $ref: "#/components/parameters/ApprovalRequestID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApprovalDecision" }
      responses:
        "200": { description: Decided approval request, content: { application/json: { schema: { $ref: "#/components/schemas/ApprovalRequest" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: /realms/pinvou/.well-known/openid-configuration
  parameters:
    CatalogItemID:
      name: catalog_item_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ModelID:
      name: model_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Search:
      name: q
      in: query
      description: Case-insensitive display name, email, or exact UUID search.
      schema: { type: string, maxLength: 320 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string, minLength: 1, maxLength: 512 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 128 }
    UserID:
      name: user_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserCode:
      name: user_code
      in: path
      required: true
