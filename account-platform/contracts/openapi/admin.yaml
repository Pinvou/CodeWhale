      responses:
        "200": { description: Transition applied, content: { application/json: { schema: { $ref: "#/components/schemas/RechargeProduct" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
