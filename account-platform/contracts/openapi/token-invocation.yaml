                    "type": "integer",
                    "description": "0/omitted defaults900; explicit range30..1800"
                  },
                  "additional_microcredits": {
                    "type": "integer",
                    "format": "int64",
                    "minimum": 0
                  },
                  "operation_id": {
                    "type": [
                      "string",
                      "null"
                    ],
                    "format": "uuid",
                    "description": "Required nonzero stable logical-operation UUID for positive additional_microcredits. Reuse for retries; an independent addition uses a different ID even when the amount matches. Zero-only lease renewal omits this field or uses null/zero UUID."
                  }
                },
                "additionalProperties": false,
                "oneOf": [
                  {
                    "required": [
