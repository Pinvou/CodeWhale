            "name": "X-Pinvou-Delivery-ID",
            "in": "header",
            "required": false,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Actual current success projection.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "additionalProperties": true
                }
              },
              "text/event-stream": {
                "schema": {
                  "type": "string",
                  "description": "Stored SSE sequence replay includes original DONE event; unknown trusted usage remains pending settlement."
                }
              }
            }
          },
          "default": {
            "description": "Stable error or explicit unavailable; no success/effect inference from missing ACK."
          },
          "503": {
            "description": "The proxy preserves upstream503 status, original media type and body, including arbitrary JSON or non-JSON; these are not constrained to gateway api.Error and do not prove no dispatch or no effect. Gateway-produced PROVIDER_CREDENTIAL_UNAVAILABLE and USAGE_STATE_UNCONFIRMED receipts have the separate precise component definitions CredentialUnavailableReceipt and UsageStateUnconfirmedReceipt. Only the former, atomically recorded under the original RECEIVED/v1 no-hold/no-preparation/no-dispatch/no-prior-result fence, carries FAILED/RELEASED meaning. It preserves the original usage identity and30-day result/90-day tombstone retention; expiry follows existing410. The latter means the accepted original usage could not be read and authorizes no terminal/no-effect inference. If another actor progressed, the credential-failure actor preserves its facts and returns the authoritative read-only state/result. A provider body containing a matching code is not by itself evidence of the gateway receipt or authority to replace an accepted identity, route or dispatch. A local PROVIDER_CIRCUIT_OPEN follows the same exact untouched acceptance fence and persists its503 receipt. A concurrently progressed usage returns its authoritative read-only state/result, never a locally inferred release. Retry-After describes the current circuit and is not authorization for a new usage identity or redispatch.",
            "content": {
              "application/json": {
                "schema": {}
              },
              "*/*": {
                "schema": {}
              }
            }
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "model"
                ],
                "properties": {
                  "model": {
                    "type": "string",
                    "minLength": 1
                  },
                  "stream": {
                    "type": "boolean"
                  },
                  "max_tokens": {
                    "type": "integer",
                    "format": "int64"
                  },
                  "max_completion_tokens": {
                    "type": "integer",
                    "format": "int64"
                  }
                },
                "additionalProperties": true
              }
            }
          }
        }
      }
    },
    "/v1/usage-requests/by-idempotency-key": {
      "get": {
        "operationId": "token_getOwnedUsageByIdempotencyKey",
        "x-go-handler": "getOwnedUsageByIdempotencyKey",
        "x-service": "token",
        "x-permission": "personal.usage.cancel",
        "description": "Read-only recovery using the original invocation key. Current stable authenticated user must own the original personal or organizational invocation. Current context and membership changes do not change that ownership. Full list/detail remain context-scoped. A missing receipt never proves no effect or authorizes a new invocation.",
        "security": [
          {
            "UserBearer": []
          }
        ],
        "parameters": [
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "minLength": 16,
              "maxLength": 128
            }
          }
        ],
        "responses": {
          "200": {
            "description": "The original owned usage identity and current durable states; no dispatch, cancellation write or funds release.",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "const": "no-store"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "additionalProperties": false,
                  "required": [
                    "usage_request_id",
                    "execution_status",
                    "delivery_status",
                    "cancel_status",
                    "settlement_status"
                  ],
                  "properties": {
                    "usage_request_id": {
                      "type": "string",
                      "format": "uuid"
                    },
                    "execution_status": {
                      "type": "string"
                    },
                    "delivery_status": {
                      "type": "string"
                    },
                    "cancel_status": {
                      "type": "string"
                    },
                    "settlement_status": {
                      "type": "string"
                    }
                  }
                }
              }
            }
          },
          "404": {
            "description": "No readable original-owner receipt found. The original outcome remains unknown; do not infer no effect or redispatch."
          },
          "default": {
            "description": "Authorization, invalid-key or temporary failure; never a no-effect receipt."
          }
        }
      }
