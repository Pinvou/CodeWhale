    "/v1/chat/completions": {
      "post": {
        "operationId": "token_chatCompletions",
        "x-go-handler": "chatCompletions",
        "x-service": "token",
        "x-permission": "personal.model.invoke",
        "security": [
          {
            "UserBearer": []
          }
        ],
        "parameters": [
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "minLength": 16,
              "maxLength": 128
            }
          },
          {
            "name": "X-Pinvou-Logical-Turn-ID",
            "in": "header",
            "required": false,
            "schema": {
              "type": "string",
              "pattern": "^[A-Za-z0-9_-]{16,128}$"
            }
          },
          {
            "name": "X-Pinvou-Client-Capabilities",
            "in": "header",
            "required": false,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "X-Pinvou-Conversation-Mode",
            "in": "header",
            "required": false,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "Last-Event-ID",
            "in": "header",
            "required": false,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "X-Pinvou-Delivery-ID",
            "in": "header",
            "required": false,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Actual current success projection.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "additionalProperties": true
                }
              },
              "text/event-stream": {
                "schema": {
                  "type": "string",
                  "description": "Stored SSE sequence replay includes original DONE event; unknown trusted usage remains pending settlement."
                }
              }
            }
          },
          "default": {
            "description": "Stable error or explicit unavailable; no success/effect inference from missing ACK."
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "model"
                ],
                "properties": {
                  "model": {
                    "type": "string",
                    "minLength": 1
                  },
                  "stream": {
                    "type": "boolean"
                  },
                  "max_tokens": {
                    "type": "integer",
                    "format": "int64"
                  },
                  "max_completion_tokens": {
                    "type": "integer",
                    "format": "int64"
                  }
                },
                "additionalProperties": true
              }
            }
          }
        }
      }
    },
    "/v1/usage-requests/by-idempotency-key": {
      "get": {
        "operationId": "token_getPersonalUsageByIdempotencyKey",
        "x-go-handler": "getPersonalUsageByIdempotencyKey",
        "x-service": "token",
        "x-permission": "personal.usage.cancel",
        "description": "Read-only recovery using the original invocation key. Persisted owner must match and organization must be null. Current context selection and login session do not authorize organization resources. A missing receipt never proves no effect or authorizes a new invocation.",
        "security": [{ "UserBearer": [] }],
        "parameters": [{
          "name": "Idempotency-Key", "in": "header", "required": true,
          "schema": { "type": "string", "minLength": 16, "maxLength": 128 }
        }],
        "responses": {
          "200": {
            "description": "The original personal usage identity and current durable states; no dispatch, cancellation write or funds release.",
            "headers": { "Cache-Control": { "schema": { "type": "string", "const": "no-store" } } },
            "content": { "application/json": { "schema": {
              "type": "object", "additionalProperties": false,
              "required": ["usage_request_id", "execution_status", "delivery_status", "cancel_status", "settlement_status"],
              "properties": {
                "usage_request_id": { "type": "string", "format": "uuid" },
                "execution_status": { "type": "string" },
                "delivery_status": { "type": "string" },
                "cancel_status": { "type": "string" },
                "settlement_status": { "type": "string" }
              }
            } } }
          },
          "404": { "description": "No readable personal receipt found. The original outcome remains unknown; do not infer no effect or redispatch." },
          "default": { "description": "Authorization, invalid-key or temporary failure; never a no-effect receipt." }
        }
      }
    },
