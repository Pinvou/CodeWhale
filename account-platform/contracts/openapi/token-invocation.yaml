                      "operation_id"
                    ],
                    "properties": {
                      "additional_microcredits": {
                        "type": "integer",
                        "format": "int64",
                        "minimum": 1
                      },
                      "operation_id": {
                        "type": "string",
                        "format": "uuid",
                        "not": {
                          "enum": [
                            "00000000-0000-0000-0000-000000000000"
                          ]
                        }
                      }
                    }
                  },
                  {
                    "properties": {
                      "additional_microcredits": {
                        "type": "integer",
                        "format": "int64",
                        "enum": [
                          0
                        ]
                      },
                      "operation_id": {
                        "type": [
                          "string",
                          "null"
                        ],
                        "format": "uuid",
                        "enum": [
                          null,
                          "00000000-0000-0000-0000-000000000000"
                        ]
                      }
                    }
                  }
                ]
              }
            }
