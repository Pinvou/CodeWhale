  "components": {
    "securitySchemes": {
      "UserBearer": {
        "type": "http",
        "scheme": "bearer"
      }
    },
    "schemas": {
      "PartialProjection": {
        "type": "object",
        "additionalProperties": true,
        "description": "Existing Billing projection forwarded without inventing fields; financial integer values are JSON int64, consumers must decode losslessly."
      },
      "OrganizationModelPolicy": {
        "type": "object",
        "properties": {
          "organization_id": {
            "type": "string",
            "format": "uuid"
          },
          "version": {
            "type": "integer",
            "format": "int64"
          },
          "mode": {
            "type": "string",
            "enum": [
              "ALLOW_ALL",
              "ALLOW_LIST",
              "DENY_LIST"
            ]
          },
          "model_ids": {
            "type": "array",
            "items": {
              "type": "string",
              "format": "uuid"
            }
          },
          "authorization_version": {
            "type": "integer",
            "format": "int64"
          },
          "updated_by": {
            "type": "string",
            "format": "uuid"
          },
          "updated_at": {
            "type": "string",
            "format": "date-time"
          }
        },
        "required": [
          "organization_id",
          "version",
          "mode",
          "model_ids",
          "authorization_version"
        ]
      },
      "ModelPolicyWrite": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "mode",
          "reason"
        ],
        "properties": {
          "expected_version": {
            "type": "integer",
            "format": "int64",
            "minimum": 0,
            "default": 0,
            "description": "Current Go decoder defaults omission to zero, valid only for the initial absent policy; subsequent writes must match the frozen version."
          },
          "mode": {
            "type": "string",
            "enum": [
              "ALLOW_ALL",
              "ALLOW_LIST",
              "DENY_LIST"
            ]
          },
          "model_ids": {
            "type": "array",
            "items": {
              "type": "string",
              "format": "uuid"
            },
            "default": [],
            "description": "Current owner normalizes omission/null to the empty selection. ALLOW_ALL accepts only an empty selection.",
            "nullable": true
          },
          "reason": {
            "type": "string"
          }
        }
      },
      "RechargeOrderWrite": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "product_id",
          "channel"
        ],
        "properties": {
          "product_id": {
            "type": "string"
          },
          "channel": {
            "type": "string"
          }
        }
      },
      "QuotaBatchWrite": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "items"
        ],
        "properties": {
          "items": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/QuotaItem"
            },
            "minItems": 1,
            "maxItems": 200
          }
        }
      },
      "QuotaItem": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "member_user_id",
          "membership_version",
          "package_id",
          "component_id",
          "component_type",
          "amount_microcredits"
        ],
        "properties": {
          "member_user_id": {
            "type": "string",
            "format": "uuid"
          },
          "membership_version": {
            "type": "integer",
            "format": "int64"
          },
          "package_id": {
            "type": "string",
            "format": "uuid"
          },
          "component_id": {
            "type": "string",
            "format": "uuid"
          },
          "component_type": {
            "type": "string",
            "enum": [
              "BASE",
              "BONUS"
            ]
          },
          "amount_microcredits": {
            "type": "integer",
            "format": "int64"
          }
        }
      },
      "QuotaRevokeWrite": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "reason"
        ],
        "properties": {
          "reason": {
            "type": "string"
          }
        }
      },
      "ClosedGrantReclaimRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "reason"
        ],
        "properties": {
          "reason": {
            "type": "string",
            "minLength": 1,
            "maxLength": 500,
            "description": "Whitespace is trimmed before applying the existing Unicode-character bound."
          }
        }
      },
      "ClosedGrantReclaimBatchRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "grant_ids",
          "reason"
        ],
        "properties": {
          "grant_ids": {
            "type": "array",
            "minItems": 1,
            "maxItems": 200,
            "uniqueItems": true,
            "items": {
              "type": "string",
              "format": "uuid"
            },
            "description": "A zero UUID is handled as an individual failed item, preserving independently committed batch results."
          },
          "reason": {
            "type": "string",
            "minLength": 1,
            "maxLength": 500,
            "description": "Whitespace is trimmed before applying the existing Unicode-character bound."
          }
        }
      },
      "ClosedGrantReclaimReceipt": {
        "type": "object",
        "description": "Selected frozen receipt projection validated by the gateway; other Billing grant projection fields remain partial.",
        "required": [
          "grant",
          "amount_microcredits",
          "subject_lifecycle_version",
          "replayed"
        ],
        "properties": {
          "grant": {
            "type": "object",
            "required": [
              "grant_id",
              "organization_id",
              "status"
            ],
            "properties": {
              "grant_id": {
                "type": "string",
                "format": "uuid"
              },
              "organization_id": {
                "type": "string",
                "format": "uuid"
              },
              "status": {
                "type": "string",
                "enum": [
                  "RECLAIMED_ACCOUNT_CLOSED"
                ]
              }
            }
          },
          "amount_microcredits": {
            "type": "integer",
            "format": "int64",
            "minimum": 1
          },
          "subject_lifecycle_version": {
            "type": "integer",
            "format": "int64",
            "minimum": 2
          },
          "replayed": {
            "type": "boolean"
          }
        }
      },
      "ClosedGrantReclaimBatchResult": {
        "type": "object",
        "required": [
          "items"
        ],
        "properties": {
          "items": {
            "type": "array",
            "items": {
              "type": "object",
              "required": [
                "grant_id",
                "status"
              ],
              "properties": {
                "grant_id": {
                  "type": "string",
                  "format": "uuid"
                },
                "status": {
                  "type": "string",
                  "enum": [
                    "SUCCEEDED",
                    "FAILED"
                  ]
                },
                "result": {
                  "$ref": "#/components/schemas/ClosedGrantReclaimReceipt"
                },
                "code": {
                  "type": "string",
                  "enum": [
                    "COMMAND_RESULT_UNKNOWN",
                    "ACCOUNT_CLOSED_GRANT_RECLAIM_REJECTED"
                  ]
                }
              }
            }
          }
        },
        "description": "Each item commits independently. SUCCEEDED includes result; FAILED includes code. Retry retains the original batch key and stable indexed grant subkeys."
      },
      "OrganizationOrderHistoryPage": {
        "type": "object",
        "required": [
          "organization_id",
          "items",
          "next_cursor"
        ],
        "properties": {
          "organization_id": {
            "type": "string",
            "format": "uuid"
          },
          "items": {
            "type": "array",
            "maxItems": 50,
            "items": {
              "$ref": "#/components/schemas/PartialProjection"
            }
          },
          "next_cursor": {
            "type": "string",
            "nullable": true,
            "maxLength": 256
          }
        },
        "description": "Order summaries retain exact money encoding and snapshot product facts. Full order/payment details still use the existing requester-scoped endpoint."
      }
    }
  }
}
