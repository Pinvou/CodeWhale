        "responses": {
          "207": {
            "description": "Per-item SUCCEEDED, FAILED (known business rejection) or UNKNOWN. Any UNKNOWN requires retaining the original parent key and complete ordered facts for manual whole-batch retry; 207 alone does not prove completion.",
