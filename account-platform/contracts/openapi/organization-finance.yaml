            "description": "A zero UUID is handled as an individual failed item, preserving independently committed batch results."
          },
          "reason": {
            "type": "string",
            "minLength": 1,
            "maxLength": 500,
            "description": "Whitespace is trimmed before applying the existing Unicode-character bound."
          }
        }
      },
      "ClosedGrantReclaimReceipt": {
        "type": "object",
        "description": "Selected frozen receipt projection validated by the gateway; other Billing grant projection fields remain partial.",
        "required": [
          "grant",
          "amount_microcredits",
          "subject_lifecycle_version",
          "replayed"
        ],
        "properties": {
          "grant": {
            "type": "object",
            "required": [
              "grant_id",
              "organization_id",
              "status"
            ],
            "properties": {
              "grant_id": {
                "type": "string",
                "format": "uuid"
              },
              "organization_id": {
                "type": "string",
                "format": "uuid"
              },
              "status": {
                "type": "string",
                "enum": [
                  "RECLAIMED_ACCOUNT_CLOSED"
                ]
              }
            }
          },
          "amount_microcredits": {
            "type": "integer",
            "format": "int64",
            "minimum": 1
          },
          "subject_lifecycle_version": {
            "type": "integer",
            "format": "int64",
            "minimum": 2
          },
          "replayed": {
            "type": "boolean"
          }
        }
      },
      "ClosedGrantReclaimBatchResult": {
        "type": "object",
        "required": [
          "items"
        ],
        "properties": {
          "items": {
            "type": "array",
            "items": {
              "type": "object",
              "required": [
                "grant_id",
                "status"
              ],
              "properties": {
                "grant_id": {
                  "type": "string",
                  "format": "uuid"
                },
                "status": {
                  "type": "string",
                  "enum": [
                    "SUCCEEDED",
                    "FAILED"
                  ]
                },
                "result": {
                  "$ref": "#/components/schemas/ClosedGrantReclaimReceipt"
                },
                "code": {
                  "type": "string",
                  "enum": [
                    "COMMAND_RESULT_UNKNOWN",
                    "ACCOUNT_CLOSED_GRANT_RECLAIM_REJECTED"
                  ]
                }
              }
            }
          }
        },
        "description": "Each item commits independently. SUCCEEDED includes result; FAILED includes code. Retry retains the original batch key and stable indexed grant subkeys."
      }
    }
  }
