              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/PartialProjection"
                }
              }
            }
          },
          "409": {
            "description": "The parent key was already frozen with different actor or ordered request facts; no child allocation is attempted."
          },
          "503": {
            "description": "Parent persistence outcome is unknown. Retain the original key and complete ordered facts; do not create a new logical batch."
          },
          "default": {
            "description": "Existing bearer/organization authority and handler error mapping; no new response behavior is introduced."
