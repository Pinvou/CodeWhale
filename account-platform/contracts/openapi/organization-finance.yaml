      },
      "OrganizationModelPolicy": {
        "type": "object",
        "properties": {
          "organization_id": {
            "type": "string",
            "format": "uuid"
          },
          "version": {
            "type": "integer",
            "format": "int64"
          },
          "mode": {
            "type": "string",
            "enum": [
              "ALLOW_ALL",
              "ALLOW_LIST",
              "DENY_LIST"
            ]
          },
          "model_ids": {
            "type": "array",
            "items": {
              "type": "string",
              "format": "uuid"
            }
          },
          "authorization_version": {
            "type": "integer",
            "format": "int64"
          },
          "updated_by": {
            "type": "string",
            "format": "uuid"
          },
          "updated_at": {
            "type": "string",
            "format": "date-time"
          }
        },
        "required": [
          "organization_id",
          "version",
          "mode",
          "model_ids",
          "authorization_version"
        ]
      },
      "ModelPolicyWrite": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "mode",
          "reason"
        ],
        "properties": {
          "expected_version": {
            "type": "integer",
            "format": "int64",
            "minimum": 0,
            "default": 0,
            "description": "Current Go decoder defaults omission to zero, valid only for the initial absent policy; subsequent writes must match the frozen version."
          },
          "mode": {
            "type": "string",
            "enum": [
              "ALLOW_ALL",
              "ALLOW_LIST",
              "DENY_LIST"
            ]
          },
          "model_ids": {
            "type": "array",
            "items": {
              "type": "string",
              "format": "uuid"
            },
            "default": [],
            "description": "Current owner normalizes omission/null to the empty selection. ALLOW_ALL accepts only an empty selection.",
            "nullable": true
          },
          "reason": {
            "type": "string"
          }
        }
      },
      "RechargeOrderWrite": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "product_id",
          "channel"
