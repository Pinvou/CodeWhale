openapi: 3.1.0
info:
  title: Pinvou Account Platform Common Types
  version: 0.1.0
paths: {}
components:
  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [code, message, request_id]
      properties:
        code:
          type: string
          enum:
            - AUTH_REQUIRED
            - ACTIVE_ORG_FORBIDDEN
            - MEMBERSHIP_REVOKED
            - TOKEN_ACCOUNT_NOT_ELIGIBLE
            - IDEMPOTENCY_CONFLICT
            - CONTEXT_CHANGED
            - ORDER_PRODUCT_INVALID
            - ORDER_EXPIRED
            - WALLET_INSUFFICIENT
            - USAGE_ALREADY_SETTLED
            - PAYMENT_PROVIDER_UNAVAILABLE
            - BILLING_UNAVAILABLE
            - INVALID_REQUEST
            - NOT_FOUND
            - ACCOUNT_FORBIDDEN
            - ACCOUNT_CONFLICT
            - LAST_OWNER_REQUIRED
            - ORG_UNIT_HIERARCHY_INVALID
            - INVITATION_EXPIRED
            - SERVICE_AUTH_REQUIRED
            - BILLING_CONFLICT
            - WALLET_UNAVAILABLE
            - CLIENT_UPGRADE_REQUIRED
            - INTERNAL_ERROR
        message:
          type: string
        request_id:
          type: string
        details:
          type: object
          additionalProperties: true
    Context:
      type: object
      additionalProperties: false
      required: [context_type, membership_version, context_version, authorization_version, personal_authorization_version, platform_authorization_version, organization_authorization_version, permissions]
      properties:
        context_type:
          type: string
          enum: [PERSONAL, ORGANIZATION]
        organization_id:
          type: [string, "null"]
          format: uuid
        membership_version:
          type: integer
          minimum: 1
        context_version:
          type: integer
          minimum: 1
        authorization_version:
          type: integer
          minimum: 1
          description: Compatibility projection for the current personal or organization context.
        personal_authorization_version:
          type: integer
          minimum: 1
        platform_authorization_version:
          type: integer
          minimum: 1
        organization_authorization_version:
          type: integer
          minimum: 1
        permissions:
          type: array
          uniqueItems: true
          items:
            type: string
