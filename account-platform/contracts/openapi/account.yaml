openapi: 3.1.0
info:
  title: Pinvou Account Service API
  version: 0.1.0
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /v1
security:
  - oidc: []
paths:
  /auth/registration/precheck:
    post:
      security: []
      operationId: precheckMobileRegistration
      summary: Validate username and mobile availability using an opaque Identity password reference
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, mobile, password_handle, password_policy_version]
              properties:
                username: { type: string, minLength: 3, maxLength: 32 }
                mobile: { type: string }
                password_handle: { type: string, minLength: 43, maxLength: 43 }
                password_policy_version: { type: string, minLength: 1, maxLength: 64 }
      responses:
        "200":
          description: Registration fields are valid and available
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /auth/captcha/challenges:
    post:
      security: []
      operationId: createSliderCaptcha
      summary: Create a mobile- and purpose-bound slider challenge
      responses:
        "201":
          description: Slider challenge with PNG background and puzzle piece
        "400":
          $ref: "#/components/responses/Error"
  /auth/sms/challenges:
    post:
      security: []
      operationId: sendSMSChallenge
      summary: Send an SMS after registration precheck and slider verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [mobile, purpose, captcha_id, captcha_offset]
              properties:
                username: { type: string, maxLength: 32 }
                mobile: { type: string }
                password_handle: { type: string, maxLength: 43 }
                password_policy_version: { type: string, maxLength: 64 }
                purpose: { type: string, enum: [REGISTER, LOGIN, PASSWORD_RESET] }
                captcha_id: { type: string, format: uuid }
                captcha_offset: { type: integer, minimum: 0 }
      responses:
        "202":
          description: SMS challenge accepted; REGISTER also returns the scoped recovery operation and query token
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [challenge_id, expires_at, retry_after_seconds]
                properties:
                  challenge_id: { type: string, format: uuid }
                  expires_at: { type: string, format: date-time }
                  retry_after_seconds: { type: integer, minimum: 1 }
                  registration_operation_id: { type: string, format: uuid }
                  registration_query_token: { type: string, minLength: 80, maxLength: 256 }
                  registration_query_token_expires_at: { type: string, format: date-time }
        "400":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /auth/register:
    post:
      security: []
      operationId: registerMobile
      summary: Register a mobile identity after provider-side SMS verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, mobile, challenge_id, code, password_handle, password_policy_version, registration_operation_id, registration_query_token]
              properties:
                username: { type: string, minLength: 3, maxLength: 32 }
                mobile: { type: string }
                challenge_id: { type: string, format: uuid }
                code: { type: string, minLength: 1, maxLength: 16 }
                password_handle: { type: string, minLength: 43, maxLength: 43 }
                password_policy_version: { type: string, minLength: 1, maxLength: 64 }
                registration_operation_id: { type: string, format: uuid }
                registration_query_token: { type: string, minLength: 80, maxLength: 256 }
      responses:
        "201":
          description: Account provisioning started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegistrationStatus" }
        "202":
          description: Identity or Account recovery continues asynchronously; the client must query the original operation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegistrationStatus" }
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /auth/registration-operations/{registration_operation_id}:
    get:
      security: []
      operationId: getRegistrationOperation
      summary: Query one registration operation using its scoped signed query token
      parameters:
        - name: registration_operation_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: X-Registration-Query-Token
          in: header
          required: true
          schema: { type: string, minLength: 80, maxLength: 256 }
      responses:
        "200":
          description: Redacted registration recovery state
          headers:
            Cache-Control:
              required: true
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegistrationStatus" }
        "404":
          $ref: "#/components/responses/Error"
  /auth/password-resets:
    post:
      security: []
      operationId: resetForgottenPassword
      summary: Reset a password after anti-enumeration mobile SMS verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [mobile, challenge_id, code, password_handle, password_policy_version]
              properties:
                mobile: { type: string }
                challenge_id: { type: string, format: uuid }
                code: { type: string, minLength: 1, maxLength: 16 }
                password_handle: { type: string, minLength: 43, maxLength: 43 }
                password_policy_version: { type: string, const: user-v1 }
      responses:
        "204": { description: Password reset and all existing sessions revoked }
        "401": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
  /account/bootstrap:
    post:
      operationId: bootstrapAccount
      summary: Idempotently provision the current business user and enqueue personal wallet initialization
      responses:
        "200":
          description: Current business user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Error"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
  /me:
    get:
      operationId: getMe
      summary: Get the current business user and active context
      responses:
        "200":
          description: Current business user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Error"
  /me/account-closure-request:
    get:
      operationId: getMyAccountClosure
      summary: Get the current durable account-closure state and user-actionable blockers
      responses:
        "200":
          description: Redacted account-closure progress
          headers:
            Cache-Control:
              required: true
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountClosure" }
        "404": { $ref: "#/components/responses/Error" }
  /me/account-closure-requests:
    post:
      operationId: createMyAccountClosure
      summary: Request account closure after recent authentication and exact explicit confirmation
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 16, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirmation]
              properties:
                confirmation: { type: string, const: CLOSE_MY_ACCOUNT }
      responses:
        "202":
          description: Durable closure requested; local role blockers may keep the user active until handoff is possible
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountClosure" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /me/commerce-customer-mapping:
    get:
      operationId: getCommerceCustomerMapping
      summary: Get the supplier-neutral external customer readiness used only by dependent payments
      responses:
        "200":
          description: Current Commerce Customer mapping state without an external customer identifier
          headers:
            Cache-Control:
              required: true
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommerceCustomerMapping" }
        "401": { $ref: "#/components/responses/Error" }
  /me/profile-change-requests:
    post:
      operationId: createProfileChange
      summary: Reserve a username or mobile after recent authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [field, value]
              properties:
                field: { type: string, enum: [USERNAME, MOBILE] }
                value: { type: string }
      responses:
        "201": { description: Recoverable profile change created }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /me/profile-change-requests/{request_id}/mobile-challenges:
    post:
      operationId: sendProfileMobileChallenge
      summary: Verify the reserved new mobile with a bound SMS challenge
      parameters:
        - name: request_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "202": { description: Challenge sent }
        "401": { $ref: "#/components/responses/Error" }
  /me/profile-change-requests/{request_id}/actions/complete:
    post:
      operationId: completeProfileChange
      summary: Converge Identity update, Account CAS commit, session revocation, and Commerce sync
      parameters:
        - name: request_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Profile change completed }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /me/profile-change-requests/{request_id}:
    get:
      operationId: getProfileChange
      summary: Get the redacted recovery state of one profile change
      parameters:
        - name: request_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Redacted profile change state }
        "404": { $ref: "#/components/responses/Error" }
  /me/authorization-context:
    get:
      operationId: resolveAuthorizationContext
      summary: Resolve the current user, explicit context, scoped roles, permission codes, and authorization versions
      responses:
        "200":
          description: Session-scoped authorization context
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [user_id, session_id, context_type, membership_version, context_version, authorization_version, personal_authorization_version, platform_authorization_version, organization_authorization_version, unit_ids, ancestor_unit_ids, roles, permissions, unit_authorization_bindings, personal_roles, personal_permissions, platform_roles, platform_permissions]
                properties:
                  user_id:
                    type: string
                    format: uuid
                  session_id:
                    type: string
                  context_type:
                    type: string
                    enum: [PERSONAL, ORGANIZATION]
                  organization_id:
                    type: [string, "null"]
                    format: uuid
                  membership_version:
                    type: integer
                    format: int64
                    minimum: 1
                  context_version:
                    type: integer
                    format: int64
                    minimum: 1
                  authorization_version:
                    type: integer
                    format: int64
                    minimum: 1
                    description: Compatibility projection for the current personal or organization context.
                  personal_authorization_version:
                    type: integer
                    format: int64
                    minimum: 1
                  platform_authorization_version:
                    type: integer
                    format: int64
                    minimum: 1
                  organization_authorization_version:
                    type: integer
                    format: int64
                    minimum: 1
                  unit_ids:
                    type: array
                    uniqueItems: true
                    items:
                      type: string
                      format: uuid
                  ancestor_unit_ids:
                    type: array
                    uniqueItems: true
                    items:
                      type: string
                      format: uuid
                  roles:
                    type: array
                    uniqueItems: true
                    items:
                      type: string
                  permissions:
                    type: array
                    uniqueItems: true
                    description: Organization-scoped permissions only; unit-scoped grants are never flattened into this collection.
                    items:
                      type: string
                  unit_authorization_bindings:
                    type: array
                    description: Exact unit-role bindings retained for object-level subtree authorization.
                    items:
                      type: object
                      additionalProperties: false
                      required: [unit_id, role, permissions]
                      properties:
                        unit_id:
                          type: string
                          format: uuid
                        role:
                          type: string
                        permissions:
                          type: array
                          uniqueItems: true
                          items:
                            type: string
                  personal_roles:
                    type: array
                    uniqueItems: true
                    items:
                      type: string
                  personal_permissions:
                    type: array
                    uniqueItems: true
                    items:
                      type: string
                  platform_roles:
                    type: array
                    uniqueItems: true
                    items:
                      type: string
                  platform_permissions:
                    type: array
                    uniqueItems: true
                    items:
                      type: string
        "401":
          $ref: "#/components/responses/Error"
  /me/organizations:
    get:
      operationId: listMyOrganizations
      summary: List active organization memberships
      responses:
        "200":
          description: Active organization memberships
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/OrganizationSummary"
        "401":
          $ref: "#/components/responses/Error"
  /me/role-bindings:
    get:
      operationId: listMyRoleBindings
      summary: List only the current user's platform and organization role bindings, including validity and grant source
      responses:
        "200":
          description: Current user's role bindings; never contains another user's assignment
          headers:
            Cache-Control: { required: true, schema: { type: string, const: no-store } }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/RoleBinding" } }
        "401": { $ref: "#/components/responses/Error" }
  /sessions/current/active-context:
    post:
      operationId: setActiveContext
      summary: CAS-select the user's global personal or organization context across every session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetActiveContextRequest"
      responses:
        "200":
          description: Updated active context
          content:
            application/json:
              schema:
                $ref: "common.yaml#/components/schemas/Context"
        "403":
          $ref: "#/components/responses/Error"
  /organizations/{organization_id}/units:
    get:
      operationId: listOrganizationUnits
      summary: List the active organization tree visible to a member
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: Flat organization-unit list linked by parent_id
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, structure_version]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/OrganizationUnit"
                  structure_version:
                    type: integer
                    minimum: 1
        "403":
          $ref: "#/components/responses/Error"
    post:
      operationId: createOrganizationUnit
      summary: Create an internal organization unit
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 120
                parent_id:
                  type: [string, "null"]
                  format: uuid
                idempotency_key:
                  type: string
                  minLength: 8
                  maxLength: 120
      responses:
        "201":
          description: Created organization unit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationUnitMutation"
        "200":
          description: Existing result replayed for the same idempotency key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationUnitMutation"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /organizations/{organization_id}/units/{unit_id}/parent:
    patch:
      operationId: moveOrganizationUnit
      summary: Move an organization unit with optimistic concurrency
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: unit_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_structure_version]
              properties:
                parent_id:
                  type: [string, "null"]
                  format: uuid
                expected_structure_version:
                  type: integer
                  minimum: 1
                idempotency_key:
                  type: string
                  minLength: 8
                  maxLength: 120
      responses:
        "200":
          description: Moved organization unit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationUnitMutation"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /organizations/{organization_id}/invitations:
    post:
      operationId: createOrganizationInvitation
      summary: Create a target-bound or one-time-link organization invitation without revealing target existence
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [target_type, roles, expires_in_hours]
              properties:
                target_type:
                  type: string
                  enum: [PHONE, USERNAME, LINK, EMAIL]
                target:
                  type: string
                  description: Required for PHONE, USERNAME, and legacy EMAIL; omitted for LINK.
                email:
                  type: string
                  format: email
                  deprecated: true
                roles:
                  type: array
                  uniqueItems: true
                  items:
                    type: string
                    enum: [ORG_ADMIN, BILLING_ADMIN, MEMBER, AUDITOR]
                expires_in_hours:
                  type: integer
                  minimum: 1
                  maximum: 720
                idempotency_key:
                  type: string
                  minLength: 8
                  maxLength: 120
      responses:
        "201":
          description: Invitation; token is returned only on creation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
        "200":
          description: Existing metadata replayed without returning the one-time token again
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          description: The expected context version is stale; reload the current global context before retrying
          $ref: "#/components/responses/Error"
  /organizations/{organization_id}/invitations/{invitation_id}:
    delete:
      operationId: revokeOrganizationInvitation
      summary: Idempotently revoke a pending invitation while retaining history
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - name: invitation_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Revoked invitation or its existing terminal result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invitation" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /me/invitations:
    get:
      operationId: listMyOrganizationInvitations
      summary: Recover invitations from the authenticated identity without accepting an arbitrary lookup target
      responses:
        "200":
          description: Pending targeted invitations for the current identity
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Invitation" } }
        "401": { $ref: "#/components/responses/Error" }
  /invitations/accept:
    post:
      operationId: acceptOrganizationInvitation
      summary: Idempotently accept a one-time invitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [token]
                  properties:
                    token: { type: string, minLength: 32, maxLength: 128 }
                - type: object
                  additionalProperties: false
                  required: [invitation_id]
                  properties:
                    invitation_id: { type: string, format: uuid }
      responses:
        "200":
          description: Membership established, or the same existing relationship returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipMutationResult"
        "403":
          $ref: "#/components/responses/Error"
        "410":
          $ref: "#/components/responses/Error"
  /organizations/{organization_id}/members/{user_id}:
    delete:
      operationId: revokeOrganizationMembership
      summary: Revoke a membership while preserving the final owner invariant
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Membership revoked, or the same terminal relationship returned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MembershipMutationResult" }
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /organizations/{organization_id}/members:
    get:
      operationId: listOrganizationMembers
      summary: List active members with roles and unit assignments
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: Active organization members
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/OrganizationMember"
        "403":
          $ref: "#/components/responses/Error"
  /organizations/{organization_id}/quota-members:
    get:
      operationId: listOrganizationQuotaMembers
      summary: List the minimal active-member directory required by quota allocators
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: Active members eligible for organization quota allocation
          headers:
            Cache-Control:
              required: true
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/QuotaMember"
        "403":
          $ref: "#/components/responses/Error"
  /organizations/{organization_id}/members/{user_id}/roles:
    put:
      operationId: replaceOrganizationMemberRoles
      summary: Replace non-owner organization-wide roles and invalidate authorization caches
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [roles]
              properties:
                roles:
                  type: array
                  uniqueItems: true
                  items:
                    type: string
                    enum: [ORG_ADMIN, BILLING_ADMIN, MEMBER, AUDITOR]
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationMember"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /organizations/{organization_id}/role-bindings:
    get:
      operationId: listOrganizationRoleBindings
      summary: List organization and node role bindings with validity, source, and lifecycle status
      parameters: [{ $ref: "#/components/parameters/OrganizationId" }]
      responses:
        "200":
          description: Organization role bindings visible under org.roles.read
          headers:
            Cache-Control: { required: true, schema: { type: string, const: no-store } }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/RoleBinding" } }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: grantOrganizationRoleBinding
      summary: Idempotently grant an assignable non-owner organization or node role with an optional validity window
      parameters: [{ $ref: "#/components/parameters/OrganizationId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleBindingGrant" }
      responses:
        "201": { description: Role binding created or the idempotent original returned, content: { application/json: { schema: { $ref: "#/components/schemas/RoleBinding" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /organizations/{organization_id}/role-bindings/{binding_id}:
    delete:
      operationId: revokeOrganizationRoleBinding
      summary: Idempotently revoke one ordinary role binding and invalidate authorization caches
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - { name: binding_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Revoked binding or the already revoked original, content: { application/json: { schema: { $ref: "#/components/schemas/RoleBinding" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: "Owner, platform, or non-assignable base role must use its dedicated lifecycle API", content: { application/json: { schema: { $ref: "common.yaml#/components/schemas/Error" } } } }
  /organizations/{organization_id}/ownership:
    post:
      operationId: transferOrganizationOwnership
      summary: Atomically transfer organization ownership
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [new_owner_user_id]
              properties:
                new_owner_user_id:
                  type: string
                  format: uuid
                idempotency_key:
                  type: string
                  minLength: 8
                  maxLength: 120
      responses:
        "200":
          description: Ownership transferred, or the same result returned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnershipTransferResult" }
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://identity.example.invalid/realms/pinvou/.well-known/openid-configuration
  responses:
    Error:
      description: Stable error response
      content:
        application/json:
          schema:
            $ref: "common.yaml#/components/schemas/Error"
    UpgradeRequired:
      description: The desktop client sunset has passed for remote write operations
      headers:
        Link: { required: true, schema: { type: string } }
        X-API-Contract-Version: { required: true, schema: { type: string } }
        X-Minimum-Supported-Client-Version: { required: true, schema: { type: string } }
      content:
        application/json:
          schema:
            $ref: "common.yaml#/components/schemas/Error"
  parameters:
    OrganizationId:
      name: organization_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 8
        maxLength: 120
      description: Stable operation key; body fallback is accepted for constrained clients.
  schemas:
    AccountClosureBlocker:
      type: object
      additionalProperties: false
      required: [code, domain, resource_type]
      properties:
        code: { type: string }
        domain: { type: string, enum: [ACCOUNT, BILLING, TOKEN] }
        resource_type: { type: string }
        user_action: { type: string }
    AccountClosure:
      type: object
      additionalProperties: false
      required: [closure_request_id, status, stage, policy_version, blockers, attempts, reauthenticated_at, sla_expires_at, version, created_at, updated_at, replayed]
      properties:
        closure_request_id: { type: string, format: uuid }
        status: { type: string, enum: [IN_PROGRESS, BLOCKED, RETRY, REPAIR_REQUIRED, COMPLETED] }
        stage: { type: string, enum: [CLOSURE_REQUESTED, QUIESCING, FINANCIAL_CLEARANCE, IDENTITY_CLEANUP, ANONYMIZED, COMPLETED] }
        policy_version: { type: integer, minimum: 1 }
        blockers:
          type: array
          items: { $ref: "#/components/schemas/AccountClosureBlocker" }
        attempts: { type: integer, minimum: 0 }
        last_error_code: { type: string }
        next_attempt_at: { type: string, format: date-time }
        reauthenticated_at: { type: string, format: date-time }
        sla_expires_at: { type: string, format: date-time }
        version: { type: integer, format: int64, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
        replayed: { type: boolean }
    RoleBinding:
      type: object
      additionalProperties: false
      required: [binding_id, user_id, role_code, scope, starts_at, status, grant_source, created_at]
      properties:
        binding_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        role_code: { type: string }
        scope: { type: string, enum: [PERSONAL, PLATFORM, ORGANIZATION, UNIT] }
        organization_id: { type: string, format: uuid }
        unit_id: { type: string, format: uuid }
        starts_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        status: { type: string, enum: [SCHEDULED, ACTIVE, EXPIRED, REVOKED] }
        grant_source: { type: string }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time }
        revoked_by: { type: string, format: uuid }
    RoleBindingGrant:
      type: object
      additionalProperties: false
      required: [user_id, role_code, idempotency_key]
      properties:
        user_id: { type: string, format: uuid }
        role_code: { type: string, enum: [ORG_ADMIN, BILLING_ADMIN, ORG_MODEL_ADMIN, AUDITOR, UNIT_ADMIN] }
        unit_id: { type: string, format: uuid }
        starts_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        idempotency_key: { type: string, minLength: 8, maxLength: 120 }
    RegistrationStatus:
      type: object
      additionalProperties: false
      required: [registration_operation_id, status]
      properties:
        registration_operation_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        user_code: { $ref: "#/components/schemas/UserCode" }
        username: { type: string, minLength: 3, maxLength: 32 }
        status:
          type: string
          enum: [SMS_PENDING, REGISTRATION_IN_PROGRESS, IDENTITY_CREATING, IDENTITY_CREATED, ACCOUNT_COMMITTING, ACCOUNT_COMMITTED, PROVISIONING, ACTIVE, REPAIR_REQUIRED, COMPENSATION_PENDING, COMPENSATED, EXPIRED]
        next_retry_at: { type: string, format: date-time }
        reason:
          type: string
          description: Stable redacted reason code; provider text and secret material are never returned.
    Me:
      type: object
      additionalProperties: false
      required: [user_id, user_code, status, mobile_verified, commerce_customer_status, active_context]
      properties:
        user_id:
          type: string
          format: uuid
        user_code:
          $ref: "#/components/schemas/UserCode"
        status:
          type: string
          enum: [PROVISIONING, ACTIVE, REPAIR_REQUIRED, DISABLED]
        username:
          type: [string, "null"]
        display_name:
          type: [string, "null"]
        mobile:
          type: [string, "null"]
        mobile_verified:
          type: boolean
        commerce_customer_status:
          type: string
          enum: [NOT_CONFIGURED, PENDING, IN_PROGRESS, READY, RETRY, REPAIR_REQUIRED, DETACHED]
        active_context:
          $ref: "common.yaml#/components/schemas/Context"
    CommerceCustomerMapping:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [NOT_CONFIGURED, PENDING, IN_PROGRESS, READY, RETRY, REPAIR_REQUIRED, DETACHED]
        provider_id:
          type: string
          description: Stable configured Provider identifier; it is data, not a provider-specific API contract.
        adapter_version:
          type: string
        updated_at:
          type: string
          format: date-time
    UserCode:
      type: string
      description: Permanent, display-safe user code. It is not an authentication or authorization credential.
      pattern: '^USR-[0-9A-HJKMNP-TV-Z]{4}-[0-9A-HJKMNP-TV-Z]{4}-[0-9A-HJKMNP-TV-Z]{4}-[0-9A-HJKMNP-TV-Z]{4}-[0-9A-HJKMNP-TV-Z]{2}$'
      example: USR-0123-4567-89AB-CDEF-MV
    OrganizationSummary:
      type: object
      additionalProperties: false
      required: [organization_id, name, roles]
      properties:
        organization_id:
          type: string
          format: uuid
        name:
          type: string
        roles:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [OWNER, ORG_ADMIN, BILLING_ADMIN, ORG_MODEL_ADMIN, UNIT_ADMIN, MEMBER, AUDITOR]
    OrganizationUnit:
      type: object
      additionalProperties: false
      required: [unit_id, organization_id, name, status, version]
      properties:
        unit_id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        parent_id:
          type: [string, "null"]
          format: uuid
        name:
          type: string
        status:
          type: string
          enum: [ACTIVE, DISABLED, DELETED]
        version:
          type: integer
          minimum: 1
    OrganizationUnitMutation:
      type: object
      additionalProperties: false
      required: [unit, structure_version, replayed]
      properties:
        unit:
          $ref: "#/components/schemas/OrganizationUnit"
        structure_version:
          type: integer
          minimum: 1
        replayed:
          type: boolean
    OrganizationMember:
      type: object
      additionalProperties: false
      required: [membership_id, user_id, status, version, roles, unit_ids, joined_at]
      properties:
        membership_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        display_name:
          type: [string, "null"]
        email:
          type: [string, "null"]
          format: email
        status:
          type: string
          enum: [ACTIVE]
        version:
          type: integer
          minimum: 1
        roles:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [OWNER, ORG_ADMIN, BILLING_ADMIN, ORG_MODEL_ADMIN, UNIT_ADMIN, MEMBER, AUDITOR]
        unit_ids:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
        joined_at:
          type: string
          format: date-time
    QuotaMember:
      type: object
      additionalProperties: false
      required: [user_id, version]
      properties:
        user_id:
          type: string
          format: uuid
        display_name:
          type: [string, "null"]
        version:
          type: integer
          minimum: 1
    Invitation:
      type: object
      additionalProperties: false
      required: [invitation_id, organization_id, target_type, roles, status, version, expires_at, replayed]
      properties:
        invitation_id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        target_type:
          type: string
          enum: [PHONE, USERNAME, LINK, EMAIL]
        target_hint:
          type: string
        roles:
          type: array
          uniqueItems: true
          items:
            type: string
        expires_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [PENDING, ACCEPTED, REVOKED, EXPIRED]
        version:
          type: integer
          format: int64
          minimum: 1
        accepted_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
        token:
          type: string
          minLength: 32
          description: Present only in the first successful creation response.
        replayed:
          type: boolean
    MembershipMutationResult:
      type: object
      additionalProperties: false
      required: [organization_id, member, replayed]
      properties:
        organization_id: { type: string, format: uuid }
        member: { $ref: "#/components/schemas/OrganizationMember" }
        replayed: { type: boolean }
    OwnershipTransferResult:
      type: object
      additionalProperties: false
      required: [organization_id, previous_owner_user_id, new_owner_user_id, new_owner_membership, replayed]
      properties:
        organization_id: { type: string, format: uuid }
        previous_owner_user_id: { type: string, format: uuid }
        new_owner_user_id: { type: string, format: uuid }
        new_owner_membership: { $ref: "#/components/schemas/OrganizationMember" }
        replayed: { type: boolean }
    SetActiveContextRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [context_type, expected_context_version]
          properties:
            context_type:
              const: PERSONAL
            expected_context_version:
              type: integer
              format: int64
              minimum: 1
        - type: object
          additionalProperties: false
          required: [context_type, organization_id, expected_context_version]
          properties:
            context_type:
              const: ORGANIZATION
            organization_id:
              type: string
              format: uuid
            expected_context_version:
              type: integer
              format: int64
              minimum: 1
