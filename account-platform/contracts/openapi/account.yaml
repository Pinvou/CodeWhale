      type: object
      additionalProperties: false
      required: [unit, structure_version, replayed]
      properties:
        unit:
          $ref: "#/components/schemas/OrganizationUnit"
        structure_version:
          type: integer
          minimum: 1
        replayed:
          type: boolean
    OrganizationMember:
      type: object
      additionalProperties: false
      required: [membership_id, user_id, user_code, status, version, roles, unit_ids, unit_admin_unit_ids, joined_at]
      properties:
        membership_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        user_code:
          $ref: "#/components/schemas/UserCode"
        display_name:
          type: [string, "null"]
        email:
          type: [string, "null"]
          format: email
        status:
          type: string
          enum: [ACTIVE, SUSPENDED, REVOKED]
        version:
          type: integer
          minimum: 1
        roles:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [OWNER, ORG_ADMIN, BILLING_ADMIN, ORG_MODEL_ADMIN, UNIT_ADMIN, MEMBER, AUDITOR]
        unit_ids:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
        unit_admin_unit_ids:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
        joined_at:
          type: string
          format: date-time
    QuotaMember:
      type: object
      additionalProperties: false
      required: [user_id, version]
      properties:
        user_id:
          type: string
          format: uuid
        display_name:
          type: [string, "null"]
        version:
          type: integer
          minimum: 1
    Invitation:
      type: object
      additionalProperties: false
      required: [invitation_id, organization_id, target_type, roles, status, version, expires_at, replayed]
      properties:
        organization_name:
          type: string
          description: Display name of the organization attached to this authorized invitation; does not grant organization directory access.
        invitation_id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        target_type:
          type: string
          enum: [PHONE, USERNAME, LINK, EMAIL]
        target_hint:
          type: string
        roles:
          type: array
          uniqueItems: true
          items:
            type: string
        expires_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [PENDING, ACCEPTED, REVOKED, EXPIRED]
        version:
          type: integer
          format: int64
          minimum: 1
        accepted_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
        token:
          type: string
          minLength: 32
          description: Present only in the first successful creation response.
        replayed:
          type: boolean
    MembershipMutationResult:
      type: object
      additionalProperties: false
      required: [organization_id, member, replayed]
      properties:
        organization_id: { type: string, format: uuid }
        member: { $ref: "#/components/schemas/OrganizationMember" }
        replayed: { type: boolean }
    OwnershipTransferResult:
      type: object
      additionalProperties: false
      required: [organization_id, previous_owner_user_id, new_owner_user_id, new_owner_membership, replayed]
      properties:
        organization_id: { type: string, format: uuid }
        previous_owner_user_id: { type: string, format: uuid }
        new_owner_user_id: { type: string, format: uuid }
        new_owner_membership: { $ref: "#/components/schemas/OrganizationMember" }
        replayed: { type: boolean }
    SetActiveContextRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [context_type, expected_context_version]
          properties:
            context_type:
              const: PERSONAL
            expected_context_version:
              type: integer
              format: int64
              minimum: 1
        - type: object
          additionalProperties: false
          required: [context_type, organization_id, expected_context_version]
          properties:
            context_type:
              const: ORGANIZATION
            organization_id:
              type: string
              format: uuid
            expected_context_version:
              type: integer
              format: int64
              minimum: 1
