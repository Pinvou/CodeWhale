openapi: 3.1.0
info:
  title: Pinvou Account Service API
  version: 0.1.0
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /v1
security:
  - oidc: []
paths:
  /account/bootstrap:
    post:
      operationId: bootstrapAccount
      summary: Idempotently provision the current business user and personal wallet
      responses:
        "200":
          description: Current business user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /me:
    get:
      operationId: getMe
      summary: Get the current business user and active context
      responses:
        "200":
          description: Current business user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Error"
  /me/organizations:
    get:
      operationId: listMyOrganizations
      summary: List active organization memberships
      responses:
        "200":
          description: Active organization memberships
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/OrganizationSummary"
        "401":
          $ref: "#/components/responses/Error"
  /sessions/current/active-context:
    post:
      operationId: setActiveContext
      summary: Select personal context or one active organization for this session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetActiveContextRequest"
      responses:
        "200":
          description: Updated active context
          content:
            application/json:
              schema:
                $ref: "common.yaml#/components/schemas/Context"
        "403":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://identity.example.invalid/realms/pinvou/.well-known/openid-configuration
  responses:
    Error:
      description: Stable error response
      content:
        application/json:
          schema:
            $ref: "common.yaml#/components/schemas/Error"
  schemas:
    Me:
      type: object
      additionalProperties: false
      required: [user_id, status, active_context]
      properties:
        user_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [PROVISIONING, ACTIVE, DISABLED]
        display_name:
          type: [string, "null"]
        active_context:
          $ref: "common.yaml#/components/schemas/Context"
    OrganizationSummary:
      type: object
      additionalProperties: false
      required: [organization_id, name, roles]
      properties:
        organization_id:
          type: string
          format: uuid
        name:
          type: string
        roles:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [OWNER, ORG_ADMIN, BILLING_ADMIN, UNIT_ADMIN, MEMBER, AUDITOR]
    SetActiveContextRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [context_type]
          properties:
            context_type:
              const: PERSONAL
        - type: object
          additionalProperties: false
          required: [context_type, organization_id]
          properties:
            context_type:
              const: ORGANIZATION
            organization_id:
              type: string
              format: uuid
