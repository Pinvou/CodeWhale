        requester_user_id: { type: string, format: uuid }
        requester_authorization_version: { type: integer, format: int64, minimum: 1, description: Frozen original requester authorization version }
        requester_reason: { type: string, description: Frozen original request reason; never synthesized by the executor }
        first_claim: { type: boolean, description: True only when this call created the durable execution record. Replays and failed execution reclaims are false; unknown outcomes permit only original-result queries. }
        approver_user_id: { type: string, format: uuid }
        decision_reason: { type: string }
        execution_idempotency_key: { type: string, minLength: 1, maxLength: 512 }
        executor_identity: { type: string, minLength: 1, maxLength: 120 }
        status: { type: string, enum: [EXECUTING, EXECUTED, FAILED] }
        authorization_event_id: { type: string, format: uuid }
        authorization_durable: { type: string, minLength: 1, maxLength: 120 }
