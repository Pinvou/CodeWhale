        - if: { properties: { command_type: { const: TOKEN_MODEL_LIFECYCLE_CHANGE } }, required: [command_type] }
          then:
            properties:
              normalized_command:
                oneOf:
                  - { $ref: "#/components/schemas/TokenModelLifecycleImmediateCommand" }
                  - { $ref: "#/components/schemas/TokenModelLifecyclePlanCommand" }
