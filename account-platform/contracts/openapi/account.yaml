openapi: 3.1.0
info:
  title: Pinvou Account Service API
  version: 0.1.0
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /v1
security:
  - oidc: []
paths:
  /internal/v1/approval-recovery/confirm:
    post:
      servers: [{ url: / }]
      security: [{ serviceToken: [] }]
      operationId: confirmOriginalApprovalRecoverySuccess
      summary: Recheck and atomically converge a persisted original domain success
      description: Requires internal.approval-recovery.confirm and the dedicated account-approval-recovery workload identity. The body contains only an original Account candidate and live read-query lease. Account independently re-reads the domain authority before its serializable same-execution CAS; worker-provided domain results are forbidden. Never starts a second domain attempt.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [candidate, lease]
              properties:
                candidate: { $ref: "#/components/schemas/ApprovalRecoveryCandidate" }
                lease:
                  type: object
                  additionalProperties: false
                  required: [approval_request_id, lease_token, lease_until, query_count, version]
                  properties:
                    approval_request_id: { type: string, format: uuid }
                    lease_token: { type: string, format: uuid }
                    lease_until: { type: string, format: date-time }
                    query_count: { type: integer, minimum: 1 }
                    version: { type: integer, format: int64, minimum: 1 }
      responses:
        "204": { description: Original positive result converged; no second domain execution, headers: { Cache-Control: { schema: { type: string, const: no-store } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /internal/v1/approval-recovery/plan:
    get:
      servers: [{ url: / }]
      security: [{ serviceToken: [] }]
      operationId: planProofApprovalRecovery
      summary: Read a bounded proof-era recovery investigation plan without execution authority
      description: Requires internal.approval-recovery.plan and the dedicated account-approval-recovery workload identity. The result contains original execution references only for read-only investigation; it cannot authorize replay, invalidation, or completion.
      parameters:
        - { name: limit, in: query, required: true, schema: { type: integer, minimum: 1, maximum: 200 } }
      responses:
        "200":
          description: Bounded, consistent Account snapshot
          headers: { Cache-Control: { schema: { type: string, const: no-store } } }
          content: { application/json: { schema: { $ref: "#/components/schemas/ApprovalRecoveryPlan" } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /internal/v1/approval-requests/{approval_request_id}/executions:
    post:
      servers: [{ url: / }]
      security: [{ serviceToken: [] }]
      operationId: beginApprovalExecution
      description: New execution claims require an executable command; policy-only historical requests return 409 APPROVAL_COMMAND_NOT_EXECUTABLE without an execution or authorization effect. Existing EXECUTING or EXECUTED results retain their existing identity-checked read behavior.
      summary: Atomically acquire an approved command execution lease with both frozen snapshots
      parameters:
        - name: approval_request_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              description: observed_financial_snapshot is required by the service for Token lifecycle and catalog rollback approvals; legacy non-Token commands remain compatible without it.
              required: [job_run_id, observed_versions]
              properties:
                job_run_id: { type: string, minLength: 1, maxLength: 160 }
                observed_versions: { type: object, additionalProperties: true }
                observed_financial_snapshot: { $ref: "#/components/schemas/TokenFinancialSnapshotOrGeneric" }
                authorization_binding: { $ref: "#/components/schemas/ApprovalAuthorizationBinding" }
      responses:
        "200": { description: Immutable execution lease, content: { application/json: { schema: { $ref: "#/components/schemas/ApprovalExecutionLease" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /internal/v1/approval-authorization/events/{event_id}/route:
    get:
      servers: [{ url: / }]
      security: [{ serviceToken: [] }]
      operationId: resolveApprovalAuthorizationRoute
      summary: Authenticate a shared-subject authorization event and return its registry-owned target without execution authority
      parameters:
        - { name: event_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Immutable read-only authorization route
          headers: { Cache-Control: { schema: { type: string, const: no-store } } }
          content: { application/json: { schema: { $ref: "#/components/schemas/ApprovalAuthorizationRoute" } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /internal/v1/approval-authorization/events/{event_id}/binding:
    get:
      servers: [{ url: / }]
      security: [{ serviceToken: [] }]
      operationId: resolveApprovalAuthorizationBinding
      summary: Resolve the immutable Account-owned binding for one published authorization event
      parameters:
        - { name: event_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: durable, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 120 } }
      responses:
        "200": { description: Immutable authorization binding, content: { application/json: { schema: { $ref: "#/components/schemas/ApprovalAuthorizationBinding" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /internal/v1/approval-authorization/events/{event_id}/deliveries/{durable}/observe:
    post:
      servers: [{ url: / }]
      security: [{ serviceToken: [] }]
      operationId: observeApprovalAuthorizationDelivery
      summary: Bind the first physical delivery sequence without creating domain execution authority
      parameters:
        - { name: event_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: durable, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 120 } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ApprovalAuthorizationDeliveryObservation" } } }
      responses:
        "200": { description: Shared durable delivery state, content: { application/json: { schema: { $ref: "#/components/schemas/ApprovalAuthorizationDeliveryState" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /internal/v1/approval-authorization/events/{event_id}/deliveries/{durable}:
    get:
      servers: [{ url: / }]
      security: [{ serviceToken: [] }]
      operationId: getApprovalAuthorizationDeliveryState
      summary: Read the closed delivery state needed to recover a confirmed twelfth failure
      parameters:
        - { name: event_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: durable, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 120 } }
      responses:
        "200":
          description: Current delivery state without payload or delivery bytes
          headers: { Cache-Control: { schema: { type: string, const: no-store } } }
          content: { application/json: { schema: { $ref: "#/components/schemas/ApprovalAuthorizationDeliveryState" } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /internal/v1/approval-authorization/events/{event_id}/deliveries/{durable}/attempts/grant:
    post:
      servers: [{ url: / }]
      security: [{ serviceToken: [] }]
      operationId: grantApprovalAuthorizationDomainAttempt
      summary: Grant exactly one Billing domain attempt by durable state CAS
      parameters:
        - { name: event_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: durable, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 120 } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ApprovalAuthorizationDeliveryVersion" } } } }
      responses:
        "200": { description: Granted state, content: { application/json: { schema: { $ref: "#/components/schemas/ApprovalAuthorizationDeliveryState" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /internal/v1/approval-authorization/events/{event_id}/deliveries/{durable}/attempts/failure:
    post:
      servers: [{ url: / }]
      security: [{ serviceToken: [] }]
      operationId: recordApprovalAuthorizationDomainFailure
      summary: Record a stable Billing domain-attempt failure by CAS
      parameters:
        - { name: event_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: durable, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 120 } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ApprovalAuthorizationDeliveryFailure" } } } }
      responses:
        "200": { description: Updated state, content: { application/json: { schema: { $ref: "#/components/schemas/ApprovalAuthorizationDeliveryState" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /internal/v1/approval-authorization/events/{event_id}/deliveries/{durable}/result:
    post:
      servers: [{ url: / }]
      security: [{ serviceToken: [] }]
      operationId: recordApprovalAuthorizationResult
      summary: Persist that the domain result is durably queryable
      parameters:
        - { name: event_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: durable, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 120 } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ApprovalAuthorizationDeliveryVersion" } } } }
      responses:
        "200": { description: Result-confirmed state, content: { application/json: { schema: { $ref: "#/components/schemas/ApprovalAuthorizationDeliveryState" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /internal/v1/approval-authorization/events/{event_id}/deliveries/{durable}/dlq-puback:
    post:
      servers: [{ url: / }]
      security: [{ serviceToken: [] }]
      operationId: recordApprovalAuthorizationDLQPubAck
      summary: Persist a Billing-only authorization DLQ PubAck before terminal source acknowledgement
      parameters:
        - { name: event_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: durable, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 120 } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ApprovalAuthorizationDeliveryDLQPubAck" } } } }
      responses:
        "200": { description: DLQ PubAck state, content: { application/json: { schema: { $ref: "#/components/schemas/ApprovalAuthorizationDeliveryState" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /internal/v1/approval-authorization/events/{event_id}/deliveries/{durable}/terminal:
    post:
      servers: [{ url: / }]
      security: [{ serviceToken: [] }]
      operationId: recordApprovalAuthorizationTerminal
      summary: Confirm the current physical delivery after checking DoubleAck
      parameters:
        - { name: event_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: durable, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 120 } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ApprovalAuthorizationDeliveryVersion" } } } }
      responses:
        "200": { description: Terminal shared state, content: { application/json: { schema: { $ref: "#/components/schemas/ApprovalAuthorizationDeliveryState" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /internal/v1/token-owner-candidates:
    get:
      servers:
        - url: /
      security:
        - serviceToken: []
      operationId: listInternalTokenOwnerCandidates
      summary: Return the minimal authoritative owner projection to the trusted Token service
      description: Requires the exact internal.token-owner-candidates.read workload permission and the human actor issuer/subject. This is a high-throughput internal scan API, not a Portal/public admin page. One logical scan consumes anti-enumeration quota only on its first request; signed continuations inherit scan_id and quota, while invalid cursors count as new failed scans. At most 3 scans per actor and 10 per calling service remain active for the 15-minute TTL. Each scan request has a 10-second server budget. The opaque cursor binds the workload, actor, authorization version, resource, filter, database transaction-time high-water, and immutable owner type plus stable ID. The APT-121 facade independently builds and pages the normalized-label UI snapshot.
      parameters:
        - name: actor_issuer
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 512 }
        - name: actor_subject
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 255 }
        - name: owner_type
          in: query
          schema: { type: string, enum: [USER, ORGANIZATION, UNIT] }
        - name: organization_id
          in: query
          description: Optional authoritative organization scope; response remains the same four-field minimal projection.
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50000, default: 20000 }
        - name: cursor
          in: query
          description: Opaque server-signed continuation token; clients must not inspect or modify it.
          schema: { type: string, minLength: 80, maxLength: 4096 }
      responses:
        "200":
          description: Minimal candidates in immutable owner_type, id order.
          headers:
            Cache-Control: { required: true, schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenOwnerCandidatePage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/registration/precheck:
    post:
      security: []
      operationId: precheckMobileRegistration
      summary: Validate username and mobile availability using an opaque Identity password reference
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, mobile, password_handle, password_policy_version]
              properties:
                username: { type: string, minLength: 3, maxLength: 32 }
                mobile: { type: string }
                password_handle: { type: string, minLength: 43, maxLength: 43 }
                password_policy_version: { type: string, minLength: 1, maxLength: 64 }
      responses:
        "200":
          description: Registration fields are valid and available
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /auth/captcha/challenges:
    post:
      security: []
      operationId: createSliderCaptcha
      summary: Create a mobile- and purpose-bound slider challenge
      responses:
        "201":
          description: Slider challenge with PNG background and puzzle piece
        "400":
          $ref: "#/components/responses/Error"
  /auth/sms/challenges:
    post:
      security: []
      operationId: sendSMSChallenge
      summary: Send an SMS after registration precheck and slider verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [mobile, purpose, captcha_id, captcha_offset]
              properties:
                username: { type: string, maxLength: 32 }
                mobile: { type: string }
                password_handle: { type: string, maxLength: 43 }
                password_policy_version: { type: string, maxLength: 64 }
                purpose: { type: string, enum: [REGISTER, LOGIN, PASSWORD_RESET] }
                captcha_id: { type: string, format: uuid }
                captcha_offset: { type: integer, minimum: 0 }
      responses:
        "202":
          description: SMS challenge accepted; REGISTER also returns the scoped recovery operation and query token
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [challenge_id, expires_at, retry_after_seconds]
                properties:
                  challenge_id: { type: string, format: uuid }
                  expires_at: { type: string, format: date-time }
                  retry_after_seconds: { type: integer, minimum: 1 }
                  registration_operation_id: { type: string, format: uuid }
                  registration_query_token: { type: string, minLength: 80, maxLength: 256 }
                  registration_query_token_expires_at: { type: string, format: date-time }
        "400":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /auth/register:
    post:
      security: []
      operationId: registerMobile
      summary: Register a mobile identity after provider-side SMS verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, mobile, challenge_id, code, password_handle, password_policy_version, registration_operation_id, registration_query_token]
              properties:
                username: { type: string, minLength: 3, maxLength: 32 }
                mobile: { type: string }
                challenge_id: { type: string, format: uuid }
                code: { type: string, minLength: 1, maxLength: 16 }
                password_handle: { type: string, minLength: 43, maxLength: 43 }
                password_policy_version: { type: string, minLength: 1, maxLength: 64 }
                registration_operation_id: { type: string, format: uuid }
                registration_query_token: { type: string, minLength: 80, maxLength: 256 }
      responses:
        "201":
          description: Account provisioning started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegistrationStatus" }
        "202":
          description: Identity or Account recovery continues asynchronously; the client must query the original operation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegistrationStatus" }
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /auth/registration-operations/{registration_operation_id}:
    get:
      security: []
      operationId: getRegistrationOperation
      summary: Query one registration operation using its scoped signed query token
      parameters:
        - name: registration_operation_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: X-Registration-Query-Token
          in: header
          required: true
          schema: { type: string, minLength: 80, maxLength: 256 }
      responses:
        "200":
          description: Redacted registration recovery state
          headers:
            Cache-Control:
              required: true
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegistrationStatus" }
        "404":
          $ref: "#/components/responses/Error"
  /auth/password-resets:
    post:
      security: []
      operationId: resetForgottenPassword
      summary: Reset a password after anti-enumeration mobile SMS verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [mobile, challenge_id, code, password_handle, password_policy_version]
              properties:
                mobile: { type: string }
                challenge_id: { type: string, format: uuid }
                code: { type: string, minLength: 1, maxLength: 16 }
                password_handle: { type: string, minLength: 43, maxLength: 43 }
                password_policy_version: { type: string, const: user-v1 }
      responses:
        "204": { description: Password reset and all existing sessions revoked }
        "401": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
  /me/password-changes:
    post:
      operationId: changeMyPassword
      summary: Change the authenticated user's password after recent authentication
      description: Requires personal.security.manage. ACTIVE, PROVISIONING, and REPAIR_REQUIRED are allowed; all other account states fail closed. A successful change revokes every existing session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password_handle, password_policy_version]
              properties:
                password_handle: { type: string, minLength: 43, maxLength: 43 }
                password_policy_version: { type: string, const: user-v1 }
      responses:
        "204": { description: Password changed and all existing sessions revoked }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
  /account/bootstrap:
    post:
      operationId: bootstrapAccount
      summary: Idempotently provision the current business user and enqueue personal wallet initialization
      responses:
        "200":
          description: Current business user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Error"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
  /me:
    get:
      operationId: getMe
      summary: Get the current business user and active context
      responses:
        "200":
          description: Current business user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /me/account-closure-request:
    get:
      operationId: getMyAccountClosure
      summary: Get the current durable account-closure state and user-actionable blockers
      responses:
        "200":
          description: Redacted account-closure progress
          headers:
            Cache-Control:
              required: true
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountClosure" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /me/account-closure-requests:
    post:
      operationId: createMyAccountClosure
      summary: Request account closure after recent authentication and exact explicit confirmation
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 16, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirmation]
              properties:
                confirmation: { type: string, const: CLOSE_MY_ACCOUNT }
      responses:
        "202":
          description: Durable closure requested; local role blockers may keep the user active until handoff is possible
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountClosure" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /me/commerce-customer-mapping:
    get:
      operationId: getCommerceCustomerMapping
      summary: Get the supplier-neutral external customer readiness used only by dependent payments
      responses:
        "200":
          description: Current Commerce Customer mapping state without an external customer identifier
          headers:
            Cache-Control:
              required: true
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommerceCustomerMapping" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /me/profile-change-requests:
    post:
      operationId: createProfileChange
      summary: Reserve a username or mobile after recent authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [field, value]
              properties:
                field: { type: string, enum: [USERNAME, MOBILE] }
                value: { type: string }
      responses:
        "201": { description: Recoverable profile change created }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /me/profile-change-requests/{request_id}/mobile-challenges:
    post:
      operationId: sendProfileMobileChallenge
      summary: Verify the reserved new mobile with a bound SMS challenge
      parameters:
        - name: request_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "202": { description: Challenge sent }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /me/profile-change-requests/{request_id}/actions/complete:
    post:
      operationId: completeProfileChange
      summary: Converge Identity update, Account CAS commit, session revocation, and Commerce sync
      parameters:
        - name: request_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Profile change completed }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /me/profile-change-requests/{request_id}:
    get:
      operationId: getProfileChange
      summary: Get the redacted recovery state of one profile change
      parameters:
        - name: request_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Redacted profile change state }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /me/authorization-context:
    get:
      operationId: resolveAuthorizationContext
      summary: Resolve the current user, explicit context, scoped roles, permission codes, and authorization versions
      responses:
        "200":
          description: Session-scoped authorization context
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [user_id, session_id, context_type, membership_version, context_version, authorization_version, personal_authorization_version, platform_authorization_version, organization_authorization_version, unit_ids, ancestor_unit_ids, roles, permissions, unit_authorization_bindings, personal_roles, personal_permissions, platform_roles, platform_permissions]
                properties:
                  user_id:
                    type: string
                    format: uuid
                  session_id:
                    type: string
                  context_type:
                    type: string
                    enum: [PERSONAL, ORGANIZATION]
                  organization_id:
                    type: [string, "null"]
                    format: uuid
                  membership_version:
                    type: integer
                    format: int64
                    minimum: 1
                  context_version:
                    type: integer
                    format: int64
                    minimum: 1
                  authorization_version:
                    type: integer
                    format: int64
                    minimum: 1
                    description: Compatibility projection for the current personal or organization context.
                  personal_authorization_version:
                    type: integer
                    format: int64
                    minimum: 1
                  platform_authorization_version:
                    type: integer
                    format: int64
                    minimum: 1
                  organization_authorization_version:
                    type: integer
                    format: int64
                    minimum: 1
                  unit_ids:
                    type: array
                    uniqueItems: true
                    items:
                      type: string
                      format: uuid
                  ancestor_unit_ids:
                    type: array
                    uniqueItems: true
                    items:
                      type: string
                      format: uuid
                  roles:
                    type: array
                    uniqueItems: true
                    items:
                      type: string
                  permissions:
                    type: array
                    uniqueItems: true
                    description: Organization-scoped permissions only; unit-scoped grants are never flattened into this collection.
                    items:
                      type: string
                  unit_authorization_bindings:
                    type: array
                    description: Exact unit-role bindings retained for object-level subtree authorization.
                    items:
                      type: object
                      additionalProperties: false
                      required: [unit_id, role, permissions]
                      properties:
                        unit_id:
                          type: string
                          format: uuid
                        role:
                          type: string
                        permissions:
                          type: array
                          uniqueItems: true
                          items:
                            type: string
                  personal_roles:
                    type: array
                    uniqueItems: true
                    items:
                      type: string
                  personal_permissions:
                    type: array
                    uniqueItems: true
                    items:
                      type: string
                  platform_roles:
                    type: array
                    uniqueItems: true
                    items:
                      type: string
                  platform_permissions:
                    type: array
                    uniqueItems: true
                    items:
                      type: string
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /me/organizations:
    get:
      operationId: listMyOrganizations
      summary: List active organization memberships
      responses:
        "200":
          description: Active organization memberships
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/OrganizationSummary"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /me/role-bindings:
    get:
      operationId: listMyRoleBindings
      summary: List only the current user's platform and organization role bindings, including validity and grant source
      responses:
        "200":
          description: Current user's role bindings; never contains another user's assignment
          headers:
            Cache-Control: { required: true, schema: { type: string, const: no-store } }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/RoleBinding" } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /sessions/current/active-context:
    post:
      operationId: setActiveContext
      summary: CAS-select the user's global personal or organization context across every session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetActiveContextRequest"
      responses:
        "200":
          description: Updated active context
          content:
            application/json:
              schema:
                $ref: "common.yaml#/components/schemas/Context"
        "403":
          $ref: "#/components/responses/Error"
  /organizations/{organization_id}/units:
    get:
      operationId: listOrganizationUnits
      summary: List the active organization tree visible to a member
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - name: root_unit_id
          in: query
          required: false
          description: Explicit subtree root. Required for unit-scoped administrators; organization-scoped readers may omit it.
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Flat organization-unit list linked by parent_id
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, structure_version]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/OrganizationUnit"
                  structure_version:
                    type: integer
                    minimum: 1
        "403":
          $ref: "#/components/responses/Error"
    post:
      operationId: createOrganizationUnit
      summary: Create an internal organization unit
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 120
                parent_id:
                  type: [string, "null"]
                  format: uuid
                idempotency_key:
                  type: string
                  minLength: 8
                  maxLength: 120
      responses:
        "201":
          description: Created organization unit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationUnitMutation"
        "200":
          description: Existing result replayed for the same idempotency key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationUnitMutation"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /organizations/{organization_id}/units/{unit_id}/parent:
    patch:
      operationId: moveOrganizationUnit
      summary: Move an organization unit with optimistic concurrency
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: unit_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_structure_version]
              properties:
                parent_id:
                  type: [string, "null"]
                  format: uuid
                expected_structure_version:
                  type: integer
                  minimum: 1
                idempotency_key:
                  type: string
                  minLength: 8
                  maxLength: 120
      responses:
        "200":
          description: Moved organization unit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationUnitMutation"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /organizations/{organization_id}/invitations:
    post:
      operationId: createOrganizationInvitation
      summary: Create a target-bound or one-time-link organization invitation without revealing target existence
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [target_type, roles, expires_in_hours]
              properties:
                target_type:
                  type: string
                  enum: [PHONE, USERNAME, LINK, EMAIL]
                target:
                  type: string
                  description: Required for PHONE, USERNAME, and legacy EMAIL; omitted for LINK.
                email:
                  type: string
                  format: email
                  deprecated: true
                roles:
                  type: array
                  uniqueItems: true
                  items:
                    type: string
                    enum: [ORG_ADMIN, BILLING_ADMIN, MEMBER, AUDITOR]
                expires_in_hours:
                  type: integer
                  minimum: 1
                  maximum: 720
                idempotency_key:
                  type: string
                  minLength: 8
                  maxLength: 120
      responses:
        "201":
          description: Invitation; token is returned only on creation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
        "200":
          description: Existing metadata replayed without returning the one-time token again
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          description: The expected context version is stale; reload the current global context before retrying
          $ref: "#/components/responses/Error"
  /organizations/{organization_id}/invitations/{invitation_id}:
    delete:
      operationId: revokeOrganizationInvitation
      summary: Idempotently revoke a pending invitation while retaining history
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - name: invitation_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Revoked invitation or its existing terminal result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invitation" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /me/invitations:
    get:
      operationId: listMyOrganizationInvitations
      summary: Recover invitations from the authenticated identity without accepting an arbitrary lookup target
      responses:
        "200":
          description: Pending targeted invitations for the current identity
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Invitation" } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /invitations/accept:
    post:
      operationId: acceptOrganizationInvitation
      summary: Idempotently accept a one-time invitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [token]
                  properties:
                    token: { type: string, minLength: 32, maxLength: 128 }
                - type: object
                  additionalProperties: false
                  required: [invitation_id]
                  properties:
                    invitation_id: { type: string, format: uuid }
      responses:
        "200":
          description: Membership established, or the same existing relationship returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipMutationResult"
        "403":
          $ref: "#/components/responses/Error"
        "410":
          $ref: "#/components/responses/Error"
  /organizations/{organization_id}/members/{user_id}:
    delete:
      operationId: revokeOrganizationMembership
      summary: Revoke a membership while preserving the final owner invariant
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Membership revoked, or the same terminal relationship returned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MembershipMutationResult" }
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /organizations/{organization_id}/members:
    get:
      operationId: listOrganizationMembers
      summary: List active members with roles and unit assignments
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - name: unit_id
          in: query
          required: false
          description: Explicit member-subtree target. Required for unit-scoped administrators; cross-subtree memberships are excluded.
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Active organization members
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/OrganizationMember"
        "403":
          $ref: "#/components/responses/Error"
  /organizations/{organization_id}/quota-members:
    get:
      operationId: listOrganizationQuotaMembers
      summary: List the minimal active-member directory required by quota allocators
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: Active members eligible for organization quota allocation
          headers:
            Cache-Control:
              required: true
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/QuotaMember"
        "403":
          $ref: "#/components/responses/Error"
  /organizations/{organization_id}/members/{user_id}/roles:
    put:
      operationId: replaceOrganizationMemberRoles
      summary: Replace non-owner organization-wide roles and invalidate authorization caches
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [roles]
              properties:
                roles:
                  type: array
                  uniqueItems: true
                  items:
                    type: string
                    enum: [ORG_ADMIN, BILLING_ADMIN, MEMBER, AUDITOR]
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationMember"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /organizations/{organization_id}/role-bindings:
    get:
      operationId: listOrganizationRoleBindings
      summary: List organization and node role bindings with validity, source, and lifecycle status
      parameters: [{ $ref: "#/components/parameters/OrganizationId" }]
      responses:
        "200":
          description: Organization role bindings visible under org.roles.read
          headers:
            Cache-Control: { required: true, schema: { type: string, const: no-store } }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/RoleBinding" } }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: grantOrganizationRoleBinding
      summary: Idempotently grant an assignable non-owner organization or node role with an optional validity window
      parameters: [{ $ref: "#/components/parameters/OrganizationId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleBindingGrant" }
      responses:
        "201": { description: Role binding created or the idempotent original returned, content: { application/json: { schema: { $ref: "#/components/schemas/RoleBinding" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /organizations/{organization_id}/role-bindings/{binding_id}:
    delete:
      operationId: revokeOrganizationRoleBinding
      summary: Idempotently revoke one ordinary role binding and invalidate authorization caches
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - { name: binding_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Revoked binding or the already revoked original, content: { application/json: { schema: { $ref: "#/components/schemas/RoleBinding" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: "Owner, platform, or non-assignable base role must use its dedicated lifecycle API", content: { application/json: { schema: { $ref: "common.yaml#/components/schemas/Error" } } } }
  /organizations/{organization_id}/ownership:
    post:
      operationId: transferOrganizationOwnership
      summary: Atomically transfer organization ownership
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [new_owner_user_id]
              properties:
                new_owner_user_id:
                  type: string
                  format: uuid
                idempotency_key:
                  type: string
                  minLength: 8
                  maxLength: 120
      responses:
        "200":
          description: Ownership transferred, or the same result returned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnershipTransferResult" }
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://identity.example.invalid/realms/pinvou/.well-known/openid-configuration
    serviceToken:
      type: http
      scheme: bearer
      bearerFormat: workload identity JWT
  responses:
    Error:
      description: Stable error response
      content:
        application/json:
          schema:
            $ref: "common.yaml#/components/schemas/Error"
    UpgradeRequired:
      description: The desktop client sunset has passed for remote write operations
      headers:
        Link: { required: true, schema: { type: string } }
        X-API-Contract-Version: { required: true, schema: { type: string } }
        X-Minimum-Supported-Client-Version: { required: true, schema: { type: string } }
      content:
        application/json:
          schema:
            $ref: "common.yaml#/components/schemas/Error"
  parameters:
    OrganizationId:
      name: organization_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 8
        maxLength: 120
      description: Stable operation key; body fallback is accepted for constrained clients.
  schemas:
    ApprovalRecoveryPlan:
      type: object
      additionalProperties: false
      required: [schema_version, observed_at, control, candidates, more_candidates]
      properties:
        schema_version: { type: integer, const: 1 }
        observed_at: { type: string, format: date-time }
        control:
          type: object
          additionalProperties: false
          required: [control_id, schema_version, mode, approval_wire_version, proof_required, authorization_relay_state, approval_epoch, authorization_relay_epoch, version, updated_at]
          properties:
            control_id: { type: string, const: ADMIN_APPROVAL }
            schema_version: { type: integer, const: 1 }
            mode: { type: string, enum: [LEGACY, QUIESCING, PROOF_REQUIRED, SAFE_ROLLBACK] }
            approval_wire_version: { type: integer, enum: [1, 2] }
            proof_required: { type: boolean }
            authorization_relay_state: { type: string, enum: [RUNNING, FENCED] }
            approval_epoch: { type: integer, format: int64, minimum: 1 }
            authorization_relay_epoch: { type: integer, format: int64, minimum: 1 }
            version: { type: integer, format: int64, minimum: 1 }
            updated_at: { type: string, format: date-time }
        candidates: { type: array, maxItems: 200, items: { $ref: "#/components/schemas/ApprovalRecoveryCandidate" } }
        more_candidates: { type: boolean }
    ApprovalRecoveryCandidate:
      type: object
      additionalProperties: false
      required: [approval_request_id, execution_id, original_execution_idempotency_key, original_event_id, durable, workload, command_type, command_fingerprint, policy_version, approval_epoch, request_version, request_status, execution_status, execution_deadline, window_elapsed, delivery, investigation]
      properties:
        approval_request_id: { type: string, format: uuid }
        execution_id: { type: string, format: uuid }
        original_execution_idempotency_key: { type: string, minLength: 1, maxLength: 512 }
        original_event_id: { type: string, format: uuid }
        durable: { type: string, minLength: 1, maxLength: 120 }
        workload: { type: string, enum: [billing-command-executor, token-command-executor] }
        command_type: { type: string, enum: [WALLET_ADJUSTMENT, PAYMENT_PROVIDER_RESUME, PAYMENT_PRODUCT_RESUME, TOKEN_MODEL_LIFECYCLE_CHANGE, TOKEN_MODEL_CATALOG_ROLLBACK, TOKEN_CREDENTIAL_REVOKE] }
        command_fingerprint: { type: string, pattern: '^[0-9a-f]{64}$' }
        policy_version: { type: integer, format: int64, minimum: 1 }
        approval_epoch: { type: integer, format: int64, minimum: 1 }
        request_version: { type: integer, format: int64, minimum: 1 }
        request_status: { type: string, enum: [EXECUTING, EXECUTION_FAILED] }
        execution_status: { type: string, enum: [EXECUTING, FAILED] }
        execution_deadline: { type: string, format: date-time }
        window_elapsed: { type: boolean }
        delivery:
          type: object
          additionalProperties: false
          required: [domain_attempt_count, state, version]
          properties:
            domain_attempt_count: { type: integer, minimum: 0, maximum: 12 }
            state: { type: string }
            version: { type: integer, format: int64, minimum: 1 }
            last_error_code: { type: string }
            execution_status: { type: string }
            execution_error_class: { type: string }
        investigation:
          type: object
          additionalProperties: false
          required: [class, retryable, max_domain_attempts, query_only]
          properties:
            class: { type: string, enum: [UNKNOWN, PERMANENT, FACT_OR_POLICY_CHANGED, WINDOW_ENDED, TRANSIENT_SAFE] }
            retryable: { type: boolean, const: false }
            max_domain_attempts: { type: integer, const: 1 }
            query_only: { type: boolean, const: true }
    TokenFinancialSnapshot:
      type: object
      additionalProperties: false
      required: [billing_price_revision, price_set_fingerprint, models_checked, models_covered, fully_covered, billing_as_of]
      properties:
        billing_price_revision: { type: integer, format: int64, minimum: 1 }
        price_set_fingerprint: { type: string, pattern: '^[0-9a-f]{64}$' }
        models_checked: { type: integer, minimum: 1 }
        models_covered: { type: integer, minimum: 0 }
        fully_covered: { type: boolean, const: true }
        billing_as_of: { type: string, format: date-time }
