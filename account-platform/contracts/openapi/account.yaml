        authorization_provenance: { type: string, enum: [FROZEN_AT_APPROVAL, RECONSTRUCTED_FOR_DELIVERY, RECONSTRUCTED_AFTER_PUBLISH] }
        authorization_approval_epoch: { type: integer, format: int64, minimum: 1 }
