openapi: 3.1.0
info:
  title: Pinvou Account Service API
  version: 0.1.0
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /v1
security:
  - oidc: []
paths:
  /auth/registration/precheck:
    post:
      security: []
      operationId: precheckMobileRegistration
      summary: Validate username and mobile availability using an opaque Identity password reference
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, mobile, password_handle, password_policy_version]
              properties:
                username: { type: string, minLength: 3, maxLength: 32 }
                mobile: { type: string }
                password_handle: { type: string, minLength: 43, maxLength: 43 }
                password_policy_version: { type: string, minLength: 1, maxLength: 64 }
      responses:
        "200":
          description: Registration fields are valid and available
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /auth/captcha/challenges:
    post:
      security: []
      operationId: createSliderCaptcha
      summary: Create a mobile- and purpose-bound slider challenge
      responses:
        "201":
          description: Slider challenge with PNG background and puzzle piece
        "400":
          $ref: "#/components/responses/Error"
  /auth/sms/challenges:
    post:
      security: []
      operationId: sendSMSChallenge
      summary: Send an SMS after registration precheck and slider verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [mobile, purpose, captcha_id, captcha_offset]
              properties:
                username: { type: string, maxLength: 32 }
                mobile: { type: string }
                password_handle: { type: string, maxLength: 43 }
                password_policy_version: { type: string, maxLength: 64 }
                purpose: { type: string, enum: [REGISTER, LOGIN, PASSWORD_RESET] }
                captcha_id: { type: string, format: uuid }
                captcha_offset: { type: integer, minimum: 0 }
      responses:
        "202":
          description: SMS challenge accepted; REGISTER also returns the scoped recovery operation and query token
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [challenge_id, expires_at, retry_after_seconds]
                properties:
                  challenge_id: { type: string, format: uuid }
                  expires_at: { type: string, format: date-time }
                  retry_after_seconds: { type: integer, minimum: 1 }
                  registration_operation_id: { type: string, format: uuid }
                  registration_query_token: { type: string, minLength: 80, maxLength: 256 }
                  registration_query_token_expires_at: { type: string, format: date-time }
        "400":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /auth/register:
    post:
      security: []
      operationId: registerMobile
      summary: Register a mobile identity after provider-side SMS verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, mobile, challenge_id, code, password_handle, password_policy_version, registration_operation_id, registration_query_token]
              properties:
                username: { type: string, minLength: 3, maxLength: 32 }
                mobile: { type: string }
                challenge_id: { type: string, format: uuid }
                code: { type: string, minLength: 1, maxLength: 16 }
                password_handle: { type: string, minLength: 43, maxLength: 43 }
                password_policy_version: { type: string, minLength: 1, maxLength: 64 }
                registration_operation_id: { type: string, format: uuid }
                registration_query_token: { type: string, minLength: 80, maxLength: 256 }
      responses:
        "201":
          description: Account provisioning started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegistrationStatus" }
        "202":
          description: Identity or Account recovery continues asynchronously; the client must query the original operation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegistrationStatus" }
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /auth/registration-operations/{registration_operation_id}:
    get:
      security: []
      operationId: getRegistrationOperation
      summary: Query one registration operation using its scoped signed query token
      parameters:
        - name: registration_operation_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: X-Registration-Query-Token
          in: header
          required: true
          schema: { type: string, minLength: 80, maxLength: 256 }
      responses:
        "200":
          description: Redacted registration recovery state
          headers:
            Cache-Control:
              required: true
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegistrationStatus" }
        "404":
          $ref: "#/components/responses/Error"
  /auth/password-resets:
    post:
      security: []
      operationId: resetForgottenPassword
      summary: Reset a password after anti-enumeration mobile SMS verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [mobile, challenge_id, code, password_handle, password_policy_version]
              properties:
                mobile: { type: string }
                challenge_id: { type: string, format: uuid }
                code: { type: string, minLength: 1, maxLength: 16 }
                password_handle: { type: string, minLength: 43, maxLength: 43 }
                password_policy_version: { type: string, const: user-v1 }
      responses:
        "204": { description: Password reset and all existing sessions revoked }
        "401": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
  /account/bootstrap:
    post:
      operationId: bootstrapAccount
      summary: Idempotently provision the current business user and enqueue personal wallet initialization
      responses:
        "200":
          description: Current business user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Error"
  /me:
    get:
      operationId: getMe
      summary: Get the current business user and active context
      responses:
        "200":
          description: Current business user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Error"
  /me/profile-change-requests:
    post:
      operationId: createProfileChange
      summary: Reserve a username or mobile after recent authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [field, value]
              properties:
                field: { type: string, enum: [USERNAME, MOBILE] }
                value: { type: string }
      responses:
        "201": { description: Recoverable profile change created }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /me/profile-change-requests/{request_id}/mobile-challenges:
    post:
      operationId: sendProfileMobileChallenge
      summary: Verify the reserved new mobile with a bound SMS challenge
      parameters:
        - name: request_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "202": { description: Challenge sent }
        "401": { $ref: "#/components/responses/Error" }
  /me/profile-change-requests/{request_id}/actions/complete:
    post:
      operationId: completeProfileChange
      summary: Converge Identity update, Account CAS commit, session revocation, and Commerce sync
      parameters:
        - name: request_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Profile change completed }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /me/profile-change-requests/{request_id}:
    get:
      operationId: getProfileChange
      summary: Get the redacted recovery state of one profile change
      parameters:
        - name: request_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Redacted profile change state }
        "404": { $ref: "#/components/responses/Error" }
  /me/authorization-context:
    get:
      operationId: resolveAuthorizationContext
      summary: Resolve the current user, explicit context, scoped roles, permission codes, and authorization versions
      responses:
        "200":
          description: Session-scoped authorization context
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [user_id, session_id, context_type, membership_version, context_version, authorization_version, unit_ids, ancestor_unit_ids, roles, permissions, platform_roles, platform_permissions]
                properties:
                  user_id:
                    type: string
                    format: uuid
                  session_id:
                    type: string
                  context_type:
                    type: string
                    enum: [PERSONAL, ORGANIZATION]
                  organization_id:
                    type: [string, "null"]
                    format: uuid
                  membership_version:
                    type: integer
                    format: int64
                    minimum: 1
                  context_version:
                    type: integer
                    format: int64
                    minimum: 1
                  authorization_version:
                    type: integer
                    format: int64
                    minimum: 1
                  unit_ids:
                    type: array
                    uniqueItems: true
                    items:
                      type: string
                      format: uuid
                  ancestor_unit_ids:
                    type: array
                    uniqueItems: true
                    items:
                      type: string
                      format: uuid
                  roles:
                    type: array
                    uniqueItems: true
                    items:
                      type: string
                  permissions:
                    type: array
                    uniqueItems: true
                    items:
                      type: string
                  platform_roles:
                    type: array
                    uniqueItems: true
                    items:
                      type: string
                  platform_permissions:
                    type: array
                    uniqueItems: true
                    items:
                      type: string
        "401":
          $ref: "#/components/responses/Error"
  /me/organizations:
    get:
      operationId: listMyOrganizations
      summary: List active organization memberships
      responses:
        "200":
          description: Active organization memberships
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/OrganizationSummary"
        "401":
          $ref: "#/components/responses/Error"
  /sessions/current/active-context:
    post:
      operationId: setActiveContext
      summary: Select personal context or one active organization for this session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetActiveContextRequest"
      responses:
        "200":
          description: Updated active context
          content:
            application/json:
              schema:
                $ref: "common.yaml#/components/schemas/Context"
        "403":
          $ref: "#/components/responses/Error"
  /organizations/{organization_id}/units:
    get:
      operationId: listOrganizationUnits
      summary: List the active organization tree visible to a member
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: Flat organization-unit list linked by parent_id
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/OrganizationUnit"
        "403":
          $ref: "#/components/responses/Error"
    post:
      operationId: createOrganizationUnit
      summary: Create an internal organization unit
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 120
                parent_id:
                  type: [string, "null"]
                  format: uuid
      responses:
        "201":
          description: Created organization unit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationUnit"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /organizations/{organization_id}/units/{unit_id}/parent:
    patch:
      operationId: moveOrganizationUnit
      summary: Move an organization unit with optimistic concurrency
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - name: unit_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_version]
              properties:
                parent_id:
                  type: [string, "null"]
                  format: uuid
                expected_version:
                  type: integer
                  minimum: 1
      responses:
        "200":
          description: Moved organization unit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationUnit"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /organizations/{organization_id}/invitations:
    post:
      operationId: createOrganizationInvitation
      summary: Create a one-time organization invitation
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, roles, expires_in_hours]
              properties:
                email:
                  type: string
                  format: email
                roles:
                  type: array
                  uniqueItems: true
                  items:
                    type: string
                    enum: [ORG_ADMIN, BILLING_ADMIN, MEMBER, AUDITOR]
                expires_in_hours:
                  type: integer
                  minimum: 1
                  maximum: 720
      responses:
        "201":
          description: Invitation; token is returned only on creation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /invitations/accept:
    post:
      operationId: acceptOrganizationInvitation
      summary: Idempotently accept a one-time invitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token:
                  type: string
                  minLength: 32
                  maxLength: 128
      responses:
        "200":
          description: Joined organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "403":
          $ref: "#/components/responses/Error"
        "410":
          $ref: "#/components/responses/Error"
  /organizations/{organization_id}/members/{user_id}:
    delete:
      operationId: revokeOrganizationMembership
      summary: Revoke a membership while preserving the final owner invariant
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Membership revoked
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /organizations/{organization_id}/members:
    get:
      operationId: listOrganizationMembers
      summary: List active members with roles and unit assignments
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: Active organization members
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/OrganizationMember"
        "403":
          $ref: "#/components/responses/Error"
  /organizations/{organization_id}/members/{user_id}/roles:
    put:
      operationId: replaceOrganizationMemberRoles
      summary: Replace non-owner organization-wide roles and invalidate authorization caches
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [roles]
              properties:
                roles:
                  type: array
                  uniqueItems: true
                  items:
                    type: string
                    enum: [ORG_ADMIN, BILLING_ADMIN, MEMBER, AUDITOR]
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationMember"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /organizations/{organization_id}/ownership:
    post:
      operationId: transferOrganizationOwnership
      summary: Atomically transfer organization ownership
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [new_owner_user_id]
              properties:
                new_owner_user_id:
                  type: string
                  format: uuid
      responses:
        "204":
          description: Ownership transferred
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://identity.example.invalid/realms/pinvou/.well-known/openid-configuration
  responses:
    Error:
      description: Stable error response
      content:
        application/json:
          schema:
            $ref: "common.yaml#/components/schemas/Error"
  parameters:
    OrganizationId:
      name: organization_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    RegistrationStatus:
      type: object
      additionalProperties: false
      required: [registration_operation_id, status]
      properties:
        registration_operation_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        user_code: { $ref: "#/components/schemas/UserCode" }
        username: { type: string, minLength: 3, maxLength: 32 }
        status:
          type: string
          enum: [SMS_PENDING, REGISTRATION_IN_PROGRESS, IDENTITY_CREATING, IDENTITY_CREATED, ACCOUNT_COMMITTING, ACCOUNT_COMMITTED, PROVISIONING, ACTIVE, REPAIR_REQUIRED, COMPENSATION_PENDING, COMPENSATED, EXPIRED]
        next_retry_at: { type: string, format: date-time }
        reason:
          type: string
          description: Stable redacted reason code; provider text and secret material are never returned.
    Me:
      type: object
      additionalProperties: false
      required: [user_id, user_code, status, active_context]
      properties:
        user_id:
          type: string
          format: uuid
        user_code:
          $ref: "#/components/schemas/UserCode"
        status:
          type: string
          enum: [PROVISIONING, ACTIVE, REPAIR_REQUIRED, DISABLED]
        username:
          type: [string, "null"]
        display_name:
          type: [string, "null"]
        active_context:
          $ref: "common.yaml#/components/schemas/Context"
    UserCode:
      type: string
      description: Permanent, display-safe user code. It is not an authentication or authorization credential.
      pattern: '^USR-[0-9A-HJKMNP-TV-Z]{4}-[0-9A-HJKMNP-TV-Z]{4}-[0-9A-HJKMNP-TV-Z]{4}-[0-9A-HJKMNP-TV-Z]{4}-[0-9A-HJKMNP-TV-Z]{2}$'
      example: USR-0123-4567-89AB-CDEF-MV
    OrganizationSummary:
      type: object
      additionalProperties: false
      required: [organization_id, name, roles]
      properties:
        organization_id:
          type: string
          format: uuid
        name:
          type: string
        roles:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [OWNER, ORG_ADMIN, BILLING_ADMIN, UNIT_ADMIN, MEMBER, AUDITOR]
    Organization:
      type: object
      additionalProperties: false
      required: [organization_id, name, status, version]
      properties:
        organization_id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum: [ACTIVE, DISABLED]
        version:
          type: integer
          minimum: 1
        roles:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [OWNER, ORG_ADMIN, BILLING_ADMIN, UNIT_ADMIN, MEMBER, AUDITOR]
    OrganizationUnit:
      type: object
      additionalProperties: false
      required: [unit_id, organization_id, name, status, version]
      properties:
        unit_id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        parent_id:
          type: [string, "null"]
          format: uuid
        name:
          type: string
        status:
          type: string
          enum: [ACTIVE, DISABLED]
        version:
          type: integer
          minimum: 1
    OrganizationMember:
      type: object
      additionalProperties: false
      required: [membership_id, user_id, status, version, roles, unit_ids, joined_at]
      properties:
        membership_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        display_name:
          type: [string, "null"]
        email:
          type: [string, "null"]
          format: email
        status:
          type: string
          enum: [ACTIVE]
        version:
          type: integer
          minimum: 1
        roles:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [OWNER, ORG_ADMIN, BILLING_ADMIN, UNIT_ADMIN, MEMBER, AUDITOR]
        unit_ids:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
        joined_at:
          type: string
          format: date-time
    Invitation:
      type: object
      additionalProperties: false
      required: [invitation_id, organization_id, email, roles, expires_at, token]
      properties:
        invitation_id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        roles:
          type: array
          uniqueItems: true
          items:
            type: string
        expires_at:
          type: string
          format: date-time
        token:
          type: string
    SetActiveContextRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [context_type]
          properties:
            context_type:
              const: PERSONAL
        - type: object
          additionalProperties: false
          required: [context_type, organization_id]
          properties:
            context_type:
              const: ORGANIZATION
            organization_id:
              type: string
              format: uuid
