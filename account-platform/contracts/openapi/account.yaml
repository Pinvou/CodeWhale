      required: [domain_attempt_count, state, version]
      allOf:
        - if: { required: [execution_status], properties: { execution_status: { const: FAILED } } }
          then: { required: [execution_error_class], properties: { execution_error_class: {} } }
        - if: { required: [execution_error_class], properties: { execution_error_class: {} } }
          then: { required: [execution_status], properties: { execution_status: { const: FAILED } } }
