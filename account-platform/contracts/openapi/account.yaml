        last_error_code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{0,119}$'
          not: { pattern: '(TOKEN|KEY|SECRET|PASSWORD|CREDENTIAL)' }
        execution_status: { type: string, enum: [EXECUTING, EXECUTED, FAILED] }
        execution_error_class:
          type: string
