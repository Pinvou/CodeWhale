  "x-existing-input-additions": {
    "adminAddMember": {
      "unit_ids": {
        "type": "array",
        "items": {
          "type": "string",
          "format": "uuid",
          "description": "Canonical nonzero UUID."
        },
        "description": "Optional explicit initial units for new/reactivated membership. Existing ACTIVE membership is not silently moved."
      }
    },
    "createInvitation": {
      "unit_ids": {
        "type": "array",
        "items": {
          "type": "string",
          "format": "uuid",
          "description": "Canonical nonzero UUID."
        },
        "description": "Optional frozen ordinary attachment facts. Accept rechecks current inviter authority and current units. Non-MEMBER grants additionally require current organization-wide roles.assign."
      }
    }
  }
