openapi: 3.1.0
info:
  title: Pinvou Billing Service API
  version: 0.1.0
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /v1
security:
  - serviceToken: []
paths:
  /internal/v1/organizations/{organization_id}/recharge/products:
    servers: [{ url: / }]
    get:
      operationId: listInternalOrganizationEntitlementProducts
      summary: List plan products for the exact organization wallet
      parameters:
        - { name: organization_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: wallet_id, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { $ref: "#/paths/~1recharge~1products/get/responses/200" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /internal/v1/organizations/{organization_id}/entitlement-packages:
    servers: [{ url: / }]
    get:
      operationId: listInternalOrganizationEntitlementPackages
      summary: List entitlement packages for the exact organization wallet
      parameters:
        - { name: organization_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: wallet_id, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { $ref: "#/paths/~1entitlement-packages/get/responses/200" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /internal/v1/organizations/{organization_id}/members/{user_id}/lifecycle:
    servers: [{ url: / }]
    put:
      operationId: applyInternalOrganizationMemberLifecycle
      summary: Apply the trusted organization member lifecycle snapshot
      parameters:
        - { name: organization_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: user_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status, membership_version]
              properties:
                status: { type: string, enum: [ACTIVE, SUSPENDED, REVOKED] }
                membership_version: { type: integer, format: int64, minimum: 1 }
      responses:
        "200":
          description: Authoritative member lifecycle projection
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [organization_id, user_id, status, membership_version]
                properties:
                  organization_id: { type: string, format: uuid }
                  user_id: { type: string, format: uuid }
                  status: { type: string, enum: [ACTIVE, SUSPENDED, REVOKED] }
                  membership_version: { type: integer, format: int64, minimum: 1 }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /internal/v1/organizations/{organization_id}/quota-grants:
    servers: [{ url: / }]
    get:
      operationId: listInternalOrganizationQuotaGrants
      summary: List organization member grants using trusted service-provided filters
      description: The Gateway authorizes the caller; this internal route requires service authentication.
      parameters:
        - { name: organization_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: member_user_id, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Component-bound member grants
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/MemberQuotaGrant" } }
        "403": { $ref: "#/components/responses/Error" }
  /internal/v1/organizations/{organization_id}/quota-grants:batch:
    servers: [{ url: / }]
    post:
      operationId: allocateInternalOrganizationQuotaBatch
      summary: Allocate exact package components using independent per-item transactions and stable derived idempotency keys
      parameters:
        - { name: organization_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 16, maxLength: 128 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [created_by, items]
              properties:
                created_by: { type: string, format: uuid }
                items:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items: { $ref: "#/components/schemas/MemberQuotaAllocation" }
      responses:
        "207": { description: "Per-item success, replay, or stable failure result", content: { application/json: { schema: { $ref: "#/components/schemas/MemberQuotaBatchResponse" } } } }
        "403": { $ref: "#/components/responses/Error" }
  /internal/v1/organizations/{organization_id}/quota-grants/{grant_id}/revoke:
    servers: [{ url: / }]
    post:
      operationId: revokeInternalOrganizationQuotaGrant
      summary: Revoke the unconsumed and unheld remainder back to its original component
      parameters:
        - { name: organization_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: grant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 16, maxLength: 128 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [actor_user_id, reason]
              properties:
                actor_user_id: { type: string, format: uuid }
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "200": { description: Grant revoked without changing consumed or held amounts, content: { application/json: { schema: { $ref: "#/components/schemas/MemberQuotaGrant" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /internal/v1/recharge/products:
    servers: [{ url: / }]
    get:
      operationId: listOrganizationRechargeProducts
      summary: List the four original LEGACY organization products supported by the development simulator
      parameters:
        - { name: wallet_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: currency, in: query, schema: { type: string, const: CNY, default: CNY } }
        - { name: channel, in: query, schema: { $ref: "#/components/schemas/PaymentChannel" } }
      responses:
        "200": { $ref: "#/paths/~1recharge~1products/get/responses/200" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /entitlement-packages:
    servers: [{ url: /internal/v1 }]
    get:
      operationId: listInternalEntitlementPackages
      summary: List packages bound to the requested personal user and wallet
      parameters:
        - { name: user_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: wallet_id, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Exact package balances and expiry summary
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, summary]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/EntitlementPackage" } }
                  summary: { $ref: "#/components/schemas/EntitlementPackageSummary" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }

  /holds/waiver:
    servers: [{ url: /internal/v1 }]
    post:
      operationId: resolveInternalUsageWaiver
      summary: Resolve an explicit Token-prepared operator waiver against the authoritative hold-row financial winner
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UsageWaiverIntent" } } }
      responses:
        "200": { description: Authoritative RELEASED waiver or already COMMITTED financial winner, content: { application/json: { schema: { $ref: "#/components/schemas/UsageWaiverAuthority" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /recharge/products:
    get:
      operationId: listRechargeProducts
      summary: List server-authoritative recharge products
      parameters:
        - name: currency
          in: query
          schema:
            type: string
            const: CNY
            default: CNY
        - name: channel
          in: query
          schema:
            $ref: "#/components/schemas/PaymentChannel"
      responses:
        "200":
          description: Recharge product catalog
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [catalog_version, items]
                properties:
                  catalog_version:
                    type: integer
                    minimum: 0
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/RechargeProduct"
        "401":
          $ref: "#/components/responses/Error"
  /recharge/orders:
    servers:
      - url: /internal/v1
    get:
      operationId: listRechargeOrders
      summary: List recharge orders for one requester and wallet
      parameters:
        - name: requester_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: wallet_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Recharge order history
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RechargeOrderList"
        "400":
          $ref: "#/components/responses/Error"
    post:
      operationId: createRechargeOrder
      summary: Create or replay a recharge order
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRechargeOrderRequest"
      responses:
        "200":
          description: Existing recharge order replayed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RechargeOrder"
        "201":
          description: Recharge order
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RechargeOrder"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /recharge/orders/recent:
    servers:
      - url: /internal/v1
    get:
      operationId: getRecentRechargeOrder
      summary: Read the newest recharge order for one requester and wallet
      parameters:
        - name: requester_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: wallet_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The newest order, or null when the context has no order
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecentRechargeOrder"
        "400":
          $ref: "#/components/responses/Error"
  /recharge/orders/{order_id}:
    servers:
      - url: /internal/v1
    get:
      operationId: getRechargeOrder
      summary: Read a recharge order
      parameters:
        - name: requester_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: order_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Recharge order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RechargeOrder"
        "404":
          $ref: "#/components/responses/Error"
  /wallets/{wallet_id}/balance:
    get:
      operationId: getBalance
      summary: Read a strongly consistent wallet balance
      parameters:
        - name: wallet_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Wallet balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletBalance"
        "404":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    serviceToken:
      type: http
      scheme: bearer
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
  responses:
    Error:
      description: Stable error response
      content:
        application/json:
          schema:
            $ref: "common.yaml#/components/schemas/Error"
  schemas:
    MemberQuotaAllocation:
      type: object
      additionalProperties: false
      required: [member_user_id, package_id, component_id, component_type, amount_microcredits, membership_version]
      properties:
        member_user_id: { type: string, format: uuid }
        package_id: { type: string, format: uuid }
        component_id: { type: string, format: uuid }
        component_type: { type: string, enum: [BASE, BONUS] }
        amount_microcredits: { type: integer, format: int64, minimum: 1 }
        membership_version: { type: integer, format: int64, minimum: 1 }
    MemberQuotaBatchResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 200
          items:
            oneOf:
              - type: object
                additionalProperties: false
                required: [index, status, grant]
                properties:
                  index: { type: integer, minimum: 0, maximum: 199 }
                  status: { const: SUCCEEDED }
                  created: { type: boolean }
                  grant: { $ref: "#/components/schemas/MemberQuotaGrant" }
              - type: object
                additionalProperties: false
                required: [index, status, code]
                properties:
                  index: { type: integer, minimum: 0, maximum: 199 }
                  status: { const: FAILED }
                  code: { type: string, enum: [INSUFFICIENT_COMPONENT_CAPACITY, IDEMPOTENCY_CONFLICT, NOT_FOUND, BILLING_CONFLICT, INTERNAL_ERROR] }
    MemberQuotaGrant:
      type: object
      additionalProperties: false
      required: [grant_id, organization_id, member_user_id, package_id, component_id, component_type, original_microcredits, available_microcredits, reserved_microcredits, used_microcredits, expired_microcredits, revoked_microcredits, status, membership_version, allocation_version, created_by, expires_at, created_at, updated_at]
      properties:
        grant_id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        member_user_id: { type: string, format: uuid }
        package_id: { type: string, format: uuid }
        component_id: { type: string, format: uuid }
        component_type: { type: string, enum: [BASE, BONUS] }
        original_microcredits: { type: string, pattern: '^[1-9][0-9]*$' }
        available_microcredits: { type: string, pattern: '^[0-9]+$' }
        reserved_microcredits: { type: string, pattern: '^[0-9]+$' }
        used_microcredits: { type: string, pattern: '^[0-9]+$' }
        expired_microcredits: { type: string, pattern: '^[0-9]+$' }
        revoked_microcredits: { type: string, pattern: '^[0-9]+$' }
        status: { type: string, enum: [ACTIVE, SUSPENDED, REVOKED, EXPIRED, RECLAIMED_ACCOUNT_CLOSED] }
        suspension_reason: { type: [string, "null"], enum: [MEMBER_REMOVED, ACCOUNT_CLOSED, null] }
        membership_version: { type: integer, format: int64, minimum: 1 }
        allocation_version: { type: integer, format: int64, minimum: 1 }
        created_by: { type: string, format: uuid }
        expires_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    UsageWaiverIntent:
      type: object
      additionalProperties: false
      required: [hold_id, usage_request_id, reason, actor]
      properties:
        hold_id: { type: string, format: uuid }
        usage_request_id: { type: string, format: uuid }
        reason: { type: string, minLength: 1 }
        actor: { type: string, minLength: 1 }
    UsageWaiverAuthority:
      type: object
      additionalProperties: false
      required: [hold, usage_snapshot]
      properties:
        hold:
          type: object
          additionalProperties: false
          required: [hold_id, usage_request_id, wallet_id, status, max_microcredits, actual_microcredits, expires_at, updated_at]
          properties:
            hold_id: { type: string, format: uuid }
            usage_request_id: { type: string, format: uuid }
            wallet_id: { type: string, format: uuid }
            status: { type: string, enum: [COMMITTED, RELEASED] }
            max_microcredits: { type: string, pattern: '^[1-9][0-9]*$' }
            actual_microcredits: { type: string, pattern: '^(0|[1-9][0-9]*)$' }
            expires_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
        usage_snapshot: { type: object, additionalProperties: true }
    PaymentChannel:
      type: string
      enum: [UNIONPAY, ALIPAY, WECHAT]
    RechargeProduct:
      type: object
      additionalProperties: false
      required: [product_id, amount_fen, credit_microcredits, display_points, currency, catalog_version, channels, plan_name, sku_code, base_points, bonus_points, validity_days, price_status, invoice_product_name]
      properties:
        product_id:
          type: string
          enum: [CNY_1, CNY_10, CNY_100, CNY_200, PLAN_TRIAL, PLAN_STANDARD, PLAN_ADVANCED, PLAN_FLAGSHIP]
        plan_name:
          type: string
        sku_code:
          type: string
        amount_fen:
          type: integer
          format: int64
          minimum: 1
        credit_microcredits:
          type: integer
          format: int64
          minimum: 1
        display_points:
          type: integer
          format: int64
          minimum: 1
        currency:
          type: string
          const: CNY
        catalog_version:
          type: integer
          format: int64
          minimum: 1
        base_points:
          type: integer
          format: int64
          minimum: 0
        bonus_points:
          type: integer
          format: int64
          minimum: 0
        validity_days:
          type: integer
          minimum: 0
        price_status:
          type: string
          enum: [LEGACY, UAT_TENTATIVE, FROZEN]
        invoice_product_name:
          type: string
        channels:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/PaymentChannel"
    CreateRechargeOrderRequest:
      type: object
      additionalProperties: false
      required: [wallet_id, requester_id, product_id, channel]
      properties:
        mobile:
          type: string
          description: Optional commerce identity, supplied only after Account confirms verified and synchronized mobile; empty for community simulator and ordinary organization recharge.
        wallet_id:
          type: string
          format: uuid
        requester_id:
          type: string
          format: uuid
        beneficiary_organization_id:
          type: string
          format: uuid
          description: When present, the wallet must belong to this organization and the fulfilled package has no personal user owner.
        product_id:
          type: string
          enum: [CNY_1, CNY_10, CNY_100, CNY_200, PLAN_TRIAL, PLAN_STANDARD, PLAN_ADVANCED, PLAN_FLAGSHIP]
        channel:
          $ref: "#/components/schemas/PaymentChannel"
        commerce_customer_status:
          type: string
          enum: [NOT_CONFIGURED, PENDING, IN_PROGRESS, READY, RETRY, REPAIR_REQUIRED, DETACHED]
          description: Trusted Account Mapping projection; only enforced when the selected Payment Provider declares commerce_customer_required.
    RechargeOrder:
      type: object
      additionalProperties: false
      required: [order_id, merchant_order_no, requester_id, wallet_id, status, fulfillment_status, product_id, amount_fen, currency, credit_microcredits, channel, expires_at]
      properties:
        order_id:
          type: string
          format: uuid
        merchant_order_no:
          type: string
        requester_id:
          type: string
          format: uuid
        beneficiary_organization_id: { type: string, format: uuid }
        wallet_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [CREATED, PENDING, PAID, PAID_LATE, FAILED, CLOSED, PARTIALLY_REFUNDED, REFUNDED, MANUAL_REVIEW]
        fulfillment_status:
          type: string
          enum: [PENDING, CREDITED, REFUNDED, MANUAL_REVIEW]
        product_id:
          type: string
        amount_fen:
          type: integer
          format: int64
        currency:
          type: string
          const: CNY
        credit_microcredits:
          type: integer
          format: int64
        channel:
          $ref: "#/components/schemas/PaymentChannel"
        payment_url:
          type: string
        qr_data:
          type: string
        channel_transaction_id:
          type: string
        paid_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    RecentRechargeOrder:
      type: object
      additionalProperties: false
      required: [order]
      properties:
        order:
          oneOf:
            - $ref: "#/components/schemas/RechargeOrder"
            - type: "null"
    RechargeOrderHistoryItem:
      type: object
      additionalProperties: false
      required: [order_id, pinvou_order_id, mall_order_id, product_id, plan_name, sku_code, order_type, amount_fen, display_points, channel, status, fulfillment_status, invoice_status, expires_at, created_at]
      properties:
        order_id:
          type: string
          format: uuid
        beneficiary_organization_id:
          type: string
          format: uuid
        pinvou_order_id:
          type: string
          format: uuid
        mall_order_id:
          type: string
        product_id:
          type: string
        plan_name:
          type: string
        sku_code:
          type: string
        order_type:
          type: string
          enum: [PLAN, LEGACY]
        amount_fen:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
        display_points:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
        channel:
          $ref: "#/components/schemas/PaymentChannel"
        status:
          type: string
          enum: [CREATED, PENDING, PAID, PAID_LATE, FAILED, CLOSED, PARTIALLY_REFUNDED, REFUNDED, MANUAL_REVIEW]
        fulfillment_status:
          type: string
          enum: [PENDING, CREDITED, REFUNDED, MANUAL_REVIEW]
        expires_at:
          type: string
          format: date-time
        paid_at:
          type: string
          format: date-time
        credited_at:
          type: string
          format: date-time
        valid_until:
          type: string
          format: date-time
        invoice_status:
          type: string
          enum: [NOT_SUPPORTED]
        created_at:
          type: string
          format: date-time
    RechargeOrderList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RechargeOrderHistoryItem"
    EntitlementPackageSummary:
      type: object
      additionalProperties: false
      required:
        - available_microcredits
        - base_available_microcredits
        - bonus_available_microcredits
        - reserved_microcredits
        - used_microcredits
        - active_package_count
        - next_expiry_microcredits
      properties:
        available_microcredits:
          type: string
          pattern: ^(0|[1-9][0-9]*)$
        base_available_microcredits:
          type: string
          pattern: ^(0|[1-9][0-9]*)$
        bonus_available_microcredits:
          type: string
          pattern: ^(0|[1-9][0-9]*)$
        reserved_microcredits:
          type: string
          pattern: ^(0|[1-9][0-9]*)$
        used_microcredits:
          type: string
          pattern: ^(0|[1-9][0-9]*)$
