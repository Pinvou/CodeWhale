openapi: 3.1.0
info:
  title: Pinvou Billing Service API
  version: 0.1.0
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /v1
security:
  - serviceToken: []
paths:
  /payment-capabilities:
    get:
      operationId: getPaymentCapabilities
      summary: Discover the versioned behavior of the selected Payment Provider
      responses:
        "200":
          description: Provider-neutral payment behavior used by API, UI, and background jobs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentCapabilities"
        "401":
          $ref: "#/components/responses/Error"
  /recharge/products:
    get:
      operationId: listRechargeProducts
      summary: List server-authoritative recharge products
      parameters:
        - name: channel
          in: query
          schema:
            $ref: "#/components/schemas/PaymentChannel"
      responses:
        "200":
          description: Recharge product catalog
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [catalog_version, items]
                properties:
                  catalog_version:
                    type: integer
                    minimum: 1
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/RechargeProduct"
        "401":
          $ref: "#/components/responses/Error"
  /recharge/orders:
    get:
      operationId: listRechargeOrders
      summary: List recharge orders for one requester and wallet
      parameters:
        - name: requester_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: wallet_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Recharge order history
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RechargeOrderList"
        "400":
          $ref: "#/components/responses/Error"
    post:
      operationId: createRechargeOrder
      summary: Create or replay a recharge order
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRechargeOrderRequest"
      responses:
        "201":
          description: Recharge order
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RechargeOrder"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /recharge/orders/recent:
    get:
      operationId: getRecentRechargeOrder
      summary: Read the newest recharge order for one requester and wallet
      parameters:
        - name: requester_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: wallet_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The newest order, or null when the context has no order
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecentRechargeOrder"
        "400":
          $ref: "#/components/responses/Error"
  /recharge/orders/{order_id}:
    get:
      operationId: getRechargeOrder
      summary: Read a recharge order
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Recharge order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RechargeOrder"
        "404":
          $ref: "#/components/responses/Error"
  /wallets/{wallet_id}/balance:
    get:
      operationId: getBalance
      summary: Read a strongly consistent wallet balance
      parameters:
        - name: wallet_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Wallet balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletBalance"
        "404":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    serviceToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
  responses:
    Error:
      description: Stable error response
      content:
        application/json:
          schema:
            $ref: "common.yaml#/components/schemas/Error"
  schemas:
    PaymentCapabilities:
      type: object
      additionalProperties: false
      required: [provider_id, version, channels, order_query_supported, order_history_retention_seconds, minimum_query_interval_seconds, maximum_payable_window_seconds, maximum_late_confirmation_seconds, authoritative_unpaid_terminal, refund_supported, close_supported, notification_supported, bill_supported, manual_repair_supported, commerce_customer_required, reuse_pending_order_after_expiry, review_late_payment, test_only]
      properties:
        provider_id: { type: string, minLength: 1 }
        version: { type: string, minLength: 1 }
        channels: { type: array, minItems: 1, uniqueItems: true, items: { $ref: "#/components/schemas/PaymentChannel" } }
        order_query_supported: { type: boolean }
        order_history_retention_seconds: { type: integer, format: int64, minimum: 0 }
        minimum_query_interval_seconds: { type: integer, format: int64, minimum: 0 }
        maximum_payable_window_seconds: { type: integer, format: int64, minimum: 0 }
        maximum_late_confirmation_seconds: { type: integer, format: int64, minimum: 0 }
        authoritative_unpaid_terminal: { type: boolean }
        refund_supported: { type: boolean }
        close_supported: { type: boolean }
        notification_supported: { type: boolean }
        bill_supported: { type: boolean }
        manual_repair_supported: { type: boolean }
        commerce_customer_required: { type: boolean }
        reuse_pending_order_after_expiry: { type: boolean }
        review_late_payment: { type: boolean }
        test_only: { type: boolean }
    PaymentChannel:
      type: string
      pattern: '^[A-Z0-9_]{1,32}$'
      description: Runtime intersection of the product mapping and selected provider capability channels.
    RechargeProduct:
      type: object
      additionalProperties: false
      required: [product_id, plan_name, amount_fen, credit_microcredits, display_points, base_points, bonus_points, validity_days, price_status, invoice_product_name, channels]
      properties:
        product_id:
          type: string
          enum: [PLAN_TRIAL, PLAN_STANDARD, PLAN_ADVANCED, PLAN_FLAGSHIP]
        plan_name:
          type: string
        amount_fen:
          type: integer
          format: int64
          minimum: 1
        credit_microcredits:
          type: integer
          format: int64
          minimum: 1
        display_points:
          type: integer
          format: int64
          minimum: 1
        base_points:
          type: integer
          format: int64
          minimum: 0
        bonus_points:
          type: integer
          format: int64
          minimum: 0
        validity_days:
          type: integer
          minimum: 1
        price_status:
          type: string
          enum: [UAT_TENTATIVE, FROZEN]
        invoice_product_name:
          type: string
        channels:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/PaymentChannel"
    CreateRechargeOrderRequest:
      type: object
      additionalProperties: false
      required: [wallet_id, requester_id, product_id, channel, mobile, commerce_customer_status]
      properties:
        wallet_id:
          type: string
          format: uuid
        requester_id:
          type: string
          format: uuid
        beneficiary_organization_id:
          type: string
          format: uuid
          description: When present, the wallet must belong to this organization and the fulfilled package has no personal user owner.
        product_id:
          type: string
          enum: [PLAN_TRIAL, PLAN_STANDARD, PLAN_ADVANCED, PLAN_FLAGSHIP]
        channel:
          $ref: "#/components/schemas/PaymentChannel"
        mobile:
          type: string
        commerce_customer_status:
          type: string
          enum: [NOT_CONFIGURED, PENDING, IN_PROGRESS, READY, RETRY, REPAIR_REQUIRED, DETACHED]
          description: Trusted Account Mapping projection; only enforced when the selected Payment Provider declares commerce_customer_required.
    RechargeOrder:
      type: object
      additionalProperties: false
      required: [order_id, status, fulfillment_status, product_id, amount_fen, credit_microcredits, channel, expires_at]
      properties:
        order_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [CREATED, PENDING, PAID, PAID_LATE, FAILED, CLOSED, PARTIALLY_REFUNDED, REFUNDED, MANUAL_REVIEW]
        fulfillment_status:
          type: string
          enum: [PENDING, CREDITED, REFUNDED, MANUAL_REVIEW]
        product_id:
          type: string
        amount_fen:
          type: integer
          format: int64
        credit_microcredits:
          type: integer
          format: int64
        channel:
          $ref: "#/components/schemas/PaymentChannel"
        qr_content:
          type: [string, "null"]
          maxLength: 2048
        expires_at:
          type: string
          format: date-time
    RecentRechargeOrder:
      type: object
      additionalProperties: false
      required: [order]
      properties:
        order:
          oneOf:
            - $ref: "#/components/schemas/RechargeOrder"
            - type: "null"
    RechargeOrderHistoryItem:
      type: object
      additionalProperties: false
      required: [order_id, pinvou_order_id, mall_order_id, product_id, plan_name, sku_code, order_type, amount_fen, display_points, channel, status, fulfillment_status, invoice_status, expires_at, created_at]
      properties:
        order_id:
          type: string
          format: uuid
        beneficiary_organization_id:
          type: string
          format: uuid
        pinvou_order_id:
          type: string
          format: uuid
        mall_order_id:
          type: string
        product_id:
          type: string
        plan_name:
          type: string
        sku_code:
          type: string
        order_type:
          type: string
          const: PLAN
        amount_fen:
          type: integer
          format: int64
        display_points:
          type: integer
          format: int64
        channel:
          $ref: "#/components/schemas/PaymentChannel"
        status:
          type: string
          enum: [CREATED, PENDING, PAID, PAID_LATE, FAILED, CLOSED, PARTIALLY_REFUNDED, REFUNDED, MANUAL_REVIEW]
        fulfillment_status:
          type: string
          enum: [PENDING, CREDITED, REFUNDED, MANUAL_REVIEW]
        expires_at:
          type: string
          format: date-time
        paid_at:
          type: string
          format: date-time
        credited_at:
          type: string
          format: date-time
        valid_until:
          type: string
          format: date-time
        invoice_status:
          type: string
          enum: [NOT_SUPPORTED]
        created_at:
          type: string
          format: date-time
    RechargeOrderList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RechargeOrderHistoryItem"
    WalletBalance:
      type: object
      additionalProperties: false
      required: [wallet_id, posted_microcredits, reserved_microcredits, available_microcredits, version]
      properties:
        wallet_id:
          type: string
          format: uuid
        posted_microcredits:
          type: integer
          format: int64
          minimum: 0
        reserved_microcredits:
          type: integer
          format: int64
          minimum: 0
        available_microcredits:
          type: integer
          format: int64
          minimum: 0
        version:
          type: integer
          format: int64
          minimum: 0
