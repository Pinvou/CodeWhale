openapi: 3.1.0
info:
  title: Pinvou Billing Service API
  version: 0.1.0
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /v1
security:
  - serviceToken: []
paths:
  /payment-capabilities:
    get:
      operationId: getPaymentCapabilities
      summary: Discover the versioned behavior of the selected Payment Provider
      responses:
        "200":
          description: Provider-neutral payment behavior used by API, UI, and background jobs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentCapabilities"
        "401":
          $ref: "#/components/responses/Error"
  /recharge/products:
    get:
      operationId: listRechargeProducts
      summary: List server-authoritative recharge products
      parameters:
        - name: channel
          in: query
          schema:
            $ref: "#/components/schemas/PaymentChannel"
      responses:
        "200":
          description: Recharge product catalog
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [catalog_version, items]
                properties:
                  catalog_version:
                    type: integer
                    minimum: 1
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/RechargeProduct"
        "401":
          $ref: "#/components/responses/Error"
  /recharge/orders:
    get:
      operationId: listRechargeOrders
      summary: List recharge orders for one requester and wallet
      parameters:
        - name: requester_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: wallet_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Recharge order history
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RechargeOrderList"
        "400":
          $ref: "#/components/responses/Error"
    post:
      operationId: createRechargeOrder
      summary: Create or replay a recharge order
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRechargeOrderRequest"
      responses:
        "201":
          description: Recharge order
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RechargeOrder"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /recharge/orders/recent:
    get:
      operationId: getRecentRechargeOrder
      summary: Read the newest recharge order for one requester and wallet
      parameters:
        - name: requester_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: wallet_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The newest order, or null when the context has no order
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecentRechargeOrder"
        "400":
          $ref: "#/components/responses/Error"
  /recharge/orders/{order_id}:
    get:
      operationId: getRechargeOrder
      summary: Read a recharge order
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Recharge order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RechargeOrder"
        "404":
          $ref: "#/components/responses/Error"
  /wallets/{wallet_id}/balance:
    get:
      operationId: getBalance
      summary: Read a strongly consistent wallet balance
      parameters:
        - name: wallet_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Wallet balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletBalance"
        "404":
          $ref: "#/components/responses/Error"
  /internal/v1/recharge/orders/{order_id}/refunds:
    post:
      operationId: createTargetedRemainingRefund
      summary: Refund the whole unconsumed remainder of exactly one payment transaction entitlement package
      parameters:
        - name: order_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TargetedRefundRequest" }
      responses:
        "201":
          description: Targeted whole-remaining refund created
          content: { application/json: { schema: { $ref: "#/components/schemas/Refund" } } }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /internal/v1/refunds/forced:
    post:
      operationId: recordForcedRefund
      summary: Record a provider-initiated refund as separate immutable evidence and freeze its package for review
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ForcedRefundRequest" }
      responses:
        "200":
          description: Forced refund review case
          content: { application/json: { schema: { $ref: "#/components/schemas/ForcedRefundCase" } } }
        "409": { $ref: "#/components/responses/Error" }
  /internal/v1/chargebacks/confirmed:
    post:
      operationId: applyConfirmedChargeback
      summary: Apply an immutable provider-confirmed chargeback to exactly one payment transaction package
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmedChargebackRequest"
      responses:
        "200":
          description: Idempotent chargeback accounting result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChargebackCase"
        "409":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    serviceToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
  responses:
    Error:
      description: Stable error response
      content:
        application/json:
          schema:
            $ref: "common.yaml#/components/schemas/Error"
  schemas:
    PaymentCapabilities:
      type: object
      additionalProperties: false
      required: [provider_id, version, channels, order_query_supported, order_history_retention_seconds, minimum_query_interval_seconds, maximum_payable_window_seconds, maximum_late_confirmation_seconds, authoritative_unpaid_terminal, refund_supported, refund_idempotency_supported, close_supported, notification_supported, bill_supported, manual_repair_supported, commerce_customer_required, reuse_pending_order_after_expiry, review_late_payment, test_only]
      properties:
        provider_id: { type: string, minLength: 1 }
        version: { type: string, minLength: 1 }
        channels: { type: array, minItems: 1, uniqueItems: true, items: { $ref: "#/components/schemas/PaymentChannel" } }
        order_query_supported: { type: boolean }
        order_history_retention_seconds: { type: integer, format: int64, minimum: 0 }
        minimum_query_interval_seconds: { type: integer, format: int64, minimum: 0 }
        maximum_payable_window_seconds: { type: integer, format: int64, minimum: 0 }
        maximum_late_confirmation_seconds: { type: integer, format: int64, minimum: 0 }
        authoritative_unpaid_terminal: { type: boolean }
        refund_supported: { type: boolean }
        refund_idempotency_supported: { type: boolean }
        close_supported: { type: boolean }
        notification_supported: { type: boolean }
        bill_supported: { type: boolean }
        manual_repair_supported: { type: boolean }
        commerce_customer_required: { type: boolean }
        reuse_pending_order_after_expiry: { type: boolean }
        review_late_payment: { type: boolean }
        test_only: { type: boolean }
    PaymentChannel:
      type: string
      pattern: '^[A-Z0-9_]{1,32}$'
      description: Runtime intersection of the product mapping and selected provider capability channels.
    RechargeProduct:
      type: object
      additionalProperties: false
      required: [product_id, plan_name, amount_fen, credit_microcredits, display_points, base_points, bonus_points, validity_days, price_status, invoice_product_name, channels]
      properties:
        product_id:
          type: string
          enum: [PLAN_TRIAL, PLAN_STANDARD, PLAN_ADVANCED, PLAN_FLAGSHIP]
        plan_name:
          type: string
        amount_fen:
          type: integer
          format: int64
          minimum: 1
        credit_microcredits:
          type: integer
          format: int64
          minimum: 1
        display_points:
          type: integer
          format: int64
          minimum: 1
        base_points:
          type: integer
          format: int64
          minimum: 0
        bonus_points:
          type: integer
          format: int64
          minimum: 0
        validity_days:
          type: integer
          minimum: 1
        price_status:
          type: string
          enum: [UAT_TENTATIVE, FROZEN]
        invoice_product_name:
          type: string
        channels:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/PaymentChannel"
    CreateRechargeOrderRequest:
      type: object
      additionalProperties: false
      required: [wallet_id, requester_id, product_id, channel, mobile, commerce_customer_status]
      properties:
        wallet_id:
          type: string
          format: uuid
        requester_id:
          type: string
          format: uuid
        beneficiary_organization_id:
          type: string
          format: uuid
          description: When present, the wallet must belong to this organization and the fulfilled package has no personal user owner.
        product_id:
          type: string
          enum: [PLAN_TRIAL, PLAN_STANDARD, PLAN_ADVANCED, PLAN_FLAGSHIP]
        channel:
          $ref: "#/components/schemas/PaymentChannel"
        mobile:
          type: string
        commerce_customer_status:
          type: string
          enum: [NOT_CONFIGURED, PENDING, IN_PROGRESS, READY, RETRY, REPAIR_REQUIRED, DETACHED]
          description: Trusted Account Mapping projection; only enforced when the selected Payment Provider declares commerce_customer_required.
    RechargeOrder:
      type: object
      additionalProperties: false
      required: [order_id, status, fulfillment_status, product_id, amount_fen, credit_microcredits, channel, expires_at]
      properties:
        order_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [CREATED, PENDING, PAID, PAID_LATE, FAILED, CLOSED, MANUAL_REVIEW]
        fulfillment_status:
          type: string
          enum: [PENDING, CREDITED, MANUAL_REVIEW]
        product_id:
          type: string
        amount_fen:
          type: integer
          format: int64
        credit_microcredits:
          type: integer
          format: int64
        channel:
          $ref: "#/components/schemas/PaymentChannel"
        qr_content:
          type: [string, "null"]
          maxLength: 2048
        primary_provider_transaction_id:
          type: string
          description: Compatibility projection of the first confirmed provider transaction; transaction facts are exposed by the operations detail API.
        expires_at:
          type: string
          format: date-time
    RecentRechargeOrder:
      type: object
      additionalProperties: false
      required: [order]
      properties:
        order:
          oneOf:
            - $ref: "#/components/schemas/RechargeOrder"
            - type: "null"
    RechargeOrderHistoryItem:
      type: object
      additionalProperties: false
      required: [order_id, pinvou_order_id, provider_order_reference, product_id, plan_name, sku_code, order_type, amount_fen, display_points, channel, status, fulfillment_status, invoice_status, expires_at, created_at]
      properties:
        order_id:
          type: string
          format: uuid
        beneficiary_organization_id:
          type: string
          format: uuid
        pinvou_order_id:
          type: string
          format: uuid
        provider_order_reference:
          type: string
          description: Supplier-neutral external order correlation reference.
        product_id:
          type: string
        plan_name:
          type: string
        sku_code:
          type: string
        order_type:
          type: string
          const: PLAN
        amount_fen:
          type: integer
          format: int64
        display_points:
          type: integer
          format: int64
        channel:
          $ref: "#/components/schemas/PaymentChannel"
        status:
          type: string
          enum: [CREATED, PENDING, PAID, PAID_LATE, FAILED, CLOSED, MANUAL_REVIEW]
        fulfillment_status:
          type: string
          enum: [PENDING, CREDITED, MANUAL_REVIEW]
        expires_at:
          type: string
          format: date-time
        paid_at:
          type: string
          format: date-time
        credited_at:
          type: string
          format: date-time
        valid_until:
          type: string
          format: date-time
        invoice_status:
          type: string
          enum: [NOT_SUPPORTED]
        created_at:
          type: string
          format: date-time
    RechargeOrderList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RechargeOrderHistoryItem"
    WalletBalance:
      type: object
      additionalProperties: false
      required: [wallet_id, posted_microcredits, reserved_microcredits, receivable_microcredits, available_microcredits, financial_status, version]
      properties:
        wallet_id:
          type: string
          format: uuid
        posted_microcredits:
          type: integer
          format: int64
          minimum: 0
        reserved_microcredits:
          type: integer
          format: int64
          minimum: 0
        receivable_microcredits:
          type: integer
          format: int64
          minimum: 0
        available_microcredits:
          type: integer
          format: int64
          description: Signed projection equal to posted minus reserved minus receivable.
        financial_status:
          type: string
          enum: [CLEAR, RECEIVABLE_OPEN]
        financial_freeze_reason:
          type: string
        version:
          type: integer
          format: int64
          minimum: 0
    ConfirmedChargebackRequest:
      type: object
      additionalProperties: false
      required: [provider_chargeback_id]
      oneOf:
        - required: [payment_evidence_id]
        - required: [payment_transaction_id, payload_snapshot]
      properties:
        payment_evidence_id: { type: string, format: uuid }
        payment_transaction_id: { type: string, format: uuid }
        provider_chargeback_id: { type: string, minLength: 1, maxLength: 200 }
        payload_snapshot: { type: object, additionalProperties: true, description: Verified provider event snapshot; secrets must be redacted before ingestion. }
    TargetedRefundRequest:
      type: object
      additionalProperties: false
      required: [requester_id, payment_transaction_id, entitlement_package_id, reason]
      properties:
        requester_id: { type: string, format: uuid }
        payment_transaction_id: { type: string, format: uuid }
        entitlement_package_id: { type: string, format: uuid }
        reason: { type: string, minLength: 1, maxLength: 500 }
    Refund:
      type: object
      additionalProperties: false
      required: [refund_id, payment_order_id, payment_transaction_id, entitlement_package_id, requester_id, merchant_refund_no, amount_fen, credit_microcredits, base_microcredits, bonus_microcredits, status, reason, created_at, updated_at]
      properties:
        refund_id: { type: string, format: uuid }
        payment_order_id: { type: string, format: uuid }
        payment_transaction_id: { type: string, format: uuid }
        entitlement_package_id: { type: string, format: uuid }
        requester_id: { type: string, format: uuid }
        merchant_refund_no: { type: string }
        channel_refund_id: { type: string }
        amount_fen: { type: integer, format: int64, minimum: 1 }
        credit_microcredits: { type: integer, format: int64, minimum: 1 }
        base_microcredits: { type: integer, format: int64, minimum: 1 }
        bonus_microcredits: { type: integer, format: int64, minimum: 0 }
        status: { type: string, enum: [REQUESTED, SUCCEEDED, FAILED, MANUAL_REVIEW] }
        reason: { type: string }
        failure_reason: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ForcedRefundRequest:
      type: object
      additionalProperties: false
      required: [payment_transaction_id, provider_refund_id, amount_fen, payload_snapshot]
      properties:
        payment_transaction_id: { type: string, format: uuid }
        provider_refund_id: { type: string, minLength: 1, maxLength: 200 }
        amount_fen: { type: integer, format: int64, minimum: 1 }
        payload_snapshot: { type: object, additionalProperties: true, description: Verified provider evidence with secrets redacted. }
    ForcedRefundCase:
      type: object
      additionalProperties: false
      required: [forced_refund_case_id, payment_evidence_id, payment_order_id, payment_transaction_id, entitlement_package_id, wallet_id, provider_refund_id, amount_fen, status, entitlement_snapshot, created_at]
      properties:
        forced_refund_case_id: { type: string, format: uuid }
        payment_evidence_id: { type: string, format: uuid }
        payment_order_id: { type: string, format: uuid }
        payment_transaction_id: { type: string, format: uuid }
        entitlement_package_id: { type: string, format: uuid }
        wallet_id: { type: string, format: uuid }
        provider_refund_id: { type: string }
        amount_fen: { type: integer, format: int64, minimum: 1 }
        status: { type: string, enum: [REVIEW_REQUIRED, RESOLVED] }
        entitlement_snapshot: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time }
    ChargebackCase:
      type: object
      additionalProperties: false
      required: [chargeback_case_id, payment_evidence_id, payment_order_id, payment_transaction_id, entitlement_package_id, wallet_id, provider_chargeback_id, status, revoked_base_microcredits, revoked_bonus_microcredits, created_at]
      properties:
        chargeback_case_id: { type: string, format: uuid }
        payment_evidence_id: { type: string, format: uuid }
        payment_order_id: { type: string, format: uuid }
        payment_transaction_id: { type: string, format: uuid }
        entitlement_package_id: { type: string, format: uuid }
        wallet_id: { type: string, format: uuid }
        provider_chargeback_id: { type: string }
        status: { type: string, enum: [CONFIRMED, RESOLVED] }
        revoked_base_microcredits: { type: integer, format: int64, minimum: 0 }
        revoked_bonus_microcredits: { type: integer, format: int64, minimum: 0 }
        receivable_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
