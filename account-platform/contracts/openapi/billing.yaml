openapi: 3.1.0
info:
  title: Pinvou Billing Service API
  version: 0.1.0
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /v1
security:
  - serviceToken: []
paths:
  /payment-capabilities:
    get:
      operationId: getPaymentCapabilities
      summary: Discover the versioned behavior of the selected Payment Provider
      responses:
        "200":
          description: Provider-neutral payment behavior used by API, UI, and background jobs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentCapabilities"
        "401":
          $ref: "#/components/responses/Error"
  /recharge/products:
    get:
      operationId: listRechargeProducts
      summary: List server-authoritative recharge products
      parameters:
        - name: channel
          in: query
          schema:
            $ref: "#/components/schemas/PaymentChannel"
      responses:
        "200":
          description: Recharge product catalog
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [catalog_version, items]
                properties:
                  catalog_version:
                    type: integer
                    minimum: 1
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/RechargeProduct"
        "401":
          $ref: "#/components/responses/Error"
  /recharge/orders:
    get:
      operationId: listRechargeOrders
      summary: List recharge orders for one requester and wallet
      parameters:
        - name: requester_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: wallet_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Recharge order history
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RechargeOrderList"
        "400":
          $ref: "#/components/responses/Error"
    post:
      operationId: createRechargeOrder
      summary: Create or replay a recharge order
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRechargeOrderRequest"
      responses:
        "201":
          description: Recharge order
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RechargeOrder"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
        "429":
          $ref: "#/components/responses/RateLimited"
  /recharge/orders/recent:
    get:
      operationId: getRecentRechargeOrder
      summary: Read the newest recharge order for one requester and wallet
      parameters:
        - name: requester_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: wallet_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The newest order, or null when the context has no order
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecentRechargeOrder"
        "400":
          $ref: "#/components/responses/Error"
  /recharge/orders/{order_id}:
    get:
      operationId: getRechargeOrder
      summary: Read a recharge order
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Recharge order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RechargeOrder"
        "404":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
  /wallets/{wallet_id}/balance:
    get:
      operationId: getBalance
      summary: Read a strongly consistent wallet balance
      parameters:
        - name: wallet_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Wallet balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletBalance"
        "404":
          $ref: "#/components/responses/Error"
  /internal/v1/recharge/orders/{order_id}/refunds:
    post:
      operationId: createTargetedRemainingRefund
      summary: Refund the whole unconsumed remainder of exactly one payment transaction entitlement package
      parameters:
        - name: order_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TargetedRefundRequest" }
      responses:
        "201":
          description: Targeted whole-remaining refund created
          content: { application/json: { schema: { $ref: "#/components/schemas/Refund" } } }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /internal/payment/notifications:
    post:
      servers:
        - url: /
      security: []
      operationId: persistPaymentNotification
      summary: Verify and durably enqueue a provider callback before asynchronous processing
      parameters:
        - name: X-Pinvou-Payment-Channel
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 32 }
        - name: X-Pinvou-Payment-Signature
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 512 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "202":
          description: The valid callback is durably persisted for asynchronous idempotent processing
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/payment-callback/token:
    post:
      servers: [{ url: / }]
      security: [{ paymentCallbackClient: [] }]
      operationId: issuePaymentCallbackToken
      summary: Exchange a provider-bound callback client credential for a short-lived callback token
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              required: [grant_type]
              properties:
                grant_type: { type: string, const: client_credentials }
                scope: { type: string, const: payment.callback.write }
      responses:
        "200":
          description: Short-lived token scoped only to payment callback delivery
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentCallbackToken" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/payment-callbacks:
    post:
      servers: [{ url: / }]
      security: [{ paymentCallbackBearer: [] }]
      operationId: persistProviderPaymentCallback
      summary: Authenticate a provider-bound token and durably persist a normalized payment result
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentCallback" }
      responses:
        "202":
          description: Callback durably persisted; duplicate notification IDs return the same acknowledgement
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /internal/v1/recharge/orders/{order_id}/payment-claims:
    post:
      operationId: addLatePaymentClaimInternal
      summary: Append a requester-owned payment claim and wake an existing late-payment review
      parameters:
        - name: order_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [requester_id, statement]
              properties:
                requester_id: { type: string, format: uuid }
                statement: { type: string, minLength: 10, maxLength: 1000 }
      responses:
        "201": { description: Immutable user evidence accepted }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /internal/v1/refunds/forced:
    post:
      operationId: recordForcedRefund
      summary: Record a provider-initiated refund as separate immutable evidence and freeze its package for review
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ForcedRefundRequest" }
      responses:
        "200":
          description: Forced refund review case
          content: { application/json: { schema: { $ref: "#/components/schemas/ForcedRefundCase" } } }
        "409": { $ref: "#/components/responses/Error" }
  /internal/v1/chargebacks/confirmed:
    post:
      operationId: recordConfirmedChargeback
      summary: Record immutable provider-confirmed chargeback evidence, freeze its exact package, and open review before accounting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmedChargebackRequest"
      responses:
        "200":
          description: Idempotent chargeback review case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChargebackCase"
        "409":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    serviceToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
    paymentCallbackClient:
      type: http
      scheme: basic
      description: Dedicated client credentials bound server-side to one provider, adapter version, and merchant.
    paymentCallbackBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived token whose provider identity is derived by the server and cannot be supplied in the callback body.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
  responses:
    Error:
      description: Stable error response
      content:
        application/json:
          schema:
            $ref: "common.yaml#/components/schemas/Error"
    RateLimited:
      description: The payment action exceeds an atomic multidimensional rate limit
      headers:
        Retry-After:
          required: true
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema:
            $ref: "common.yaml#/components/schemas/Error"
    UpgradeRequired:
      description: The desktop client sunset has passed for remote write operations
      headers:
        Link: { required: true, schema: { type: string } }
        X-API-Contract-Version: { required: true, schema: { type: string } }
        X-Minimum-Supported-Client-Version: { required: true, schema: { type: string } }
      content:
        application/json:
          schema:
            $ref: "common.yaml#/components/schemas/Error"
  schemas:
    PaymentCallbackToken:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_in, scope]
      properties:
        access_token: { type: string, minLength: 32, maxLength: 4096 }
        token_type: { type: string, const: Bearer }
        expires_in: { type: integer, minimum: 60, maximum: 900 }
        scope: { type: string, const: payment.callback.write }
    PaymentCallback:
      description: Provider-profile payload selected exclusively by the callback token. H3C Mall is the first supported profile; future profiles extend this union without changing the endpoint.
      oneOf:
        - $ref: "#/components/schemas/H3CMallOrderSnapshotCallback"
    H3CMallOrderSnapshotCallback:
      type: object
      additionalProperties: false
      description: The native H3C Mall order snapshot, identical to queryOrder content. Provider identity comes only from the callback token.
      required: [orderKey, merchantCustomerKey, mobile, skuBom, needPayAmt, skuAmt, status, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        orderKey: { type: string, minLength: 1, maxLength: 128 }
        merchantCustomerKey: { type: string, format: uuid, description: Pinvou immutable user_id supplied when the order was created. }
        mobile: { type: string, pattern: '^(\+86)?1[0-9]{10}$' }
        skuBom: { type: string, minLength: 1, maxLength: 128 }
        tradeOrderCode: { type: string, maxLength: 128 }
        tradeOrderId: { type: integer, format: int64 }
        skuId: { type: integer, format: int64 }
        needPayAmt: { $ref: "#/components/schemas/H3CMallDecimalAmount" }
        paidAmt: { $ref: "#/components/schemas/H3CMallDecimalAmount" }
        paymentStatus: { type: string, maxLength: 64 }
        payEndTime: { $ref: "#/components/schemas/H3CMallTimestamp" }
        skuAmt: { $ref: "#/components/schemas/H3CMallDecimalAmount" }
        receiveAddressId: { type: integer, format: int64 }
        shopId: { type: integer, format: int64 }
        tradeContractId: { type: integer, format: int64 }
        tradeContractCode: { type: string, maxLength: 128 }
        payUniqueKey: { type: string, maxLength: 128 }
        paymentOrderId: { type: integer, format: int64 }
        buyerId: { type: string, maxLength: 128 }
        payChannel: { type: string, maxLength: 64 }
        aliQrData: { type: string, maxLength: 1048576 }
        wechatQrData: { type: string, maxLength: 1048576 }
        status: { type: string, minLength: 1, maxLength: 64, description: Native Mall status; unknown future values are retained and routed to review. }
        node: { type: string, maxLength: 128 }
        payTime: { $ref: "#/components/schemas/H3CMallTimestamp" }
        executeCostMs: { type: integer, format: int64, minimum: 0 }
        errorMsg: { type: string, maxLength: 4096 }
        traceId: { type: string, maxLength: 128 }
        createdAt: { $ref: "#/components/schemas/H3CMallTimestamp" }
        updatedAt: { $ref: "#/components/schemas/H3CMallTimestamp" }
      allOf:
        - if:
            properties: { status: { const: PAID } }
            required: [status]
          then:
            properties:
              paidAmt: {}
              payTime: {}
              payUniqueKey: {}
              paymentOrderId: {}
            required: [paidAmt, payTime]
            anyOf:
              - properties: { payUniqueKey: {} }
                required: [payUniqueKey]
              - properties: { paymentOrderId: {} }
                required: [paymentOrderId]
    H3CMallDecimalAmount:
      oneOf:
        - type: number
          minimum: 0
          multipleOf: 0.01
        - type: string
          pattern: '^[0-9]+(\.[0-9]{1,2})?$'
    H3CMallTimestamp:
      oneOf:
        - type: string
          minLength: 1
          description: RFC 3339 or Asia/Shanghai yyyy-MM-dd HH:mm:ss.
        - type: integer
          format: int64
          minimum: 1
          description: Unix seconds or milliseconds as returned by H3C Mall.
    PaymentCapabilities:
      type: object
      additionalProperties: false
      required: [provider_id, version, channels, order_query_supported, order_history_retention_seconds, minimum_query_interval_seconds, maximum_payable_window_seconds, maximum_late_confirmation_seconds, authoritative_unpaid_terminal, refund_supported, refund_idempotency_supported, normal_refund_creation_enabled, close_supported, notification_supported, bill_supported, bill_file_import_supported, reconciliation_mode, formal_collection_admitted, manual_repair_supported, commerce_customer_required, reuse_pending_order_after_expiry, review_late_payment, test_only]
      properties:
        provider_id: { type: string, minLength: 1 }
        version: { type: string, minLength: 1 }
        channels: { type: array, minItems: 1, uniqueItems: true, items: { $ref: "#/components/schemas/PaymentChannel" } }
        order_query_supported: { type: boolean }
        order_history_retention_seconds: { type: integer, format: int64, minimum: 0 }
        minimum_query_interval_seconds: { type: integer, format: int64, minimum: 0 }
        maximum_payable_window_seconds: { type: integer, format: int64, minimum: 0 }
        maximum_late_confirmation_seconds: { type: integer, format: int64, minimum: 0 }
        authoritative_unpaid_terminal: { type: boolean }
        refund_supported: { type: boolean }
        refund_idempotency_supported: { type: boolean }
        normal_refund_creation_enabled:
          type: boolean
          description: Independent product gate for creating new normal refunds; defaults to false and never inherits provider capability.
        close_supported: { type: boolean }
        notification_supported: { type: boolean }
        bill_supported: { type: boolean }
        bill_file_import_supported: { type: boolean }
        reconciliation_mode: { type: string, enum: [API, FILE_IMPORT, QUERY_DEGRADED] }
        formal_collection_admitted: { type: boolean }
        manual_repair_supported: { type: boolean }
        commerce_customer_required: { type: boolean }
        reuse_pending_order_after_expiry: { type: boolean }
        review_late_payment: { type: boolean }
        test_only: { type: boolean }
    PaymentChannel:
      type: string
      pattern: '^[A-Z0-9_]{1,32}$'
      description: Runtime intersection of the product mapping and selected provider capability channels.
    RechargeProduct:
      type: object
      additionalProperties: false
      required: [product_id, plan_name, amount_fen, credit_microcredits, display_points, base_points, bonus_points, validity_days, price_status, invoice_product_name, channels, availability_status]
      properties:
        product_id:
          type: string
          enum: [PLAN_TRIAL, PLAN_STANDARD, PLAN_ADVANCED, PLAN_FLAGSHIP]
        plan_name:
          type: string
        amount_fen:
          type: integer
          format: int64
          minimum: 1
        credit_microcredits:
          type: integer
          format: int64
          minimum: 1
        display_points:
          type: integer
          format: int64
          minimum: 1
        base_points:
          type: integer
          format: int64
          minimum: 0
        bonus_points:
          type: integer
          format: int64
          minimum: 0
        validity_days:
          type: integer
          minimum: 1
        price_status:
          type: string
          enum: [UAT_TENTATIVE, FROZEN]
        invoice_product_name:
          type: string
        channels:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/PaymentChannel"
        availability_status:
          type: string
          enum: [AVAILABLE, PROVIDER_PAUSED, PRODUCT_PAUSED]
        availability_reason_code:
          type: string
          enum: [PAYMENT_PROVIDER_PAUSED, PAYMENT_PRODUCT_PAUSED]
    CreateRechargeOrderRequest:
      type: object
      additionalProperties: false
      required: [wallet_id, requester_id, product_id, channel, mobile, commerce_customer_status]
      properties:
        wallet_id:
          type: string
          format: uuid
        requester_id:
          type: string
          format: uuid
        beneficiary_organization_id:
          type: string
          format: uuid
          description: When present, the wallet must belong to this organization and the fulfilled package has no personal user owner.
        product_id:
          type: string
          enum: [PLAN_TRIAL, PLAN_STANDARD, PLAN_ADVANCED, PLAN_FLAGSHIP]
        channel:
          $ref: "#/components/schemas/PaymentChannel"
        mobile:
          type: string
        commerce_customer_status:
          type: string
          enum: [NOT_CONFIGURED, PENDING, IN_PROGRESS, READY, RETRY, REPAIR_REQUIRED, DETACHED]
          description: Trusted Account Mapping projection; only enforced when the selected Payment Provider declares commerce_customer_required.
    RechargeOrder:
      type: object
      additionalProperties: false
      required: [order_id, status, fulfillment_status, close_status, product_id, amount_fen, credit_microcredits, channel, expires_at]
      properties:
        order_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [CREATED, PENDING, PAID, PAID_LATE, FAILED, CLOSED, EXPIRED, MANUAL_REVIEW]
        fulfillment_status:
          type: string
          enum: [PENDING, CREDITED, MANUAL_REVIEW]
        close_status:
          type: string
          enum: [OPEN, CLOSE_REQUESTED, LOCALLY_CLOSED_EXTERNAL_PENDING, PROVIDER_CLOSED, EXPIRED]
        product_id:
          type: string
        amount_fen:
          type: integer
          format: int64
        credit_microcredits:
          type: integer
          format: int64
        channel:
          $ref: "#/components/schemas/PaymentChannel"
        qr_content:
          type: [string, "null"]
          maxLength: 2048
        primary_provider_transaction_id:
          type: string
          description: Compatibility projection of the first confirmed provider transaction; transaction facts are exposed by the operations detail API.
        expires_at:
          type: string
          format: date-time
    RecentRechargeOrder:
      type: object
      additionalProperties: false
      required: [order]
      properties:
        order:
          oneOf:
            - $ref: "#/components/schemas/RechargeOrder"
            - type: "null"
    RechargeOrderHistoryItem:
      type: object
      additionalProperties: false
      required: [order_id, pinvou_order_id, provider_order_reference, product_id, plan_name, sku_code, order_type, amount_fen, display_points, channel, status, fulfillment_status, close_status, invoice_status, expires_at, created_at]
      properties:
        order_id:
          type: string
          format: uuid
        beneficiary_organization_id:
          type: string
          format: uuid
        pinvou_order_id:
          type: string
          format: uuid
        provider_order_reference:
          type: string
          description: Supplier-neutral external order correlation reference.
        product_id:
          type: string
        plan_name:
          type: string
        sku_code:
          type: string
        order_type:
          type: string
          const: PLAN
        amount_fen:
          type: integer
          format: int64
        display_points:
          type: integer
          format: int64
        channel:
          $ref: "#/components/schemas/PaymentChannel"
        status:
          type: string
          enum: [CREATED, PENDING, PAID, PAID_LATE, FAILED, CLOSED, EXPIRED, MANUAL_REVIEW]
        fulfillment_status:
          type: string
          enum: [PENDING, CREDITED, MANUAL_REVIEW]
        close_status:
          type: string
          enum: [OPEN, CLOSE_REQUESTED, LOCALLY_CLOSED_EXTERNAL_PENDING, PROVIDER_CLOSED, EXPIRED]
        expires_at:
          type: string
          format: date-time
        paid_at:
          type: string
          format: date-time
        credited_at:
          type: string
          format: date-time
        valid_until:
          type: string
          format: date-time
        invoice_status:
          type: string
          enum: [NOT_SUPPORTED]
        created_at:
          type: string
          format: date-time
    RechargeOrderList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RechargeOrderHistoryItem"
    WalletBalance:
      type: object
      additionalProperties: false
      required: [wallet_id, posted_microcredits, reserved_microcredits, receivable_microcredits, available_microcredits, financial_status, version]
      properties:
        wallet_id:
          type: string
          format: uuid
        posted_microcredits:
          type: integer
          format: int64
          minimum: 0
        reserved_microcredits:
          type: integer
          format: int64
          minimum: 0
        receivable_microcredits:
          type: integer
          format: int64
          minimum: 0
        available_microcredits:
          type: integer
          format: int64
          description: Signed projection equal to posted minus reserved minus receivable.
        financial_status:
          type: string
          enum: [CLEAR, RECEIVABLE_OPEN]
        financial_freeze_reason:
          type: string
        version:
          type: integer
          format: int64
          minimum: 0
    ConfirmedChargebackRequest:
      type: object
      additionalProperties: false
      required: [payment_transaction_id, provider_chargeback_id, payload_snapshot]
      properties:
        payment_transaction_id: { type: string, format: uuid }
        provider_chargeback_id: { type: string, minLength: 1, maxLength: 200 }
        payload_snapshot: { type: object, additionalProperties: true, description: Verified provider event snapshot; secrets must be redacted before ingestion. }
    TargetedRefundRequest:
      type: object
      additionalProperties: false
      required: [requester_id, payment_transaction_id, entitlement_package_id, reason]
      properties:
        requester_id: { type: string, format: uuid }
        payment_transaction_id: { type: string, format: uuid }
        entitlement_package_id: { type: string, format: uuid }
        reason: { type: string, minLength: 1, maxLength: 500 }
    Refund:
      type: object
      additionalProperties: false
      required: [refund_id, payment_order_id, payment_transaction_id, entitlement_package_id, requester_id, merchant_refund_no, amount_fen, credit_microcredits, base_microcredits, bonus_microcredits, status, reason, created_at, updated_at]
      properties:
        refund_id: { type: string, format: uuid }
        payment_order_id: { type: string, format: uuid }
        payment_transaction_id: { type: string, format: uuid }
        entitlement_package_id: { type: string, format: uuid }
        requester_id: { type: string, format: uuid }
        merchant_refund_no: { type: string }
        channel_refund_id: { type: string }
        amount_fen: { type: integer, format: int64, minimum: 1 }
