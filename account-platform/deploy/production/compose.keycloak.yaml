# Independent production identity project; reuse the verified dependency network.
name: pinvou-production-identity
services:
  keycloak:
    image: ${KEYCLOAK_IMAGE:?set verified Pinvou Keycloak 26.7.0 image digest}
    pull_policy: never
    user: "1000:0"
    command: ["--config-file=/run/pinvou/keycloak-config/keycloak.conf", "start", "--optimized"]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1536m
    cpus: 1.0
    pids_limit: 256
    ulimits:
      core: {soft: 0, hard: 0}
    logging:
      driver: local
      options: {max-size: "10m", max-file: "3"}
    environment:
      JAVA_OPTS_KC_HEAP: "-Xms128m -Xmx512m"
      KC_SPI_CACHE_EMBEDDED_DEFAULT_NODE_NAME: "pinvou-keycloak-production"
      HEALTHCHECK_URL: https://keycloak:9000/health/ready
      SSL_CERT_FILE: /run/pinvou/keycloak-trust/ca.crt
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=128m,mode=1777
      - /opt/keycloak/data:rw,nosuid,nodev,size=128m,uid=1000,gid=0,mode=0700
    volumes:
      - type: bind
        source: ${KEYCLOAK_CONFIG_DIRECTORY:?set dedicated private Keycloak configuration directory}
        target: /run/pinvou/keycloak-config
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${KEYCLOAK_TLS_DIRECTORY:?set Keycloak-only leaf certificate directory}
        target: /run/pinvou/keycloak-tls
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${KEYCLOAK_TRUST_DIRECTORY:?set public infrastructure trust directory}
        target: /run/pinvou/keycloak-trust
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${KEYCLOAK_HEALTHCHECK_BINARY:?set verified same-source Linux healthcheck binary}
        target: /opt/pinvou/healthcheck
        read_only: true
        bind: {create_host_path: false}
    healthcheck:
      test: ["CMD-SHELL", "/opt/pinvou/healthcheck >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12
    networks:
      data:
        aliases: [keycloak]
      business-egress: {}
  keycloak-realm-upgrade:
    image: ${KEYCLOAK_IMAGE:?set verified Pinvou Keycloak 26.7.0 image digest}
    pull_policy: never
    user: "1000:0"
    entrypoint: ["/opt/keycloak/bin/pinvou-provision-mobile-auth.sh"]
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128
    environment:
      HOME: /tmp
      KEYCLOAK_ADMIN_SERVER: https://keycloak:8443
      PINVOU_OIDC_CLIENT_ID: pinvou-desktop
      KEYCLOAK_ADMIN_USERNAME_FILE: /run/pinvou/keycloak-realm-upgrade/admin-username
      KEYCLOAK_ADMIN_PASSWORD_FILE: /run/pinvou/keycloak-realm-upgrade/admin-password
      KEYCLOAK_PROVISIONER_CLIENT_SECRET_FILE: /run/pinvou/keycloak-realm-upgrade/provisioner-client-secret
      KEYCLOAK_ADMIN_TRUSTSTORE: /run/pinvou/keycloak-realm-upgrade/admin-truststore.p12
      KEYCLOAK_ADMIN_TRUSTSTORE_PASSWORD_FILE: /run/pinvou/keycloak-realm-upgrade/admin-truststore-password
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=32m,uid=1000,gid=0,mode=0700
    volumes:
      - type: bind
        source: ${KEYCLOAK_REALM_UPGRADE_SECRET_DIRECTORY:?set one-shot Keycloak realm upgrade secret directory}
        target: /run/pinvou/keycloak-realm-upgrade
        read_only: true
        bind: {create_host_path: false}
    depends_on:
      keycloak: { condition: service_healthy }
    networks: [data]
networks:
  data:
    external: true
    name: ${KEYCLOAK_DATA_NETWORK:?set independently verified internal dependency network}
  business-egress:
    external: true
    name: pinvou-production-business-egress
