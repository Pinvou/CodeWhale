# This file is mounted read-only; only the private service network reaches it.
listen_addresses = '*'
port = 5432
unix_socket_directories = '/var/run/postgresql'
hba_file = '/etc/pinvou/postgres/pg_hba.conf'
ssl = on
ssl_cert_file = '/run/pinvou/postgres-tls/server.crt'
ssl_key_file = '/run/pinvou/postgres-tls/server.key'
ssl_min_protocol_version = 'TLSv1.2'
password_encryption = 'scram-sha-256'
log_statement = 'none'
log_min_error_statement = 'panic'
log_parameter_max_length_on_error = 0
log_connections = off
log_disconnections = off
max_connections = 120
shared_buffers = '128MB'
