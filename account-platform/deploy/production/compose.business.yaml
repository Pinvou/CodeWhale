      PORTAL_ADMIN_MODEL_TOKEN_IA_ENABLED: "true"
      PORTAL_ADMIN_TOKEN_RESOURCE_FORMS_ENABLED: "true"
      PORTAL_ADMIN_MODEL_OPERATIONS_DETAILS_ENABLED: "true"
      PORTAL_ADMIN_MODEL_DETAILS_ENABLED: "true"
      PORTAL_ADMIN_MODEL_PRICING_EDIT_ENABLED: "true"
      PORTAL_ADMIN_MODEL_OPERATIONS_OVERVIEW_ENABLED: "true"
