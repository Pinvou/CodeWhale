      - target: 8080
        published: "${TOKEN_CREDENTIAL_PORTAL_BIND_PORT:?set verified TOKEN_CREDENTIAL_PORTAL_BIND_PORT}"
        host_ip: 127.0.0.1
        protocol: tcp
