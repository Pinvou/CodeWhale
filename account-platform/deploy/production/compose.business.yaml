      CREDENTIAL_OIDC_AUDIENCE: "pinvou-token-credential-portal"
    volumes:
      - type: bind
        source: "${TOKEN_CREDENTIAL_PORTAL_DATABASE_DIRECTORY:?set verified TOKEN_CREDENTIAL_PORTAL_DATABASE_DIRECTORY}"
        target: /var/run/secrets/pinvou/database
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: "${INFRA_CA_DIRECTORY:?set verified INFRA_CA_DIRECTORY}"
        target: /var/run/secrets/pinvou/trust
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: "${TOKEN_CREDENTIAL_PORTAL_WORKLOAD_DIRECTORY:?set verified TOKEN_CREDENTIAL_PORTAL_WORKLOAD_DIRECTORY}"
        target: /var/run/secrets/pinvou/workload
        read_only: true
        bind: {create_host_path: false}
