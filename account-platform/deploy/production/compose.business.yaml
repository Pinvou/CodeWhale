      DATABASE_URL: "postgresql://${TOKEN_CREDENTIAL_RELEASE_ROLE:?set verified TOKEN_CREDENTIAL_RELEASE_ROLE}@postgres:5432/account_platform_token?sslmode=verify-full&sslrootcert=/var/run/secrets/pinvou/trust/ca.crt"
      PGPASSFILE: "/var/run/secrets/pinvou/database/pgpass"
      TOKEN_SECRET_PROVIDER: "vault-transit"
      TOKEN_SECRET_PROVIDER_URL: "${TOKEN_SECRET_PROVIDER_URL:?set verified TOKEN_SECRET_PROVIDER_URL}"
      TOKEN_SECRET_KEY_ID: "${TOKEN_SECRET_KEY_ID:?set verified TOKEN_SECRET_KEY_ID}"
      TOKEN_SECRET_PROVIDER_TOKEN_FILE: "/var/run/secrets/pinvou/kms/token"
      TOKEN_SECRET_PROVIDER_CA_FILE: "/var/run/secrets/pinvou/kms-ca/ca.crt"
      ACCOUNT_HTTP_URL: "http://account-service:8080"
      TOKEN_PROVIDER_ALLOWED_HOSTS: "${TOKEN_PROVIDER_ALLOWED_HOSTS:?set verified TOKEN_PROVIDER_ALLOWED_HOSTS}"
