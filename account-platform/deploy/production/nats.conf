# TLS and separately provisioned public NKeys; no consumer or future-domain identity.
server_name: pinvou-nats
listen: "0.0.0.0:4222"
http: "127.0.0.1:8222"
tls {
  cert_file: "/run/pinvou/nats-tls/server.crt"
  key_file: "/run/pinvou/nats-tls/server.key"
  min_version: "1.2"
  timeout: 2
}
include authorization.conf
jetstream {
  store_dir: "/data"
  max_memory_store: 128MB
  max_file_store: 2GB
}
max_connections: 256
max_payload: 1MB
debug: false
trace: false
