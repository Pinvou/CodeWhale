# These environment values are PUBLIC user NKeys, never NKey seeds or credentials.
# A missing/invalid key must make the broker reject its configuration.
authorization {
  users: [
    {
      nkey: $NATS_EVENT_RESOURCE_OPERATOR_PUBLIC_KEY
      permissions: {
        publish: ["$JS.API.STREAM.INFO.ACCOUNT_PLATFORM", "$JS.API.STREAM.CREATE.ACCOUNT_PLATFORM"]
        subscribe: ["_INBOX.event-resource-operator.>"]
      }
    },
    {
      nkey: $NATS_ACCOUNT_OUTBOX_RELAY_PUBLIC_KEY
      permissions: {
        publish: ["account.>", "account-platform.dead-letter.account.>", "$JS.API.STREAM.INFO.ACCOUNT_PLATFORM"]
        subscribe: ["_INBOX.account-outbox-relay.>"]
      }
    }
  ]
}
