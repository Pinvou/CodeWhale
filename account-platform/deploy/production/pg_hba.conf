# Local socket is mounted only in this database container, not in clients.
local all account_platform_admin scram-sha-256
local all all reject
hostnossl all all all reject
hostssl account_platform_account account_service all scram-sha-256
hostssl account_platform_billing billing_service,billing_migrator all scram-sha-256
hostssl account_platform_token token_gateway,token_migrator,token_policy_operator all scram-sha-256
hostssl account_platform_newapi new_api all scram-sha-256
hostssl account_platform_keycloak keycloak all scram-sha-256
host all all all reject
