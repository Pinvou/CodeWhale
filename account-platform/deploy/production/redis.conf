bind 0.0.0.0
protected-mode yes
port 0
tls-port 6379
tls-cert-file /run/pinvou/redis-tls/server.crt
tls-key-file /run/pinvou/redis-tls/server.key
tls-auth-clients no
tls-protocols "TLSv1.2 TLSv1.3"
aclfile /etc/pinvou/redis/users.acl
unixsocket /run/redis/redis.sock
unixsocketperm 700
daemonize no
logfile ""
loglevel notice
dir /data
databases 1
maxclients 128
maxmemory 96mb
maxmemory-policy noeviction
appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite no
aof-load-truncated no
stop-writes-on-bgsave-error yes
save 900 1
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
