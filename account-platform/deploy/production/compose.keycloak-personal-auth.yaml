# Combine only with the site's verified Keycloak service configuration. The
# image must contain this F01 SPI and theme, with the user realm already verified.
services:
  keycloak:
    environment:
      PINVOU_ACCOUNT_AUTH_URL: ${KEYCLOAK_ACCOUNT_AUTH_URL:?set verified private Account origin}
      PINVOU_OIDC_ISSUER: ${USER_OIDC_ISSUER:?set exact public user realm issuer}
      PINVOU_IDENTITY_AUTH_URL: ${KEYCLOAK_IDENTITY_AUTH_URL:?set verified private Identity origin}
      PINVOU_SMS_VERIFY_URL: ${KEYCLOAK_SMS_VERIFY_URL:?set exact private SMS verification endpoint}
      PINVOU_WORKLOAD_IDENTITY_TOKEN_FILE: /run/pinvou/keycloak-workload/token
      PINVOU_INTERNAL_SERVICE_TOKEN: ""
      KC_PROXY_HEADERS: xforwarded
      KC_PROXY_TRUSTED_ADDRESSES: "${PERSONAL_EDGE_BACKEND_IP:?set fixed verified edge address},${PERSONAL_IDENTITY_BACKEND_IP:?set fixed verified Identity address}"
    volumes:
      - {type: bind, source: "${KEYCLOAK_WORKLOAD_TOKEN_DIRECTORY:?set only authenticator projected token directory}", target: /run/pinvou/keycloak-workload, read_only: true, bind: {create_host_path: false}}
