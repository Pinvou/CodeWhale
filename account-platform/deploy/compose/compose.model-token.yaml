# Explicit APT-137 overlay; never changes the development compose defaults by itself.
# Supply external short-lived workload JWT files and audited site overrides first.
# This template is NOT a production-equivalence attestation. See model-token-release.md.
x-governed-environment: &governed-environment
  APP_ENV: ${MODEL_TOKEN_APP_ENV:-staging}
  INTERNAL_SERVICE_TOKEN: ""
  WORKLOAD_IDENTITY_TOKEN_FILE: /var/run/secrets/pinvou/workload/token
  WORKLOAD_IDENTITY_ISSUER: ${WORKLOAD_IDENTITY_ISSUER:?set trusted workload issuer}
  WORKLOAD_IDENTITY_JWKS_URL: ${WORKLOAD_IDENTITY_JWKS_URL:?set trusted workload JWKS}
  WORKLOAD_IDENTITY_AUDIENCE: ${WORKLOAD_IDENTITY_AUDIENCE:?set workload audience}
  OIDC_ISSUER: ${OIDC_ISSUER:?set public OIDC issuer}
  OIDC_JWKS_URL: ${OIDC_JWKS_URL:?set OIDC JWKS}
  OIDC_AUDIENCE: ${OIDC_AUDIENCE:?set user audience}
  TRUSTED_TIME_SOURCES: ${TRUSTED_TIME_SOURCES:?set trusted time sources}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  NATS_URL: ${MODEL_TOKEN_NATS_URL:?set the single authenticated event cluster}
  NATS_CREDENTIALS_FILE: /var/run/secrets/pinvou/nats/client.creds

x-governed-service: &governed-service
  restart: unless-stopped
  read_only: true
  user: "65532:65532"
  tmpfs: ["/tmp:size=16m,mode=1777"]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  healthcheck:
    test: ["CMD", "/healthcheck"]
    interval: 5s
    timeout: 3s
    retries: 6

services:
  account-service:
    environment:
      <<: *governed-environment
      WORKLOAD_IDENTITY_RULES_JSON: '[{"permissions":["internal.authorization.check","internal.approval-authorization.consume","internal.approval-execution.begin","internal.approval-execution.complete","internal.account-closure-state.read"],"service":"billing-service","subject":"pinvou:service:billing-service"},{"permissions":["internal.authorization.check","internal.authorization.delegate","internal.client-compatibility.read","internal.token-owner-candidates.read","internal.account.token-owner-authority.check"],"service":"token-gateway","subject":"pinvou:service:token-gateway"},{"permissions":["internal.authorization.check","internal.approval-authorization.consume","internal.approval-execution.begin","internal.approval-execution.complete"],"service":"token-command-executor","subject":"pinvou:service:token-command-executor"},{"permissions":["internal.approval-recovery.plan"],"service":"account-approval-recovery","subject":"pinvou:service:account-approval-recovery"},{"permissions":["internal.authorization.check"],"service":"token-credential-portal","subject":"pinvou:service:token-credential-portal"},{"permissions":["internal.auth.sms.verify","internal.authorization.check"],"service":"keycloak-mobile-authenticator","subject":"pinvou:service:keycloak-mobile-authenticator"}]'
      TOKEN_GATEWAY_HTTP_URL: http://token-gateway:8080
    volumes:
      - type: bind
        source: ${WORKLOAD_TOKEN_DIRECTORY:?set externally rotated per-service token directory}/account-service
        target: /var/run/secrets/pinvou/workload
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${NATS_CREDENTIAL_DIRECTORY:?set rotated per-service NATS directories}/account-service
        target: /var/run/secrets/pinvou/nats
        read_only: true
        bind: { create_host_path: false }
    networks: [backend, governance-control, credential-control]
  identity-service:
    environment:
      <<: *governed-environment
      NATS_URL: ""
      NATS_CREDENTIALS_FILE: ""
      WORKLOAD_IDENTITY_RULES_JSON: '[{"permissions":["internal.identity.password-reference.validate","internal.identity.user.create","internal.identity.registration.read","internal.identity.user.disable","internal.identity.username.update","internal.identity.mobile.update","internal.identity.password.reset","internal.identity.sessions.revoke","internal.identity.user.delete"],"service":"account-service","subject":"pinvou:service:account-service"}]'
    volumes:
      - type: bind
        source: ${WORKLOAD_TOKEN_DIRECTORY:?set externally rotated per-service token directory}/identity-service
        target: /var/run/secrets/pinvou/workload
        read_only: true
        bind: { create_host_path: false }
  billing-service:
    environment:
      <<: *governed-environment
      WORKLOAD_IDENTITY_RULES_JSON: '[{"permissions":["internal.billing.wallet.ensure","internal.billing.account-closure-assessment.read","internal.billing.account-closure-grants.isolate","internal.billing.organization.lifecycle","internal.billing.organization-unit.lifecycle","internal.billing.organization-member.lifecycle","internal.billing.approval-activation.read","internal.billing.approval-proof.read","internal.billing.approval-effect.read"],"service":"account-service","subject":"pinvou:service:account-service"},{"permissions":["internal.billing.approval-effect.read"],"service":"account-approval-recovery","subject":"pinvou:service:account-approval-recovery"},{"permissions":["internal.billing.wallet.ensure","internal.billing.wallet.read","internal.billing.entitlement.read","internal.billing.hold.reserve","internal.billing.hold.extend","internal.billing.hold.commit","internal.billing.hold.release","internal.billing.account-closed-grant.reclaim","internal.billing.pricing.read","internal.billing.pricing.bind","internal.billing.quota.read","internal.billing.quota.allocate","internal.billing.quota.revoke","internal.billing.product.read","internal.billing.payment-capability.read","internal.billing.recharge-order.create","internal.billing.recharge-order.read","internal.billing.recharge-order.close","internal.billing.payment-claim.create","internal.billing.token-account-wallet-provision.execute","internal.billing.token-account-wallet-provision.read"],"service":"token-gateway","subject":"pinvou:service:token-gateway"}]'
    volumes:
      - type: bind
        source: ${WORKLOAD_TOKEN_DIRECTORY:?set externally rotated per-service token directory}/billing-service
        target: /var/run/secrets/pinvou/workload
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${NATS_CREDENTIAL_DIRECTORY:?set rotated per-service NATS directories}/billing-service
        target: /var/run/secrets/pinvou/nats
        read_only: true
        bind: { create_host_path: false }
  token-gateway:
    environment:
      <<: *governed-environment
      WORKLOAD_IDENTITY_RULES_JSON: '[{"permissions":["internal.token.organization.lifecycle","internal.token.organization-unit.lifecycle","internal.token.replay.delete","internal.token.account-closure-assessment.read","internal.token.approval-snapshot.read","internal.token.approval-proof.read","internal.token.approval-effect.read","internal.authorization.check"],"service":"account-service","subject":"pinvou:service:account-service"},{"permissions":["internal.token.approval-effect.read","internal.token.approval-result.read"],"service":"account-approval-recovery","subject":"pinvou:service:account-approval-recovery"},{"permissions":["internal.token.model-lifecycle.execute","internal.token.catalog-rollback.execute","internal.token.credential-revoke.execute","internal.authorization.check"],"service":"token-command-executor","subject":"pinvou:service:token-command-executor"}]'
      DATABASE_URL: ${TOKEN_GATEWAY_RELEASE_DATABASE_URL:?set new release-scoped gateway database URL}
      TOKEN_SECRET_PROVIDER: remote
      TOKEN_SECRET_PROVIDER_URL: ${TOKEN_SECRET_PROVIDER_URL:?set remote secret provider}
      # Provider-specific validation runs on the merged config; native overlay clears this.
      TOKEN_SECRET_PROVIDER_TOKEN: ${TOKEN_SECRET_PROVIDER_TOKEN:-}
      TOKEN_SECRET_KEY_ID: ${TOKEN_SECRET_KEY_ID:?set remote secret key reference}
      TOKEN_LOCAL_KEK_BASE64: ""
      TOKEN_PROVIDER_ALLOWED_HOSTS: ${TOKEN_PROVIDER_ALLOWED_HOSTS:?set provider allowlist}
      TOKEN_PROVIDER_CA_FILE: ${TOKEN_PROVIDER_CA_FILE:-}
    volumes:
      - type: bind
        source: ${WORKLOAD_TOKEN_DIRECTORY:?set externally rotated per-service token directory}/token-gateway
        target: /var/run/secrets/pinvou/workload
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${NATS_CREDENTIAL_DIRECTORY:?set rotated per-service NATS directories}/token-gateway
        target: /var/run/secrets/pinvou/nats
        read_only: true
        bind: { create_host_path: false }
    networks: [backend, edge, governance-control]
  token-portal:
    environment:
      APP_ENV: ${MODEL_TOKEN_APP_ENV:-staging}
      PORTAL_PUBLIC_URL: ${PORTAL_PUBLIC_URL:?set public Portal origin}
      PORTAL_OIDC_AUTHORIZATION_URL: ${PORTAL_OIDC_AUTHORIZATION_URL:?set public authorization URL}
      PORTAL_OIDC_TOKEN_URL: ${PORTAL_OIDC_TOKEN_URL:?set token endpoint}
      PORTAL_OIDC_CLIENT_ID: ${PORTAL_OIDC_CLIENT_ID:?set Portal client ID}
      TRUSTED_TIME_SOURCES: ${TRUSTED_TIME_SOURCES:?set trusted time sources}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}

  keycloak:
    environment:
      PINVOU_INTERNAL_SERVICE_TOKEN: ""
      PINVOU_WORKLOAD_IDENTITY_TOKEN_FILE: /var/run/secrets/pinvou/workload/token
    volumes:
      - type: bind
        source: ${WORKLOAD_TOKEN_DIRECTORY:?set externally rotated per-service token directory}/keycloak-mobile-authenticator
        target: /var/run/secrets/pinvou/workload
        read_only: true
        bind: { create_host_path: false }

  postgres:
    networks: [backend, credential-control, governance-operations]
  nats:
    networks: [backend, governance-control]
  newapi:
    networks: [backend, credential-provider]
  account-event-relay:
    environment:
      NATS_URL: ${MODEL_TOKEN_NATS_URL:?set the single authenticated event cluster}
      NATS_CREDENTIALS_FILE: /var/run/secrets/pinvou/nats/client.creds
      APPROVAL_RELAY_NATS_CREDENTIALS_FILE: /var/run/secrets/pinvou/approval-nats/client.creds
      APPROVAL_RELAY_NATS_CURRENT_PUBLIC_KEYS_FILE: /var/run/public/pinvou/nats-authorization/current-v2.json
      APPROVAL_RELAY_NATS_CURRENT_PUBLIC_KEYS_SHA256: ${APPROVAL_RELAY_NATS_CURRENT_PUBLIC_KEYS_SHA256:?set independently trusted current v2 public artifact digest}
      APPROVAL_RELAY_NATS_PREVIOUS_PUBLIC_KEYS_FILE: ${APPROVAL_RELAY_NATS_PREVIOUS_PUBLIC_KEYS_FILE:-}
      APPROVAL_RELAY_NATS_PREVIOUS_PUBLIC_KEYS_SHA256: ${APPROVAL_RELAY_NATS_PREVIOUS_PUBLIC_KEYS_SHA256:-}
    volumes:
      - type: bind
        source: ${NATS_CREDENTIAL_DIRECTORY:?set rotated per-service NATS directories}/account-event-relay
        target: /var/run/secrets/pinvou/nats
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${NATS_CREDENTIAL_DIRECTORY:?set rotated per-service NATS directories}/account-approval-relay
        target: /var/run/secrets/pinvou/approval-nats
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${NATS_PUBLIC_AUTHORIZATION_DIRECTORY:?set independent public NATS authorization artifact directory}
        target: /var/run/public/pinvou/nats-authorization
        read_only: true
        bind: { create_host_path: false }

  billing-event-relay:
    environment:
      NATS_URL: ${MODEL_TOKEN_NATS_URL:?set the single authenticated event cluster}
      NATS_CREDENTIALS_FILE: /var/run/secrets/pinvou/nats/client.creds
    volumes:
      - type: bind
        source: ${NATS_CREDENTIAL_DIRECTORY:?set rotated per-service NATS directories}/billing-event-relay
        target: /var/run/secrets/pinvou/nats
        read_only: true
        bind: { create_host_path: false }

  token-event-relay:
    environment:
      DATABASE_URL: ${TOKEN_GATEWAY_RELEASE_DATABASE_URL:?set new release-scoped gateway database URL}
      NATS_URL: ${MODEL_TOKEN_NATS_URL:?set the single authenticated event cluster}
      NATS_CREDENTIALS_FILE: /var/run/secrets/pinvou/nats/client.creds
    volumes:
      - type: bind
        source: ${NATS_CREDENTIAL_DIRECTORY:?set rotated per-service NATS directories}/token-event-relay
        target: /var/run/secrets/pinvou/nats
        read_only: true
        bind: { create_host_path: false }

  token-credential-portal:
    <<: *governed-service
    profiles: [model-token]
    build:
      context: ../..
      dockerfile: Dockerfile
      args: { SERVICE: token-credential-portal, GOPROXY: "${GOPROXY:-https://proxy.golang.org,direct}" }
    environment:
      <<: *governed-environment
      PORT: "8080"
      METRICS_ADDRESS: ":9090"
      DATABASE_URL: ${TOKEN_CREDENTIAL_RELEASE_DATABASE_URL:?set distinct release-scoped credential database URL}
      NATS_URL: ""
      NATS_CREDENTIALS_FILE: ""
      ACCOUNT_HTTP_URL: http://account-service:8080
      TOKEN_SECRET_PROVIDER: remote
      TOKEN_SECRET_KEY_ID: ${TOKEN_SECRET_KEY_ID:?set remote key reference}
      TOKEN_SECRET_PROVIDER_URL: ${TOKEN_SECRET_PROVIDER_URL:?set remote secret provider}
      TOKEN_SECRET_PROVIDER_TOKEN: ${CREDENTIAL_SECRET_PROVIDER_TOKEN:-}
      TOKEN_PROVIDER_ALLOWED_HOSTS: ${TOKEN_PROVIDER_ALLOWED_HOSTS:?set provider allowlist}
      PORTAL_PUBLIC_URL: ${PORTAL_PUBLIC_URL:?set public Portal origin}
      CREDENTIAL_PORTAL_PUBLIC_URL: ${CREDENTIAL_PORTAL_PUBLIC_URL:?set frozen credential origin}
      CREDENTIAL_OIDC_AUTHORIZATION_URL: ${CREDENTIAL_OIDC_AUTHORIZATION_URL:?set credential authorization URL}
      CREDENTIAL_OIDC_TOKEN_URL: ${CREDENTIAL_OIDC_TOKEN_URL:?set credential token URL}
      CREDENTIAL_OIDC_CLIENT_ID: ${CREDENTIAL_OIDC_CLIENT_ID:?set dedicated credential client}
      CREDENTIAL_OIDC_AUDIENCE: ${CREDENTIAL_OIDC_AUDIENCE:?set dedicated credential audience}
    volumes:
      - type: bind
        source: ${WORKLOAD_TOKEN_DIRECTORY:?set workload directory}/token-credential-portal
        target: /var/run/secrets/pinvou/workload
        read_only: true
        bind: { create_host_path: false }
    ports: ["127.0.0.1:${CREDENTIAL_PORTAL_BIND_PORT:-18108}:8080"]
    networks: [credential-control, credential-provider, credential-egress]

  token-command-executor:
    <<: *governed-service
    profiles: [model-token]
    build:
      context: ../..
      dockerfile: Dockerfile
      args: { SERVICE: token-command-executor, GOPROXY: "${GOPROXY:-https://proxy.golang.org,direct}" }
    environment:
      APP_ENV: ${MODEL_TOKEN_APP_ENV:-staging}
      PORT: "8080"
      METRICS_ADDRESS: ":9090"
      TRUSTED_TIME_SOURCES: ${TRUSTED_TIME_SOURCES:?set trusted time sources}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      WORKLOAD_IDENTITY_TOKEN_FILE: /var/run/secrets/pinvou/workload/token
      ACCOUNT_HTTP_URL: http://account-service:8080
      TOKEN_GATEWAY_HTTP_URL: http://token-gateway:8080
      NATS_URL: ${MODEL_TOKEN_NATS_URL:?set the single authenticated event cluster}
      NATS_CREDENTIALS_FILE: /var/run/secrets/pinvou/nats/client.creds
    volumes:
      - type: bind
        source: ${WORKLOAD_TOKEN_DIRECTORY:?set workload directory}/token-command-executor
        target: /var/run/secrets/pinvou/workload
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${NATS_CREDENTIAL_DIRECTORY:?set rotated per-service NATS directories}/token-command-executor
        target: /var/run/secrets/pinvou/nats
        read_only: true
        bind: { create_host_path: false }
    networks: [governance-control, executor-egress]

  token-governance-check:
    <<: *governed-service
    profiles: [governance-operations]
    restart: "no"
    build:
      context: ../..
      dockerfile: Dockerfile
      args: { SERVICE: token-governance, GOPROXY: "${GOPROXY:-https://proxy.golang.org,direct}" }
    command: []
    healthcheck: { disable: true }
    environment:
      TOKEN_MIGRATOR_DATABASE_URL: ${TOKEN_GOVERNANCE_MIGRATOR_URL:-}
      ACCOUNT_POLICY_DATABASE_URL: ${ACCOUNT_POLICY_DATABASE_URL:-}
    networks: [governance-operations]

networks:
  governance-control: { internal: true }
  credential-control: { internal: true }
  credential-provider: { internal: true }
  governance-operations: { internal: true }
  # Egress is not a firewall: host/network allowlisting must be independently verified.
  credential-egress: {}
  executor-egress: {}
