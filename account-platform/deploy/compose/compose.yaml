name: pinvou-account-platform

x-service-defaults: &service-defaults
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=16m,mode=1777
  security_opt:
    - no-new-privileges:true
  networks:
    - backend

x-service-build: &service-build
  context: ../..
  dockerfile: Dockerfile

x-go-build-args: &go-build-args
  GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}

x-client-compatibility: &client-compatibility
  PINVOU_API_CONTRACT_VERSION: ${PINVOU_API_CONTRACT_VERSION:-account-platform-v1}
  PINVOU_CLIENT_UPGRADE_URL: ${PINVOU_CLIENT_UPGRADE_URL:-https://github.com/Pinvou/pinvou3/releases/latest}
  PINVOU_CLIENT_RELEASE_MANIFEST: '${PINVOU_CLIENT_RELEASE_MANIFEST:-[{"version":"0.8.0","released_at":"2026-08-01T00:00:00Z"},{"version":"0.7.0","released_at":"2026-06-01T00:00:00Z","deprecation_notice_at":"2026-08-31T00:00:00Z","sunset_at":"2026-10-30T00:00:00Z"},{"version":"0.6.0","released_at":"2026-03-01T00:00:00Z","deprecation_notice_at":"2026-07-03T00:00:00Z","sunset_at":"2026-09-01T00:00:00Z"}]}'

services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: account_platform_admin
      POSTGRES_PASSWORD: ${ACCOUNT_PLATFORM_POSTGRES_PASSWORD:?set ACCOUNT_PLATFORM_POSTGRES_PASSWORD}
      ACCOUNT_DB_PASSWORD: ${ACCOUNT_DB_PASSWORD:?set ACCOUNT_DB_PASSWORD}
      BILLING_DB_PASSWORD: ${BILLING_DB_PASSWORD:?set BILLING_DB_PASSWORD}
      TOKEN_DB_PASSWORD: ${TOKEN_DB_PASSWORD:?set TOKEN_DB_PASSWORD}
      PAYMENT_SIM_DB_PASSWORD: ${PAYMENT_SIM_DB_PASSWORD:?set PAYMENT_SIM_DB_PASSWORD}
      ENABLE_PAYMENT_SIMULATOR_DB: "true"
      NEWAPI_DB_PASSWORD: ${NEWAPI_DB_PASSWORD:?set NEWAPI_DB_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U account_platform_admin -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - backend

  redis:
    image: redis:8.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - backend

  nats:
    image: nats:2.11-alpine
    restart: unless-stopped
    command: ["--jetstream", "--store_dir=/data", "--http_port=8222"]
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - backend

  keycloak:
    build:
      context: ../keycloak
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/account_platform_keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?set KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: http://127.0.0.1:18080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      PINVOU_ACCOUNT_AUTH_URL: http://account-service:8080
      PINVOU_OIDC_ISSUER: http://127.0.0.1:18080/realms/pinvou
      PINVOU_IDENTITY_AUTH_URL: http://identity-service:8080
      PINVOU_SMS_VERIFY_URL: http://account-service:8080/internal/v1/auth/sms/verify
      PINVOU_INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set INTERNAL_SERVICE_TOKEN}
      KEYCLOAK_PROVISIONER_CLIENT_ID: ${KEYCLOAK_PROVISIONER_CLIENT_ID:-pinvou-account-provisioner}
      KEYCLOAK_PROVISIONER_CLIENT_SECRET: ${KEYCLOAK_PROVISIONER_CLIENT_SECRET:-}
    volumes:
      - ../keycloak/pinvou-dev-realm.json:/opt/keycloak/data/import/pinvou-realm.json:ro
      - ../keycloak/provision-platform-admin.sh:/opt/keycloak/data/import/provision-platform-admin.sh:ro
      - ../keycloak/provision-mobile-auth.sh:/opt/keycloak/data/import/provision-mobile-auth.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:18080:8080"
    networks:
      - backend
      - edge

  account-service:
    <<: *service-defaults
    build:
      <<: *service-build
      args:
        <<: *go-build-args
        SERVICE: account-service
    environment:
      <<: *client-compatibility
      APP_ENV: development
      PORT: 8080
      DATABASE_URL: postgresql://account_service:${ACCOUNT_DB_PASSWORD}@postgres:5432/account_platform_account?sslmode=disable
      OIDC_ISSUER: http://127.0.0.1:18080/realms/pinvou
      OIDC_JWKS_URL: http://keycloak:8080/realms/pinvou/protocol/openid-connect/certs
      OIDC_AUDIENCE: pinvou-desktop-dev
      BILLING_HTTP_URL: http://billing-service:8080
      TOKEN_GATEWAY_HTTP_URL: http://token-gateway:8080
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set INTERNAL_SERVICE_TOKEN}
      MANUAL_REVIEW_ON_CALL_USER_IDS: ${MANUAL_REVIEW_ON_CALL_USER_IDS:-}
      NATS_URL: nats://nats:4222
      MOBILE_AUTH_ENABLED: ${MOBILE_AUTH_ENABLED:-false}
      IDENTITY_HTTP_URL: http://identity-service:8080
      SMS_PROVIDER: ${SMS_PROVIDER:-aliyun-managed}
      SMS_VERIFICATION_HMAC_KEY_BASE64: ${SMS_VERIFICATION_HMAC_KEY_BASE64:-}
      SMS_HTTP_ENDPOINT: ${SMS_HTTP_ENDPOINT:-}
      SMS_HTTP_BEARER_TOKEN: ${SMS_HTTP_BEARER_TOKEN:-}
      REGISTRATION_QUERY_HMAC_KEY_BASE64: ${REGISTRATION_QUERY_HMAC_KEY_BASE64:-}
      AUDIT_EXPORT_MASTER_KEY_BASE64: ${AUDIT_EXPORT_MASTER_KEY_BASE64:?set AUDIT_EXPORT_MASTER_KEY_BASE64}
      HUMAN_DELEGATION_SIGNING_KEY_ID: ${HUMAN_DELEGATION_SIGNING_KEY_ID:?set HUMAN_DELEGATION_SIGNING_KEY_ID}
      HUMAN_DELEGATION_SIGNING_KEY_BASE64URL: ${HUMAN_DELEGATION_SIGNING_KEY_BASE64URL:?set HUMAN_DELEGATION_SIGNING_KEY_BASE64URL}
      OWNER_CANDIDATE_CURSOR_HMAC_KEY_BASE64: ${OWNER_CANDIDATE_CURSOR_HMAC_KEY_BASE64:?set OWNER_CANDIDATE_CURSOR_HMAC_KEY_BASE64}
      WALLET_PROVISIONING_POLICY_VERSION: ${WALLET_PROVISIONING_POLICY_VERSION:-wallet-provisioning-v1}
      WALLET_PROVISIONING_SLA_MINUTES: ${WALLET_PROVISIONING_SLA_MINUTES:-15}
      COMMERCE_PROVIDER_ID: ${COMMERCE_PROVIDER_ID:-h3c_mall}
      COMMERCE_ADAPTER_VERSION: ${COMMERCE_ADAPTER_VERSION:-h3c-mall-v1}
      ACCOUNT_SERVICE_VERSION: ${ACCOUNT_SERVICE_VERSION:-development}
      ACCOUNT_CLIENT_CONTRACT_VERSION: ${ACCOUNT_CLIENT_CONTRACT_VERSION:-account-client-v1}
      ALIYUN_SMS_ACCESS_KEY_ID: ${ALIYUN_SMS_ACCESS_KEY_ID:-}
      ALIYUN_SMS_ACCESS_KEY_SECRET: ${ALIYUN_SMS_ACCESS_KEY_SECRET:-}
      ALIYUN_SMS_SIGN_NAME: ${ALIYUN_SMS_SIGN_NAME:-}
      ALIYUN_SMS_REGISTER_TEMPLATE: ${ALIYUN_SMS_REGISTER_TEMPLATE:-}
      ALIYUN_SMS_LOGIN_TEMPLATE: ${ALIYUN_SMS_LOGIN_TEMPLATE:-}
      ALIYUN_SMS_ENDPOINT: ${ALIYUN_SMS_ENDPOINT:-https://dypnsapi.aliyuncs.com}
      H3C_MALL_BASE_URL: ${H3C_MALL_BASE_URL:-}
      H3C_MALL_APP_KEY: ${H3C_MALL_APP_KEY:-}
      H3C_MALL_APP_SECRET: ${H3C_MALL_APP_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      account-migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
      identity-service:
        condition: service_started
    ports:
      - "127.0.0.1:18101:8080"
    networks:
      - backend
      - edge

  identity-service:
    <<: *service-defaults
    build:
      <<: *service-build
      args:
        <<: *go-build-args
        SERVICE: identity-service
    environment:
      APP_ENV: development
      PORT: 8080
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set INTERNAL_SERVICE_TOKEN}
      MOBILE_AUTH_ENABLED: ${MOBILE_AUTH_ENABLED:-false}
      IDENTITY_PASSWORD_HMAC_KEY_BASE64: ${IDENTITY_PASSWORD_HMAC_KEY_BASE64:-}
      AUTH_RISK_REDIS_URL: ${AUTH_RISK_REDIS_URL:-}
      AUTH_RISK_HMAC_KEY_BASE64: ${AUTH_RISK_HMAC_KEY_BASE64:-}
      KEYCLOAK_ADMIN_API_URL: http://keycloak:8080
      KEYCLOAK_PROVISIONER_TOKEN_URL: http://keycloak:8080/realms/pinvou/protocol/openid-connect/token
      KEYCLOAK_REALM: pinvou
      KEYCLOAK_PROVISIONER_CLIENT_ID: ${KEYCLOAK_PROVISIONER_CLIENT_ID:-pinvou-account-provisioner}
      KEYCLOAK_PROVISIONER_CLIENT_SECRET: ${KEYCLOAK_PROVISIONER_CLIENT_SECRET:-}
    depends_on:
      keycloak:
        condition: service_started
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:18107:8080"
    networks:
      - backend
      - edge

  billing-service:
    <<: *service-defaults
    build:
      <<: *service-build
      args:
        <<: *go-build-args
        SERVICE: billing-service
    environment:
      <<: *client-compatibility
      APP_ENV: development
      PORT: 8080
      DATABASE_URL: postgresql://billing_service:${BILLING_DB_PASSWORD}@postgres:5432/account_platform_billing?sslmode=disable
      ACCOUNT_HTTP_URL: http://account-service:8080
      OIDC_ISSUER: http://127.0.0.1:18080/realms/pinvou
      OIDC_JWKS_URL: http://keycloak:8080/realms/pinvou/protocol/openid-connect/certs
      OIDC_AUDIENCE: pinvou-desktop-dev
      NATS_URL: nats://nats:4222
      PAYMENT_PROVIDER_BASE_URL: http://payment-simulator:8080
      BILLING_PAYMENT_PROVIDER: ${BILLING_PAYMENT_PROVIDER:-development_simulator}
      BILLING_ALLOW_TENTATIVE_PRICES: ${BILLING_ALLOW_TENTATIVE_PRICES:-true}
      BILLING_TEST_ADMISSION_EVIDENCE_TTL: ${BILLING_TEST_ADMISSION_EVIDENCE_TTL:-720h}
      BILLING_NORMAL_REFUND_CREATION_ENABLED: ${BILLING_NORMAL_REFUND_CREATION_ENABLED:-false}
      BILLING_PAYMENT_CALLBACK_URL: http://billing-service:8080/internal/payment/notifications
      PAYMENT_MERCHANT_ID: ${PAYMENT_MERCHANT_ID:-pinvou-development}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set INTERNAL_SERVICE_TOKEN}
      HUMAN_DELEGATION_VERIFICATION_KEYS_JSON: ${HUMAN_DELEGATION_VERIFICATION_KEYS_JSON:?set HUMAN_DELEGATION_VERIFICATION_KEYS_JSON}
      MANUAL_REVIEW_ON_CALL_USER_IDS: ${MANUAL_REVIEW_ON_CALL_USER_IDS:-}
      PAYMENT_NOTIFICATION_HMAC_UNIONPAY: ${PAYMENT_SIM_HMAC_UNIONPAY:?set PAYMENT_SIM_HMAC_UNIONPAY}
      PAYMENT_NOTIFICATION_HMAC_ALIPAY: ${PAYMENT_SIM_HMAC_ALIPAY:?set PAYMENT_SIM_HMAC_ALIPAY}
      PAYMENT_NOTIFICATION_HMAC_WECHAT: ${PAYMENT_SIM_HMAC_WECHAT:?set PAYMENT_SIM_HMAC_WECHAT}
      H3C_MALL_BASE_URL: ${H3C_MALL_BASE_URL:-}
      H3C_MALL_APP_KEY: ${H3C_MALL_APP_KEY:-}
      H3C_MALL_APP_SECRET: ${H3C_MALL_APP_SECRET:-}
      PAYMENT_CALLBACK_CLIENT_ID: ${PAYMENT_CALLBACK_CLIENT_ID:-}
      PAYMENT_CALLBACK_CLIENT_SECRET: ${PAYMENT_CALLBACK_CLIENT_SECRET:-}
      PAYMENT_CALLBACK_TOKEN_SIGNING_KEY_BASE64: ${PAYMENT_CALLBACK_TOKEN_SIGNING_KEY_BASE64:-}
      PAYMENT_CALLBACK_TOKEN_KEY_ID: ${PAYMENT_CALLBACK_TOKEN_KEY_ID:-payment-callback-v1}
      PAYMENT_CALLBACK_TOKEN_TTL_SECONDS: ${PAYMENT_CALLBACK_TOKEN_TTL_SECONDS:-300}
      BILLING_PAYMENT_EXPIRY_INTERVAL_SECONDS: "15"
    depends_on:
      postgres:
        condition: service_healthy
      billing-migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
    ports:
      - "127.0.0.1:18102:8080"
    networks:
      - backend
      - edge

  token-gateway:
    <<: *service-defaults
    build:
      <<: *service-build
      args:
        <<: *go-build-args
        SERVICE: token-gateway
    environment:
      <<: *client-compatibility
      APP_ENV: development
      PORT: 8080
      DATABASE_URL: postgresql://token_gateway:${TOKEN_DB_PASSWORD}@postgres:5432/account_platform_token?sslmode=disable
      OIDC_ISSUER: http://127.0.0.1:18080/realms/pinvou
      OIDC_JWKS_URL: http://keycloak:8080/realms/pinvou/protocol/openid-connect/certs
      OIDC_AUDIENCE: pinvou-desktop-dev
      ACCOUNT_HTTP_URL: http://account-service:8080
      BILLING_HTTP_URL: http://billing-service:8080
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set INTERNAL_SERVICE_TOKEN}
      MANUAL_REVIEW_ON_CALL_USER_IDS: ${MANUAL_REVIEW_ON_CALL_USER_IDS:-}
      TOKEN_SECRET_PROVIDER: local
      TOKEN_SECRET_KEY_ID: pinvou-development-local-v1
      TOKEN_LOCAL_KEK_BASE64: ${TOKEN_LOCAL_KEK_BASE64:?set TOKEN_LOCAL_KEK_BASE64}
      TOKEN_GATEWAY_MAX_INPUT_TOKENS: "128000"
      TOKEN_ADMIN_PAGINATION_ENABLED: ${TOKEN_ADMIN_PAGINATION_ENABLED:-false}
      TOKEN_ADMIN_IMPACT_PRECHECKS_ENABLED: ${TOKEN_ADMIN_IMPACT_PRECHECKS_ENABLED:-false}
      TOKEN_ADMIN_PAGINATION_CURSOR_HMAC_KEY_BASE64: ${TOKEN_ADMIN_PAGINATION_CURSOR_HMAC_KEY_BASE64:-}
      TOKEN_PROVIDER_ALLOWED_HOSTS: mock-newapi,newapi
      TOKEN_DEFAULT_PROVIDER: new-api
      TOKEN_GATEWAY_ADAPTER: ${TOKEN_GATEWAY_ADAPTER:-NEW_API}
      TOKEN_DEFAULT_PROVIDER_BASE_URL: ${TOKEN_DEFAULT_PROVIDER_BASE_URL:?set TOKEN_DEFAULT_PROVIDER_BASE_URL}
      TOKEN_DEFAULT_PROVIDER_API_KEY: ${TOKEN_DEFAULT_PROVIDER_API_KEY:?set TOKEN_DEFAULT_PROVIDER_API_KEY}
      TOKEN_DEFAULT_PROVIDER_MODELS: ${TOKEN_DEFAULT_PROVIDER_MODELS:-deepseek-v4-flash}
      TOKEN_MODEL_CATALOG_DEFAULT_CONTEXT_TOKENS: ${TOKEN_MODEL_CATALOG_DEFAULT_CONTEXT_TOKENS:-128000}
      TOKEN_MODEL_CATALOG_DEFAULT_MAX_OUTPUT_TOKENS: ${TOKEN_MODEL_CATALOG_DEFAULT_MAX_OUTPUT_TOKENS:-4096}
      TOKEN_MODEL_CATALOG_SYNC_MINUTES: ${TOKEN_MODEL_CATALOG_SYNC_MINUTES:-15}
      TOKEN_DEFAULT_ROUTE_PRIORITY: "10"
      TOKEN_RECONCILIATION_NEWAPI_BASE_URL: ${TOKEN_DEFAULT_PROVIDER_BASE_URL:?set TOKEN_DEFAULT_PROVIDER_BASE_URL}
      TOKEN_RECONCILIATION_NEWAPI_ADMIN_TOKEN: ${TOKEN_RECONCILIATION_NEWAPI_ADMIN_TOKEN:?set TOKEN_RECONCILIATION_NEWAPI_ADMIN_TOKEN}
      TOKEN_RECONCILIATION_NEWAPI_ADMIN_USER_ID: ${TOKEN_RECONCILIATION_NEWAPI_ADMIN_USER_ID:?set TOKEN_RECONCILIATION_NEWAPI_ADMIN_USER_ID}
      TOKEN_RECONCILIATION_INTERVAL_SECONDS: "15"
      TOKEN_SERVICE_VERSION: ${TOKEN_SERVICE_VERSION:-development}
      TOKEN_CLIENT_CONTRACT_VERSION: ${TOKEN_CLIENT_CONTRACT_VERSION:-client-readiness-v1}
      TOKEN_MINIMUM_CLIENT_VERSION: ${TOKEN_MINIMUM_CLIENT_VERSION:-0.8.0}
      TOKEN_MAXIMUM_CLIENT_VERSION: ${TOKEN_MAXIMUM_CLIENT_VERSION:-0.8.0}
      CLIENT_READINESS_ATTESTATION_KEY_ID: ${CLIENT_READINESS_ATTESTATION_KEY_ID:-}
      CLIENT_READINESS_ATTESTATION_PRIVATE_KEY_BASE64: ${CLIENT_READINESS_ATTESTATION_PRIVATE_KEY_BASE64:-}
      CLIENT_READINESS_ATTESTATION_TTL_SECONDS: ${CLIENT_READINESS_ATTESTATION_TTL_SECONDS:-600}
      NATS_URL: nats://nats:4222
    depends_on:
      postgres:
        condition: service_healthy
      token-migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
    ports:
      - "127.0.0.1:18103:8080"
    networks:
      - backend
      - edge

  account-event-relay:
    <<: *service-defaults
    build:
      <<: *service-build
      args:
        <<: *go-build-args
        SERVICE: event-relay
    environment:
      APP_ENV: development
      EVENT_SOURCE: account
      HEALTHCHECK_URL: http://127.0.0.1:9090/health/ready
      DATABASE_URL: postgresql://account_service:${ACCOUNT_DB_PASSWORD}@postgres:5432/account_platform_account?sslmode=disable
      NATS_URL: nats://nats:4222
    depends_on:
      account-migrate: { condition: service_completed_successfully }
      nats: { condition: service_healthy }

  billing-event-relay:
    <<: *service-defaults
    build:
      <<: *service-build
      args:
        <<: *go-build-args
        SERVICE: event-relay
    environment:
      APP_ENV: development
      EVENT_SOURCE: billing
      HEALTHCHECK_URL: http://127.0.0.1:9090/health/ready
      DATABASE_URL: postgresql://billing_service:${BILLING_DB_PASSWORD}@postgres:5432/account_platform_billing?sslmode=disable
      NATS_URL: nats://nats:4222
    depends_on:
      billing-migrate: { condition: service_completed_successfully }
      nats: { condition: service_healthy }

  token-event-relay:
    <<: *service-defaults
    build:
      <<: *service-build
      args:
        <<: *go-build-args
        SERVICE: event-relay
    environment:
      APP_ENV: development
      EVENT_SOURCE: token
      HEALTHCHECK_URL: http://127.0.0.1:9090/health/ready
      DATABASE_URL: postgresql://token_gateway:${TOKEN_DB_PASSWORD}@postgres:5432/account_platform_token?sslmode=disable
      NATS_URL: nats://nats:4222
    depends_on:
      token-migrate: { condition: service_completed_successfully }
      nats: { condition: service_healthy }

  token-portal:
    <<: *service-defaults
    build:
      <<: *service-build
      args:
        <<: *go-build-args
        SERVICE: token-portal
    environment:
      <<: *client-compatibility
      APP_ENV: development
      PORT: 8080
      REDIS_URL: redis://redis:6379/0
      PORTAL_PUBLIC_URL: http://127.0.0.1:18105
      PORTAL_OIDC_AUTHORIZATION_URL: http://127.0.0.1:18080/realms/pinvou/protocol/openid-connect/auth
      PORTAL_OIDC_TOKEN_URL: http://keycloak:8080/realms/pinvou/protocol/openid-connect/token
      PORTAL_OIDC_CLIENT_ID: pinvou-desktop-dev
      ACCOUNT_HTTP_URL: http://account-service:8080
      BILLING_HTTP_URL: http://billing-service:8080
      TOKEN_GATEWAY_HTTP_URL: http://token-gateway:8080
      # Portal enforces per-class absolute chains: 10/12/14, 3/5/7, 5/7/9.
      TOKEN_ADMIN_INGRESS_MAX_TIMEOUT_SECONDS: "14"
      PORTAL_ADMIN_MODEL_TOKEN_IA_ENABLED: ${PORTAL_ADMIN_MODEL_TOKEN_IA_ENABLED:-false}
      PORTAL_ADMIN_TOKEN_RESOURCE_FORMS_ENABLED: ${PORTAL_ADMIN_TOKEN_RESOURCE_FORMS_ENABLED:-false}
      PORTAL_ADMIN_MODEL_OPERATIONS_DETAILS_ENABLED: ${PORTAL_ADMIN_MODEL_OPERATIONS_DETAILS_ENABLED:-false}
      PORTAL_ADMIN_MODEL_DETAILS_ENABLED: ${PORTAL_ADMIN_MODEL_DETAILS_ENABLED:-false}
      PORTAL_ADMIN_MODEL_TOKEN_ACTIONS_ENABLED: ${PORTAL_ADMIN_MODEL_TOKEN_ACTIONS_ENABLED:-false}
      TOKEN_ADMIN_PAGINATION_CURSOR_HMAC_KEY_BASE64: ${TOKEN_ADMIN_PAGINATION_CURSOR_HMAC_KEY_BASE64:-}
      SYSTEM_PROBES_JSON: '[{"key":"portal","kind":"local"},{"key":"account","kind":"http","url":"http://account-service:8080/health/ready"},{"key":"billing","kind":"http","url":"http://billing-service:8080/health/ready"},{"key":"token-gateway","kind":"http","url":"http://token-gateway:8080/health/ready"},{"key":"identity-provider","kind":"http","url":"http://keycloak:8080/realms/pinvou/.well-known/openid-configuration"},{"key":"model-gateway","kind":"http","url":"http://mock-newapi:8080/health/ready"},{"key":"event-bus","kind":"http","url":"http://nats:8222/healthz"},{"key":"account-event-relay","kind":"relay","url":"http://account-event-relay:9090"},{"key":"billing-event-relay","kind":"relay","url":"http://billing-event-relay:9090"},{"key":"token-event-relay","kind":"relay","url":"http://token-event-relay:9090"}]'
    depends_on:
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
      account-service:
        condition: service_started
      token-gateway:
        condition: service_started
    ports:
      - "127.0.0.1:18105:8080"
    networks:
      - backend
      - edge

  mock-newapi:
    <<: *service-defaults
    build:
      <<: *service-build
      args:
        <<: *go-build-args
        SERVICE: mock-newapi
    environment:
      APP_ENV: development
      PORT: 8080
      MOCK_NEWAPI_KEY: ${MOCK_NEWAPI_KEY:?set MOCK_NEWAPI_KEY}

  newapi:
    <<: *service-defaults
    profiles: [real-newapi]
    image: calciumion/new-api:v1.0.0-rc.11@sha256:bd30213d808857bb569ef47d3c9209d061a66ea089c2472ef46ce51e75517f19
    user: "65532:65532"
    cap_drop: [ALL]
    tmpfs:
      - /tmp:size=16m,mode=1777,uid=65532,gid=65532
      - /data:size=64m,mode=0700,uid=65532,gid=65532
    environment:
      PORT: 3000
      TZ: Asia/Shanghai
      GIN_MODE: release
      SQL_DSN: postgresql://new_api:${NEWAPI_DB_PASSWORD:?set NEWAPI_DB_PASSWORD}@postgres:5432/account_platform_newapi?sslmode=disable
      REDIS_CONN_STRING: redis://redis:6379/1
      SESSION_SECRET: ${NEWAPI_SESSION_SECRET:?set NEWAPI_SESSION_SECRET}
      CRYPTO_SECRET: ${NEWAPI_CRYPTO_SECRET:?set NEWAPI_CRYPTO_SECRET}
      TRUSTED_PROXIES: none
      NODE_TYPE: master
      BATCH_UPDATE_ENABLED: "true"
      ERROR_LOG_ENABLED: "true"
      STREAMING_TIMEOUT: "300"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/status | grep -q '\"success\":true'"]
      interval: 10s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:18106:3000"
    networks:
      - backend

  payment-simulator:
    <<: *service-defaults
    build:
      <<: *service-build
      args:
        <<: *go-build-args
        SERVICE: payment-simulator
    environment:
      APP_ENV: development
      PORT: 8080
      DATABASE_URL: postgresql://payment_simulator:${PAYMENT_SIM_DB_PASSWORD}@postgres:5432/account_platform_payment_sim?sslmode=disable
      BILLING_CALLBACK_URL: http://billing-service:8080/internal/payment/notifications
      PAYMENT_SIM_PUBLIC_URL: http://127.0.0.1:18104
      PAYMENT_SIM_PAY_TOKEN_SECRET: ${PAYMENT_SIM_PAY_TOKEN_SECRET:?set PAYMENT_SIM_PAY_TOKEN_SECRET}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set INTERNAL_SERVICE_TOKEN}
      PAYMENT_SIM_HMAC_UNIONPAY: ${PAYMENT_SIM_HMAC_UNIONPAY:?set PAYMENT_SIM_HMAC_UNIONPAY}
      PAYMENT_SIM_HMAC_ALIPAY: ${PAYMENT_SIM_HMAC_ALIPAY:?set PAYMENT_SIM_HMAC_ALIPAY}
      PAYMENT_SIM_HMAC_WECHAT: ${PAYMENT_SIM_HMAC_WECHAT:?set PAYMENT_SIM_HMAC_WECHAT}
    depends_on:
      postgres:
        condition: service_healthy
      payment-simulator-migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:18104:8080"
    networks:
      - backend
      - edge

  account-migrate:
    <<: *service-defaults
    restart: "no"
    build:
      <<: *service-build
      args:
        <<: *go-build-args
        SERVICE: migrate
    command: ["--dir", "/migrations/account"]
    environment:
      DATABASE_URL: postgresql://account_service:${ACCOUNT_DB_PASSWORD}@postgres:5432/account_platform_account?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  billing-migrate:
    <<: *service-defaults
    restart: "no"
    build:
      <<: *service-build
      args:
        <<: *go-build-args
        SERVICE: migrate
    command: ["--dir", "/migrations/billing"]
    environment:
      DATABASE_URL: postgresql://billing_service:${BILLING_DB_PASSWORD}@postgres:5432/account_platform_billing?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  token-migrate:
    <<: *service-defaults
    restart: "no"
    build:
      <<: *service-build
      args:
        <<: *go-build-args
        SERVICE: migrate
    command: ["--dir", "/migrations/token"]
    environment:
      DATABASE_URL: postgresql://token_gateway:${TOKEN_DB_PASSWORD}@postgres:5432/account_platform_token?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  payment-simulator-migrate:
    <<: *service-defaults
    restart: "no"
    build:
      <<: *service-build
      args:
        <<: *go-build-args
        SERVICE: migrate
    command: ["--dir", "/migrations/payment-simulator"]
    environment:
      DATABASE_URL: postgresql://payment_simulator:${PAYMENT_SIM_DB_PASSWORD}@postgres:5432/account_platform_payment_sim?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

networks:
  backend:
    internal: true
  edge:

volumes:
  postgres-data:
  nats-data:
