name: pinvou-account-platform

x-service-defaults: &service-defaults
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=16m,mode=1777
  security_opt:
    - no-new-privileges:true
  networks:
    - backend

x-service-build: &service-build
  context: ../..
  dockerfile: Dockerfile

services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: account_platform_admin
      POSTGRES_PASSWORD: ${ACCOUNT_PLATFORM_POSTGRES_PASSWORD:?set ACCOUNT_PLATFORM_POSTGRES_PASSWORD}
      ACCOUNT_DB_PASSWORD: ${ACCOUNT_DB_PASSWORD:?set ACCOUNT_DB_PASSWORD}
      BILLING_DB_PASSWORD: ${BILLING_DB_PASSWORD:?set BILLING_DB_PASSWORD}
      TOKEN_DB_PASSWORD: ${TOKEN_DB_PASSWORD:?set TOKEN_DB_PASSWORD}
      PAYMENT_SIM_DB_PASSWORD: ${PAYMENT_SIM_DB_PASSWORD:?set PAYMENT_SIM_DB_PASSWORD}
      NEWAPI_DB_PASSWORD: ${NEWAPI_DB_PASSWORD:?set NEWAPI_DB_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U account_platform_admin -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - backend

  redis:
    image: redis:8.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - backend

  nats:
    image: nats:2.11-alpine
    restart: unless-stopped
    command: ["--jetstream", "--store_dir=/data", "--http_port=8222"]
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - backend

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    restart: unless-stopped
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/account_platform_keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?set KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: http://127.0.0.1:18080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    volumes:
      - ../keycloak/pinvou-dev-realm.json:/opt/keycloak/data/import/pinvou-realm.json:ro
      - ../keycloak/provision-platform-admin.sh:/opt/keycloak/data/import/provision-platform-admin.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:18080:8080"
    networks:
      - backend
      - edge

  account-service:
    <<: *service-defaults
    build:
      <<: *service-build
      args:
        SERVICE: account-service
    environment:
      APP_ENV: development
      PORT: 8080
      DATABASE_URL: postgresql://account_service:${ACCOUNT_DB_PASSWORD}@postgres:5432/account_platform_account?sslmode=disable
      OIDC_ISSUER: http://127.0.0.1:18080/realms/pinvou
      OIDC_JWKS_URL: http://keycloak:8080/realms/pinvou/protocol/openid-connect/certs
      OIDC_AUDIENCE: pinvou-desktop-dev
      BILLING_HTTP_URL: http://billing-service:8080
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set INTERNAL_SERVICE_TOKEN}
      NATS_URL: nats://nats:4222
    depends_on:
      postgres:
        condition: service_healthy
      account-migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
    ports:
      - "127.0.0.1:18101:8080"
    networks:
      - backend
      - edge

  billing-service:
    <<: *service-defaults
    build:
      <<: *service-build
      args:
        SERVICE: billing-service
    environment:
      APP_ENV: development
      PORT: 8080
      DATABASE_URL: postgresql://billing_service:${BILLING_DB_PASSWORD}@postgres:5432/account_platform_billing?sslmode=disable
      OIDC_ISSUER: http://127.0.0.1:18080/realms/pinvou
      OIDC_JWKS_URL: http://keycloak:8080/realms/pinvou/protocol/openid-connect/certs
      OIDC_AUDIENCE: pinvou-desktop-dev
      NATS_URL: nats://nats:4222
      PAYMENT_SIMULATOR_URL: http://payment-simulator:8080
      BILLING_PAYMENT_CALLBACK_URL: http://billing-service:8080/internal/payment/notifications
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set INTERNAL_SERVICE_TOKEN}
      PAYMENT_SIM_HMAC_UNIONPAY: ${PAYMENT_SIM_HMAC_UNIONPAY:?set PAYMENT_SIM_HMAC_UNIONPAY}
      PAYMENT_SIM_HMAC_ALIPAY: ${PAYMENT_SIM_HMAC_ALIPAY:?set PAYMENT_SIM_HMAC_ALIPAY}
      PAYMENT_SIM_HMAC_WECHAT: ${PAYMENT_SIM_HMAC_WECHAT:?set PAYMENT_SIM_HMAC_WECHAT}
    depends_on:
      postgres:
        condition: service_healthy
      billing-migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
    ports:
      - "127.0.0.1:18102:8080"
    networks:
      - backend
      - edge

  token-gateway:
    <<: *service-defaults
    build:
      <<: *service-build
      args:
        SERVICE: token-gateway
    environment:
      APP_ENV: development
      PORT: 8080
      DATABASE_URL: postgresql://token_gateway:${TOKEN_DB_PASSWORD}@postgres:5432/account_platform_token?sslmode=disable
      OIDC_ISSUER: http://127.0.0.1:18080/realms/pinvou
      OIDC_JWKS_URL: http://keycloak:8080/realms/pinvou/protocol/openid-connect/certs
      OIDC_AUDIENCE: pinvou-desktop-dev
      ACCOUNT_HTTP_URL: http://account-service:8080
      BILLING_HTTP_URL: http://billing-service:8080
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set INTERNAL_SERVICE_TOKEN}
      TOKEN_SECRET_PROVIDER: local
      TOKEN_SECRET_KEY_ID: pinvou-development-local-v1
      TOKEN_LOCAL_KEK_BASE64: ${TOKEN_LOCAL_KEK_BASE64:?set TOKEN_LOCAL_KEK_BASE64}
      TOKEN_GATEWAY_MAX_INPUT_TOKENS: "128000"
      TOKEN_PROVIDER_ALLOWED_HOSTS: mock-newapi,newapi
      NATS_URL: nats://nats:4222
    depends_on:
      postgres:
        condition: service_healthy
      token-migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
    ports:
      - "127.0.0.1:18103:8080"
    networks:
      - backend
      - edge

  account-event-relay:
    <<: *service-defaults
    build:
      <<: *service-build
      args: { SERVICE: event-relay }
    environment:
      EVENT_SOURCE: account
      HEALTHCHECK_URL: http://127.0.0.1:9090/health/live
      DATABASE_URL: postgresql://account_service:${ACCOUNT_DB_PASSWORD}@postgres:5432/account_platform_account?sslmode=disable
      NATS_URL: nats://nats:4222
    depends_on:
      account-migrate: { condition: service_completed_successfully }
      nats: { condition: service_healthy }

  billing-event-relay:
    <<: *service-defaults
    build:
      <<: *service-build
      args: { SERVICE: event-relay }
    environment:
      EVENT_SOURCE: billing
      HEALTHCHECK_URL: http://127.0.0.1:9090/health/live
      DATABASE_URL: postgresql://billing_service:${BILLING_DB_PASSWORD}@postgres:5432/account_platform_billing?sslmode=disable
      NATS_URL: nats://nats:4222
    depends_on:
      billing-migrate: { condition: service_completed_successfully }
      nats: { condition: service_healthy }

  token-event-relay:
    <<: *service-defaults
    build:
      <<: *service-build
      args: { SERVICE: event-relay }
    environment:
      EVENT_SOURCE: token
      HEALTHCHECK_URL: http://127.0.0.1:9090/health/live
      DATABASE_URL: postgresql://token_gateway:${TOKEN_DB_PASSWORD}@postgres:5432/account_platform_token?sslmode=disable
      NATS_URL: nats://nats:4222
    depends_on:
      token-migrate: { condition: service_completed_successfully }
      nats: { condition: service_healthy }

  token-portal:
    <<: *service-defaults
    build:
      <<: *service-build
      args:
        SERVICE: token-portal
    environment:
      APP_ENV: development
      PORT: 8080
      REDIS_URL: redis://redis:6379/0
      PORTAL_PUBLIC_URL: http://127.0.0.1:18105
      PORTAL_OIDC_AUTHORIZATION_URL: http://127.0.0.1:18080/realms/pinvou/protocol/openid-connect/auth
      PORTAL_OIDC_TOKEN_URL: http://keycloak:8080/realms/pinvou/protocol/openid-connect/token
      PORTAL_OIDC_CLIENT_ID: pinvou-desktop-dev
      ACCOUNT_HTTP_URL: http://account-service:8080
      BILLING_HTTP_URL: http://billing-service:8080
      TOKEN_GATEWAY_HTTP_URL: http://token-gateway:8080
    depends_on:
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
      account-service:
        condition: service_started
      token-gateway:
        condition: service_started
    ports:
      - "127.0.0.1:18105:8080"
    networks:
      - backend
      - edge

  mock-newapi:
    <<: *service-defaults
    build:
      <<: *service-build
      args:
        SERVICE: mock-newapi
    environment:
      APP_ENV: development
      PORT: 8080
      MOCK_NEWAPI_KEY: ${MOCK_NEWAPI_KEY:?set MOCK_NEWAPI_KEY}

  newapi:
    <<: *service-defaults
    profiles: [real-newapi]
    image: calciumion/new-api:v1.0.0-rc.11@sha256:bd30213d808857bb569ef47d3c9209d061a66ea089c2472ef46ce51e75517f19
    user: "65532:65532"
    cap_drop: [ALL]
    tmpfs:
      - /tmp:size=16m,mode=1777,uid=65532,gid=65532
      - /data:size=64m,mode=0700,uid=65532,gid=65532
    environment:
      PORT: 3000
      TZ: Asia/Shanghai
      GIN_MODE: release
      SQL_DSN: postgresql://new_api:${NEWAPI_DB_PASSWORD:?set NEWAPI_DB_PASSWORD}@postgres:5432/account_platform_newapi?sslmode=disable
      REDIS_CONN_STRING: redis://redis:6379/1
      SESSION_SECRET: ${NEWAPI_SESSION_SECRET:?set NEWAPI_SESSION_SECRET}
      CRYPTO_SECRET: ${NEWAPI_CRYPTO_SECRET:?set NEWAPI_CRYPTO_SECRET}
      TRUSTED_PROXIES: none
      NODE_TYPE: master
      BATCH_UPDATE_ENABLED: "true"
      ERROR_LOG_ENABLED: "true"
      STREAMING_TIMEOUT: "300"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/status | grep -q '\"success\":true'"]
      interval: 10s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:18106:3000"
    networks:
      - backend

  payment-simulator:
    <<: *service-defaults
    build:
      <<: *service-build
      args:
        SERVICE: payment-simulator
    environment:
      APP_ENV: development
      PORT: 8080
      DATABASE_URL: postgresql://payment_simulator:${PAYMENT_SIM_DB_PASSWORD}@postgres:5432/account_platform_payment_sim?sslmode=disable
      BILLING_CALLBACK_URL: http://billing-service:8080/internal/payment/notifications
      PAYMENT_SIM_PUBLIC_URL: http://127.0.0.1:18104
      PAYMENT_SIM_PAY_TOKEN_SECRET: ${PAYMENT_SIM_PAY_TOKEN_SECRET:?set PAYMENT_SIM_PAY_TOKEN_SECRET}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set INTERNAL_SERVICE_TOKEN}
      PAYMENT_SIM_HMAC_UNIONPAY: ${PAYMENT_SIM_HMAC_UNIONPAY:?set PAYMENT_SIM_HMAC_UNIONPAY}
      PAYMENT_SIM_HMAC_ALIPAY: ${PAYMENT_SIM_HMAC_ALIPAY:?set PAYMENT_SIM_HMAC_ALIPAY}
      PAYMENT_SIM_HMAC_WECHAT: ${PAYMENT_SIM_HMAC_WECHAT:?set PAYMENT_SIM_HMAC_WECHAT}
    depends_on:
      postgres:
        condition: service_healthy
      payment-simulator-migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:18104:8080"
    networks:
      - backend
      - edge

  account-migrate:
    <<: *service-defaults
    restart: "no"
    build:
      <<: *service-build
      args:
        SERVICE: migrate
    command: ["--dir", "/migrations/account"]
    environment:
      DATABASE_URL: postgresql://account_service:${ACCOUNT_DB_PASSWORD}@postgres:5432/account_platform_account?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  billing-migrate:
    <<: *service-defaults
    restart: "no"
    build:
      <<: *service-build
      args:
        SERVICE: migrate
    command: ["--dir", "/migrations/billing"]
    environment:
      DATABASE_URL: postgresql://billing_service:${BILLING_DB_PASSWORD}@postgres:5432/account_platform_billing?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  token-migrate:
    <<: *service-defaults
    restart: "no"
    build:
      <<: *service-build
      args:
        SERVICE: migrate
    command: ["--dir", "/migrations/token"]
    environment:
      DATABASE_URL: postgresql://token_gateway:${TOKEN_DB_PASSWORD}@postgres:5432/account_platform_token?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  payment-simulator-migrate:
    <<: *service-defaults
    restart: "no"
    build:
      <<: *service-build
      args:
        SERVICE: migrate
    command: ["--dir", "/migrations/payment-simulator"]
    environment:
      DATABASE_URL: postgresql://payment_simulator:${PAYMENT_SIM_DB_PASSWORD}@postgres:5432/account_platform_payment_sim?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

networks:
  backend:
    internal: true
  edge:

volumes:
  postgres-data:
  nats-data:
