/opt/pinvou-security/openbao/audit/audit.jsonl {
    size 10M
    rotate -1
    notifempty
    dateext
    dateformat -%Y%m%dT%H%M%S
    nocompress
    # Inherit the original numeric UID/GID; the container UID has no host account.
    # The reopen checker requires the inherited ownership to remain 65532:65532.
    create 0600
    sharedscripts
    postrotate
        /usr/bin/python3 /opt/pinvou-security/monitor/account-platform-kms-audit-reopen.py
    endscript
}
