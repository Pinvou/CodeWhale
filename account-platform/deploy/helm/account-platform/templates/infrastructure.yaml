{{- $root := . -}}
{{- $fullname := include "pinvou.fullname" . -}}
{{- if .Values.redis.enabled }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: {{ $fullname }}-redis }
spec:
  serviceName: {{ $fullname }}-redis
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: {{ include "pinvou.name" . }}, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: redis } }
  template:
    metadata: { labels: { app.kubernetes.io/name: {{ include "pinvou.name" . }}, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: redis } }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 999, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: redis
          image: "{{ .Values.images.redis.repository }}:{{ .Values.images.redis.tag }}"
          args: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
          ports: [{ name: redis, containerPort: 6379 }]
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
          volumeMounts: [{ name: data, mountPath: /data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: {{ .Values.redis.storage }} } } }
{{- end }}
{{- if .Values.nats.enabled }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: {{ $fullname }}-nats }
spec:
  serviceName: {{ $fullname }}-nats
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: {{ include "pinvou.name" . }}, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: nats } }
  template:
    metadata: { labels: { app.kubernetes.io/name: {{ include "pinvou.name" . }}, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: nats } }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: nats
          image: "{{ .Values.images.nats.repository }}:{{ .Values.images.nats.tag }}"
          args: ["--jetstream", "--store_dir=/data", "--http_port=8222"]
          ports: [{ name: client, containerPort: 4222 }, { name: monitor, containerPort: 8222 }]
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
          volumeMounts: [{ name: data, mountPath: /data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: {{ .Values.nats.storage }} } } }
{{- end }}
{{- if .Values.keycloak.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: {{ $fullname }}-keycloak }
spec:
  replicas: {{ .Values.keycloak.replicas }}
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector: { matchLabels: { app.kubernetes.io/name: {{ include "pinvou.name" . }}, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: keycloak } }
  template:
    metadata: { labels: { app.kubernetes.io/name: {{ include "pinvou.name" . }}, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: keycloak } }
    spec:
      automountServiceAccountToken: false
      {{- include "pinvou.availabilityPodSpec" (dict "root" $root "component" "keycloak") | nindent 6 }}
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: keycloak
          image: "{{ .Values.images.keycloak.repository }}:{{ .Values.images.keycloak.tag }}"
          args: ["start", "--health-enabled=true", "--http-enabled=true"]
          ports: [{ name: http, containerPort: 8080 }]
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
          env:
            - { name: KC_HOSTNAME, value: {{ .Values.keycloak.hostname | quote }} }
            - { name: KC_HOSTNAME_ADMIN, value: {{ .Values.keycloak.adminHostname | quote }} }
            - { name: KC_PROXY_HEADERS, value: xforwarded }
            - { name: KC_DB, value: postgres }
            - name: KC_DB_URL
              valueFrom: { secretKeyRef: { name: {{ .Values.global.runtimeSecret }}, key: keycloak-database-url } }
            - name: KC_DB_USERNAME
              valueFrom: { secretKeyRef: { name: {{ .Values.global.runtimeSecret }}, key: keycloak-database-username } }
            - name: KC_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.global.runtimeSecret }}, key: keycloak-database-password } }
{{- end }}
