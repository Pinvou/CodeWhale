{{- $root := . -}}
{{- $fullname := include "pinvou.fullname" . -}}
{{- range $source := list "account" "billing" "token" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-{{ $source }}-event-relay
  labels:
    {{- include "pinvou.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $source }}-event-relay
spec:
  selector:
    {{- include "pinvou.selector" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $source }}-event-relay
  ports: [{ name: metrics, port: 9090, targetPort: metrics }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-{{ $source }}-event-relay
  labels:
    {{- include "pinvou.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $source }}-event-relay
spec:
  replicas: {{ $root.Values.replicas.eventRelay }}
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector:
    matchLabels:
      {{- include "pinvou.selector" $root | nindent 6 }}
      app.kubernetes.io/component: {{ $source }}-event-relay
  template:
    metadata:
      annotations: { prometheus.io/scrape: "true", prometheus.io/path: "/metrics", prometheus.io/port: "9090" }
      labels:
        {{- include "pinvou.selector" $root | nindent 8 }}
        app.kubernetes.io/component: {{ $source }}-event-relay
    spec:
      serviceAccountName: {{ $fullname }}-{{ $source }}-event-relay
      automountServiceAccountToken: false
      {{- include "pinvou.availabilityPodSpec" (dict "root" $root "component" (printf "%s-event-relay" $source)) | nindent 6 }}
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: event-relay
          image: "{{ $root.Values.images.eventRelay.repository }}:{{ $root.Values.images.eventRelay.tag }}"
          imagePullPolicy: {{ $root.Values.images.eventRelay.pullPolicy }}
          ports: [{ name: metrics, containerPort: 9090 }]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          resources: {{ toYaml $root.Values.resources | nindent 12 }}
          env:
            - { name: APP_ENV, value: {{ $root.Values.global.environment | quote }} }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: {{ $root.Values.observability.otlpEndpoint | quote }} }
            - { name: EVENT_SOURCE, value: {{ $source | quote }} }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ if and (eq $source "token") $root.Values.tokenGateway.runtimeSecret }}{{ $root.Values.tokenGateway.runtimeSecret }}{{ else }}{{ $root.Values.global.runtimeSecret }}{{ end }}, key: {{ if and (eq $source "token") $root.Values.tokenGateway.runtimeSecret }}token-gateway-database-url{{ else }}{{ printf "%s-service-database-url" $source }}{{ end }} } }
            - { name: NATS_URL, value: {{ include "pinvou.natsUrl" $root | quote }} }
            - { name: NATS_CREDENTIALS_FILE, value: {{ printf "/var/run/secrets/pinvou/nats/%s.creds" $source | quote }} }
          readinessProbe: { httpGet: { path: /health/ready, port: metrics }, periodSeconds: 10, timeoutSeconds: 3 }
          livenessProbe: { httpGet: { path: /health/live, port: metrics }, periodSeconds: 20, timeoutSeconds: 3 }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: nats-credentials, mountPath: /var/run/secrets/pinvou/nats, readOnly: true }
      volumes:
        - { name: tmp, emptyDir: { sizeLimit: 16Mi } }
        - name: nats-credentials
          secret: { secretName: {{ $root.Values.global.runtimeSecret }}, items: [{ key: {{ printf "%s-event-relay.creds" $source }}, path: {{ printf "%s.creds" $source }} }] }
{{- end }}
