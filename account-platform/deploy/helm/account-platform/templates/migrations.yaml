{{- $root := . -}}
{{- $fullname := include "pinvou.fullname" . -}}
{{- range $domain := list "account" "billing" "token" }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $fullname }}-migrate-{{ $domain }}-{{ $root.Release.Revision }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        {{- include "pinvou.selector" $root | nindent 8 }}
        app.kubernetes.io/component: migrate-{{ $domain }}
    spec:
      restartPolicy: Never
      # pre-install runs before the chart ServiceAccount exists. The namespace
      # default account has no token mounted and needs no Kubernetes API access.
      automountServiceAccountToken: false
      {{- with $root.Values.global.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: migrate
          image: "{{ $root.Values.images.migrate.repository }}:{{ $root.Values.images.migrate.tag }}"
          imagePullPolicy: {{ $root.Values.images.migrate.pullPolicy }}
          args: ["--dir", "/migrations/{{ $domain }}"]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ $root.Values.global.runtimeSecret }}, key: {{ if eq $domain "token" }}token-gateway-database-url{{ else }}{{ $domain }}-service-database-url{{ end }} } }
{{- end }}
