{{- $root := . -}}
{{- $fullname := include "pinvou.fullname" . -}}
{{- range $domain := list "account" "billing" "token" }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $fullname }}-migrate-{{ $domain }}-{{ $root.Release.Revision }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: {{ if eq $domain "account" }}"-30"{{ else if eq $domain "billing" }}"-20"{{ else }}"-10"{{ end }}
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        {{- include "pinvou.selector" $root | nindent 8 }}
        app.kubernetes.io/component: migrate-{{ $domain }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $fullname }}
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: migrate
          image: "{{ $root.Values.images.migrate.repository }}:{{ $root.Values.images.migrate.tag }}"
          imagePullPolicy: {{ $root.Values.images.migrate.pullPolicy }}
          args: ["--dir", "/migrations/{{ $domain }}"]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          env:
            - name: PINVOU_DEPLOYMENT_ENVIRONMENT
              value: {{ $root.Values.global.environment | quote }}
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ $root.Values.global.runtimeSecret }}, key: {{ $domain }}-migration-database-url } }
            - name: MIGRATION_ROLE
              value: {{ if eq $domain "billing" }}billing_service{{ else if eq $domain "token" }}token_gateway{{ else }}account_service{{ end }}
            - name: MIGRATION_BACKUP_EVIDENCE_ID
              valueFrom: { secretKeyRef: { name: {{ $root.Values.global.runtimeSecret }}, key: migration-backup-evidence-id, optional: true } }
            - name: MIGRATION_BACKUP_COMPLETED_AT
              valueFrom: { secretKeyRef: { name: {{ $root.Values.global.runtimeSecret }}, key: migration-backup-completed-at, optional: true } }
            - name: MIGRATION_BACKUP_SHA256
              valueFrom: { secretKeyRef: { name: {{ $root.Values.global.runtimeSecret }}, key: migration-backup-sha256, optional: true } }
{{- end }}
{{- if .Values.tokenAccountPolicyBootstrap.enabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $fullname }}-token-policy-bootstrap-{{ .Release.Revision }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        {{- include "pinvou.selector" . | nindent 8 }}
        app.kubernetes.io/component: token-policy-bootstrap
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $fullname }}
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: bootstrap
          image: "{{ .Values.images.migrate.repository }}:{{ .Values.images.migrate.tag }}"
          imagePullPolicy: {{ .Values.images.migrate.pullPolicy }}
          command: ["/token-policy-bootstrap"]
          args: ["--mode", "bootstrap"]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          env:
            - name: TOKEN_POLICY_DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ .Values.global.runtimeSecret }}, key: token-policy-database-url } }
            - name: TOKEN_POLICY_MAX_PER_OWNER
              valueFrom: { secretKeyRef: { name: {{ .Values.global.runtimeSecret }}, key: token-policy-max-per-owner } }
            - name: TOKEN_POLICY_EXPECTED_VERSION
              valueFrom: { secretKeyRef: { name: {{ .Values.global.runtimeSecret }}, key: token-policy-expected-version } }
            - name: TOKEN_POLICY_IDEMPOTENCY_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.global.runtimeSecret }}, key: token-policy-idempotency-key } }
            - name: TOKEN_POLICY_REASON
              valueFrom: { secretKeyRef: { name: {{ .Values.global.runtimeSecret }}, key: token-policy-reason } }
{{- end }}
