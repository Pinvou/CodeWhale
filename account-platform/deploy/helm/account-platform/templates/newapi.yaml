{{- if .Values.newApi.enabled }}
{{- $root := . -}}
{{- include "pinvou.requireNewApiTLS" . -}}
{{- $fullname := include "pinvou.fullname" . -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-new-api
  labels:
    {{- include "pinvou.labels" . | nindent 4 }}
    app.kubernetes.io/component: new-api
spec:
  replicas: {{ .Values.newApi.replicas }}
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector:
    matchLabels:
      {{- include "pinvou.selector" . | nindent 6 }}
      app.kubernetes.io/component: new-api
  template:
    metadata:
      labels:
        {{- include "pinvou.selector" . | nindent 8 }}
        app.kubernetes.io/component: new-api
        pinvou.io/newapi-data-plane: "true"
        {{- with .Values.global.podLabels }}{{ toYaml . | nindent 8 }}{{- end }}
    spec:
      serviceAccountName: {{ $fullname }}
      automountServiceAccountToken: false
      {{- include "pinvou.availabilityPodSpec" (dict "root" $root "component" "new-api") | nindent 6 }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      securityContext: { runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: new-api
          image: "{{ .Values.images.newApi.repository }}@{{ .Values.images.newApi.digest }}"
          imagePullPolicy: {{ .Values.images.newApi.pullPolicy }}
          ports: [{ name: http, containerPort: 8080 }]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          resources: {{ toYaml .Values.resources | nindent 12 }}
          env:
            - { name: PORT, value: "8080" }
            - { name: TZ, value: "Asia/Shanghai" }
            - { name: GIN_MODE, value: "release" }
            - { name: NODE_TYPE, value: {{ .Values.newApi.nodeType | quote }} }
            - { name: TRUSTED_PROXIES, value: {{ .Values.newApi.trustedProxies | quote }} }
            - { name: REDIS_CONN_STRING, value: {{ include "pinvou.newApiRedisUrl" $root | quote }} }
            - { name: BATCH_UPDATE_ENABLED, value: "true" }
            - { name: ERROR_LOG_ENABLED, value: "true" }
            - { name: STREAMING_TIMEOUT, value: "300" }
            - name: SQL_DSN
              valueFrom: { secretKeyRef: { name: {{ .Values.global.runtimeSecret }}, key: newapi-database-url } }
            - name: SESSION_SECRET
              valueFrom: { secretKeyRef: { name: {{ .Values.global.runtimeSecret }}, key: newapi-session-secret } }
            - name: CRYPTO_SECRET
              valueFrom: { secretKeyRef: { name: {{ .Values.global.runtimeSecret }}, key: newapi-crypto-secret } }
          readinessProbe: { httpGet: { path: /api/status, port: http }, initialDelaySeconds: 5, periodSeconds: 10, timeoutSeconds: 3 }
          livenessProbe: { httpGet: { path: /api/status, port: http }, initialDelaySeconds: 20, periodSeconds: 20, timeoutSeconds: 3 }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
        {{- range $mode := list "data" "status-only" }}
        - name: newapi-tls-{{ $mode }}
          image: "{{ $root.Values.images.newApiTLS.repository }}@{{ $root.Values.images.newApiTLS.digest }}"
          imagePullPolicy: {{ $root.Values.images.newApiTLS.pullPolicy }}
          args: [{{ printf "--mode=%s" $mode | quote }}]
          ports: [{ name: {{ if eq $mode "data" }}provider-tls{{ else }}status-tls{{ end }}, containerPort: {{ if eq $mode "data" }}8443{{ else }}8444{{ end }} }]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          resources: {{ toYaml $root.Values.resources | nindent 12 }}
          env:
            - { name: NEWAPI_TLS_CERT_FILE, value: /run/pinvou/newapi/server.crt }
            - { name: NEWAPI_TLS_KEY_FILE, value: /run/pinvou/newapi/server.key }
          volumeMounts:
            - { name: newapi-tls, mountPath: /run/pinvou/newapi, readOnly: true }
        {{- end }}
      volumes:
        - name: newapi-tls
          secret:
            secretName: {{ .Values.newApi.tlsSecretName }}
            defaultMode: 288
            items: [{ key: tls.crt, path: server.crt }, { key: tls.key, path: server.key }]
        - { name: data, emptyDir: { sizeLimit: 256Mi } }
        - { name: tmp, emptyDir: { sizeLimit: 16Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.newApi.serviceName }}
  labels:
    {{- include "pinvou.labels" . | nindent 4 }}
    app.kubernetes.io/component: new-api
spec:
  selector:
    {{- include "pinvou.selector" . | nindent 4 }}
    app.kubernetes.io/component: new-api
  ports: [{ name: provider-tls, port: 8443, targetPort: provider-tls }, { name: status-tls, port: 8444, targetPort: status-tls }]
{{- end }}
