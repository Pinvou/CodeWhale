{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "pinvou.fullname" . }}-runtime
  labels: {{ include "pinvou.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    kind: {{ .Values.externalSecrets.secretStoreKind }}
    name: {{ .Values.externalSecrets.secretStoreName }}
  target:
    name: {{ .Values.global.runtimeSecret }}
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: {{ .Values.externalSecrets.remoteKey | quote }}
{{- end }}
