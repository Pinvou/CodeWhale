{{ include "pinvou.validate" . }}
{{- $root := . -}}
{{- $fullname := include "pinvou.fullname" . -}}
{{- range $component := list "" "account-service" "identity-service" "billing-service" "token-gateway" "token-command-executor" "token-portal" "keycloak" "account-event-relay" "billing-event-relay" "token-event-relay" }}
{{- if ne $component "" }}
---
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ if eq $component "" }}{{ $fullname }}{{ else }}{{ $fullname }}-{{ $component }}{{ end }}
  labels:
    {{- include "pinvou.labels" $root | nindent 4 }}
    {{- if ne $component "" }}
    app.kubernetes.io/component: {{ $component }}
    {{- end }}
automountServiceAccountToken: false
{{- end }}
