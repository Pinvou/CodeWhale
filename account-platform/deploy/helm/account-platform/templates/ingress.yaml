{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "pinvou.fullname" . }}
  labels: {{ include "pinvou.labels" . | nindent 4 }}
spec:
  {{- with .Values.ingress.className }}ingressClassName: {{ . }}{{- end }}
  {{- with .Values.ingress.tlsSecretName }}
  tls:
    - secretName: {{ . }}
      hosts: [{{ $.Values.ingress.portalHost | quote }}, {{ $.Values.ingress.keycloakHost | quote }}, {{ $.Values.ingress.identityHost | quote }}]
  {{- end }}
  rules:
    - host: {{ .Values.ingress.portalHost | quote }}
      http:
        paths:
          - path: /api/v1/payment-callback/token
            pathType: Exact
            backend: { service: { name: {{ include "pinvou.fullname" . }}-billing-service, port: { number: 8080 } } }
          - path: /api/v1/payment-callbacks
            pathType: Exact
            backend: { service: { name: {{ include "pinvou.fullname" . }}-billing-service, port: { number: 8080 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: {{ include "pinvou.fullname" . }}-token-portal, port: { number: 8080 } } }
    - host: {{ .Values.ingress.keycloakHost | quote }}
      http:
        paths:
          - path: /realms/pinvou/protocol/openid-connect/token
            pathType: Exact
            backend: { service: { name: {{ include "pinvou.fullname" . }}-identity-service, port: { number: 8080 } } }
          - path: /realms
            pathType: Prefix
            backend: { service: { name: {{ include "pinvou.fullname" . }}-keycloak, port: { number: 8080 } } }
          - path: /resources
            pathType: Prefix
            backend: { service: { name: {{ include "pinvou.fullname" . }}-keycloak, port: { number: 8080 } } }
    - host: {{ .Values.ingress.identityHost | quote }}
      http:
        paths:
          - path: /v1/registration/password-prechecks
            pathType: Exact
            backend: { service: { name: {{ include "pinvou.fullname" . }}-identity-service, port: { number: 8080 } } }
---
# Token administration has a dedicated ingress so its bounded pagination
# transport ceiling cannot alter payment callbacks, Keycloak, Identity, or the
# rest of Portal. Portal applies the exact 14/7/9-second per-request deadline.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "pinvou.fullname" . }}-token-admin
  labels: {{ include "pinvou.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "2"
    nginx.ingress.kubernetes.io/proxy-read-timeout: {{ .Values.ingress.tokenAdminMaxTimeoutSeconds | quote }}
    nginx.ingress.kubernetes.io/proxy-send-timeout: {{ .Values.ingress.tokenAdminMaxTimeoutSeconds | quote }}
spec:
  {{- with .Values.ingress.className }}ingressClassName: {{ . }}{{- end }}
  {{- with .Values.ingress.tlsSecretName }}
  tls:
    - secretName: {{ . }}
      hosts: [{{ $.Values.ingress.portalHost | quote }}]
  {{- end }}
  rules:
    - host: {{ .Values.ingress.portalHost | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.tokenAdminPath }}
            pathType: Prefix
            backend: { service: { name: {{ include "pinvou.fullname" . }}-token-portal, port: { number: 8080 } } }
{{- end }}
