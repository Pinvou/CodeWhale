global:
  environment: production-new
  runtimeSecret: pinvou-account-platform-production-new
  trustedTimeSources: [time.cloudflare.com:123, pool.ntp.org:123, ntp.aliyun.com:123, time1.cloud.tencent.com:123, time.windows.com:123]
  # Replace with the ordered stable user IDs of the real on-call escalation chain.
  manualReviewOnCallUserIds: ["00000000-0000-0000-0000-000000000101", "00000000-0000-0000-0000-000000000102"]

externalSecrets:
  enabled: true
  secretStoreKind: ClusterSecretStore
  secretStoreName: pinvou-production-vault
  remoteKey: pinvou/production/account-platform
  refreshInterval: 5m

images:
  keycloak: { repository: pinvou/account-platform-keycloak, tag: "26.7.0-pinvou.1", pullPolicy: IfNotPresent }
  accountService: { repository: registry.example.com/pinvou/account-service, tag: 0.1.0, pullPolicy: IfNotPresent }
  identityService: { repository: registry.example.com/pinvou/identity-service, tag: 0.1.0, pullPolicy: IfNotPresent }
  billingService: { repository: registry.example.com/pinvou/billing-service, tag: 0.1.0, pullPolicy: IfNotPresent }
  tokenGateway: { repository: registry.example.com/pinvou/token-gateway, tag: 0.1.0, pullPolicy: IfNotPresent }
  tokenPortal: { repository: registry.example.com/pinvou/token-portal, tag: 0.1.0, pullPolicy: IfNotPresent }
  tokenCredentialPortal: { repository: registry.example.com/pinvou/token-credential-portal, tag: 0.1.0, pullPolicy: IfNotPresent }
  tokenCommandExecutor: { repository: registry.example.com/pinvou/token-command-executor, tag: 0.1.0, pullPolicy: IfNotPresent }
  tokenGovernance: { repository: registry.example.com/pinvou/token-governance, tag: 0.1.0, pullPolicy: IfNotPresent }
  eventRelay: { repository: registry.example.com/pinvou/account-platform-event-relay, tag: 0.1.0, pullPolicy: IfNotPresent }
  migrate: { repository: registry.example.com/pinvou/account-platform-migrate, tag: 0.1.0, pullPolicy: IfNotPresent }
  newApi: { repository: calciumion/new-api, tag: v1.0.0-rc.26, digest: sha256:7b82c866e9c0fb02faca7d5068e9d1261e47edf52462d63d9db7b614e7f1027d, pullPolicy: IfNotPresent }

replicas:
  accountService: 2
  identityService: 1
  billingService: 2
  tokenGateway: 2
  tokenPortal: 2
  eventRelay: 2

availability:
  enabled: true
  topologyKey: topology.kubernetes.io/zone
  hostnameTopologyKey: kubernetes.io/hostname
  terminationGracePeriodSeconds: 60

dependencies:
  redisUrl: rediss://redis.example.com:6379/0
  newApiRedisUrl: rediss://redis.example.com:6379/1
  natsUrl: tls://nats.example.com:4222
  natsMonitorUrl: https://nats-monitor.example.com/healthz

redis:
  enabled: false

nats:
  enabled: false

newApi:
  replicas: 2

oidc:
  issuer: https://accounts.example.com/realms/pinvou
  audience: pinvou-desktop
  portalClientId: pinvou-token-portal

public:
  portalUrl: https://tokens.example.com
  paymentCallbackUrl: https://billing.example.com/internal/payment/notifications

observability:
  otlpEndpoint: https://otel.example.com
  prometheusRulesEnabled: true

security:
  authRiskEnabled: true

workloadIdentity:
  issuer: https://workload-identity.example.com
  jwksUrl: https://workload-identity.example.com/openid/v1/jwks
  audience: pinvou-account-platform-internal
  tokenExpirationSeconds: 600

sms:
  enabled: true

tokenGateway:
  secretProvider: remote
  secretKeyId: production-account-token-v1
  secretRotationIntervalSeconds: 300
  secretRotationBatchSize: 100
  providerAllowedHosts: [newapi]

external:
  postgresCidrs: [10.20.0.0/24]
  paymentProviderCidrs: [10.21.0.0/24]
  secretProviderCidrs: [10.22.0.0/24]
  modelProviderCidrs: [10.23.0.0/24]
  telemetryCollectorCidrs: [10.24.0.0/24]
  timeSourceCidrs: [10.25.0.0/24]

ingress:
  enabled: true
  className: nginx
  portalHost: tokens.example.com
  keycloakHost: accounts.example.com
  identityHost: identity.example.com
  tlsSecretName: pinvou-account-platform-production-tls

keycloak:
  hostname: https://accounts.example.com
  adminHostname: http://127.0.0.1:18081
  realmUpgradeEnabled: true
  oidcClientId: pinvou-desktop
