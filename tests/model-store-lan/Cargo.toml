[package]
name = "model-store-lan-tests"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "harness.rs"

[dependencies]
async-trait = "0.1"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.49", features = ["full"] }
libc = "0.2"
rand = "0.10"
base64 = "0.22"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tempfile = "3"

[workspace]
