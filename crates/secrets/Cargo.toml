[package]
name = "codewhale-secrets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Secret storage backends for Codewhale, with OS keyring and file fallback"

[lints]
workspace = true

[dependencies]
codewhale-paths = { path = "../paths", version = "0.9.12" }
chrono.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
sha2.workspace = true
tempfile.workspace = true
thiserror = { workspace = true }
tracing = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "4.2", features = ["apple-native-keyring-store"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "4.2", features = ["windows-native-keyring-store"] }

[target.'cfg(all(target_os = "linux", not(target_env = "ohos"), not(target_env = "musl")))'.dependencies]
# keyring 4 ships no keyutils-persistent composite: its v1 API picks the sync
# zbus Secret Service store on *nix. Session encryption stays RustCrypto by
# unioning secret-service's crypto-rust feature (was keyring 3 `crypto-rust`).
keyring = { version = "4.2", features = ["zbus-secret-service-keyring-store"] }
secret-service = { version = "5", default-features = false, features = ["crypto-rust"] }

[dev-dependencies]
tempfile.workspace = true
